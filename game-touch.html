<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Open JET</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#8ec5e8;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  canvas{display:block;touch-action:none}

  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;
       text-shadow:0 2px 8px rgba(0,0,0,.65);font-size:13px;letter-spacing:.5px;z-index:5}
  .hud-row{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;
           display:flex;justify-content:space-between;padding:0 16px}
  .hud-item{background:rgba(10,25,45,.35);backdrop-filter:blur(6px);
            -webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);
            border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;
            align-items:center;min-width:64px}
  .hud-item .label{font-size:10px;opacity:.7;letter-spacing:1px}
  .hud-item .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .hud-item .hpbar{width:76px;height:9px;border-radius:5px;margin-top:5px;
                   background:rgba(255,255,255,.16);overflow:hidden}
  #hpFill{height:100%;width:100%;border-radius:5px;background:#5ee06a}
  #dmgFlash{position:fixed;inset:0;pointer-events:none;opacity:0;
            background:radial-gradient(ellipse at center,rgba(255,40,20,0) 40%,rgba(255,40,20,.6) 100%)}
  #lockMark{position:fixed;left:50%;top:50%;width:46px;height:46px;display:none;
            transform:translate(-50%,-50%);border:2px solid rgba(255,90,60,.95);
            border-radius:50%;pointer-events:none;z-index:7;
            box-shadow:0 0 12px rgba(255,70,40,.55),inset 0 0 8px rgba(255,70,40,.35)}
  #lockMark::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;
            transform:translate(-50%,-50%);background:rgba(255,90,60,.95);border-radius:50%}

  #overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
           background:radial-gradient(circle at 50% 40%,rgba(40,90,150,.72),rgba(6,16,32,.92));
           backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:20px}
  #overlay.hide{display:none}
  .panel{width:100%;max-width:380px;text-align:center;color:#eaf4ff;
         background:rgba(12,28,52,.72);border:1px solid rgba(120,200,255,.3);
         border-radius:22px;padding:28px 22px;
         box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
  .panel h1{font-size:23px;letter-spacing:2px;margin-bottom:6px;
            background:linear-gradient(90deg,#8fd6ff,#ffd39b);
            -webkit-background-clip:text;background-clip:text;color:transparent}
  .panel .sub{font-size:12px;opacity:.65;margin-bottom:18px;letter-spacing:1px}
  .panel p{font-size:14px;line-height:1.8;opacity:.9;margin-bottom:16px}
  .panel button{width:100%;padding:15px;font-size:16px;font-weight:700;letter-spacing:3px;
    color:#04202f;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(135deg,#7fdcff,#b9f0ff 45%,#ffd9a0);
    box-shadow:0 8px 26px rgba(110,220,255,.4);transition:transform .1s}
  .panel button:active{transform:scale(.97)}
  .bigscore{font-size:38px;font-weight:800;color:#ffd98a;margin:6px 0 16px;
            font-variant-numeric:tabular-nums}

  /* ---------- 触屏控件 ----------
     左下：横滚 ◀ ▶ ｜ 左下上方：视角摇杆
     右下：俯仰 ▲ ▼ + 动作（加力 / 开火 / 投弹）
     顶侧肩键（参考 PSP 的 L / R）：锁定视角 / 关闭发动机 */
  #controls{position:fixed;inset:0;pointer-events:none;z-index:10}
  .pad{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
       display:flex;gap:14px;pointer-events:auto;align-items:flex-end}
  .pad.left{left:18px}
  .pad.right{right:18px}
  .btn{width:70px;height:70px;border-radius:50%;
       background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.30),rgba(20,40,70,.45));
       border:2px solid rgba(255,255,255,.45);
       display:flex;align-items:center;justify-content:center;
       color:#fff;font-size:24px;font-weight:700;
       box-shadow:0 4px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);
       transition:transform .06s,background .1s;touch-action:none}
  .btn:active,.btn.on{transform:scale(.92);
       background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6),rgba(70,140,220,.7))}
  .btn.fire{font-size:16px;letter-spacing:1px;
       background:radial-gradient(circle at 35% 30%,rgba(255,235,150,.55),rgba(200,140,20,.75));
       border-color:rgba(255,230,160,.85)}
  .btn.fire:active,.btn.fire.on{background:radial-gradient(circle at 35% 30%,rgba(255,250,210,.95),rgba(255,180,40,.95))}
  .btn.bomb{font-size:16px;letter-spacing:1px;
       background:radial-gradient(circle at 35% 30%,rgba(255,180,120,.55),rgba(190,50,30,.75));
       border-color:rgba(255,200,160,.85)}
  .btn.bomb:active,.btn.bomb.on{background:radial-gradient(circle at 35% 30%,rgba(255,220,180,.95),rgba(255,90,50,.98));
       box-shadow:0 0 22px rgba(255,120,60,.85),inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.boost{grid-column:1/-1;width:100%;height:56px;border-radius:28px;font-size:17px;letter-spacing:2px;
       background:radial-gradient(circle at 40% 30%,rgba(180,240,255,.5),rgba(20,90,150,.65));
       border-color:rgba(190,235,255,.8)}
  .btn.boost:active,.btn.boost.on{background:radial-gradient(circle at 40% 30%,rgba(230,250,255,.95),rgba(60,170,255,.95));
       box-shadow:0 0 22px rgba(120,200,255,.8),inset 0 1px 0 rgba(255,255,255,.35)}
  .actions{display:grid;grid-template-columns:70px 70px;gap:12px;pointer-events:auto}
  .trigger{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);
       width:96px;height:46px;border-radius:23px;
       display:flex;align-items:center;justify-content:center;
       color:#fff;font-size:15px;font-weight:700;letter-spacing:2px;
       background:radial-gradient(circle at 40% 30%,rgba(150,220,255,.45),rgba(25,60,110,.55));
       border:2px solid rgba(170,225,255,.6);
       box-shadow:0 4px 14px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.3);
       pointer-events:auto;touch-action:none;transition:transform .06s,background .1s}
  .trigger.left{left:14px}
  .trigger.right{right:14px}
  .trigger:active,.trigger.on{transform:scale(.94);
       background:radial-gradient(circle at 40% 30%,rgba(220,245,255,.85),rgba(80,150,230,.85))}
  .trigger.cut{background:radial-gradient(circle at 40% 30%,rgba(255,215,150,.4),rgba(140,70,20,.55));
       border-color:rgba(255,220,160,.6)}
  .trigger.cut:active,.trigger.cut.on{background:radial-gradient(circle at 40% 30%,rgba(255,240,210,.9),rgba(230,130,40,.9))}
  .joystick{position:absolute;left:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 122px);
       width:104px;height:104px;border-radius:50%;
       background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.14),rgba(20,40,70,.34));
       border:2px solid rgba(255,255,255,.30);
       box-shadow:0 4px 16px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.20);
       pointer-events:auto;touch-action:none;
       display:flex;align-items:center;justify-content:center}
  .joy-knob{width:42px;height:42px;border-radius:50%;
       background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.75),rgba(90,150,220,.65));
       border:2px solid rgba(255,255,255,.7);
       box-shadow:0 3px 10px rgba(0,0,0,.4);
       pointer-events:none;
       transition:transform .04s linear}
  .joy-label{position:absolute;bottom:-15px;width:100%;text-align:center;
       font-size:9px;color:rgba(255,255,255,.55);letter-spacing:1px;pointer-events:none}
  .joy-cross{position:absolute;width:60%;height:60%;pointer-events:none;opacity:.18}
  .joy-cross::before,.joy-cross::after{content:'';position:absolute;background:#fff}
  .joy-cross::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%)}
  .joy-cross::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%)}
</style>
</head>
<body>

<div id="hud">
  <div class="hud-row">
    <div class="hud-item"><span class="label">机体</span><div class="hpbar"><div id="hpFill"></div></div></div>
    <div class="hud-item"><span class="label">得分</span><span class="val" id="hudScore">0</span></div>
    <div class="hud-item"><span class="label">击毁单位</span><span class="val" id="hudDestroyed">0</span></div>
    <div class="hud-item"><span class="label">高度</span><span class="val" id="hudAlt">0</span></div>
  </div>
  <div id="dmgFlash"></div>
  <div id="lockMark"></div>
</div>

<div id="controls">
  <!-- 肩键（参考 PSP 的 L / R）：左侧锁定视角，右侧关闭发动机 -->
  <div class="trigger left" id="btnLock">锁定</div>
  <div class="trigger right cut" id="btnCut">关车</div>

  <!-- 左下：横滚 -->
  <div class="pad left">
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnRight">▶</div>
  </div>

  <!-- 视角摇杆 -->
  <div class="joystick" id="joystick">
    <div class="joy-cross"></div>
    <div class="joy-knob" id="joyKnob"></div>
    <div class="joy-label">视角 · 双击回正</div>
  </div>

  <!-- 右下：俯仰 + 动作 -->
  <div class="pad right">
    <div class="actions">
      <div class="btn boost" id="btnBoost">加力</div>
      <div class="btn" id="btnUp">▲</div>
      <div class="btn fire" id="btnFire">开火</div>
      <div class="btn" id="btnDown">▼</div>
      <div class="btn bomb" id="btnBomb">投弹</div>
    </div>
  </div>
</div>

<div id="overlay">
  <div class="panel" id="panel">
    <h1>Open JET</h1>
    <button id="startBtn">开始任务</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
'use strict';

/* =========================================================
   配置
========================================================= */
const CFG = {
  speed:      68,
  rollRate:   1.9,
  pitchRate:  1.35,
  yawRate:    0.75,
  gravity:    48,
  bombCD:     0.6,
  fireCD:     0.085,
  bulletSpd:  560,
  mapHalf:    1850,
  ceil:       1500,
  planeR:     6
};

const BOOST_MULT = 2.0;        // 左Shift 加力倍率（速度、尾焰、引擎声、视野同步强化）

const GUN_KILL_HITS = 10;      // 机枪命中 10 次摧毁建筑
const BOMB_RADIUS   = 195;     // 炸弹爆炸半径

const WATER_LEVEL = 4;

/* 关车（长按 Space）动力学：推力回落 → 减速 + 低头下坠 */
const CUT_GLIDE     = 0.55;    // 滑翔速度下限（相对巡航；实际速度按 G.thrust 平滑过渡）
const CUT_SPOOL_DN  = 0.75;    // 关车后推力回落速率（/s）
const CUT_SPOOL_UP  = 1.0;     // 松开后推力恢复速率（/s）
const CUT_SINK_RATE = 1.0;     // 低头角速度上限（rad/s，乘以失推力比例）
const CUT_SINK_MAX  = -0.5;    // 下坠收敛下滑角（机头方向 y 分量，约 -30°）

const G = {
  started:false, over:false, crashing:false, crashTime:0,
  score:0, destroyed:0, fireTimer:0, shake:0, bulletSide:1,
  aiming:false, boost:0,
  hp:64, hpMax:64, invuln:0, hitFlash:0,   // 触屏版血量 64（键鼠版为 8；敌人血量不变）
  thrust:1, lockTarget: null, engCut: false
};

const keys = { left:false, right:false, up:false, down:false, fire:false, boost:false, engineCut:false };

let scene, camera, renderer, clock;
let plane, bombMark, gunReticle;
const bombs = [], bullets = [], effects = [], buildings = [];
const aaaGuns = [], samSites = [], enemies = [], eBullets = [], missiles = [];
const wingmen = [], wingRespawn = [0, 0];
let enemyTimer = 0;
let camInit = false;
const camLook = new THREE.Vector3();
const overlay = document.getElementById('overlay');

/* ---- 视角偏移（由触屏摇杆控制） ---- */
let camYawOff = 0, camPitchOff = 0;
/* 水平视角 360° 连续环绕（无死区）；垂直限幅 */
const CAM_PITCH_MIN = -0.85;
const CAM_PITCH_MAX = 1.05;

/* ---- 触屏视角摇杆（沿用触屏时代锁定值：水平 1.9 / 垂直 1.5 rad/s） ---- */
const JOY_YAW_RATE   = 1.9;
const JOY_PITCH_RATE = 1.5;
let joyPointerId = null;
let joyActive = false;
let joyStickX = 0, joyStickY = 0;   // -1 .. 1
let lastJoyTapTime = 0;
let joyTapX = 0, joyTapY = 0;

const _tmpEuler = new THREE.Euler(0, 0, 0, 'YXZ');
const _tmpQuat  = new THREE.Quaternion();
const _tmpVec   = new THREE.Vector3();

/* =========================================================
   共享几何 / 材质
========================================================= */
const UNIT_BOX   = new THREE.BoxGeometry(1, 1, 1);
const FX_BALL    = new THREE.SphereGeometry(1, 12, 10);
const FX_SPARK   = new THREE.BoxGeometry(1, 1, 1);
const SMOKE_GEO  = new THREE.SphereGeometry(1, 8, 6);
const FX_RING    = (function () {
  const g = new THREE.RingGeometry(0.82, 1.0, 36);
  g.rotateX(-Math.PI / 2);
  return g;
})();
const BULLET_GEO = (function () {
  const g = new THREE.CylinderGeometry(0.18, 0.18, 5, 6);
  g.rotateX(Math.PI / 2);
  return g;
})();
const BULLET_MAT = new THREE.MeshBasicMaterial({
  color: 0xffe066, transparent: true, opacity: 0.92,
  blending: THREE.AdditiveBlending, depthWrite: false
});
/* 敌方曳光弹（红橙色，便于区分敌我） */
const E_BULLET_MAT = new THREE.MeshBasicMaterial({
  color: 0xff6644, transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const DEBRIS_MATS = new Map();
function getDebrisMat(hex) {
  let m = DEBRIS_MATS.get(hex);
  if (!m) { m = new THREE.MeshLambertMaterial({ color: hex }); DEBRIS_MATS.set(hex, m); }
  return m;
}

/* =========================================================
   音效
========================================================= */
const Sound = {
  ctx:null, master:null, ready:false,
  engOsc1:null, engOsc2:null, engGain:null, engFilter:null, noiseBuf:null,
  lastGun:0,

  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const ctx = this.ctx;

    this.master = ctx.createGain();
    this.master.gain.value = 0.55;
    this.master.connect(ctx.destination);

    const sr = ctx.sampleRate;
    const buf = ctx.createBuffer(1, sr * 2, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;

    this.engOsc1 = ctx.createOscillator();
    this.engOsc1.type = 'sawtooth';
    this.engOsc1.frequency.value = 58;

    this.engOsc2 = ctx.createOscillator();
    this.engOsc2.type = 'sawtooth';
    this.engOsc2.frequency.value = 61.5;

    const engNoise = ctx.createBufferSource();
    engNoise.buffer = buf;
    engNoise.loop = true;

    const noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.3;

    this.engFilter = ctx.createBiquadFilter();
    this.engFilter.type = 'lowpass';
    this.engFilter.frequency.value = 380;
    this.engFilter.Q.value = 2.5;

    this.engGain = ctx.createGain();
    this.engGain.gain.value = 0;

    this.engOsc1.connect(this.engFilter);
    this.engOsc2.connect(this.engFilter);
    engNoise.connect(noiseGain);
    noiseGain.connect(this.engFilter);
    this.engFilter.connect(this.engGain);
    this.engGain.connect(this.master);

    this.engOsc1.start();
    this.engOsc2.start();
    engNoise.start();

    this.engGain.gain.setTargetAtTime(0.085, ctx.currentTime, 0.6);
    this.ready = true;
  },

  setEngine(intensity, boost) {
    if (!this.ready) return;
    boost = boost || 0;
    const t = this.ctx.currentTime;
    /* 加力：转速更低沉、滤通更开、共振更强、音量明显更大 */
    this.engOsc1.frequency.setTargetAtTime(50 + intensity * 42 - boost * 24, t, 0.18);
    this.engOsc2.frequency.setTargetAtTime(53 + intensity * 44 - boost * 24, t, 0.18);
    this.engFilter.frequency.setTargetAtTime(290 + intensity * 880 + boost * 1500, t, 0.2);
    this.engFilter.Q.setTargetAtTime(2.5 + boost * 4, t, 0.25);
    this.engGain.gain.setTargetAtTime((0.06 + intensity * 0.055) * (1 + boost * 1.6), t, 0.25);
  },

  silenceEngine() {
    if (!this.ready) return;
    this.engGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.15);
  },

  gun() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    if (t - this.lastGun < 0.028) return;
    this.lastGun = t;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 1.5 + Math.random() * 0.4;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1500 + Math.random() * 600;
    bp.Q.value = 1.3;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.20, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);

    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.085);
  },

  boom(power) {
    if (!this.ready) return;
    power = power || 1;
    const ctx = this.ctx, t = ctx.currentTime;
    const dur = 0.5 + power * 0.65;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.5 + Math.random() * 0.3;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400 * power, t);
    lp.frequency.exponentialRampToValueAtTime(100, t + dur);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.34 * Math.min(1.7, power), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);

    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.15);
  },

  /* 防空机枪远距枪声：低频闷响，按距离衰减，带节流 */
  aaa(vol) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    if (t - (this.lastAaa || 0) < 0.055) return;
    this.lastAaa = t;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.9 + Math.random() * 0.3;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 900;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.14 * vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.1);
  },

  /* 导弹发射：噪声扫频上扬 */
  launch() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.8;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(260, t);
    bp.frequency.exponentialRampToValueAtTime(1900, t + 0.6);
    bp.Q.value = 1.1;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);

    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.85);
  },

  /* 玩家被命中的闷响 */
  hit() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.6 + Math.random() * 0.25;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 420;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);

    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.18);
  }
};

/* =========================================================
   工具
========================================================= */
function smoothstep(e0, e1, x) {
  let t = (x - e0) / (e1 - e0);
  t = Math.min(1, Math.max(0, t));
  return t * t * (3 - 2 * t);
}

/* =========================================================
   地形
========================================================= */
function terrainHeight(x, z) {
  let h = 70;
  h += Math.sin(x * 0.0015) * Math.cos(z * 0.0012) * 30;
  h += Math.sin(x * 0.0038 + 1.7) * 13;
  h += Math.cos(z * 0.0031 - 0.9) * 15;
  h += Math.sin((x + z) * 0.0006) * 22;

  const mdx = (x + 1250) / 900;
  const mdz = (z + 950) / 820;
  const md = Math.hypot(mdx, mdz);
  const mtnMask = Math.max(0, 1 - md);
  const mm = mtnMask * mtnMask * (1 - mtnMask * 0.25);
  h += mm * 620;
  h += Math.sin(x * 0.0052 + 0.5) * Math.cos(z * 0.0046 - 1.2) * mm * 210;
  h += Math.sin(x * 0.011 + 2.1) * Math.cos(z * 0.0098) * mm * 60;

  const cdx = (x - 700) / 640, cdz = (z - 40) / 620;
  const cd = Math.hypot(cdx, cdz);
  if (cd < 1.4) {
    const w = smoothstep(1.4, 0.82, cd);
    h = h * (1 - w) + 50 * w;
  }

  const rc = Math.sin(z * 0.0021) * 300 + Math.sin(z * 0.00075) * 220 - 120;
  const rd = Math.abs(x - rc);
  const rw = 52 + Math.sin(z * 0.009) * 10;
  if (rd < rw * 2.9) {
    const t = smoothstep(rw * 2.9, rw * 0.75, rd);
    h = h * (1 - t) + (-24 + Math.sin(z * 0.008) * 4) * t;
  }

  const ldx = x + 620, ldz = z - 700;
  const ld = Math.hypot(ldx, ldz);
  const ang = Math.atan2(ldz, ldx);
  const lr = 305 + Math.sin(ang * 3) * 48 + Math.sin(ang * 5 + 1.2) * 26;
  if (ld < lr * 1.75) {
    const t = smoothstep(lr * 1.75, lr * 0.55, ld);
    h = h * (1 - t) + (-20 + Math.sin(ang * 4) * 3) * t;
  }

  return h;
}

const STOPS = [
  { h: -30, c: [0.19, 0.25, 0.17] },
  { h:  2,  c: [0.42, 0.40, 0.27] },
  { h: 12,  c: [0.56, 0.50, 0.34] },
  { h: 22,  c: [0.35, 0.49, 0.24] },
  { h: 120, c: [0.28, 0.46, 0.22] },
  { h: 215, c: [0.19, 0.35, 0.17] },
  { h: 300, c: [0.31, 0.29, 0.26] },
  { h: 400, c: [0.46, 0.44, 0.43] },
  { h: 520, c: [0.90, 0.93, 0.97] },
  { h: 720, c: [1.00, 1.00, 1.00] }
];

function terrainColor(h, out) {
  if (h <= STOPS[0].h) {
    out[0] = STOPS[0].c[0]; out[1] = STOPS[0].c[1]; out[2] = STOPS[0].c[2];
    return;
  }
  for (let i = 0; i < STOPS.length - 1; i++) {
    const a = STOPS[i], b = STOPS[i + 1];
    if (h >= a.h && h <= b.h) {
      const t = smoothstep(a.h, b.h, h);
      out[0] = a.c[0] + (b.c[0] - a.c[0]) * t;
      out[1] = a.c[1] + (b.c[1] - a.c[1]) * t;
      out[2] = a.c[2] + (b.c[2] - a.c[2]) * t;
      return;
    }
  }
  const L = STOPS[STOPS.length - 1].c;
  out[0] = L[0]; out[1] = L[1]; out[2] = L[2];
}

function createTerrain() {
  const SIZE = 4400, SEG = 200;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);

  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const tmp = [0, 0, 0];

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = terrainHeight(x, z);
    pos.setY(i, h);
    terrainColor(h, tmp);

    const cdx = (x - 700) / 640, cdz = (z - 40) / 620;
    if (Math.hypot(cdx, cdz) < 1.15) {
      const w = smoothstep(1.15, 0.82, Math.hypot(cdx, cdz)) * 0.68;
      tmp[0] = tmp[0] * (1 - w) + 0.40 * w;
      tmp[1] = tmp[1] * (1 - w) + 0.41 * w;
      tmp[2] = tmp[2] * (1 - w) + 0.42 * w;
    }

    const n = (Math.sin(x * 0.31 + z * 0.27) * 0.5 + 0.5) * 0.06 - 0.03;
    colors[i * 3]     = Math.min(1, Math.max(0, tmp[0] + n));
    colors[i * 3 + 1] = Math.min(1, Math.max(0, tmp[1] + n));
    colors[i * 3 + 2] = Math.min(1, Math.max(0, tmp[2] + n));
  }

  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true })));
}

    vertexShader: `
      varying vec3 vPos;
      void main(){ vPos = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor;

      void main(){
        float h = vPos.y;
        vec3 c = mix(bottomColor, midColor, smoothstep(-0.12, 0.28, h));

  });

}

function createVegetation() {
  const COUNT = 460;
  const trunkGeo = new THREE.CylinderGeometry(0.5, 0.85, 6, 5);
  trunkGeo.translate(0, 3, 0);
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x4a3524 });
  const leafGeo = new THREE.ConeGeometry(3.4, 13, 7);
  leafGeo.translate(0, 10.5, 0);
  const leafMat = new THREE.MeshLambertMaterial({ color: 0x2c5c28 });

  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, COUNT);
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, COUNT);
  const dummy = new THREE.Object3D();
  let placed = 0, tries = 0;

  while (placed < COUNT && tries < COUNT * 16) {
    tries++;
    const x = (Math.random()-0.5) * 4100;
    const z = (Math.random()-0.5) * 4100;
    const h = terrainHeight(x, z);
    if (h < 80 || h > 320) continue;
    const cdx = (x - 700) / 640, cdz = (z - 40) / 620;
    if (Math.hypot(cdx, cdz) < 1.25) continue;
    if (h < WATER_LEVEL + 6) continue;

    const s = 0.65 + Math.random() * 1.05;
    dummy.position.set(x, h, z);
    dummy.rotation.y = Math.random() * Math.PI * 2;
    dummy.scale.set(s, s * (0.75 + Math.random() * 0.65), s);
    dummy.updateMatrix();
    trunks.setMatrixAt(placed, dummy.matrix);
    leaves.setMatrixAt(placed, dummy.matrix);
    placed++;
  }
  trunks.count = leaves.count = placed;
  trunks.instanceMatrix.needsUpdate = true;
  leaves.instanceMatrix.needsUpdate = true;
  scene.add(trunks);
  scene.add(leaves);
}

/* =========================================================
   空间哈希
========================================================= */
const HASH_CELL = 110;
const bHash = new Map();
let queryFrame = 0;
const _qResult = [];

function addToHash(b) {
  const key = Math.floor(b.x / HASH_CELL) + ',' + Math.floor(b.z / HASH_CELL);
  let arr = bHash.get(key);
  if (!arr) { arr = []; bHash.set(key, arr); }
  arr.push(b);
  b._hashKey = key;
}
function removeFromHash(b) {
  const arr = bHash.get(b._hashKey);
  if (!arr) return;
  const i = arr.indexOf(b);
  if (i >= 0) arr.splice(i, 1);
}
function queryBuildings(x, z, radius) {
  queryFrame++;
  _qResult.length = 0;
  const minGx = Math.floor((x - radius) / HASH_CELL);
  const maxGx = Math.floor((x + radius) / HASH_CELL);
  const minGz = Math.floor((z - radius) / HASH_CELL);
  const maxGz = Math.floor((z + radius) / HASH_CELL);
  for (let gx = minGx; gx <= maxGx; gx++) {
    for (let gz = minGz; gz <= maxGz; gz++) {
      const arr = bHash.get(gx + ',' + gz);
      if (!arr) continue;
      for (let i = 0; i < arr.length; i++) {
        const b = arr[i];
        if (b._qf === queryFrame || b.dead) continue;
        b._qf = queryFrame;
        _qResult.push(b);
      }
    }
  }
  return _qResult;
}

   城市
========================================================= */
function createCity() {
  const CX = 700, CZ = 40, RX = 620, RZ = 600;
  const BS = 118, ROAD = 24;
  const plot = BS - ROAD;

  const bodyColors = [
    0x6d8fc4, 0x7ba0cf, 0x5d7fb5, 0x88aad6, 0x6385b8,
    0x7a94b8, 0x8fb0d4, 0x5a78a8, 0x96b8dc, 0x6b8cba
  ];
  const roofColors = [0xe8956a, 0xf0a868, 0xd97a5c, 0xf5c88a, 0xc96b52];

  const bodyMats = bodyColors.map(c => new THREE.MeshLambertMaterial({ color: c }));
  const roofMats = roofColors.map(c => new THREE.MeshLambertMaterial({ color: c }));

  for (let bx = -RX; bx < RX - BS; bx += BS) {
    for (let bz = -RZ; bz < RZ - BS; bz += BS) {
      const ccx = bx + BS / 2, ccz = bz + BS / 2;
      const d = Math.hypot(ccx / RX, ccz / RZ);
      if (d > 0.92) continue;
      if (d > 0.6 && Math.random() < 0.38) continue;

      const core = Math.max(0, 1 - d / 0.92);

      const plots = [];
      if (Math.random() < 0.55) {
        const cell = plot / 2;
        for (let i = 0; i < 2; i++) {
          for (let j = 0; j < 2; j++) {
            if (Math.random() < 0.22) continue;
            plots.push({
              x: bx + ROAD / 2 + (i + 0.5) * cell,
              z: bz + ROAD / 2 + (j + 0.5) * cell,
              w: cell * 0.80, d: cell * 0.80
            });
          }
        }
      } else {
        if (Math.random() < 0.5) {
          plots.push({ x: bx + BS / 2, z: bz + BS / 2, w: plot * 0.86, d: plot * 0.86 });
        } else {
          for (let j = 0; j < 2; j++) {
            plots.push({
              x: bx + BS / 2,
              z: bz + ROAD / 2 + (j + 0.5) * (plot / 2),
              w: plot * 0.80, d: plot * 0.38
            });
          }
        }
      }

      for (const p of plots) {
        const wx = CX + p.x, wz = CZ + p.z;
        const gh = terrainHeight(wx, wz);
        if (gh < WATER_LEVEL + 8) continue;

        const hMax = 35 + core * 300;
        const h = 24 + Math.pow(Math.random(), 1.5) * hMax;
        const w  = p.w * (0.75 + Math.random() * 0.25);
        const dd = p.d * (0.75 + Math.random() * 0.25);

        makeBuilding(wx, wz, gh, w, h, dd, bodyMats, roofMats);
      }
    }
  }
}

function makeBuilding(x, z, y, w, h, d, bodyMats, roofMats) {
  const bodyMat = bodyMats[(Math.random() * bodyMats.length) | 0];
  const roofMat = roofMats[(Math.random() * roofMats.length) | 0];

  const rotY = (Math.random() - 0.5) * 0.16;

  const body = new THREE.Mesh(UNIT_BOX, bodyMat);
  body.position.set(x, y + h / 2, z);
  body.scale.set(w, h, d);
  body.rotation.y = rotY;
  scene.add(body);

  const roofH = 2.6 + h * 0.028;
  const roof = new THREE.Mesh(UNIT_BOX, roofMat);
  roof.position.set(x, y + h + roofH / 2 - 0.3, z);
  roof.scale.set(w * 1.07, roofH, d * 1.07);
  roof.rotation.y = rotY;
  scene.add(roof);

  const b = {
    body, roof,
    x, z,
    y0: y,
    y1: y + h + roofH,
    hw: (w * 1.07) / 2,
    hd: (d * 1.07) / 2,
    w, h, d,
    colorHex: bodyMat.color.getHex(),
    gunHits: 0,
    dead: false,
    _qf: -1
  };
  buildings.push(b);
  addToHash(b);
}

function sphereHitsBuilding(px, py, pz, r, b) {
  const cx = Math.max(b.x - b.hw, Math.min(px, b.x + b.hw));
  const cy = Math.max(b.y0, Math.min(py, b.y1));
  const cz = Math.max(b.z - b.hd, Math.min(pz, b.z + b.hd));
  const dx = px - cx, dy = py - cy, dz = pz - cz;
  return dx * dx + dy * dy + dz * dz < r * r;
}

function hitByBullet(b, hitPos) {
  if (b.dead) return;
  b.gunHits++;
  if (b.gunHits >= GUN_KILL_HITS) {
    destroyBuilding(b);
  } else {
    spawnHitSpark(hitPos);
  }
}

function destroyBuilding(b) {
  if (b.dead) return;
  b.dead = true;

  scene.remove(b.body);
  scene.remove(b.roof);
  removeFromHash(b);

  const n = 6 + (Math.random() * 6 | 0);
  for (let i = 0; i < n; i++) spawnDebris(b);

  const center = new THREE.Vector3(b.x, b.y0 + b.h * 0.5, b.z);
  spawnExplosion(center, 1.6 + Math.min(1.8, b.h / 170));
  Sound.boom(0.7 + Math.min(1.0, b.h / 260));

  G.shake = Math.min(1.6, G.shake + 0.45);
  G.score += 10;
}

function spawnDebris(b) {
  const s = 2 + Math.random() * 5;
  const m = new THREE.Mesh(UNIT_BOX, getDebrisMat(b.colorHex));
  m.scale.set(s, s * (0.6 + Math.random() * 0.9), s);
  m.position.set(
    b.x + (Math.random() - 0.5) * b.w,
    b.y0 + Math.random() * b.h,
    b.z + (Math.random() - 0.5) * b.d
  );
  scene.add(m);

  const dir = new THREE.Vector3(
    m.position.x - b.x,
    Math.random() * 0.8 + 0.2,
    m.position.z - b.z
  ).normalize();

  const spd = 18 + Math.random() * 35;
  const vel = dir.multiplyScalar(spd);
  vel.y += 18 + Math.random() * 24;

  effects.push({
    type: 'debris', mesh: m,
    ownsGeo: false, ownsMat: false,
    life: 0, dur: 2.2 + Math.random() * 1.5,
    vel,
    angVel: new THREE.Vector3(
      (Math.random() - 0.5) * 12,
      (Math.random() - 0.5) * 12,
      (Math.random() - 0.5) * 12
    )
  });
}

function dropBomb(forward) {
  const m = BOMB_PROTO.clone();
  m.position.copy(plane.position).addScaledVector(forward, 13);
  m.position.y -= 4;
  scene.add(m);

  const vel = forward.clone().multiplyScalar(curSpeed());
  vel.y -= 8;

  bombs.push({ mesh: m, vel: vel, age: 0, trail: 0 });
}

function onBombImpact(pos) {
  spawnExplosion(pos, 3.6);
  Sound.boom(1.6);
  G.shake = Math.min(2.4, G.shake + 1.0);

  const R = BOMB_RADIUS;
  const nearby = queryBuildings(pos.x, pos.z, R + 160);
  for (let i = 0; i < nearby.length; i++) {
    const b = nearby[i];
    if (b.dead) continue;
    const dx = b.x - pos.x, dz = b.z - pos.z;
    if (Math.abs(dx) < R + b.hw && Math.abs(dz) < R + b.hd) {
      const dy = Math.abs((b.y0 + b.h * 0.5) - pos.y);
      if (dy < R + b.h * 0.5) {
        destroyBuilding(b);
      }
    }
  }

  /* 波及敌方单位 */
  for (const g of aaaGuns) {
    if (!g.dead && Math.hypot(g.x - pos.x, g.z - pos.z) < R) destroyAAA(g);
  }
  for (const s of samSites) {
    if (!s.dead && Math.hypot(s.x - pos.x, s.z - pos.z) < R) destroySAM(s);
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.dead && e.mesh.position.distanceTo(pos) < R) destroyEnemy(e, true);
  }
}

/* =========================================================
   机炮
========================================================= */
function fireBullet() {
  const fwd = getForward().clone();
  const side = new THREE.Vector3(1, 0, 0).applyQuaternion(plane.quaternion);
  const up   = new THREE.Vector3(0, 1, 0).applyQuaternion(plane.quaternion);

  G.bulletSide = -G.bulletSide;

  const pos = plane.position.clone()
    .addScaledVector(fwd, 13)
    .addScaledVector(side, G.bulletSide * 2.6)
    .addScaledVector(up, -0.9);

  const m = new THREE.Mesh(BULLET_GEO, BULLET_MAT);
  m.position.copy(pos);
  m.quaternion.copy(plane.quaternion);
  scene.add(m);

  const vel = fwd.clone().multiplyScalar(CFG.bulletSpd).addScaledVector(side, G.bulletSide * 0.5);

  bullets.push({ mesh: m, vel: vel, age: 0 });

  spawnMuzzleFlash(pos);
  Sound.gun();
}

function spawnMuzzleFlash(pos) {
  const mat = new THREE.MeshBasicMaterial({
    color: 0xfff0a0, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const m = new THREE.Mesh(FX_BALL, mat);
  m.position.copy(pos);
  m.scale.setScalar(1.6);
  scene.add(m);
  effects.push({
    type: 'ball', mesh: m, ownsGeo: false, ownsMat: true,
    life: 0, dur: 0.07, base: 1.6
  });
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bu = bullets[i];
    bu.age += dt;

    const stepLen = bu.vel.length() * dt;
    const steps = Math.max(1, Math.ceil(stepLen / 6));
    let removed = false;

    for (let s = 0; s < steps; s++) {
      bu.mesh.position.addScaledVector(bu.vel, dt / steps);

      const p = bu.mesh.position;
      const gh = terrainHeight(p.x, p.z);
      if (p.y < gh) {
        spawnHitSpark(p);
        scene.remove(bu.mesh);
        bullets.splice(i, 1);
        removed = true;
        break;
      }

      const nearby = queryBuildings(p.x, p.z, 30);
      for (let j = 0; j < nearby.length; j++) {
        const b = nearby[j];
        if (b.dead) continue;
        if (p.x > b.x - b.hw && p.x < b.x + b.hw &&
            p.z > b.z - b.hd && p.z < b.z + b.hd &&
            p.y > b.y0 && p.y < b.y1) {
          hitByBullet(b, p.clone());
          scene.remove(bu.mesh);
          bullets.splice(i, 1);
          removed = true;
          break;
        }
      }

      /* 命中敌方单位（防空机枪 / 导弹阵地 / 敌机） */
      if (!removed) {
        for (let j = 0; j < aaaGuns.length; j++) {
          const g = aaaGuns[j];
          if (g.dead) continue;
          if (p.distanceToSquared(_u2.set(g.x, g.baseY + 3.0, g.z)) < 81) {
            g.hp--;
            if (g.hp <= 0) destroyAAA(g); else spawnHitSpark(p);
            scene.remove(bu.mesh);
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
      }
      if (!removed) {
        for (let j = 0; j < samSites.length; j++) {
          const s = samSites[j];
          if (s.dead) continue;
          if (p.distanceToSquared(_u2.set(s.x, s.baseY + 8.0, s.z)) < 576) {
            s.hp--;
            if (s.hp <= 0) destroySAM(s); else spawnHitSpark(p);
            scene.remove(bu.mesh);
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
      }
      if (!removed) {
        for (let j = 0; j < enemies.length; j++) {
          const en = enemies[j];
          if (en.dead) continue;
          if (p.distanceToSquared(en.mesh.position) < 81) {
            en.hp--;
            if (en.hp <= 0) destroyEnemy(en, true); else spawnHitSpark(p);
            scene.remove(bu.mesh);
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
      }

      if (removed) break;
    }

    if (removed) continue;

    if (bu.age > 2.2) {
      scene.remove(bu.mesh);
      bullets.splice(i, 1);
    }
  }
}

/* 双坡屋面（三棱柱）几何：底面宽 1.732r、脊高 1.5r、长 2L（小房子屋顶用） */
function makePrismGeo(r, L) {
  const w = r * 0.8660254, b = -r * 0.5, t = r;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    0, t, -L,   -w, b, -L,   w, b, -L,
    0, t,  L,    w, b,  L,  -w, b,  L,
  ]), 3));
  g.setIndex([0, 2, 1, 3, 4, 5, 0, 1, 5, 0, 5, 3, 0, 3, 4, 0, 4, 2]);
  g.computeVertexNormals();
  return g;
}

/* 小房子（墙体 + 双坡屋顶 + 门；SAM / AAA 营地共用） */
function makeHouse(w, h, d, wallMat, roofMat, ry) {
  const house = new THREE.Group();
  const walls = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  walls.position.y = h / 2 + 0.1;
  house.add(walls);
  const r = w * 0.62;
  const roof = new THREE.Mesh(makePrismGeo(r, d * 0.58), roofMat);
  roof.position.y = h + 0.1 + r * 0.5;
  house.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.72, 0.07), M_H_DOOR);
  door.position.set(w * 0.2, 0.56, d / 2 + 0.05);
  house.add(door);
  house.rotation.y = ry;
  return house;
}

/* 让物体的 -Z 朝向 dir（可带滚转） */
const _oF = new THREE.Vector3(), _oR = new THREE.Vector3();
const _oU = new THREE.Vector3(), _oB = new THREE.Vector3();
const _oQ = new THREE.Quaternion(), _oM = new THREE.Matrix4();
function orientToward(obj, dir, bank) {
  _oF.copy(dir).normalize();
  _oR.crossVectors(_oF, _worldUp);
  if (_oR.lengthSq() < 1e-6) _oR.set(1, 0, 0); else _oR.normalize();
  _oU.crossVectors(_oR, _oF).normalize();
  if (bank) {
    _oQ.setFromAxisAngle(_oF, bank);
    _oR.applyQuaternion(_oQ);
    _oU.applyQuaternion(_oQ);
  }
  _oB.copy(_oF).negate();
  _oM.makeBasis(_oR, _oU, _oB);
  obj.quaternion.setFromRotationMatrix(_oM);
}

/* ---- 防空机枪：通古斯卡式履带防空车（炮塔两侧双管机炮）+ 营地小房子 ---- */
function createAAAGun(x, z) {
  const groundY = terrainHeight(x, z);
  const yaw0 = Math.atan2(x, z);                              // 车体朝向地图中心
  const fwdX = -Math.sin(yaw0), fwdZ = -Math.cos(yaw0);
  const half = 2.9 * AAA_SCALE;                               // 车体世界半长
  const hF = terrainHeight(x + fwdX * half, z + fwdZ * half);
  const hB = terrainHeight(x - fwdX * half, z - fwdZ * half);

  const g = new THREE.Group();
  g.rotation.order = 'YXZ';
  g.rotation.y = yaw0;
  g.rotation.x = Math.atan2(hF - hB, half * 2);               // 贴合坡向
  g.position.set(x, (hF + hB) / 2 - 0.4, z);

  /* 履带底盘 */
  const trackGeo = new THREE.BoxGeometry(0.8, 0.9, 5.8);
  for (const tx of [-1.35, 1.35]) {
    const track = new THREE.Mesh(trackGeo, M_S_WHEEL);
    track.position.set(tx, 0.55, 0.15);
    g.add(track);
  }
  const hull = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.0, 5.2), M_A_TUR);
  hull.position.y = 1.05;
  g.add(hull);
  const glacis = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.8, 0.9), M_A_MOUNT);
  glacis.position.set(0, 1.12, -2.85);
  glacis.rotation.x = -0.35;
  g.add(glacis);
  const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.42, 0.1), M_S_GLASS);
  windshield.position.set(0, 1.38, -2.5);
  windshield.rotation.x = -0.35;
  g.add(windshield);

  /* 炮塔（水平跟踪）+ 俯仰组（左右两侧双管机炮，炮管加大） */
  const turret = new THREE.Group();
  turret.position.set(0, 1.75, 0.1);
  g.add(turret);
  const tbody = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.8, 2.2), M_A_TUR);
  tbody.position.set(0, 0.4, 0.15);
  turret.add(tbody);
  const optic = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.5), M_A_MOUNT);
  optic.position.set(-0.45, 0.98, 0.6);
  turret.add(optic);
  const radome = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.06, 12), M_S_DISH);
  radome.position.set(-0.45, 1.22, 0.6);
  radome.rotation.x = 0.35;
  turret.add(radome);

  const pitch = new THREE.Group();
  pitch.position.set(0, 0.55, 0);
  turret.add(pitch);
  const podGeo = new THREE.BoxGeometry(0.62, 0.55, 1.35);
  const barrelGeo = new THREE.CylinderGeometry(0.14, 0.14, 4.2, 8);
  const muzzles = [];
  for (const sx of [-1, 1]) {
    const pod = new THREE.Mesh(podGeo, M_A_MOUNT);
    pod.position.set(sx * 1.28, 0, 0.05);
    pitch.add(pod);
    for (const bx of [-0.185, 0.185]) {
      const barrel = new THREE.Mesh(barrelGeo, M_A_BARREL);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(sx * 1.28 + bx, 0, -2.0);
      pitch.add(barrel);
      const mz = new THREE.Object3D();
      mz.position.set(sx * 1.28 + bx, 0, -4.2);
      pitch.add(mz);
      muzzles.push(mz);
    }
  }

  /* 营地：2 栋小房子（与 SAM 营地同款） */
  [[-3.8, 2.9, 0.6, 1.7, 1.05, 1.6, M_H_WALL, M_H_ROOF],
   [4.4, -2.5, -2.3, 1.6, 1.0, 1.55, M_H_WALL, M_H_ROOF]].forEach(hh => {
    const house = makeHouse(hh[3], hh[4], hh[5], hh[6], hh[7], hh[2]);
    house.position.set(hh[0], 0, hh[1]);

  g.scale.setScalar(AAA_SCALE);

  return {
    mesh: g, turret, pitch, muzzles, x, z, baseY: groundY, yawBase: yaw0,
    yaw: Math.random() * Math.PI * 2, hp: GUN_KILL_HITS,

  scene.add(g);

  return {
    mesh: g, dish, missile: msl, x, z, baseY: groundY,
    yaw: yaw0, lock: 0, cd: 3 + Math.random() * 3, hp: 14, dead: false
  };
}

/* ---- 敌机（深色涂装 + 红色机翼尖，机头朝 -Z） ---- */
function createEnemyPlane() {

  [-5.1, 5.1].forEach(x => {

  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.26, 1.9, 1.4), M_E_RED);

/* ---- 布防：5 挺防空机枪 + 3 处导弹阵地（位置经地形校验） ---- */
function createDefenses() {
  const AAA_POS = [[-1450, 350], [1350, -700], [450, 1250], [-1250, 1050], [60, -600]];
  const SAM_POS = [[-150, -1400], [1500, 300], [-1550, -150]];
  for (const p of AAA_POS) aaaGuns.push(createAAAGun(p[0], p[1]));
  for (const p of SAM_POS) samSites.push(createSAM(p[0], p[1]));
}

/* ---- 敌机生成：从地图边缘进入 ---- */
function spawnEnemy() {
  const ang = Math.random() * Math.PI * 2;
  const R = 2050;
  const m = createEnemyPlane();
  m.position.set(
    Math.cos(ang) * R,
    Math.min(880, Math.max(320, plane.position.y + (Math.random() - 0.5) * 320)),
    Math.sin(ang) * R
  );
  scene.add(m);

  const fwd = new THREE.Vector3().subVectors(plane.position, m.position).normalize();
  orientToward(m, fwd, 0);
  enemies.push({
    mesh: m, hp: 12, spd: 58 + Math.random() * 10,
    bank: 0, fire: 0, shots: 0, shotGap: 0, fireCd: 1.5 + Math.random() * 2,
    sideBias: Math.random() < 0.5 ? -1 : 1,
    target: 'plane', retarget: 0,
    fwd, dead: false
  });
}

/* ---- 威胁子弹（防空机枪 / 敌机共用） ---- */
function spawnThreatBullet(pos, dir, spd, spread) {
  const m = new THREE.Mesh(BULLET_GEO, E_BULLET_MAT);
  m.position.copy(pos);
  scene.add(m);

  _u2.copy(dir);
  _u2.x += (Math.random() - 0.5) * spread;
  _u2.y += (Math.random() - 0.5) * spread;
  _u2.z += (Math.random() - 0.5) * spread;
  _u2.normalize();

  orientToward(m, _u2, 0);
  eBullets.push({ mesh: m, vel: _u2.clone().multiplyScalar(spd), age: 0 });
  spawnMuzzleFlash(pos);
}

/* 迭代求拦截点（写入 _u3）：|目标位置 + 目标速度·t − 炮口| = 弹速·t */
function leadTarget(muzzle, bulletSpd, tPos, tVel) {
  _u4.copy(tVel);
  let t = _u3.copy(tPos).distanceTo(muzzle) / bulletSpd;
  for (let k = 0; k < 2; k++) {
    _u3.copy(tPos).addScaledVector(_u4, t);
    t = _u3.distanceTo(muzzle) / bulletSpd;
  }
  _u3.copy(tPos).addScaledVector(_u4, t);
  return _u3;
}

/* ---- 防空机枪更新：跟踪 + 连发 ---- */
function fireAAAShot(gun) {
  gun.mesh.updateMatrixWorld(true);
  gun.mzIdx = (gun.mzIdx + 1) % gun.muzzles.length;   // 四管交替喷火
  const mz = gun.muzzles[gun.mzIdx];
  _u1.setFromMatrixPosition(mz.matrixWorld);

  const dist = _u1.distanceTo(plane.position);
  _vt.copy(getForward()).multiplyScalar(curSpeed());
  leadTarget(_u1, THREAT_BULLET_SPD, plane.position, _vt);
  _u2.subVectors(_u3, _u1).normalize();

  spawnThreatBullet(_u1.clone(), _u2, THREAT_BULLET_SPD, 0.025);
  const vol = Math.max(0, 1 - dist / 1500);
  if (vol > 0.06) Sound.aaa(vol);
}

function updateAAA(dt) {
  for (const gun of aaaGuns) {
    if (gun.dead) continue;

    const dx = plane.position.x - gun.x;
    const dz = plane.position.z - gun.z;
    const dh = Math.hypot(dx, dz);
    const dist = Math.hypot(dh, plane.position.y - gun.baseY);
    const canFire = G.started && !G.over && !G.crashing && dist < AAA_RANGE;

    /* 炮塔水平跟踪 */
    let yawErr = Math.atan2(-dx, -dz) - gun.yaw;
    while (yawErr > Math.PI) yawErr -= Math.PI * 2;
    while (yawErr < -Math.PI) yawErr += Math.PI * 2;
    const yawStep = 2.2 * dt;
    gun.yaw += Math.max(-yawStep, Math.min(yawStep, yawErr));
    gun.turret.rotation.y = gun.yaw - gun.yawBase;    // 车体带朝向，炮塔取局部角

    /* 炮管俯仰跟踪 */
    const mountY = gun.baseY + (1.75 + 0.55) * AAA_SCALE;
    const pitchTarget = Math.atan2(plane.position.y - mountY, Math.max(1, dh));
    const pErr = pitchTarget - gun.pitch.rotation.x;
    const pStep = 1.5 * dt;
    gun.pitch.rotation.x += Math.max(-pStep, Math.min(pStep, pErr));

    /* 连发 / 冷却 */
    if (gun.burst > 0) {
      gun.burst -= dt;
      gun.shotGap -= dt;
      if (gun.shotGap <= 0) {
        gun.shotGap = 0.09;
        fireAAAShot(gun);
        gun.shots--;
        if (gun.shots <= 0) gun.burst = 0;
      }
    } else {
      gun.cool -= dt;
      if (canFire && gun.cool <= 0 && Math.abs(yawErr) < 0.14 && Math.abs(pErr) < 0.22) {
        gun.burst = 99;
        gun.shots = 6 + (Math.random() * 5 | 0);
        gun.shotGap = 0;
        gun.cool = 1.6 + Math.random() * 1.3;
      }
    }
  }
}

/* ---- 导弹阵地更新：跟踪 + 锁定 + 发射 + 装填 ---- */
function launchSAM(s) {
  s.mesh.updateMatrixWorld(true);
  s.missile.updateMatrixWorld(true);
  const pos = new THREE.Vector3().setFromMatrixPosition(s.missile.matrixWorld);

  const m = makeMissileMesh();
  m.position.copy(pos);
  scene.add(m);

  const dir = new THREE.Vector3().subVectors(plane.position, pos).normalize();
  orientToward(m, dir, 0);
  m.scale.setScalar(SAM_SCALE);                              // 与阵地上待发弹同尺寸
  missiles.push({ mesh: m, dir, spd: 140, age: 0, trail: 0 });

  Sound.launch();
  spawnSmoke(pos.clone(), 3.0, false);                       // 冷发射筒口烟
  s.missile.visible = false;
  s.cd = 8;
}

function updateSAM(dt) {
  for (const s of samSites) {
    if (s.dead) continue;

    const dx = plane.position.x - s.x;
    const dz = plane.position.z - s.z;
    const dist = Math.sqrt(dx * dx + dz * dz + (plane.position.y - s.baseY) * (plane.position.y - s.baseY));
    const active = G.started && !G.over && !G.crashing;

    /* 垂直发射系统无需瞄准：载具静止，仅雷达天线旋转 */
    s.dish.rotation.y += dt * 2.4;

    /* 锁定进度 */
    if (active && dist < SAM_RANGE) s.lock = Math.min(1.6, s.lock + dt);
    else s.lock = Math.max(0, s.lock - dt * 2);

    /* 发射与装填 */
    s.cd -= dt;
    if (active && s.lock > 1.2 && s.cd <= 0 && missiles.length < 3) launchSAM(s);
    if (!s.missile.visible && s.cd < 5.2) s.missile.visible = true;
  }
}

/* ---- 敌机更新：追击 + 规避 + 开火（限制转向速率保证可规避） ---- */
function updateEnemies(dt) {
  enemyTimer -= dt;
  if (enemyTimer <= 0 && enemies.length < ENEMY_MAX) {
    spawnEnemy();
    enemyTimer = 9 + Math.random() * 5;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const m = e.mesh;

    /* 目标选择：玩家或僚机中较近者（每 5~8 秒重评，僚机可分担火力） */
    e.retarget -= dt;
    if (e.retarget <= 0 || (e.target !== 'plane' && e.target.dead)) {
      e.retarget = 5 + Math.random() * 3;
      let best = 'plane', bestD = m.position.distanceTo(plane.position);
      for (const w of wingmen) {
        if (w.dead) continue;
        const d = m.position.distanceTo(w.mesh.position);
        if (d < bestD) { bestD = d; best = w; }
      }
      e.target = best;
    }
    const tgt = e.target;
    const tPos = tgt === 'plane' ? plane.position : tgt.mesh.position;

    const dx = tPos.x - m.position.x;
    const dy = tPos.y - m.position.y;
    const dz = tPos.z - m.position.z;
    const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy + dz * dz));

    /* 撞击目标：同归于尽 */
    if (dist < 12) {
      destroyEnemy(e, true);
      if (tgt === 'plane') startCrash(); else destroyWingman(tgt);
      continue;
    }

    /* 期望方向：追击；进入交汇区则从目标侧向 90m 处绕行；贴地则拉起 */
    let tx = dx / dist, ty = dy / dist, tz = dz / dist;
    if (dist < 260) {
      /* 交汇脱离：从玩家侧向绕行通过，避免撞机与贴脸穿模 */
      _u2.set(tx, 0, tz);
      _u3.crossVectors(_u2, _worldUp);
      if (_u3.lengthSq() > 1e-6) {
        _u3.normalize();
        const ox = dx + _u3.x * e.sideBias * 90;
        const oy = dy + 20;
        const oz = dz + _u3.z * e.sideBias * 90;
        const ol = Math.max(1, Math.hypot(ox, oy, oz));
        tx = ox / ol; ty = oy / ol; tz = oz / ol;
      }
    }
    const gh = terrainHeight(m.position.x, m.position.z);
    if (m.position.y < gh + 80) ty = Math.max(ty, 0.45);
    if (m.position.y > 950) ty = Math.min(ty, -0.1);
    _u1.set(tx, ty, tz).normalize();

    /* 限速转向 */
    const ang = e.fwd.angleTo(_u1);
    if (ang > 1e-5) {
      const t = Math.min(1, (0.9 * dt) / ang);
      e.fwd.multiplyScalar(1 - t).addScaledVector(_u1, t).normalize();
    }

    /* 依据转向方向倾斜机身 */
    _u2.crossVectors(e.fwd, _worldUp);
    if (_u2.lengthSq() > 1e-6) {
      _u2.normalize();
      const side = _u1.dot(_u2);
      const bankTarget = Math.max(-1.0, Math.min(1.0, side * 1.2));
      e.bank += (bankTarget - e.bank) * (1 - Math.exp(-3 * dt));
    }
    orientToward(m, e.fwd, e.bank);

    /* 前进与地形碰撞 */
    m.position.addScaledVector(e.fwd, e.spd * dt);
    const ghn = terrainHeight(m.position.x, m.position.z);
    if (m.position.y < ghn + 3) {
      destroyEnemy(e, false);
      continue;
    }

    /* 尾焰闪烁 */
    const fl = m.userData.flame;
    if (fl) {
      const s = 0.8 + Math.random() * 0.5;
      fl.scale.set(s, s, s * (0.8 + Math.random() * 0.6));
      fl.material.opacity = 0.55 + Math.random() * 0.4;
    }

    /* 开火：对准且进入射程时打连发 */
    if (e.fire > 0) {
      e.fire -= dt;
      e.shotGap -= dt;
      if (e.shotGap <= 0 && dist < 800) {
        e.shotGap = 0.1;
        /* 命中点预判（对当前目标） */
        if (tgt === 'plane') _vt.copy(getForward()).multiplyScalar(curSpeed());
        else _vt.copy(tgt.fwd).multiplyScalar(tgt.spd);
        _u2.copy(e.fwd).multiplyScalar(7.6).add(m.position);
        leadTarget(_u2, 430, tPos, _vt);
        _u1.subVectors(_u3, _u2).normalize();
        spawnThreatBullet(_u2.clone(), _u1, 430, 0.04);
        const vol = Math.max(0, 1 - dist / 1400);
        if (vol > 0.07) Sound.aaa(vol);
        e.shots--;
        if (e.shots <= 0) {
          e.fire = 0;
          e.fireCd = 1.6 + Math.random() * 1.2;
        }
      }
    } else {
      e.fireCd -= dt;
      if (e.fireCd <= 0 && dist < 680) {
        _u1.set(dx / dist, dy / dist, dz / dist);
        if (e.fwd.dot(_u1) > 0.992) {
          e.fire = 1.4;
          e.shots = 6 + (Math.random() * 5 | 0);
          e.shotGap = 0;
        }
      }
    }
  }
}

/* 玩家受击：扣 1 点血量（带 0.22s 无敌帧），归零坠毁；导弹命中与撞击仍是即死 */
function damagePlayer(n) {
  if (!G.started || G.over || G.crashing) return;
  if (G.invuln > 0) return;
  G.invuln = 0.22;
  G.hitFlash = 0.6;
  G.shake = Math.min(2.0, G.shake + 0.5);
  Sound.hit();
  G.hp -= n;
  if (G.hp <= 0) {
    G.hp = 0;
    startCrash();
  }
}

/* 点到线段距离（标量版，用于导弹近炸段式判定，避免高速穿透） */
function segDist(p0, p1, q) {
  const ax = p1.x - p0.x, ay = p1.y - p0.y, az = p1.z - p0.z;
  const L2 = ax * ax + ay * ay + az * az;
  let t = 0;
  if (L2 > 1e-9) {
    t = ((q.x - p0.x) * ax + (q.y - p0.y) * ay + (q.z - p0.z) * az) / L2;
    t = Math.max(0, Math.min(1, t));
  }
  const cx = p0.x + ax * t - q.x, cy = p0.y + ay * t - q.y, cz = p0.z + az * t - q.z;
  return Math.sqrt(cx * cx + cy * cy + cz * cz);
}

/* ---- 威胁物：敌方弹幕与导弹推进 / 命中判定 ---- */
function updateThreats(dt) {
  const active = G.started && !G.over && !G.crashing;

  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.age += dt;
    const stepLen = b.vel.length() * dt;
    const steps = Math.max(1, Math.ceil(stepLen / 7));
    let removed = false;

    for (let s = 0; s < steps; s++) {
      b.mesh.position.addScaledVector(b.vel, dt / steps);
      const p = b.mesh.position;
      if (p.y <= terrainHeight(p.x, p.z) + 0.5) {
        spawnHitSpark(p);
        removed = true;
        break;
      }
      if (active && p.distanceToSquared(plane.position) < 64) {   // 半径 8 命中：扣血
        damagePlayer(1);
        removed = true;
        break;
      }
      if (active && !removed) {
        for (let j = 0; j < wingmen.length; j++) {
          const w = wingmen[j];
          if (w.dead) continue;
          if (p.distanceToSquared(w.mesh.position) < 100) {        // 半径 10：僚机被击中
            w.hp--;
            if (w.hp <= 0) destroyWingman(w); else spawnHitSpark(p);
            removed = true;
            break;
          }
        }
      }
    }

    if (removed || b.age > 3.5) {
      scene.remove(b.mesh);
      eBullets.splice(i, 1);
    }
  }

  for (let i = missiles.length - 1; i >= 0; i--) {
    const ms = missiles[i];
    ms.age += dt;

    /* 追踪（限转向速率，可被大机动甩掉） */
    _u1.subVectors(plane.position, ms.mesh.position);
    const dist = Math.max(0.001, _u1.length());
    _u1.multiplyScalar(1 / dist);
    const ang = ms.dir.angleTo(_u1);
    if (ang > 1e-5) {
      const t = Math.min(1, (0.9 * dt) / ang);
      ms.dir.multiplyScalar(1 - t).addScaledVector(_u1, t).normalize();
    }
    _u3.copy(ms.mesh.position);
    ms.mesh.position.addScaledVector(ms.dir, ms.spd * dt);
    orientToward(ms.mesh, ms.dir, 0);

    /* 烟迹 */
    ms.trail -= dt;
    if (ms.trail <= 0) {
      ms.trail = 0.05;
      spawnSmoke(ms.mesh.position.clone(), 1.5, false);
    }

    const p = ms.mesh.position;
    let blow = false;

    if (active && segDist(_u3, p, plane.position) < 12) {   // 近炸半径 12（段式判定）
      startCrash();
      blow = true;
    } else if (p.y <= terrainHeight(p.x, p.z) + 1) {
      blow = true;
    } else {
      const near = queryBuildings(p.x, p.z, 24);
      for (let j = 0; j < near.length; j++) {
        const b = near[j];
        if (b.dead) continue;
        if (p.x > b.x - b.hw && p.x < b.x + b.hw &&
            p.z > b.z - b.hd && p.z < b.z + b.hd &&
            p.y > b.y0 && p.y < b.y1) { blow = true; break; }
      }
    }
    if (ms.age > 6.5) blow = true;

    if (blow) {
      explosionAt(p.clone(), 2.4, 1.3);
      scene.remove(ms.mesh);
      missiles.splice(i, 1);
    }
  }
}

/* ---- 摧毁判定与结算 ---- */
function explosionAt(pos, scale, power) {
  spawnExplosion(pos, scale);
  Sound.boom(power);
  G.shake = Math.min(2.4, G.shake + 0.6);
}

function destroyAAA(g) {
  if (g.dead) return;
  g.dead = true;
  scene.remove(g.mesh);
  explosionAt(new THREE.Vector3(g.x, g.baseY + 4, g.z), 2.6, 1.2);
  G.score += 60;
  G.destroyed++;
}

function destroySAM(s) {
  if (s.dead) return;
  s.dead = true;
  scene.remove(s.mesh);
  explosionAt(new THREE.Vector3(s.x, s.baseY + 8, s.z), 3.2, 1.3);
  G.score += 90;
  G.destroyed++;
}

function destroyEnemy(e, scored) {
  if (e.dead) return;
  e.dead = true;
  explosionAt(e.mesh.position.clone(), 2.6, 1.2);
  scene.remove(e.mesh);
  const idx = enemies.indexOf(e);
  if (idx >= 0) enemies.splice(idx, 1);
  if (scored) { G.score += 150; G.destroyed++; }
}

/* =========================================================
   僚机（友军 AI）：编队跟随 / 交战敌机 / 击落后归队
========================================================= */
const WING_HP = 6;          // 僚机血量
const WING_RESPAWN = 20;    // 击落后归队时间（秒）

const M_W_BODY  = new THREE.MeshLambertMaterial({ color: 0xbfccd8 });
const M_W_WING  = new THREE.MeshLambertMaterial({ color: 0xaebbc9 });
const M_W_BLUE  = new THREE.MeshLambertMaterial({ color: 0x3a7bd5 });
const M_W_DARK  = new THREE.MeshLambertMaterial({ color: 0x36434f });
const M_W_GLASS = new THREE.MeshPhongMaterial({ color: 0x2f4a6e, shininess: 120, transparent: true, opacity: 0.9 });

/* 僚机：浅灰蓝机身 + 蓝色翼尖/垂尾（与敌机深灰红明确区分） */
function createWingmanPlane() {
  const g = new THREE.Group();

  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.1, 8.2, 12), M_W_BODY);
  fus.rotation.x = Math.PI / 2;
  fus.position.z = 0.3;
  g.add(fus);

  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2.8, 12), M_W_BODY);
  nose.rotation.x = -Math.PI / 2;
  nose.position.z = -5.0;
  g.add(nose);

  const wing = new THREE.Mesh(new THREE.BoxGeometry(11.5, 0.3, 2.8), M_W_WING);
  wing.position.set(0, -0.27, 0.4);
  g.add(wing);

  [-5.6, 5.6].forEach(x => {
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.36, 2.8), M_W_BLUE);
    tip.position.set(x, -0.27, 0.4);
    g.add(tip);
  });

  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.26, 1.9, 1.5), M_W_BLUE);
  fin.position.set(0, 1.32, 3.0);
  g.add(fin);

}

/* 编队位置（玩家侧后方）写入 out */
function wingFormationPos(side, out) {
  _w1.copy(getForward());
  _w2.crossVectors(_w1, _worldUp);
  if (_w2.lengthSq() < 1e-6) _w2.set(1, 0, 0); else _w2.normalize();
  _w3.crossVectors(_w2, _w1);
  out.copy(plane.position)
    .addScaledVector(_w1, -55)
    .addScaledVector(_w2, side * 70)
    .addScaledVector(_w3, -8);
  return out;
}

function spawnWingman(side) {
  const m = createWingmanPlane();
  wingFormationPos(side, _w4);
  const gh = terrainHeight(_w4.x, _w4.z);
  if (_w4.y < gh + 40) _w4.y = gh + 40;
  m.position.copy(_w4);
  scene.add(m);

  const fwd = getForward().clone();
  orientToward(m, fwd, 0);
  wingmen.push({
    mesh: m, fwd, spd: curSpeed(), bank: 0, side, hp: WING_HP,
    target: null, retarget: 0, fire: 0, shots: 0, shotGap: 0, fireCd: 1 + Math.random(),
    dead: false
  });
}

function destroyWingman(w) {
  if (w.dead) return;
  w.dead = true;
  explosionAt(w.mesh.position.clone(), 2.4, 1.1);
  scene.remove(w.mesh);
  const idx = wingmen.indexOf(w);
  if (idx >= 0) wingmen.splice(idx, 1);
  wingRespawn[w.side > 0 ? 1 : 0] = WING_RESPAWN;
}

/* 僚机开火：曳光弹并入玩家子弹池（复用命中判定），命中敌机同样有效 */
function fireWingBullet(w) {
  const e = w.target;
  if (!e || e.dead) return;
  _vt.copy(e.fwd).multiplyScalar(e.spd);
  _w3.copy(w.fwd).multiplyScalar(7.8).add(w.mesh.position);
  leadTarget(_w3, 450, e.mesh.position, _vt);
  _w2.subVectors(_u3, _w3).normalize();
  _w2.x += (Math.random() - 0.5) * 0.03;
  _w2.y += (Math.random() - 0.5) * 0.03;
  _w2.z += (Math.random() - 0.5) * 0.03;
  _w2.normalize();

  const m = new THREE.Mesh(BULLET_GEO, BULLET_MAT);
  m.position.copy(_w3);
  scene.add(m);
  orientToward(m, _w2, 0);
  bullets.push({ mesh: m, vel: _w2.clone().multiplyScalar(450), age: 0 });
  spawnMuzzleFlash(_w3);
  const vol = Math.max(0, 1 - w.mesh.position.distanceTo(plane.position) / 1400);
  if (vol > 0.05) Sound.aaa(vol * 0.8);
}

function updateWingmen(dt) {
  /* 归队重生 */
  for (let k = 0; k < 2; k++) {
    const side = k === 0 ? -1 : 1;
    wingRespawn[k] -= dt;
    if (wingRespawn[k] <= 0 && !wingmen.some(w => w.side === side)) spawnWingman(side);
  }

  for (let i = wingmen.length - 1; i >= 0; i--) {
    const w = wingmen[i];
    if (w.dead) continue;
    const m = w.mesh;

    /* 主动出击：纯战斗机，发现任何敌机即自发脱离编队迎战（不对地面单位反应）；无敌机时回编队 */
    w.retarget -= dt;
    if (w.retarget <= 0 || (w.target && w.target.dead)) {
      w.retarget = 1.0;
      let best = null, bestD = 1e9;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = m.position.distanceTo(e.mesh.position);
        if (d < bestD) { bestD = d; best = e; }
      }
      w.target = best;
    }

    let wantSpd;
    if (w.target && !w.target.dead) {
      /* ---- 交战：提前量追击 + 咬尾变速 + 近距规避 ---- */
      const e = w.target;
      const rdx = e.mesh.position.x - m.position.x;
      const rdy = e.mesh.position.y - m.position.y;
      const rdz = e.mesh.position.z - m.position.z;
      const rawDist = Math.max(1, Math.sqrt(rdx * rdx + rdy * rdy + rdz * rdz));

      /* 相撞：同归于尽 */
      if (rawDist < 12) {
        destroyEnemy(e, true);
        destroyWingman(w);
        continue;
      }

      let tx, ty, tz;
      if (rawDist < 120) {
        /* 极近处才做侧向脱离，避免对撞（近距缠斗其余时间保持机头指向） */
        _w2.set(rdx / rawDist, 0, rdz / rawDist);
        _w3.crossVectors(_w2, _worldUp);
        if (_w3.lengthSq() < 1e-6) _w3.set(1, 0, 0); else _w3.normalize();
        const ox = rdx + _w3.x * w.side * 90;
        const oy = rdy + 20;
        const oz = rdz + _w3.z * w.side * 90;
        const ol = Math.max(1, Math.hypot(ox, oy, oz));
        tx = ox / ol; ty = oy / ol; tz = oz / ol;
        wantSpd = 110;
      } else {
        /* 提前量追击：瞄向 0.6 秒后的敌机位置 */
        const ax = e.mesh.position.x + e.fwd.x * e.spd * 0.6;
        const ay = e.mesh.position.y + e.fwd.y * e.spd * 0.6;
        const az = e.mesh.position.z + e.fwd.z * e.spd * 0.6;
        const ddx = ax - m.position.x, ddy = ay - m.position.y, ddz = az - m.position.z;
        const dl = Math.max(1, Math.sqrt(ddx * ddx + ddy * ddy + ddz * ddz));
        tx = ddx / dl; ty = ddy / dl; tz = ddz / dl;
        const alignDot = tx * w.fwd.x + ty * w.fwd.y + tz * w.fwd.z;
        if (alignDot > 0.85) {
          /* 咬尾控速：接近目标速度避免冲过头 */
          wantSpd = Math.min(150, Math.max(90, e.spd + (rawDist - 180) * 0.8));
        } else {
          /* 大角度回转减速收紧转弯半径，其余快步接近 */
          wantSpd = alignDot < 0.25 ? 85 : 130;
        }
      }
      _w1.set(tx, ty, tz);
    } else {
      /* ---- 编队：跟住玩家侧后方 ---- */
      wingFormationPos(w.side, _w4);
      const dx = _w4.x - m.position.x;
      const dy = _w4.y - m.position.y;
      const dz = _w4.z - m.position.z;
      const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy + dz * dz));
      if (dist < 35) _w1.copy(getForward());
      else _w1.set(dx / dist, dy / dist, dz / dist);
      /* 编队速度：下限 34 略低于关车滑翔速度（≈37），保证关车滑翔时也能跟住 */
      wantSpd = Math.min(155, Math.max(34, curSpeed() + (dist - 30) * 0.9));
    }

    /* 与玩家保持安全距离（防穿模） */
    const pdx = m.position.x - plane.position.x;
    const pdy = m.position.y - plane.position.y;
    const pdz = m.position.z - plane.position.z;
    const pd = Math.max(1, Math.sqrt(pdx * pdx + pdy * pdy + pdz * pdz));
    if (pd < 45) {
      const k = 1.6 - pd / 45;
      _w1.x += (pdx / pd) * k * 1.4;
      _w1.y += (pdy / pd) * k * 0.8;
      _w1.z += (pdz / pd) * k * 1.4;
      _w1.normalize();
    }

    /* 贴地拉起 */
    const gh = terrainHeight(m.position.x, m.position.z);
    if (m.position.y < gh + 80) {
      _w1.y = Math.max(_w1.y, 0.5);
      _w1.normalize();
    }

    /* 限速转向 + 滚转 */
    const ang = w.fwd.angleTo(_w1);
    if (ang > 1e-5) {
      const t = Math.min(1, (1.3 * dt) / ang);
      w.fwd.multiplyScalar(1 - t).addScaledVector(_w1, t).normalize();
    }
    _w2.crossVectors(w.fwd, _worldUp);
    if (_w2.lengthSq() > 1e-6) {
      _w2.normalize();
      const side = _w1.dot(_w2);
      const bankTarget = Math.max(-1.1, Math.min(1.1, side * 1.3));
      w.bank += (bankTarget - w.bank) * (1 - Math.exp(-3.5 * dt));
    }
    orientToward(m, w.fwd, w.bank);

    /* 平滑变速与前进 */
    w.spd += (wantSpd - w.spd) * (1 - Math.exp(-1.5 * dt));
    m.position.addScaledVector(w.fwd, w.spd * dt);

    if (m.position.y < terrainHeight(m.position.x, m.position.z) + 3) {
      destroyWingman(w);
      continue;
    }

    /* 尾焰 */
    const fl = m.userData.flame;
    if (fl) {
      const s = 0.8 + Math.random() * 0.45;
      fl.scale.set(s, s, s * (0.8 + Math.random() * 0.5));
      fl.material.opacity = 0.55 + Math.random() * 0.4;
    }

    /* 开火（仅交战时打连发） */
    if (w.target && !w.target.dead) {
      const distT = m.position.distanceTo(w.target.mesh.position);
      if (w.fire > 0) {
        w.fire -= dt;
        w.shotGap -= dt;
        if (w.shotGap <= 0 && distT < 780) {
          w.shotGap = 0.1;
          fireWingBullet(w);
          w.shots--;
          if (w.shots <= 0) {
            w.fire = 0;
            w.fireCd = 1.4 + Math.random() * 1.2;
          }
        }
      } else {
        w.fireCd -= dt;
        if (w.fireCd <= 0 && distT < 700) {
          const dxx = w.target.mesh.position.x - m.position.x;
          const dyy = w.target.mesh.position.y - m.position.y;
          const dzz = w.target.mesh.position.z - m.position.z;
          const dd = Math.max(1, Math.sqrt(dxx * dxx + dyy * dyy + dzz * dzz));
          _w4.set(dxx / dd, dyy / dd, dzz / dd);
          if (w.fwd.dot(_w4) > 0.96) {
            w.fire = 1.2;
            w.shots = 5 + (Math.random() * 4 | 0);
            w.shotGap = 0;
          }
        }
      }
    }
  }
}

function spawnExplosion(pos, scale) {

  }));

  ball.scale.setScalar(4.2 * scale);
  scene.add(ball);
  effects.push({ type:'ball', mesh:ball, ownsGeo:false, ownsMat:true, life:0, dur:0.72, base:4.2*scale });

  }));

    });

    const dir = new THREE.Vector3(
      Math.random() - 0.5,
      Math.random() * 1.1 + 0.05,
      Math.random() - 0.5
    ).normalize();

    effects.push({
      type:'spark', mesh:p, ownsGeo:false, ownsMat:true, life:0,

      vel: dir.multiplyScalar((32 + Math.random() * 62) * scale)
    });
  }

  const sn = 6 + (Math.random() * 5 | 0);
  for (let i = 0; i < sn; i++) {

      (Math.random() - 0.5) * 14 * scale,
      Math.random() * 14 * scale,
      (Math.random() - 0.5) * 14 * scale
    );

  }
}

function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.life += dt;
    const t = e.life / e.dur;

    if (t >= 1) {
      scene.remove(e.mesh);
      if (e.ownsMat && e.mesh.material) e.mesh.material.dispose();
      if (e.ownsGeo && e.mesh.geometry) e.mesh.geometry.dispose();
      effects.splice(i, 1);
      continue;
    }

    switch (e.type) {
      case 'flash': {
        e.mesh.scale.setScalar(e.base * (0.6 + t * 3.0));
        e.mesh.material.opacity = Math.pow(1 - t, 2.2);
        break;
      }
      case 'ball': {
        e.mesh.scale.setScalar(e.base * (0.55 + t * 2.3));
        e.mesh.material.opacity = Math.pow(1 - t, 1.4);
        e.mesh.material.color.setHSL(0.13 - t * 0.13, 1, 0.66 - t * 0.34);
        break;
      }
      case 'ring': {
        e.mesh.scale.setScalar(e.base * (1 + t * 5.2));
        e.mesh.material.opacity = Math.pow(1 - t, 1.8) * 0.9;
        break;
      }
      case 'spark': {
        e.vel.y -= 66 * dt;
        e.mesh.position.addScaledVector(e.vel, dt);
        e.mesh.material.opacity = 1 - t * t;
        e.mesh.rotation.x += dt * 13;
        e.mesh.rotation.y += dt * 10;
        e.mesh.scale.multiplyScalar(1 - dt * 1.0);
        break;
      }
      case 'smoke': {
        e.mesh.position.addScaledVector(e.vel, dt);
        e.vel.multiplyScalar(1 - dt * 1.6);
        e.mesh.scale.setScalar(e.base * (0.8 + t * 1.9));
        e.mesh.material.opacity = 0.5 * Math.pow(1 - t, 1.3);
        break;
      }
      case 'debris': {
        e.vel.y -= 58 * dt;
        e.mesh.position.addScaledVector(e.vel, dt);
        e.mesh.rotation.x += e.angVel.x * dt;
        e.mesh.rotation.y += e.angVel.y * dt;
        e.mesh.rotation.z += e.angVel.z * dt;

        const gh = terrainHeight(e.mesh.position.x, e.mesh.position.z);
        if (e.mesh.position.y < gh + 1) {
          e.mesh.position.y = gh + 1;
          e.vel.y *= -0.25;
          e.vel.x *= 0.7;
          e.vel.z *= 0.7;
          e.angVel.multiplyScalar(0.6);
        }
        e.mesh.material.opacity = Math.max(0, 1 - t * t * 1.3);
        e.mesh.material.transparent = true;
        break;
      }
    }
  }
}

   触屏输入
========================================================= */
function clampViewOffsets() {
  if (camYawOff > Math.PI) camYawOff -= Math.PI * 2;
  else if (camYawOff < -Math.PI) camYawOff += Math.PI * 2;
  camPitchOff = Math.max(CAM_PITCH_MIN, Math.min(CAM_PITCH_MAX, camPitchOff));
}

/* 视角回正（摇杆双击归正）：锁定期间视角由锁定接管，双击不生效、也不解除锁定 */
function resetView() {
  if (G.lockTarget) return;
  camYawOff = 0;
  camPitchOff = 0;
  if (navigator.vibrate) navigator.vibrate(12);
}

function resetJoyKnob() {
  const knob = document.getElementById('joyKnob');
  if (knob) knob.style.transform = 'translate(0,0)';
}

/* ---- 按住生效的按钮（按下触发，抬起 / 滑出 / 取消时松开） ---- */
function bindHold(el, key) {
  const on  = e => { e.preventDefault(); keys[key] = true;  el.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---- 点按切换视角锁定（原 R 键） ---- */
function bindLockButton() {
  const btn = document.getElementById('btnLock');
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    btn.classList.add('on');
    toggleLock();
    if (navigator.vibrate) navigator.vibrate(10);
  });
  const off = e => { btn.classList.remove('on'); };
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---- 炸弹按钮：按住轰炸瞄准（显示落点标记），松开投弹 ---- */
let bombPointerId = null;
function bindBombButton() {
  const btnBomb = document.getElementById('btnBomb');

  btnBomb.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    if (bombPointerId !== null) return;
    bombPointerId = e.pointerId;
    btnBomb.classList.add('on');
    if (G.aiming) return;
    if (G.started && !G.over && !G.crashing) {
      G.aiming = true;
      if (navigator.vibrate) navigator.vibrate(8);
    }
  });

  window.addEventListener('pointerup', e => {
    if (e.pointerId !== bombPointerId) return;
    bombPointerId = null;
    btnBomb.classList.remove('on');
    if (!G.aiming) return;
    G.aiming = false;
    if (G.started && !G.over && !G.crashing) {
      dropBomb(getForward().clone());
      if (navigator.vibrate) navigator.vibrate(22);
    }
  });

  window.addEventListener('pointercancel', e => {
    if (e.pointerId !== bombPointerId) return;
    bombPointerId = null;
    btnBomb.classList.remove('on');
    G.aiming = false;
  });
}

/* ---- 视角摇杆：拖动转视角（360° 环绕），双击回正 ---- */
function bindJoystick() {
  const base = document.getElementById('joystick');
  const knob = document.getElementById('joyKnob');
  const MAXR = 34;                        // 手柄最大偏移像素

  function setKnob(dx, dy) {
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }

  function updateFromEvent(e) {
    const rect = base.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > MAXR) { dx = dx / d * MAXR; dy = dy / d * MAXR; }
    setKnob(dx, dy);
    joyStickX = dx / MAXR;
    joyStickY = dy / MAXR;
  }

  base.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();

    /* 双击：视角回正（快速回到机尾视角） */
    const now = performance.now();
    const dTap = Math.hypot(e.clientX - joyTapX, e.clientY - joyTapY);
    if (now - lastJoyTapTime < 320 && dTap < 36) {
      lastJoyTapTime = 0;
      resetView();
      joyStickX = 0;
      joyStickY = 0;
      setKnob(0, 0);
      return;
    }
    lastJoyTapTime = now;
    joyTapX = e.clientX;
    joyTapY = e.clientY;

    if (joyPointerId !== null) return;
    joyPointerId = e.pointerId;
    joyActive = true;
    try { base.setPointerCapture(e.pointerId); } catch (err) {}
    updateFromEvent(e);
  });

  base.addEventListener('pointermove', e => {
    if (e.pointerId !== joyPointerId) return;
    e.preventDefault();
    updateFromEvent(e);
  });

  const endJoy = e => {
    if (e.pointerId !== joyPointerId) return;
    joyPointerId = null;
    joyActive = false;
    joyStickX = 0;
    joyStickY = 0;
    setKnob(0, 0);
  };
  base.addEventListener('pointerup', endJoy);
  base.addEventListener('pointercancel', endJoy);
  base.addEventListener('contextmenu', e => e.preventDefault());
}
