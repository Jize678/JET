      const p = local((rng() * 2 - 1) * 58, -24 - rng() * 13);
      const h = ghAt(p);
      if (h < WATER_LEVEL + 2 || roadAt(GEN, p[0], p[1]) > 0.03) continue;
      let clear = true;
      for (const b of buildings) {
        if (!b.dead && Math.hypot(b.x - p[0], b.z - p[1]) < Math.max(b.w, b.d) * 0.7 + 5) {
          clear = false; break;
        }
      }
      if (!clear) continue;
      winds.push({
        x: p[0], z: p[1], h, s: 0.58 + rng() * 0.42,
        rot: rng() * 6.2832, style: rng() < 0.65 ? 'broad' : 'pine2'
      });
    }
    if (winds.length) farmDecorGroup.add(addTreeCluster(winds, null, 'farm'));
  }
}

function insideVillage(x, z, mul) {
  for (const v of GEN.villages) if (Math.hypot(x - v.x, z - v.z) < v.r * mul) return true;
  return false;
}

function insideFarmstead(x, z, mul) {
  for (const fs of (GEN.farmsteads || [])) {
    if (Math.hypot(x - fs.x, z - fs.z) < fs.r * (mul === undefined ? 1.55 : mul)) return true;
  }
  return false;
}

function insideField(x, z, mul) {
  for (const f of GEN.fields) {
    const dx = x - f.x, dz = z - f.z;
    if (Math.abs(dx) > f.rad * mul || Math.abs(dz) > f.rad * mul) continue;
    if (f._cr === undefined) {
      f._cr = Math.cos(f.rot);
      f._sr = Math.sin(f.rot);
    }
    const c = f._cr, s = f._sr;
    const lx = c * dx + s * dz, lz = -s * dx + c * dz;
    if (Math.abs(lx) > f.w * 0.62 * mul || Math.abs(lz) > f.d * 0.62 * mul) continue;
    const poly = f.poly;
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0] * mul, zi = poly[i][1] * mul;
      const xj = poly[j][0] * mul, zj = poly[j][1] * mul;
      if ((zi > lz) !== (zj > lz) &&
          lx < (xj - xi) * (lz - zi) / (zj - zi + 1e-9) + xi) inside = !inside;
    }
    if (inside) return true;
  }
  return false;
}

function createFarmland() {
  if (!GEN.fields.length) return;
  const SPECS = {
    grain: {
      soil: [0.43, 0.35, 0.23],
      crops: [[0.61, 0.51, 0.25], [0.70, 0.60, 0.31], [0.78, 0.69, 0.40]],
      row: 7.5, amp: 0.72
    },
    vegetable: {
      soil: [0.35, 0.31, 0.21],
      crops: [[0.36, 0.49, 0.22], [0.44, 0.55, 0.25], [0.52, 0.44, 0.25]],
      row: 5.0, amp: 0.38
    },
    pasture: {
      soil: [0.31, 0.42, 0.23],
      crops: [[0.36, 0.48, 0.25], [0.41, 0.52, 0.28], [0.47, 0.55, 0.30]],
      row: 18, amp: 0.08
    },
    orchard: {
      soil: [0.38, 0.35, 0.22],
      crops: [[0.33, 0.43, 0.23], [0.39, 0.48, 0.26], [0.45, 0.51, 0.28]],
      row: 20, amp: 0.06
    },
    fallow: {
      soil: [0.44, 0.35, 0.23],
      crops: [[0.53, 0.43, 0.29], [0.58, 0.48, 0.32], [0.48, 0.39, 0.26]],
      row: 12, amp: 0.20
    }
  };
  const F = { pos: [], col: [], idx: [], uv: [] };
  const TRACK = { pos: [], col: [], idx: [] };
  const PROP = { pos: [], col: [], idx: [] };
  const haySpots = [];
  const orchardSpots = [];
  const windbreakSpots = [];
  ensureVillageAssets();

  function fieldSurface(f, lx, lz, spec, crop) {
    const p = fieldLocalToWorld(f, lx, lz);
    const rowCoord = f.rowAxis === 'x' ? lx : lz;
    let fr = (rowCoord / spec.row) % 1;
    if (fr < 0) fr += 1;
    const ridge = 1 - Math.abs(2 * fr - 1);
    const micro = Math.sin(lx * 0.072 + lz * 0.061 + f.crop * 8) * 0.07;
    const lift = f.kind === 'pasture' || f.kind === 'orchard'
      ? 0.20 + micro : 0.18 + ridge * spec.amp;
    const mixv = f.kind === 'pasture' ? 0.70 + ridge * 0.18 :
                 f.kind === 'orchard' ? 0.48 + ridge * 0.16 :
                 f.kind === 'fallow' ? 0.40 + ridge * 0.18 :
                 0.54 + ridge * 0.14;
    return {
      x: p[0], z: p[1], y: terrainHeight(p[0], p[1]) + lift,
      c: [
        spec.soil[0] + (crop[0] - spec.soil[0]) * mixv,
        spec.soil[1] + (crop[1] - spec.soil[1]) * mixv,
        spec.soil[2] + (crop[2] - spec.soil[2]) * mixv
      ]
    };
  }

  function addFieldBorder(f) {
    const poly = f.poly;
    const rgb = [0.49, 0.41, 0.27];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const aw = fieldLocalToWorld(f, a[0], a[1]);
      const bw = fieldLocalToWorld(f, b[0], b[1]);
      const dx = bw[0] - aw[0], dz = bw[1] - aw[1];
      const len = Math.hypot(dx, dz);
      if (len < 1) continue;
      const nx = -dz / len * 1.45, nz = dx / len * 1.45;
      const p0 = [aw[0] - nx, aw[1] - nz], p1 = [aw[0] + nx, aw[1] + nz];
      const p2 = [bw[0] + nx, bw[1] + nz], p3 = [bw[0] - nx, bw[1] - nz];
      const base = F.pos.length / 3;
      for (const p of [p0, p1, p2, p3]) {
        F.pos.push(p[0], terrainHeight(p[0], p[1]) + 0.54, p[1]);
        F.col.push(rgb[0], rgb[1], rgb[2]);
        F.uv.push(0.985, 0.5);
      }
      F.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
    }
  }

  for (let fi = 0; fi < GEN.fields.length; fi++) {
    const f = GEN.fields[fi];
    const spec = SPECS[f.kind] || SPECS.grain;
    const crop = spec.crops[(f.crop * spec.crops.length) | 0];
    const NX = Math.max(9, Math.min(38, Math.ceil(f.w / 4.0)));
    const NZ = Math.max(8, Math.min(32, Math.ceil(f.d / 4.0)));
    const cw = f.w / NX, cd = f.d / NZ;
    for (let ix = 0; ix < NX; ix++) {
      for (let iz = 0; iz < NZ; iz++) {
        const lx0 = -f.w * 0.5 + ix * cw, lx1 = lx0 + cw;
        const lz0 = -f.d * 0.5 + iz * cd, lz1 = lz0 + cd;
        if (!pointInFieldPoly(f, (lx0 + lx1) * 0.5, (lz0 + lz1) * 0.5)) continue;
        const v0 = fieldSurface(f, lx0, lz0, spec, crop);
        const v1 = fieldSurface(f, lx0, lz1, spec, crop);
        const v2 = fieldSurface(f, lx1, lz1, spec, crop);
        const v3 = fieldSurface(f, lx1, lz0, spec, crop);
        const rowKind = f.kind === 'grain' || f.kind === 'vegetable';
        const uvFor = (lx, lz) => {
          if (!rowKind) return [0.985, (lx + lz) / 31];
          const rc = f.rowAxis === 'x' ? lx : lz;
          const oc = f.rowAxis === 'x' ? lz : lx;
          return [rc / spec.row, oc / 29];
        };
        const uv0 = uvFor(lx0, lz0), uv1 = uvFor(lx0, lz1);
        const uv2 = uvFor(lx1, lz1), uv3 = uvFor(lx1, lz0);
        const base = F.pos.length / 3;
        for (const v of [v0, v1, v2, v3]) {
          F.pos.push(v.x, v.y, v.z);
          F.col.push(v.c[0], v.c[1], v.c[2]);
        }
        F.uv.push(uv0[0], uv0[1], uv1[0], uv1[1], uv2[0], uv2[1], uv3[0], uv3[1]);
        F.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }
    }
    addFieldBorder(f);

    const rng = mulberry32((((GEN.seed ^ 0x2F11) + fi * 6151) >>> 0));
    const gateA = f.poly[f.gateEdge], gateB = f.poly[(f.gateEdge + 1) % f.poly.length];
    const ga = fieldLocalToWorld(f, gateA[0], gateA[1]);
    const gb = fieldLocalToWorld(f, gateB[0], gateB[1]);
    const gateMidX = (ga[0] + gb[0]) * 0.5, gateMidZ = (ga[1] + gb[1]) * 0.5;
    const gdx = gb[0] - ga[0], gdz = gb[1] - ga[1];
    const gl = Math.hypot(gdx, gdz) || 1;
    const gnx = -gdz / gl, gnz = gdx / gl;
    for (const s of [-1, 1]) {
      const px = gateMidX + gdx / gl * s * 3.2;
      const pz = gateMidZ + gdz / gl * s * 3.2;
      const gy = terrainHeight(px, pz);
      addRotBox(PROP, px, pz, gy + 0.15, gy + 1.55, 0.24, 0.24,
        Math.atan2(-gdz, gdx), [0.38, 0.29, 0.18]);
    }

    if (f.kind === 'grain' || f.kind === 'vegetable') {
      if (rng() < 0.55) {
        const sp = f.poly[(f.gateEdge + 4) % f.poly.length];
        const lx = sp[0] * 0.52, lz = sp[1] * 0.52;
        const p = fieldLocalToWorld(f, lx, lz);
        const gy = terrainHeight(p[0], p[1]);
        addRotBox(PROP, p[0], p[1], gy, gy + 3.0, 0.18, 0.18, f.rot, [0.34, 0.25, 0.15]);
        addRotBox(PROP, p[0], p[1], gy + 2.0, gy + 2.15, 2.6, 0.14, f.rot, [0.38, 0.29, 0.17]);
        addRotBox(PROP, p[0], p[1], gy + 2.65, gy + 3.3, 0.66, 0.66, f.rot, [0.70, 0.60, 0.32]);
      }
    }

    if (f.kind === 'pasture' || f.kind === 'orchard') {
      if (f.kind === 'pasture') {
        for (let k = 0; k < 5; k++) {
          const a = rng() * 6.2832, rr = Math.sqrt(rng()) * 0.72;
          const lx = Math.cos(a) * rr * f.w * 0.38;
          const lz = Math.sin(a) * rr * f.d * 0.38;
          if (!pointInFieldPoly(f, lx, lz)) continue;
          const p = fieldLocalToWorld(f, lx, lz);
          haySpots.push([p[0], terrainHeight(p[0], p[1]) + 1.3, p[1], 0.75 + rng() * 0.45, rng() * 3]);
        }
      }
      for (let k = 0; k < f.poly.length; k++) {
        if (k === f.gateEdge) continue;
        const a = f.poly[k], b = f.poly[(k + 1) % f.poly.length];
        const aw = fieldLocalToWorld(f, a[0], a[1]);
        const bw = fieldLocalToWorld(f, b[0], b[1]);
        const dx = bw[0] - aw[0], dz = bw[1] - aw[1];
        const len = Math.hypot(dx, dz);
        const ang = Math.atan2(-dz, dx);
        const n = Math.max(2, Math.ceil(len / 7));
        for (let q = 0; q < n; q++) {
          const px = aw[0] + dx * q / n, pz = aw[1] + dz * q / n;
          const gy = terrainHeight(px, pz);
          addRotBox(PROP, px, pz, gy, gy + 1.15, 0.15, 0.15, ang, [0.38, 0.29, 0.18]);
        }
        const mx = (aw[0] + bw[0]) * 0.5, mz = (aw[1] + bw[1]) * 0.5;
        const my = terrainHeight(mx, mz);
        addRotBox(PROP, mx, mz, my + 0.55, my + 0.68, len, 0.11, ang, [0.40, 0.31, 0.19]);
      }
    }

    if (f.kind === 'orchard') {
      const sp = 12.5;
      const nx = Math.max(2, Math.floor(f.w / sp));
      const nz = Math.max(2, Math.floor(f.d / sp));
      for (let i = 0; i < nx; i++) {
        for (let j = 0; j < nz; j++) {
          const lx = (i + 0.5) / nx * f.w - f.w * 0.5;
          const lz = (j + 0.5) / nz * f.d - f.d * 0.5;
          if (!pointInFieldPoly(f, lx, lz)) continue;
          const p = fieldLocalToWorld(f, lx, lz);
          orchardSpots.push({
            x: p[0], z: p[1], h: terrainHeight(p[0], p[1]),
            s: 0.44 + rng() * 0.16, rot: rng() * 6.2832,
            style: rng() < 0.8 ? 'broad' : 'pine2'
          });
        }
      }
    }

    /* 部分大田沿边缘布置防风林，给连续农田增加竖向层次和乡野边界。 */
    if (fi % 5 === 0) {
      const ei = (fi * 3 + 1) % f.poly.length;
      if (ei !== f.gateEdge) {
        const a = f.poly[ei], b = f.poly[(ei + 1) % f.poly.length];
        const aw = fieldLocalToWorld(f, a[0], a[1]);
        const bw = fieldLocalToWorld(f, b[0], b[1]);
        const dx = bw[0] - aw[0], dz = bw[1] - aw[1];
        const len = Math.hypot(dx, dz);
        if (len > 30) {
          const nx = -dz / len, nz = dx / len;
          const sgn = nx * (aw[0] - f.x) + nz * (aw[1] - f.z) >= 0 ? 1 : -1;
          const n = Math.min(14, Math.max(4, Math.floor(len / 11)));
          for (let q = 1; q < n; q++) {
            const t = q / n;
            const px = aw[0] + dx * t + nx * sgn * 3.6;
            const pz = aw[1] + dz * t + nz * sgn * 3.6;
            windbreakSpots.push({
              x: px, z: pz, h: terrainHeight(px, pz),
              s: 0.54 + rng() * 0.34, rot: rng() * 6.2832,
              style: rng() < 0.62 ? 'broad' : 'pine2'
            });
          }
        }
      }
    }
  }

  /* 农庄内部土路：沿田块间地籍空隙铺设，不再是“贴在一起的色块”。 */
  for (const cl of (GEN.fieldClusters || [])) {
    const c = Math.cos(cl.rot), s = Math.sin(cl.rot);
    const toWorld = (lx, lz) => [cl.x + lx * c - lz * s, cl.z + lx * s + lz * c];
    const path = (x0, z0, x1, z1, halfW) => {
      const pts = [];
      for (let i = 0; i <= 12; i++) {
        const t = i / 12;
        const p = toWorld(x0 + (x1 - x0) * t, z0 + (z1 - z0) * t);
        pts.push({ x: p[0], z: p[1], h: terrainHeight(p[0], p[1]) });
      }
      for (let i = 1; i < pts.length; i++) {
        const ax = (pts[i - 1].x + pts[i].x) * 0.5;
        const az = (pts[i - 1].z + pts[i].z) * 0.5;
        if (insideField(ax, az, 1.0)) continue;
        pushRoadRibbon(TRACK, [pts[i - 1], pts[i]], halfW, 0.34, [0.52, 0.44, 0.31], 1);
      }
    };
    const lane = Math.max(3.0, Math.min(5.0, cl.lane * 0.19));
    const xl = (cl.cellW + cl.lane) * 0.5;
    const zl = (cl.cellD + cl.lane) * 0.5;
    for (const sx of [-1, 1]) path(sx * xl, -cl.d * 0.5, sx * xl, cl.d * 0.5, lane);
    for (const sz of [-1, 1]) path(-cl.w * 0.5, sz * zl, cl.w * 0.5, sz * zl, lane);
    if (cl.access) {
      const dx = cl.access.x - cl.x, dz = cl.access.z - cl.z;
      const lx = dx * c + dz * s, lz = -dx * s + dz * c;
      if (Math.abs(lx) > Math.abs(lz)) {
        path(Math.sign(lx) * cl.w * 0.5, 0, lx, lz, 3.3);
      } else {
        path(0, Math.sign(lz) * cl.d * 0.5, lx, lz, 3.3);
      }
    }
  }

  /* 每个农庄只有一条从公路进入场院的支路。 */
  for (const fs of (GEN.farmsteads || [])) {
    if (!fs.access) continue;
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      const x = fs.access.x + (fs.x - fs.access.x) * t;
      const z = fs.access.z + (fs.z - fs.access.z) * t;
      pts.push({ x, z, h: terrainHeight(x, z) });
    }
    for (let i = 1; i < pts.length; i++) {
      const ax = (pts[i - 1].x + pts[i].x) * 0.5;
      const az = (pts[i - 1].z + pts[i].z) * 0.5;
      if (insideField(ax, az, 1.0)) continue;
      pushRoadRibbon(TRACK, [pts[i - 1], pts[i]], 3.4, 0.35, [0.53, 0.45, 0.31], 1);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(F.pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(F.col, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(F.uv, 2));
  geo.setIndex(F.idx);
  geo.computeVertexNormals();
  const fn = geo.attributes.normal;
  for (let i = 0; i < fn.count; i++) {
    fn.setXYZ(i, 0, 1, 0);
  }
  fn.needsUpdate = true;
  geo.computeBoundingSphere();
  const mat = new THREE.MeshLambertMaterial({
    vertexColors: true, side: THREE.DoubleSide, map: getFieldPatternTexture(),
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  mesh.name = 'fieldSurface';
  scene.add(mesh);
  worldScenery.push(mesh);

  if (TRACK.idx.length) {
    const tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.Float32BufferAttribute(TRACK.pos, 3));
    tg.setAttribute('color', new THREE.Float32BufferAttribute(TRACK.col, 3));
    tg.setIndex(TRACK.idx);
    tg.computeVertexNormals();
    const tm = new THREE.Mesh(tg,
      new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    tm.receiveShadow = true;
    tm.name = 'fieldTracks';
    scene.add(tm);
    worldScenery.push(tm);
  }

  if (PROP.idx.length) {
    const props = finishBatchMesh(PROP);
    props.receiveShadow = true;
    props.name = 'fieldProps';
    scene.add(props);
    worldScenery.push(props);
  }

  if (orchardSpots.length) {
    const trees = addTreeCluster(orchardSpots);
    scene.add(trees);
    worldScenery.push(trees);
  }
  if (windbreakSpots.length) {
    const trees = addTreeCluster(windbreakSpots);
    scene.add(trees);
    worldScenery.push(trees);
  }

  /* 草垛：全部合成一个 InstancedMesh，省掉上百次 draw call */
  if (haySpots.length) {
    const hays = new THREE.InstancedMesh(villageAssets.hayGeo, villageAssets.hayMat, haySpots.length);
    const hd = new THREE.Object3D();
    for (let i = 0; i < haySpots.length; i++) {
      const s = haySpots[i];
      hd.position.set(s[0], s[1], s[2]);
      hd.rotation.set(0, s[4], 0);
      hd.scale.setScalar(s[3]);
      hd.updateMatrix();
      hays.setMatrixAt(i, hd.matrix);
    }
    hays.instanceMatrix.needsUpdate = true;
    scene.add(hays);
    worldScenery.push(hays);
  }
}

function createForests() {
  if (!GEN.forests.length) return;
  ensureVegAssets();
  const MAX = 110000;
  const spots = [];
  const logSpots = [];
  for (const f of GEN.forests) {
    const rng = mulberry32(f.seed);
    const want = Math.min(12000, Math.round((Math.PI * f.a * f.b) / 30));
    for (let k = 0; k < want * 5 && spots.length < MAX; k++) {
      const lx = (rng() * 2 - 1) * f.a * 1.15;
      const lz = (rng() * 2 - 1) * f.b * 1.12;
      const x = f.x + lx * f.cr - lz * f.sr;
      const z = f.z + lx * f.sr + lz * f.cr;
      const cov = forestCoverage(f, x, z);
      if (cov < 0.085) continue;
      const edge = smoothstep(0.07, 0.72, cov);
      if (rng() > 0.06 + edge * 0.90) continue;
      const h = terrainHeight(x, z);
      if (h < WATER_LEVEL + 4 || h > 340) continue;
      if (roadAt(GEN, x, z) > 0.08) continue;
      let inCity = false;
      for (const ct of GEN.cities) {
        if (Math.hypot((x - ct.x) / ct.rx, (z - ct.z) / ct.rz) < 1.12) { inCity = true; break; }
      }
      if (inCity) continue;
      if (insideVillage(x, z, 1.12) || insideFarmstead(x, z, 1.7) ||
          insideField(x, z, 1.05) || railNear(GEN, x, z, 24)) continue;
      const moist = fbm(x * 0.0024, z * 0.0024, f.seed ^ 0x61A3, 2);
      const roll = rng();
      let style;
      if (h > 245) style = roll < 0.64 ? 'pine' : (roll < 0.88 ? 'pine2' : 'tall');
      else if (moist > 0.56) style = roll < 0.46 ? 'broad' : (roll < 0.72 ? 'pine2' : 'tall');
      else style = roll < 0.52 ? 'pine' : (roll < 0.78 ? 'pine2' : 'broad');
      spots.push({
        x, z, h,
        s: (0.58 + rng() * 0.72) * (0.84 + edge * 0.28),
        rot: rng() * Math.PI * 2,
        style
      });
    }

    /* 倒木、断桩和岩石补足林下层次，也让林缘不像整片“树桩阵列”。 */
    const logs = 8 + ((rng() * 10) | 0);
    for (let k = 0; k < logs * 6 && logSpots.length < 420; k++) {
      const lx = (rng() * 2 - 1) * f.a * 0.92;
      const lz = (rng() * 2 - 1) * f.b * 0.86;
      const x = f.x + lx * f.cr - lz * f.sr;
      const z = f.z + lx * f.sr + lz * f.cr;
      const cov = forestCoverage(f, x, z);
      if (cov < 0.18 || cov > 0.82) continue;
      const h = terrainHeight(x, z);
      if (h < WATER_LEVEL + 3 || roadAt(GEN, x, z) > 0.05 ||
          insideField(x, z, 1.0) || railNear(GEN, x, z, 20)) continue;
      logSpots.push({ x, z, h, s: 0.65 + rng() * 0.9, rot: rng() * Math.PI * 2, tilt: (rng() - 0.5) * 0.16 });
      break;
    }
  }
  if (!spots.length) return;
  const treeGroup = addTreeCluster(spots);
  scene.add(treeGroup);
  worldTrees.push(treeGroup);

  /* 林下灌木：补足林地的厚度，但保持低矮，不遮挡树冠轮廓。 */
  const bn = spots.length;
  const bushes = new THREE.InstancedMesh(vegAssets.bushGeo, vegAssets.bushMat, bn);
  bushes.frustumCulled = false;
  const dummy = new THREE.Object3D();
  let bi = 0;
  for (let i = 0; i < spots.length && bi < bn; i++) {
    const p = spots[i];
    const bx = p.x + Math.cos(i * 1.7) * (2.5 + (i % 5) * 1.4);
    const bz = p.z + Math.sin(i * 2.3) * (2.5 + (i % 7) * 1.2);
    const bh = terrainHeight(bx, bz);
    dummy.position.set(bx, Math.max(bh, p.h - 1.5), bz);
    dummy.rotation.y = i * 1.11;
    const bs = 1.35 + (i % 6) * 0.24;
    dummy.scale.set(bs * 1.25, bs * (0.7 + (i % 4) * 0.12), bs);
    dummy.updateMatrix();
    bushes.setMatrixAt(bi++, dummy.matrix);
  }
  bushes.count = bi;
  bushes.instanceMatrix.needsUpdate = true;
  scene.add(bushes);
  worldTrees.push(bushes);

  if (logSpots.length) {
    const logGeo = new THREE.CylinderGeometry(0.72, 0.96, 1, 7);
    const logMat = new THREE.MeshLambertMaterial({ color: 0x4a3525 });
    const logs = new THREE.InstancedMesh(logGeo, logMat, logSpots.length);
    const ld = new THREE.Object3D();
    for (let i = 0; i < logSpots.length; i++) {
      const p = logSpots[i];
      ld.position.set(p.x, p.h + 0.42 * p.s, p.z);
      ld.rotation.set(p.tilt, p.rot, Math.PI * 0.5);
      ld.scale.set(p.s * 0.7, 4.5 + p.s * 4.0, p.s * 0.7);
      ld.updateMatrix();
      logs.setMatrixAt(i, ld.matrix);
    }
    logs.instanceMatrix.needsUpdate = true;
    logs.receiveShadow = true;
    scene.add(logs);
    worldTrees.push(logs);
  }
}

function createMeadows() {
  if (!GEN.meadows || !GEN.meadows.length) return;
  ensureVegAssets();
  ensureVillageAssets();
  const treeSpots = [];
  const bushSpots = [];
  const haySpots = [];

  const validPoint = (x, z) => {
    const h = terrainHeight(x, z);
    if (h < WATER_LEVEL + 2.5 || h > 340) return false;
    if (roadAt(GEN, x, z) > 0.035 || railNear(GEN, x, z, 20)) return false;
    if (insideField(x, z, 1.02) || insideVillage(x, z, 1.06) || insideFarmstead(x, z, 1.35)) return false;
    for (const f of GEN.forests) if (forestCoverage(f, x, z) > 0.16) return false;
    return true;
  };

  for (const md of GEN.meadows) {
    const rng = mulberry32(md.seed);

    /* 少量树丛 + 孤立树，形成牧场、草甸和牧草地的疏林边界。 */
    for (let gi = 0, made = 0; gi < 66 && made < 18; gi++) {
      const x = md.x + (rng() * 2 - 1) * md.a * 0.82;
      const z = md.z + (rng() * 2 - 1) * md.b * 0.82;
      if (meadowCoverage(md, x, z) < 0.18 || !validPoint(x, z)) continue;
      const count = 3 + ((rng() * 6) | 0);
      const rr = 10 + rng() * 28;
      for (let k = 0; k < count; k++) {
        const a = rng() * 6.2832, d = Math.sqrt(rng()) * rr;
        const px = x + Math.cos(a) * d, pz = z + Math.sin(a) * d;
        if (!validPoint(px, pz)) continue;
        treeSpots.push({
          x: px, z: pz, h: terrainHeight(px, pz),
          s: 0.50 + rng() * 0.48, rot: rng() * 6.2832,
          style: rng() < 0.68 ? 'broad' : (rng() < 0.55 ? 'pine2' : 'pine')
        });
      }
      made++;
    }
    for (let k = 0, made = 0; k < 108 && made < 48; k++) {
      const x = md.x + (rng() * 2 - 1) * md.a;
      const z = md.z + (rng() * 2 - 1) * md.b;
      if (meadowCoverage(md, x, z) < 0.16 || !validPoint(x, z)) continue;
      treeSpots.push({
        x, z, h: terrainHeight(x, z),
        s: 0.42 + rng() * 0.45, rot: rng() * 6.2832,
        style: rng() < 0.76 ? 'broad' : 'pine2'
      });
      made++;
    }

    for (let k = 0, made = 0; k < 480 && made < 240; k++) {
      const x = md.x + (rng() * 2 - 1) * md.a;
      const z = md.z + (rng() * 2 - 1) * md.b;
      if (meadowCoverage(md, x, z) < 0.10 || !validPoint(x, z)) continue;
      bushSpots.push({
        x, z, h: terrainHeight(x, z),
        s: 0.75 + rng() * 1.45, rot: rng() * 6.2832
      });
      made++;
    }

    for (let k = 0, made = 0; k < 40 && made < 8; k++) {
      const x = md.x + (rng() * 2 - 1) * md.a * 0.68;
      const z = md.z + (rng() * 2 - 1) * md.b * 0.68;
      if (meadowCoverage(md, x, z) < 0.24 || !validPoint(x, z)) continue;
      haySpots.push([x, terrainHeight(x, z) + 1.3, z, 0.75 + rng() * 0.45, rng() * 3]);
      made++;
    }
  }

  if (treeSpots.length) {
    const trees = addTreeCluster(treeSpots);
    scene.add(trees);
    worldTrees.push(trees);
  }
  if (bushSpots.length) {
    const mat = new THREE.MeshLambertMaterial({ color: 0x69783b });
    const bushes = new THREE.InstancedMesh(vegAssets.bushGeo, mat, bushSpots.length);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < bushSpots.length; i++) {
      const p = bushSpots[i];
      dummy.position.set(p.x, p.h - 0.18, p.z);
      dummy.rotation.set(0, p.rot, 0);
      dummy.scale.set(p.s * 1.15, p.s * 0.62, p.s);
      dummy.updateMatrix();
      bushes.setMatrixAt(i, dummy.matrix);
    }
    bushes.instanceMatrix.needsUpdate = true;
    scene.add(bushes);
    worldTrees.push(bushes);
  }
  if (haySpots.length) {
    const hays = new THREE.InstancedMesh(villageAssets.hayGeo, villageAssets.hayMat, haySpots.length);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < haySpots.length; i++) {
      const p = haySpots[i];
      dummy.position.set(p[0], p[1], p[2]);
      dummy.rotation.set(0, p[4], 0);
      dummy.scale.setScalar(p[3]);
      dummy.updateMatrix();
      hays.setMatrixAt(i, dummy.matrix);
    }
    hays.instanceMatrix.needsUpdate = true;
    scene.add(hays);
    worldScenery.push(hays);
  }
}

/* 低层植物：草簇、蕨类和野花独立成批，补足近地层次的体积感。 */
function createGroundPlants() {
  ensureVegAssets();
  const COUNT = 200000;
  const rng = mulberry32((GEN.seed ^ 0xB411) >>> 0);
  const grassSpots = [], fernSpots = [], flowerSpots = [];
  let tries = 0, total = 0;
  while (total < COUNT && tries < COUNT * 8) {
    tries++;
    const x = (rng() * 2 - 1) * (WORLD_HALF - 100);
    const z = (rng() * 2 - 1) * (WORLD_HALF - 100);
    const h = terrainHeight(x, z);
    if (h < WATER_LEVEL + 2.2 || h > 420) continue;
    let inCity = false;
    for (const ct of GEN.cities) {
      if (Math.hypot((x - ct.x) / ct.rx, (z - ct.z) / ct.rz) < 1.03) {
        inCity = true;
        break;
      }
    }
    if (inCity || roadAt(GEN, x, z) > 0.04 || insideVillage(x, z, 1.02) ||
        insideFarmstead(x, z, 1.35) || insideField(x, z, 1.0) ||
        railNear(GEN, x, z, 16)) continue;
    const patch = fbm(x * 0.0018, z * 0.0018, GEN.seed ^ 0x9F12, 3);
    if (rng() > 0.40 + 0.95 * patch) continue;
    const p = {
      x, z, h,
      s: 1.00 + rng() * 1.90,
      rot: rng() * 6.2832
    };
    const roll = rng();
    if (roll < 0.12) flowerSpots.push(p);
    else if (roll < 0.38) fernSpots.push(p);
    else grassSpots.push(p);
    total++;
  }

  const addBatch = (spots, geo, mat, style) => {
    if (!spots.length) return;
    const mesh = new THREE.InstancedMesh(geo, mat, spots.length);
    mesh.frustumCulled = false;
    mesh.receiveShadow = true;
    const dummy = new THREE.Object3D();
    for (let i = 0; i < spots.length; i++) {
      const p = spots[i];
      dummy.position.set(p.x, p.h - 0.06, p.z);
      dummy.rotation.set(0, p.rot + (i % 3) * 0.8, 0);
      if (style === 'grass') {
        dummy.scale.set(
          p.s * (0.78 + (i % 5) * 0.06),
          p.s * (0.92 + (i % 4) * 0.13),
          p.s * (0.78 + (i % 3) * 0.09)
        );
      } else if (style === 'fern') {
        dummy.scale.set(
          p.s * (0.94 + (i % 4) * 0.08),
          p.s * (0.74 + (i % 5) * 0.10),
          p.s * (0.94 + (i % 3) * 0.10)
        );
      } else {
        dummy.scale.set(p.s * 0.72, p.s * 1.08, p.s * 0.72);
      }
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
    worldTrees.push(mesh);
  };

  addBatch(grassSpots, vegAssets.grassGeo, vegAssets.grassMat, 'grass');
  addBatch(fernSpots, vegAssets.fernGeo, vegAssets.fernMat, 'fern');
  addBatch(flowerSpots, vegAssets.flowerGeo, vegAssets.flowerMat, 'flower');
}

/* 零散巨石：一次 draw call，给山地与荒地补上实体 */
function createRocks() {
  if (!GEN.rocks || !GEN.rocks.length) return;
  if (!rockGeoCache) rockGeoCache = new THREE.IcosahedronGeometry(1, 0);
  if (!rockMatCache) rockMatCache = new THREE.MeshLambertMaterial({ color: 0x8b8b86 });
  const n = GEN.rocks.length;
  const mesh = new THREE.InstancedMesh(rockGeoCache, rockMatCache, n);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < n; i++) {
    const r = GEN.rocks[i];
    dummy.position.set(r.x, r.h + r.s * 0.35, r.z);
    dummy.rotation.set(r.tilt, r.rot, r.tilt * 0.6);
    dummy.scale.set(r.s, r.s * (0.55 + (i % 5) * 0.09), r.s * (0.8 + (i % 3) * 0.15));
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
  worldScenery.push(mesh);
}
let rockGeoCache = null, rockMatCache = null;

const HASH_CELL = 110;
const bHash = new Map();
let queryFrame = 0;
const _qResult = [];

function addToHash(b) {
  const key = Math.floor(b.x / HASH_CELL) + ',' + Math.floor(b.z / HASH_CELL);
  let arr = bHash.get(key);
  if (!arr) { arr = []; bHash.set(key, arr); }
  arr.push(b);
  b._hashKey = key;
}
function removeFromHash(b) {
  const arr = bHash.get(b._hashKey);
  if (!arr) return;
  const i = arr.indexOf(b);
  if (i >= 0) arr.splice(i, 1);
}
function queryBuildings(x, z, radius) {
  queryFrame++;
  _qResult.length = 0;
  const minGx = Math.floor((x - radius) / HASH_CELL);
  const maxGx = Math.floor((x + radius) / HASH_CELL);
  const minGz = Math.floor((z - radius) / HASH_CELL);
  const maxGz = Math.floor((z + radius) / HASH_CELL);
  for (let gx = minGx; gx <= maxGx; gx++) {
    for (let gz = minGz; gz <= maxGz; gz++) {
      const arr = bHash.get(gx + ',' + gz);
      if (!arr) continue;
      for (let i = 0; i < arr.length; i++) {
        const b = arr[i];
        if (b._qf === queryFrame || b.dead) continue;
        b._qf = queryFrame;
        _qResult.push(b);
      }
    }
  }
  return _qResult;
}

/* 场景可破坏物（树木 / 电线杆 / 车站模块）使用独立空间哈希，避免子弹逐帧遍历数万实例。 */
const PROP_HASH_CELL = 110;
const propHash = new Map();
let propQueryFrame = 0;
const _propResult = [];

function addPropTarget(t) {
  const r = Math.max(1, t.gridR || t.hitR || 1);
  const minGx = Math.floor((t.x - r) / PROP_HASH_CELL);
  const maxGx = Math.floor((t.x + r) / PROP_HASH_CELL);
  const minGz = Math.floor((t.z - r) / PROP_HASH_CELL);
  const maxGz = Math.floor((t.z + r) / PROP_HASH_CELL);
  const keys = [];
  for (let gx = minGx; gx <= maxGx; gx++) {
    for (let gz = minGz; gz <= maxGz; gz++) {
      const key = gx + ',' + gz;
      let arr = propHash.get(key);
      if (!arr) { arr = []; propHash.set(key, arr); }
      arr.push(t);
      keys.push(key);
    }
  }
  t._propKeys = keys;
  t._pqf = -1;
}

function removePropTarget(t) {
  if (!t || !t._propKeys) return;
  for (const key of t._propKeys) {
    const arr = propHash.get(key);
    if (!arr) continue;
    const i = arr.indexOf(t);
    if (i >= 0) arr.splice(i, 1);
  }
  t._propKeys = null;
}

function queryPropTargets(x, z, radius) {
  propQueryFrame++;
  _propResult.length = 0;
  const minGx = Math.floor((x - radius) / PROP_HASH_CELL);
  const maxGx = Math.floor((x + radius) / PROP_HASH_CELL);
  const minGz = Math.floor((z - radius) / PROP_HASH_CELL);
  const maxGz = Math.floor((z + radius) / PROP_HASH_CELL);
  for (let gx = minGx; gx <= maxGx; gx++) {
    for (let gz = minGz; gz <= maxGz; gz++) {
      const arr = propHash.get(gx + ',' + gz);
      if (!arr) continue;
      for (let i = 0; i < arr.length; i++) {
        const t = arr[i];
        if (t.dead || t._pqf === propQueryFrame) continue;
        t._pqf = propQueryFrame;
        _propResult.push(t);
      }
    }
  }
  return _propResult;
}

/* 建筑占地是否压到公路走廊（中心 + 四向半宽） */
function roadOnFootprint(x, z, w, d) {
  if (roadAt(GEN, x, z) > 0.015) return true;
  const hw = w * 0.55, hd = d * 0.55;
  return roadAt(GEN, x + hw, z) > 0.015 || roadAt(GEN, x - hw, z) > 0.015 ||
         roadAt(GEN, x, z + hd) > 0.015 || roadAt(GEN, x, z - hd) > 0.015;
}

/* =========================================================
   城市
========================================================= */
function hexRgb(hex) {
  return [((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255];
}

function addRotBox(batch, x, z, y0, y1, sx, sz, rot, rgb) {
  const hx = sx * 0.5, hz = sz * 0.5;
  const cs = [[-hx, -hz], [hx, -hz], [hx, hz], [-hx, hz]];
  const p = cs.map(([lx, lz]) => detLocal(x, z, rot, lx, lz));
  const base = batch.pos.length / 3;
  for (const q of p) {
    batch.pos.push(q[0], y0, q[1]);
    batch.col.push(rgb[0], rgb[1], rgb[2]);
  }
  for (const q of p) {
    batch.pos.push(q[0], y1, q[1]);
    batch.col.push(rgb[0], rgb[1], rgb[2]);
  }
  const f = [0, 1, 2, 0, 2, 3, 4, 6, 5, 4, 7, 6, 0, 4, 5, 0, 5, 1,
             1, 5, 6, 1, 6, 2, 2, 6, 7, 2, 7, 3, 3, 7, 4, 3, 4, 0];
  for (const i of f) batch.idx.push(base + i);
}

function addRoofBatch(batch, x, z, y, w, d, h, rot, rgb, gable) {
  const base = batch.pos.length / 3;
  if (gable) {
    const p = [
      [-0.5, 0, -0.5], [0.5, 0, -0.5], [0.5, 1, 0], [-0.5, 1, 0],
      [-0.5, 0, 0.5], [0.5, 0, 0.5]
    ].map(([lx, ly, lz]) => {
      const q = detLocal(x, z, rot, lx * w, lz * d);
      return [q[0], y + ly * h, q[1]];
    });
    for (const q of p) {
      batch.pos.push(q[0], q[1], q[2]);
      batch.col.push(rgb[0], rgb[1], rgb[2]);
    }
    const f = [0, 2, 1, 0, 3, 2, 3, 5, 2, 3, 4, 5, 0, 1, 5, 0, 5, 4,
               0, 4, 3, 1, 2, 5];
    for (const i of f) batch.idx.push(base + i);
  } else {
    const cs = [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]];
    const p = cs.map(([lx, lz]) => {
      const q = detLocal(x, z, rot, lx * w, lz * d);
      return [q[0], y, q[1]];
    });
    const ap = [x, y + h, z];
    for (const q of p) {
      batch.pos.push(q[0], q[1], q[2]);
      batch.col.push(rgb[0], rgb[1], rgb[2]);
    }
    batch.pos.push(ap[0], ap[1], ap[2]);
    batch.col.push(rgb[0], rgb[1], rgb[2]);
    for (let i = 0; i < 4; i++) {
      batch.idx.push(base + i, base + ((i + 1) % 4), base + 4);
    }
  }
}

let architectureMat = null;
function finishBatchMesh(batch) {
  if (!architectureMat) {
    architectureMat = new THREE.MeshLambertMaterial({
      vertexColors: true, side: THREE.DoubleSide
    });
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(batch.pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(batch.col, 3));
  geo.setIndex(batch.idx);
  const flat = geo.toNonIndexed();
  flat.computeVertexNormals();
  flat.computeBoundingSphere();
  const mesh = new THREE.Mesh(flat, architectureMat);
  mesh.castShadow = true;
  return mesh;
}

let cityAssets = null;
let cityDecorGroup = null;

function cityWindowGrid(x, z, rot, w, d, baseY, height, glass, rng, bid) {
  if (height < 5) return;
  const floorH = glass ? 4.15 : 3.55;
  const startY = 4.9;
  let rows = Math.max(1, Math.floor((height - startY - 1.2) / floorH));
  if (rows > 54) rows = 54;
  const stepY = rows > 1 ? (height - startY - 1.2) / rows : floorH;
  const winH = Math.min(glass ? 2.25 : 1.55, stepY * 0.58);
  for (let side = 0; side < 4; side++) {
    const span = side < 2 ? d : w;
    const cols = Math.max(2, Math.min(glass ? 11 : 8, Math.round(span / 3.2)));
    const slot = span / cols;
    const paneW = slot * (glass ? 0.66 : 0.52);
    for (let row = 0; row < rows; row++) {
      const y0 = baseY + startY + row * stepY;
      if (y0 + winH > baseY + height - 1.2) continue;
      for (let col = 0; col < cols; col++) {
        if (!glass && rng() < 0.055) continue;
        const u0 = -span * 0.5 + slot * (col + 0.5) - paneW * 0.5;
        const lit = glass ? (row % 9 === 4 && col === (row * 3) % cols) :
                            ((row * 7 + col * 5 + side * 3) % 23 === 0);
        const rgb = lit
          ? [0.78 + rng() * 0.12, 0.61 + rng() * 0.12, 0.35 + rng() * 0.08]
          : glass
            ? [0.12 + rng() * 0.035, 0.22 + rng() * 0.045, 0.29 + rng() * 0.05]
            : [0.16 + rng() * 0.035, 0.23 + rng() * 0.04, 0.27 + rng() * 0.045];
        detFace(x, z, rot, side, side < 2 ? w * 0.5 : d * 0.5, 0.085,
          u0, u0 + paneW, y0, y0 + winH, rgb, bid);
      }
    }
  }
}

function cityStorefronts(x, z, rot, w, d, y, rng, bid) {
  for (let side = 0; side < 4; side++) {
    const span = side < 2 ? d : w;
    const shops = Math.max(1, Math.min(6, Math.round(span / 7.5)));
    const slot = span / shops;
    for (let s = 0; s < shops; s++) {
      const u0 = -span * 0.5 + slot * s + 0.75;
      const u1 = -span * 0.5 + slot * (s + 1) - 0.75;
      const warm = rng() < 0.34;
      detFace(x, z, rot, side, side < 2 ? w * 0.5 : d * 0.5, 0.10,
        u0, u1, y + 0.55, y + 4.15,
        warm ? [0.63, 0.50, 0.31] : [0.17, 0.25, 0.29], bid);
      detFace(x, z, rot, side, side < 2 ? w * 0.5 : d * 0.5, 0.115,
        u0 - 0.16, u1 + 0.16, y + 4.15, y + 4.62,
        [0.31 + rng() * 0.05, 0.25 + rng() * 0.04, 0.19], bid);
    }
  }
}

function cityRoofDetails(x, z, y, w, d, rot, rng, landmark, bid) {
  const n = 1 + (rng() * 3 | 0);
  for (let i = 0; i < n; i++) {
    const lx = (rng() - 0.5) * w * 0.55;
    const lz = (rng() - 0.5) * d * 0.55;
    const p = detLocal(x, z, rot, lx, lz);
    const sx = 1.8 + rng() * Math.min(5.5, w * 0.18);
    const sz = 1.8 + rng() * Math.min(5.5, d * 0.18);
    detBoxY(p[0], y + 0.05, y + 1.2 + rng() * 2.0, p[1], sx, sz, rot,
      [0.46 + rng() * 0.08, 0.48 + rng() * 0.07, 0.49 + rng() * 0.06], bid);
  }
  if (rng() < 0.58) {
    detBoxY(x, y, y + 7 + rng() * 10, z, 0.55, 0.55, rot, [0.31, 0.35, 0.38], bid);
  }
  if (landmark) {
    detBoxY(x, y, y + 20, z, 1.1, 1.1, rot, [0.35, 0.39, 0.42], bid);
  }
}

function addCityPark(cx, cz, hx, hz, rng, treeSpots) {
  detGroundRect(cx, cz, hx - 1.8, hz - 1.8, 0.50,
    [0.29 + rng() * 0.035, 0.40 + rng() * 0.045, 0.24 + rng() * 0.025]);
  detStreet(cx - hx * 0.82, cz, cx + hx * 0.82, cz, 2.5, 0.58,
    [0.58, 0.54, 0.43]);
  detStreet(cx, cz - hz * 0.82, cx, cz + hz * 0.82, 2.5, 0.58,
    [0.58, 0.54, 0.43]);
  if (rng() < 0.46) {
    const pr = Math.min(hx, hz) * (0.16 + rng() * 0.08);
    const pond = new THREE.Mesh(
      new THREE.CircleGeometry(pr, 24),
      new THREE.MeshPhongMaterial({
        color: 0x2e6f84, shininess: 75, specular: 0x9bd5df,
        transparent: true, opacity: 0.9
      })
    );
    pond.rotation.x = -Math.PI / 2;
    const pp = detLocal(cx, cz, rng() * 6.2832,
      (rng() - 0.5) * hx * 0.72, (rng() - 0.5) * hz * 0.72);
    pond.position.set(pp[0], terrainHeight(pp[0], pp[1]) + 0.62, pp[1]);
    cityDecorGroup.add(pond);
  }
  for (let i = 0; i < 4; i++) {
    const bx = cx - hx * 0.56 + i * hx * 0.37;
    detGroundRect(bx, cz + hz * 0.72, 3.8, 1.7, 0.59,
      i % 2 ? [0.47, 0.53, 0.26] : [0.57, 0.43, 0.28]);
  }
  const treeN = 5 + (rng() * 7 | 0);
  for (let i = 0; i < treeN; i++) {
    const tx = cx + (rng() * 1.5 - 0.75) * hx;
    const tz = cz + (rng() * 1.5 - 0.75) * hz;
    if (Math.abs(tx - cx) < 4.5 || Math.abs(tz - cz) < 4.5) continue;
    treeSpots.push({
      x: tx, z: tz, h: terrainHeight(tx, tz),
      s: 0.62 + rng() * 0.38,
      rot: rng() * Math.PI * 2,
      style: rng() < 0.62 ? 'broad' : 'pine2'
    });
  }
  for (let i = 0; i < 3; i++) {
    const bx = cx - hx * 0.55 + i * hx * 0.55;
    const by = terrainHeight(bx, cz + 3);
    detBoxY(bx, by + 0.5, by + 1.15, cz + 3, 2.4, 0.55, 0, [0.36, 0.27, 0.18]);
  }
}

function addCityTraffic(CX, CZ, RX, RZ, xLines, zLines, rng) {
  const cars = [];
  const count = 20 + (rng() * 14 | 0);
  for (let i = 0; i < count; i++) {
    const side = rng() < 0.5 ? -1 : 1;
    let x, z, yaw;
    if (rng() < 0.5) {
      const ln = xLines[(rng() * xLines.length) | 0];
      if (!ln) continue;
      x = CX + ln.v + side * ln.half * 0.36;
      z = CZ + (rng() * 1.5 - 0.75) * RZ;
      yaw = Math.PI * 0.5;
    } else {
      const ln = zLines[(rng() * zLines.length) | 0];
      if (!ln) continue;
      z = CZ + ln.v + side * ln.half * 0.36;
      x = CX + (rng() * 1.5 - 0.75) * RX;
      yaw = 0;
    }
    if (Math.hypot((x - CX) / RX, (z - CZ) / RZ) > 0.86) continue;
    cars.push({ x, z, yaw, tone: i % 3 });
  }
  const mats = [
    new THREE.MeshLambertMaterial({ color: 0xb8b8b0 }),
    new THREE.MeshLambertMaterial({ color: 0x60717a }),
    new THREE.MeshLambertMaterial({ color: 0x9b5d4e })
  ];
  const glass = new THREE.MeshLambertMaterial({ color: 0x283942 });
  const dummy = new THREE.Object3D();
  for (let tone = 0; tone < 3; tone++) {
    const list = cars.filter(c => c.tone === tone);
    if (!list.length) continue;
    const bodies = new THREE.InstancedMesh(UNIT_BOX, mats[tone], list.length);
    const cabins = new THREE.InstancedMesh(UNIT_BOX, glass, list.length);
    bodies.frustumCulled = cabins.frustumCulled = false;
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      const gy = terrainHeight(c.x, c.z) + 0.12;
      dummy.position.set(c.x, gy + 0.55, c.z);
      dummy.rotation.set(0, c.yaw, 0);
      dummy.scale.set(4.1, 1.0, 1.8);
      dummy.updateMatrix();
      bodies.setMatrixAt(i, dummy.matrix);
      dummy.position.set(c.x, gy + 1.33, c.z);
      dummy.scale.set(2.15, 0.72, 1.48);
      dummy.updateMatrix();
      cabins.setMatrixAt(i, dummy.matrix);
    }
    bodies.instanceMatrix.needsUpdate = true;
    cabins.instanceMatrix.needsUpdate = true;
    cityDecorGroup.add(bodies, cabins);
  }
}

function createCity() {
  detReset();
  removeTreeTargetsByScope('city');
  if (cityDecorGroup) {
    scene.remove(cityDecorGroup);
    cityDecorGroup = null;
  }
  cityDecorGroup = new THREE.Group();
  scene.add(cityDecorGroup);
  if (!cityAssets) {
    const bodyColors = [
      0x93a5a5, 0xaa9e8d, 0x7e919b, 0xb4aa9a, 0x85918e,
      0x8d9da8, 0xa99f91, 0x73868e, 0xb7afa1, 0x899793,
      0x9b8e81, 0x6f818a
    ];
    const roofColors = [0x4e4d49, 0x5d544c, 0x435156, 0x665d51, 0x565e5a];
    cityAssets = {
      bodyMats: bodyColors.map(c => new THREE.MeshLambertMaterial({ color: c })),
      roofMats: roofColors.map(c => new THREE.MeshLambertMaterial({ color: c }))
    };
  }

  /* 逐城生成（同一种子 → 同一座城；重开一局也完全一致） */
  for (let ci = 0; ci < GEN.cities.length; ci++) {
    const ct = GEN.cities[ci];
    const CX = ct.x, CZ = ct.z, RX = ct.rx, RZ = ct.rz;
    const rng = mulberry32((((GEN.seed ^ 0xB0B0) + ci * 7919) >>> 0));
    const layout = cityRoadLayout(ct);
    const S = layout.S;                         // 城市缩放（铺开 / 楼高 / 道路等比）
    const BS = layout.BS, ROAD = layout.ROAD;
    const plot = layout.plot;
    const SW = layout.SW;
    const xLines = layout.xLines, zLines = layout.zLines;
    const parkTrees = [];
    let landmarkPlaced = false;

    /* 城市路网：主路 / 支路分级，各街在网格外缘的直角路口自然收口。 */
    const ASPHALT = [0.235, 0.255, 0.265];
    const WALK = [0.60, 0.57, 0.50];
    const EDGE = [0.69, 0.67, 0.58];
    const MARK = [0.78, 0.76, 0.66];
    const groundInset = ROAD * 0.5 + SW + 2.0;

    const laneDashes = (x0, z0, x1, z1, half, major) => {
      const dx = x1 - x0, dz = z1 - z0;
      const len = Math.hypot(dx, dz);
      if (len < 8) return;
      const ux = dx / len, uz = dz / len;
      const nxv = -uz, nzv = ux;
      for (let s = 5; s + 4 < len; s += 13) {
        const ax = x0 + ux * s, az = z0 + uz * s;
        const bx = ax + ux * 4.2, bz = az + uz * 4.2;
        detStreet(ax, az, bx, bz, 0.16, 0.17, MARK);
        if (major) {
          for (const side of [-1, 1]) {
            const off = half * 0.38 * side;
            detStreet(ax + nxv * off, az + nzv * off,
              bx + nxv * off, bz + nzv * off, 0.10, 0.17, MARK);
          }
        }
      }
    };

    for (const ln of xLines) {
      if (ln.span0 === undefined) continue;
      const z0 = CZ + ln.span0, z1 = CZ + ln.span1;
      const x = CX + ln.v;
      detStreet(x, z0, x, z1, ln.half, 0.10, ASPHALT);
      for (const side of [-1, 1]) {
        const wx = x + side * (ln.half + SW * 0.5);
        detStreet(wx, z0, wx, z1, SW * 0.5, 0.22, WALK);
        const ex = x + side * (ln.half - 0.38);
        detStreet(ex, z0, ex, z1, 0.09, 0.16, EDGE);
      }
      laneDashes(x, z0, x, z1, ln.half, ln.major);
    }
    for (const ln of zLines) {
      if (ln.span0 === undefined) continue;
      const x0 = CX + ln.span0, x1 = CX + ln.span1;
      const z = CZ + ln.v;
      detStreet(x0, z, x1, z, ln.half, 0.10, ASPHALT);
      for (const side of [-1, 1]) {
        const wz = z + side * (ln.half + SW * 0.5);
        detStreet(x0, wz, x1, wz, SW * 0.5, 0.22, WALK);
        const ez = z + side * (ln.half - 0.38);
        detStreet(x0, ez, x1, ez, 0.09, 0.16, EDGE);
      }
      laneDashes(x0, z, x1, z, ln.half, ln.major);
    }

    /* 独立路口面：覆盖穿路的人行道和标线，再补进口斑马线与停止线。 */
    const junctions = [];
    for (const xl of xLines) {
      if (xl.span0 === undefined) continue;
      for (const zl of zLines) {
        if (zl.span0 === undefined) continue;
        if (zl.v < xl.span0 - 0.01 || zl.v > xl.span1 + 0.01 ||
            xl.v < zl.span0 - 0.01 || xl.v > zl.span1 + 0.01) continue;
        junctions.push({ x: xl.v, z: zl.v, hx: xl.half, hz: zl.half, major: xl.major || zl.major });
      }
    }
    for (const j of junctions) {
      const ax = CX + j.x, az = CZ + j.z;
      const hx = j.hx + SW * 0.72, hz = j.hz + SW * 0.72;
      const half = Math.max(hx, hz);
      detGroundRect(ax, az, half, half, 0.245, ASPHALT);
      if (j.major) {
        for (const side of [-1, 1]) {
          const cxw = ax + side * (half + 3.2);
          for (let k = -3; k <= 3; k++) {
            const zz = az + k * 1.22;
            if (Math.abs(zz - az) > j.hz * 0.92) continue;
            detStreet(cxw - 1.6, zz, cxw + 1.6, zz, 0.23, 0.262, MARK);
          }
          detStreet(ax + side * (half + 5.3), az - j.hz * 0.88,
            ax + side * (half + 5.3), az + j.hz * 0.88, 0.15, 0.268, EDGE);
          const czw = az + side * (half + 3.2);
          for (let k = -3; k <= 3; k++) {
            const xx = ax + k * 1.22;
            if (Math.abs(xx - ax) > j.hx * 0.92) continue;
            detStreet(xx, czw - 1.6, xx, czw + 1.6, 0.23, 0.262, MARK);
          }
          detStreet(ax - j.hx * 0.88, az + side * (half + 5.3),
            ax + j.hx * 0.88, az + side * (half + 5.3), 0.15, 0.268, EDGE);
        }
      }
    }

    for (let bx = -RX; bx < RX - BS; bx += BS) {
      for (let bz = -RZ; bz < RZ - BS; bz += BS) {
        const ccx = bx + BS / 2, ccz = bz + BS / 2;
        const d = Math.hypot(ccx / RX, ccz / RZ);
        if (d > 1.01) continue;
        if ((GEN.railStations || []).some(st =>
          Math.hypot(CX + ccx - st.x, CZ + ccz - st.z) < st.r + 24)) continue;
        /* 外围一整圈强制为建设用地：不生成公园，也不使用绿色空地色。 */
        const outerBlock = d > 0.78;

        const isPark = !outerBlock && (d < 0.22 ? rng() < 0.18 : rng() < 0.14);
        if (isPark) {
          const parkHalf = Math.max(14, BS * 0.5 - groundInset);
          addCityPark(CX + ccx, CZ + ccz, parkHalf, parkHalf, rng, parkTrees);
          continue;
        }

        /* 街区地坪：水泥广场与边缘绿地交错，避免整城同色。 */
        const gTone = 0.55 + rng() * 0.08;
        detGroundRect(CX + bx + BS / 2, CZ + bz + BS / 2,
          BS / 2 - groundInset, BS / 2 - groundInset, 0.31,
          !outerBlock && rng() < 0.28
            ? [0.28, 0.37, 0.23]
            : [gTone, gTone * 0.97, gTone * 0.9]);

        /* 行道树：只在街区边缘补少量，增加城市纵深和绿色孔隙。 */
        if (rng() < 0.72) {
          const edge = BS * 0.445;
          const spots = rng() < 0.5
            ? [[ccx + edge, ccz + (rng() - 0.5) * BS * 0.24],
               [ccx - edge, ccz + (rng() - 0.5) * BS * 0.24]]
            : [[ccx + (rng() - 0.5) * BS * 0.24, ccz + edge],
               [ccx + (rng() - 0.5) * BS * 0.24, ccz - edge]];
          for (const sp of spots) {
            const tx = CX + sp[0], tz = CZ + sp[1];
            parkTrees.push({
              x: tx, z: tz, h: terrainHeight(tx, tz),
              s: 0.46 + rng() * 0.28,
              rot: rng() * Math.PI * 2,
              style: rng() < 0.75 ? 'broad' : 'pine2'
            });
          }
        }
        for (let li = 0; li < 2; li++) {
          const sx = li === 0 ? -1 : 1;
          const lx = CX + ccx + sx * BS * 0.455;
          const lz = CZ + ccz + (rng() - 0.5) * BS * 0.34;
          const ly = terrainHeight(lx, lz);
          detBoxY(lx, ly + 0.2, ly + 5.0, lz, 0.16, 0.16, 0, [0.26, 0.29, 0.27]);
          detBoxY(lx, ly + 4.95, ly + 5.35, lz, 0.62, 0.38, 0, [0.82, 0.65, 0.34]);
        }

        if (!outerBlock && d > 0.68 && rng() < 0.24) continue;

        const core = Math.max(0, 1 - d / 1.01);

        const plots = [];
        if (rng() < 0.64) {
          const cell = plot / 2;
          for (let i = 0; i < 2; i++) {
            for (let j = 0; j < 2; j++) {
              if (!outerBlock && rng() < 0.28) continue;
              plots.push({
                x: bx + ROAD / 2 + (i + 0.5) * cell,
                z: bz + ROAD / 2 + (j + 0.5) * cell,
                w: cell * 0.76, d: cell * 0.76
              });
            }
          }
        } else {
          if (rng() < 0.62) {
            plots.push({ x: bx + BS / 2, z: bz + BS / 2, w: plot * 0.82, d: plot * 0.82 });
          } else {
            for (let j = 0; j < 2; j++) {
              plots.push({
                x: bx + BS / 2,
                z: bz + ROAD / 2 + (j + 0.5) * (plot / 2),
                w: plot * 0.78, d: plot * 0.40
              });
            }
          }
        }

        for (const p of plots) {
          const wx = CX + p.x, wz = CZ + p.z;
          const gh = terrainHeight(wx, wz);
          if (gh < WATER_LEVEL + 8) continue;

          const w = p.w * (0.72 + rng() * 0.22);
          const dd = p.d * (0.72 + rng() * 0.22);
          const landmark = !landmarkPlaced && core > 0.66 && rng() < 0.22;
          let kind = 'low';
          if (landmark) kind = 'landmark';
          else if (core > 0.58 && rng() < 0.60 + core * 0.25) kind = 'tower';
          else if (core > 0.28 || rng() < 0.44) kind = 'mid';
          const hScale = 0.82 + Math.min(S, 3) * 0.18;
          let h = kind === 'low' ? 8 + rng() * 15 :
                  kind === 'mid' ? 22 + rng() * 43 :
                  kind === 'tower' ? 56 + Math.pow(rng(), 1.3) * (76 + core * 88) :
                  118 + rng() * 72;
          h *= hScale;
          h = Math.min(h, kind === 'tower' || kind === 'landmark' ? 235 : 82);
          if (landmark) landmarkPlaced = true;

          /* 让位给公路：占地压到路廊就不建楼（否则会出现“楼盖在路上”） */
          if (roadOnFootprint(wx, wz, w, dd)) continue;

          makeBuilding(wx, wz, gh, w, h, dd, cityAssets.bodyMats, cityAssets.roofMats,
            rng, kind, landmark);
        }
      }
    }
    if (parkTrees.length) {
      const trees = addTreeCluster(parkTrees, null, 'city');
      cityDecorGroup.add(trees);
    }
    addCityTraffic(CX, CZ, RX, RZ, xLines, zLines, rng);
  }
}

function makeBuilding(x, z, y, w, h, d, bodyMats, roofMats, rng, kind, landmark, rotOverride) {
  const bodyMat = bodyMats[(rng() * bodyMats.length) | 0];
  const roofMat = roofMats[(rng() * roofMats.length) | 0];
  const detailId = buildings.length < DET_ID_CAP ? buildings.length : -1;
  const rotY = rotOverride === undefined ? (rng() - 0.5) * 0.16 : rotOverride;
  const batch = { pos: [], col: [], idx: [] };
  let baseW = w, baseD = d, totalH = h;
  const roofH = 1.3 + Math.min(3.8, h * 0.018);
  const addPart = (px, pz, py, pw, ph, pd, mat) => {
    const c = mat.color;
    addRotBox(batch, px, pz, py, py + ph, pw, pd, rotY, [c.r, c.g, c.b]);
  };

  if (kind === 'tower' || kind === 'landmark') {
    const podiumH = Math.min(13 + rng() * 8, h * 0.28);
    baseW = w * 1.10;
    baseD = d * 1.10;
    addPart(x, z, y, baseW, podiumH, baseD, bodyMat);
    cityStorefronts(x, z, rotY, baseW, baseD, y, rng, detailId);

    const towerW = w * (0.60 + rng() * 0.12);
    const towerD = d * (0.60 + rng() * 0.12);
    const shaftH = h - podiumH;
    addPart(x, z, y + podiumH, towerW, shaftH, towerD, bodyMat);
    cityWindowGrid(x, z, rotY, towerW, towerD, y + podiumH, shaftH, true, rng, detailId);

    if (shaftH > 95 || kind === 'landmark') {
      const crownH = 10 + rng() * 10;
      const crownW = towerW * 0.72, crownD = towerD * 0.72;
      addPart(x, z, y + h - crownH, crownW, crownH, crownD, bodyMat);
      cityWindowGrid(x, z, rotY, crownW, crownD, y + h - crownH, crownH, true, rng, detailId);
    }
    addPart(x, z, y + h - 0.5, towerW * 1.05, roofH, towerD * 1.05, roofMat);
    totalH = h + roofH - 0.5;
    cityRoofDetails(x, z, y + h + roofH - 0.5, towerW, towerD, rotY, rng, !!landmark, detailId);
  } else if (kind === 'mid' && rng() < 0.42) {
    const tierH = h * (0.58 + rng() * 0.13);
    addPart(x, z, y, w, tierH, d, bodyMat);
    cityWindowGrid(x, z, rotY, w, d, y, tierH, rng() < 0.24, rng, detailId);
    const upperW = w * 0.76, upperD = d * 0.76;
    addPart(x, z, y + tierH, upperW, h - tierH, upperD, bodyMat);
    cityWindowGrid(x, z, rotY, upperW, upperD, y + tierH, h - tierH, true, rng, detailId);
    addPart(x, z, y + h - 0.35, upperW * 1.06, roofH, upperD * 1.06, roofMat);
    totalH = h + roofH - 0.35;
    cityRoofDetails(x, z, y + h + roofH - 0.35, upperW, upperD, rotY, rng, false, detailId);
  } else {
    addPart(x, z, y, w, h, d, bodyMat);
    cityWindowGrid(x, z, rotY, w, d, y, h, kind === 'low' && rng() < 0.22, rng, detailId);
    cityStorefronts(x, z, rotY, w, d, y, rng, detailId);
    addPart(x, z, y + h - 0.3, w * 1.055, roofH, d * 1.055, roofMat);
    totalH = h + roofH - 0.3;
    cityRoofDetails(x, z, y + h + roofH - 0.3, w, d, rotY, rng, false, detailId);
  }
  const mesh = finishBatchMesh(batch);
  scene.add(mesh);
  let extra = null;
  if (landmark) {
    extra = new THREE.Mesh(
      new THREE.SphereGeometry(1.1, 8, 6),
      new THREE.MeshBasicMaterial({ color: 0xff6a46 })
    );
    extra.position.set(x, y + totalH + 20.5, z);
    scene.add(extra);
  }
  aoFootprint(x, z, baseW * 0.57, baseD * 0.57, rotY, 0.046);

  const b = {
    body: mesh,
    roof: null,
    extra,
    detailId,
    x, z,
    y0: y,
    y1: y + totalH,
    hw: (baseW * 1.07) / 2,
    hd: (baseD * 1.07) / 2,
    w: baseW, h: totalH, d: baseD,
    colorHex: bodyMat.color.getHex(),
    gunHits: 0,
    dead: false,
    _qf: -1
  };
  buildings.push(b);
  addToHash(b);
}

/* ---- 世界重建辅助（种子重新生成 / 开局重置共用） ---- */
function clearCity() {
  for (const b of buildings) {
    scene.remove(b.body);
    if (b.roof) scene.remove(b.roof);
    if (b.extra) scene.remove(b.extra);
  }
  buildings.length = 0;
  bHash.clear();
}

function clearWorld() {
  clearDestructibleScenery();
  if (worldTerrain) {
    scene.remove(worldTerrain);
    worldTerrain.geometry.dispose();
    worldTerrain.material.dispose();
    worldTerrain = null;
  }
  if (worldWater) {
    scene.remove(worldWater);
    worldWater.geometry.dispose();
    worldWater.material.dispose();
    worldWater = null;
  }
  while (worldTrees.length) scene.remove(worldTrees.pop());
  while (worldClouds.length) scene.remove(worldClouds.pop());
  while (worldScenery.length) scene.remove(worldScenery.pop());
  windTurbines.length = 0;
  railTrains.length = 0;
  if (cityDecorGroup) {
    scene.remove(cityDecorGroup);
    cityDecorGroup = null;
  }
  if (villageTreeGroup) {
    scene.remove(villageTreeGroup);
    villageTreeGroup = null;
  }
  if (farmDecorGroup) {
    scene.remove(farmDecorGroup);
    farmDecorGroup = null;
  }
  clearCity();
}

function buildWorld() {
  const steps = buildWorldSteps();
  let step;
  do { step = steps.next(); } while (!step.done);
}

function sphereHitsBuilding(px, py, pz, r, b) {
  const cx = Math.max(b.x - b.hw, Math.min(px, b.x + b.hw));
  const cy = Math.max(b.y0, Math.min(py, b.y1));
  const cz = Math.max(b.z - b.hd, Math.min(pz, b.z + b.hd));
  const dx = px - cx, dy = py - cy, dz = pz - cz;
  return dx * dx + dy * dy + dz * dz < r * r;
}

function hitByBullet(b, hitPos) {
  if (b.dead) return;
  b.gunHits++;
  if (b.gunHits >= GUN_KILL_HITS) {
    destroyBuilding(b);
  } else {
    spawnHitSpark(hitPos);
  }
}

function destroyBuilding(b) {
  if (b.dead) return;
  b.dead = true;
  if (detDeathTex && b.detailId !== undefined && b.detailId >= 0) {
    detDeathTex.image.data[b.detailId * 4] = 255;
    detDeathTex.needsUpdate = true;
  }
  if (renderer && renderer.shadowMap) renderer.shadowMap.needsUpdate = true;

  scene.remove(b.body);
  if (b.roof) scene.remove(b.roof);
  if (b.extra) scene.remove(b.extra);
  removeFromHash(b);

  const n = 6 + (Math.random() * 6 | 0);
  for (let i = 0; i < n; i++) spawnDebris(b);

  const center = new THREE.Vector3(b.x, b.y0 + b.h * 0.5, b.z);
  spawnExplosion(center, 1.6 + Math.min(1.8, b.h / 170));
  Sound.boom(0.7 + Math.min(1.0, b.h / 260));

  G.shake = Math.min(1.6, G.shake + 0.45);
  G.score += 10;                                        // 建筑只计分，不计入「击毁敌方单位」
}

function spawnDebris(b) {
  const s = 2 + Math.random() * 5;
  const m = new THREE.Mesh(UNIT_BOX, getDebrisMat(b.colorHex));
  m.scale.set(s, s * (0.6 + Math.random() * 0.9), s);
  m.position.set(
    b.x + (Math.random() - 0.5) * b.w,
    b.y0 + Math.random() * b.h,
    b.z + (Math.random() - 0.5) * b.d
  );
  scene.add(m);

  const dir = new THREE.Vector3(
    m.position.x - b.x,
    Math.random() * 0.8 + 0.2,
    m.position.z - b.z
  ).normalize();

  const spd = 18 + Math.random() * 35;
  const vel = dir.multiplyScalar(spd);
  vel.y += 18 + Math.random() * 24;

  effects.push({
    type: 'debris', mesh: m,
    ownsGeo: false, ownsMat: false,
    life: 0, dur: 2.2 + Math.random() * 1.5,
    vel,
    angVel: new THREE.Vector3(
      (Math.random() - 0.5) * 12,
      (Math.random() - 0.5) * 12,
      (Math.random() - 0.5) * 12
    )
  });
}

function spawnSceneryDebris(pos, count, colorHex, size) {
  for (let i = 0; i < count; i++) {
    const s = (size || 1) * (0.28 + Math.random() * 0.72);
    const m = new THREE.Mesh(UNIT_BOX, getDebrisMat(colorHex));
    m.position.copy(pos);
    m.position.x += (Math.random() - 0.5) * size * 1.8;
    m.position.y += Math.random() * size * 2.0;
    m.position.z += (Math.random() - 0.5) * size * 1.8;
    m.scale.set(s, s * (0.55 + Math.random()), s);
    scene.add(m);
    const dir = new THREE.Vector3(
      (Math.random() - 0.5) * 1.4,
      0.35 + Math.random() * 1.1,
      (Math.random() - 0.5) * 1.4
    ).normalize();
    effects.push({
      type: 'debris', mesh: m, ownsGeo: false, ownsMat: false,
      life: 0, dur: 1.15 + Math.random() * 1.25,
      vel: dir.multiplyScalar(9 + Math.random() * 20),
      angVel: new THREE.Vector3(
        (Math.random() - 0.5) * 11,
        (Math.random() - 0.5) * 11,
        (Math.random() - 0.5) * 11
      )
    });
  }
}

function hideTreeTarget(t) {
  const zero = new THREE.Matrix4().makeScale(0, 0, 0);
  t.crownMesh.setMatrixAt(t.ti, zero);
  t.crownMesh.instanceMatrix.needsUpdate = true;
  if (t.shadowMesh) {
    t.shadowMesh.setMatrixAt(t.si, zero);
    t.shadowMesh.instanceMatrix.needsUpdate = true;
  }
  const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scale = new THREE.Vector3();
  t.trunkMat.decompose(pos, quat, scale);
  scale.y *= 0.14;
  const stump = new THREE.Matrix4().compose(pos, quat, scale);
  t.trunkMesh.setMatrixAt(t.ti, stump);
  t.trunkMesh.instanceMatrix.needsUpdate = true;
}

function restoreTreeTarget(t) {
  t.dead = false;
  t.hp = 2;
  t.trunkMesh.setMatrixAt(t.ti, t.trunkMat);
  t.crownMesh.setMatrixAt(t.ti, t.crownMat);
  t.trunkMesh.instanceMatrix.needsUpdate = true;
  t.crownMesh.instanceMatrix.needsUpdate = true;
  if (t.shadowMesh && t.shadowMat) {
    t.shadowMesh.setMatrixAt(t.si, t.shadowMat);
    t.shadowMesh.instanceMatrix.needsUpdate = true;
  }
  addPropTarget(t);
}

function cutPoleWires(t) {
  if (!t.wires) return;
  let attr = null;
  for (const seg of t.wires) {
    if (!seg || !seg.attr || seg.hidden) continue;
    attr = seg.attr;
    seg.attr.setXYZ(seg.i0, 0, 0, 0);
    seg.attr.setXYZ(seg.i1, 0, 0, 0);
    seg.attr.setXYZ(seg.i2, 0, 0, 0);
    seg.attr.setXYZ(seg.i3, 0, 0, 0);
    seg.hidden = true;
  }
  if (attr) attr.needsUpdate = true;
}

function restorePoleWires(t) {
  if (!t.wires) return;
  let attr = null;
  for (const seg of t.wires) {
    if (!seg || !seg.attr || !seg.hidden) continue;
    attr = seg.attr;
    seg.attr.setXYZ(seg.i0, seg.p0[0], seg.p0[1], seg.p0[2]);
    seg.attr.setXYZ(seg.i1, seg.p1[0], seg.p1[1], seg.p1[2]);
    seg.attr.setXYZ(seg.i2, seg.p2[0], seg.p2[1], seg.p2[2]);
    seg.attr.setXYZ(seg.i3, seg.p3[0], seg.p3[1], seg.p3[2]);
    seg.hidden = false;
  }
  if (attr) attr.needsUpdate = true;
}

function destroySceneryTarget(t, hitPos) {
  if (t.dead) return;
  t.dead = true;
  removePropTarget(t);

  if (t.kind === 'tree') {
    hideTreeTarget(t);
    const pos = hitPos || new THREE.Vector3(t.x, t.y0 + 3, t.z);
    spawnSceneryDebris(pos, 4, t.leafColor || 0x315c3b, Math.max(0.7, t.hitR * 0.55));
    spawnSmoke(pos.clone().setY(t.y0 + Math.max(1.5, t.y1 * 0.12)), 0.42, false);
    return;
  }

  if (t.kind === 'pole') {
    const zero = new THREE.Matrix4().makeScale(0, 0, 0);
    t.postMesh.setMatrixAt(t.pi, zero);
    t.postMesh.instanceMatrix.needsUpdate = true;
    if (t.armMesh) {
      t.armMesh.setMatrixAt(t.ai, zero);
      t.armMesh.instanceMatrix.needsUpdate = true;
    }
    cutPoleWires(t);
    spawnSceneryDebris(hitPos || new THREE.Vector3(t.x, t.y0 + 3, t.z), 3, 0x4d4637, 0.55);
    spawnHitSpark(hitPos || new THREE.Vector3(t.x, t.y0 + 3, t.z));
    return;
  }

  let center;
  if (t.car) {
    center = new THREE.Vector3();
    t.car.getWorldPosition(center);
    center.y += 2.0;
  } else {
    center = new THREE.Vector3(t.x, (t.y0 + t.y1) * 0.5, t.z);
  }
  if (t.mesh) t.mesh.visible = false;
  if (t.car) t.car.visible = false;
  if (t.attached) {
    for (const a of t.attached) {
      if (!a || a.dead) continue;
      a.dead = true;
      removePropTarget(a);
      if (a.mesh) a.mesh.visible = false;
    }
  }
  const scale = t.blastScale || 1.4;
  spawnExplosion(center, scale);
  spawnSceneryDebris(center, t.kind === 'train' ? 9 : 7, t.debrisColor || 0x6f7775,
    t.kind === 'train' ? 1.5 : 1.1);
  Sound.boom(Math.min(1.7, 0.82 + scale * 0.22));
  G.shake = Math.min(2.3, G.shake + 0.35 + scale * 0.18);
  if (t.score) G.score += t.score;

  if (t.kind === 'train' && t.train) {
    if (t.index === 0) {
      t.train.disabled = true;
      t.train.speed = 0;
    }
  }
}

function hitSceneryTarget(t, hitPos) {
  if (!t || t.dead) return;
  t.hp--;
  if (t.hp > 0) {
    spawnHitSpark(hitPos);
    return;
  }
  destroySceneryTarget(t, hitPos);
}

function resetDestructibleScenery() {
  for (const t of treeTargets) {
    if (t.dead) restoreTreeTarget(t);
  }
  for (const t of poleTargets) {
    if (!t.dead) continue;
    const zero = new THREE.Matrix4().makeScale(0, 0, 0);
    t.postMesh.setMatrixAt(t.pi, t.postMat);
    t.postMesh.instanceMatrix.needsUpdate = true;
    if (t.armMesh && t.armMat) {
      t.armMesh.setMatrixAt(t.ai, t.armMat);
      t.armMesh.instanceMatrix.needsUpdate = true;
    }
    restorePoleWires(t);
    t.dead = false;
    t.hp = 1;
    addPropTarget(t);
  }
  for (const t of stationTargets) {
    if (!t.dead) continue;
    t.dead = false;
    t.hp = t.hpMax;
    if (t.mesh) t.mesh.visible = true;
    addPropTarget(t);
  }
  for (const t of trainTargets) {
    if (t.dead) {
      t.dead = false;
      t.hp = t.hpMax;
      if (t.car) t.car.visible = true;
    }
    if (t.train) {
      t.train.disabled = false;
      t.train.speed = t.train.baseSpeed || 23;
    }
  }
}

function clearDestructibleScenery() {
  treeTargets.length = 0;
  poleTargets.length = 0;
  stationTargets.length = 0;
  trainTargets.length = 0;
  propHash.clear();
}

/* 水平翼面：用带厚度的多边形挤出，保留歼-10 三角翼与鸭翼的平面轮廓。 */
function makeFighterWing(points, thickness, mat) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const bevel = Math.min(0.035, thickness * 0.18);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thickness, bevelEnabled: true, curveSegments: 1,
    bevelSegments: 1, bevelSize: bevel, bevelThickness: bevel * 0.7
  });
  geo.rotateX(Math.PI / 2);
  geo.translate(0, thickness / 2, 0);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat);
}

/* 垂直翼面：points 使用 [z, y]，围绕机身中线挤出。 */
function makeFighterFin(points, thickness, mat) {
  const shape = new THREE.Shape();
  shape.moveTo(-points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(-points[i][0], points[i][1]);
  shape.closePath();
  const bevel = Math.min(0.025, thickness * 0.16);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thickness, bevelEnabled: true, curveSegments: 1,
    bevelSegments: 1, bevelSize: bevel, bevelThickness: bevel * 0.65
  });
  geo.rotateY(Math.PI / 2);
  geo.translate(-thickness / 2, 0, 0);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat);
}

/* 沿翼面前缘增加窄条，强调鸭翼 / 三角翼的轮廓，不另引入贴图。 */
function addWingEdge(group, x0, z0, x1, z1, y, mat, thickness) {
  const dx = x1 - x0, dz = z1 - z0;
  const edge = new THREE.Mesh(
    new THREE.BoxGeometry(Math.hypot(dx, dz), thickness || 0.045, 0.075),
    mat
  );
  edge.position.set((x0 + x1) / 2, y, (z0 + z1) / 2);
  edge.rotation.y = -Math.atan2(dz, dx);
  group.add(edge);
  return edge;
}

function makeWingStar(size, mat) {
  const shape = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const r = i % 2 === 0 ? size : size * 0.42;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.material.side = THREE.DoubleSide;
  return mesh;
}

      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  flameGlow.position.z = 1.34;
  flameGlow.visible = !!showFlame;
  g.add(flameGlow);
  g.userData.flame = flame;
  g.userData.flameOuter = flameOuter;
  g.userData.flameGlow = flameGlow;
  enableEntityShadows(g);
  return g;
}

const PL_TRAIL_SAMPLES = 64;
const PL_TRAIL_INTERVAL = 0.012;
const _plTrailHead = new THREE.Vector3();
const _plTrailTangent = new THREE.Vector3();
const _plTrailView = new THREE.Vector3();
const _plTrailSide = new THREE.Vector3();

function makePLTrailLayer(headColor, tailColor, widthHead, widthTail, opacity) {
  const count = PL_TRAIL_SAMPLES * 2;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const indices = new Uint16Array((PL_TRAIL_SAMPLES - 1) * 6);

  for (let i = 0; i < PL_TRAIL_SAMPLES; i++) {
    const t = i / (PL_TRAIL_SAMPLES - 1);
    const fade = Math.pow(1 - t, 1.28);
    for (let side = 0; side < 2; side++) {
      const vi = (i * 2 + side) * 3;
      colors[vi]     = tailColor[0] + (headColor[0] - tailColor[0]) * fade;
      colors[vi + 1] = tailColor[1] + (headColor[1] - tailColor[1]) * fade;
      colors[vi + 2] = tailColor[2] + (headColor[2] - tailColor[2]) * fade;
    }
    if (i < PL_TRAIL_SAMPLES - 1) {
      const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
      const ii = i * 6;
      indices[ii] = a; indices[ii + 1] = b; indices[ii + 2] = c;
      indices[ii + 3] = b; indices[ii + 4] = d; indices[ii + 5] = c;
    }
  }

  const geometry = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(positions, 3);
  const colAttr = new THREE.BufferAttribute(colors, 3);
  if (THREE.DynamicDrawUsage !== undefined) posAttr.setUsage(THREE.DynamicDrawUsage);
  geometry.setAttribute('position', posAttr);
  geometry.setAttribute('color', colAttr);
  geometry.setIndex(new THREE.BufferAttribute(indices, 1));

  const material = new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.frustumCulled = false;
  mesh.renderOrder = 3;
  scene.add(mesh);
  return {
    mesh, positions, posAttr, material, baseOpacity: opacity,
    widthHead, widthTail
  };
}

function createPLTrailFx() {
  return {
    ready: false,
    sampleTimer: 0,
    phase: Math.random() * Math.PI * 2,
    points: Array.from({ length: PL_TRAIL_SAMPLES }, () => new THREE.Vector3()),
    layers: [
      makePLTrailLayer([0.08, 0.86, 1.00], [0.00, 0.015, 0.055], 2.05, 0.05, 0.68),
      makePLTrailLayer([0.96, 1.00, 1.00], [0.02, 0.18, 0.42], 0.58, 0.012, 0.96)
    ]
  };
}

function disposePLTrailFx(fx) {
  if (!fx) return;
  for (const layer of fx.layers) {
    scene.remove(layer.mesh);
    layer.mesh.geometry.dispose();
    layer.material.dispose();
  }
  fx.layers.length = 0;
}

function updatePLTrailFx(ms, dt) {
  const fx = ms.trailFx;
  if (!fx) return;
  const points = fx.points;
  _plTrailHead.copy(ms.mesh.position).addScaledVector(ms.dir, -1.52);

  if (!fx.ready) {
    for (const p of points) p.copy(_plTrailHead);
    fx.ready = true;
  } else {
    fx.sampleTimer += dt;
    if (fx.sampleTimer >= PL_TRAIL_INTERVAL) {
      for (let i = points.length - 1; i > 0; i--) points[i].copy(points[i - 1]);
      fx.sampleTimer = 0;
    }
    points[0].copy(_plTrailHead);
  }

  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const ahead = i === 0 ? p : points[i - 1];
    const behind = i === points.length - 1 ? p : points[i + 1];
    _plTrailTangent.subVectors(ahead, behind);
    if (_plTrailTangent.lengthSq() < 1e-7) _plTrailTangent.copy(ms.dir);
    _plTrailView.subVectors(camera.position, p);
    _plTrailSide.crossVectors(_plTrailTangent, _plTrailView);
    if (_plTrailSide.lengthSq() < 1e-7) _plTrailSide.set(0, 1, 0);
    _plTrailSide.normalize();

    const t = i / (points.length - 1);
    const taper = Math.pow(1 - t, 0.76);
    const flicker = 0.82 + Math.sin(ms.age * 31 + i * 0.63 + fx.phase) * 0.18;
    for (const layer of fx.layers) {
      const width = (layer.widthTail + (layer.widthHead - layer.widthTail) * taper) * flicker;
      const vi = i * 6;
      layer.positions[vi]     = p.x - _plTrailSide.x * width;
      layer.positions[vi + 1] = p.y - _plTrailSide.y * width;
      layer.positions[vi + 2] = p.z - _plTrailSide.z * width;
      layer.positions[vi + 3] = p.x + _plTrailSide.x * width;
      layer.positions[vi + 4] = p.y + _plTrailSide.y * width;
      layer.positions[vi + 5] = p.z + _plTrailSide.z * width;
    }
  }

  const pulse = 0.84 + Math.sin(ms.age * 27 + fx.phase) * 0.16;
  for (const layer of fx.layers) {
    layer.posAttr.needsUpdate = true;
    layer.material.opacity = layer.baseOpacity * pulse;
  }
}

function disposePLMissile(ms) {
  if (!ms) return;
  disposePLTrailFx(ms.trailFx);
  scene.remove(ms.mesh);
  ms.mesh.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
      materials.forEach(material => material.dispose());
    }
  });
}

/* 歼-10：修长渐缩机身、鸭翼 + 三角翼、腹部进气道与四枚翼下霹雳。 */
function createJ10Plane() {
  const g = new THREE.Group();
  const matBody = new THREE.MeshLambertMaterial({ color: 0xa6b1b7 });
  const matLight = new THREE.MeshLambertMaterial({ color: 0xcbd1d3 });
  const matPanel = new THREE.MeshLambertMaterial({ color: 0x687981 });
  const matDark = new THREE.MeshLambertMaterial({ color: 0x39474e });
  const matIntake = new THREE.MeshLambertMaterial({
    color: 0x151d21, side: THREE.DoubleSide
  });
  const matNozzle = new THREE.MeshPhongMaterial({
    color: 0x41474a, shininess: 105, specular: 0x8d989b
  });
  const matRed = new THREE.MeshLambertMaterial({
    color: 0xc92b28, side: THREE.DoubleSide
  });
  const matGold = new THREE.MeshLambertMaterial({
    color: 0xe4b640, side: THREE.DoubleSide
  });
  const matGlass = new THREE.MeshPhongMaterial({
    color: 0x1f5068, emissive: 0x07131a, shininess: 185,
    transparent: true, opacity: 0.88, side: THREE.DoubleSide
  });

  function makeLoft(sections, segments, material) {
    const positions = [], indices = [];
    for (const section of sections) {
      for (let j = 0; j < segments; j++) {
        const a = j / segments * Math.PI * 2;
        const belly = Math.sin(a) < 0 ? 0.88 : 1.03;
        positions.push(
          Math.cos(a) * section.w,
          section.y + Math.sin(a) * section.h * belly,
          section.z
        );
      }
    }
    for (let r = 0; r < sections.length - 1; r++) {
      for (let j = 0; j < segments; j++) {
        const a = r * segments + j;
        const b = r * segments + (j + 1) % segments;
        const c = (r + 1) * segments + j;
        const d = (r + 1) * segments + (j + 1) % segments;
        indices.push(a, b, c, b, d, c);
      }
    }
    const front = sections[0], back = sections[sections.length - 1];
    const frontCenter = positions.length / 3;
    positions.push(0, front.y, front.z);
    const backCenter = positions.length / 3;
    positions.push(0, back.y, back.z);
    const backStart = (sections.length - 1) * segments;
    for (let j = 0; j < segments; j++) {
      const next = (j + 1) % segments;
      indices.push(frontCenter, next, j);
      indices.push(backCenter, backStart + j, backStart + next);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, material);
  }

  function makeBoxLoft(sections, material) {
    const positions = [], indices = [];
    for (const section of sections) {
      const halfW = section.w * 0.5;
      positions.push(
        -halfW, section.bottom, section.z,
         halfW, section.bottom, section.z,
         halfW, section.top,    section.z,
        -halfW, section.top,    section.z
      );
    }
    for (let r = 0; r < sections.length - 1; r++) {
      for (let j = 0; j < 4; j++) {
        const a = r * 4 + j;
        const b = r * 4 + (j + 1) % 4;
        const c = (r + 1) * 4 + j;
        const d = (r + 1) * 4 + (j + 1) % 4;
        indices.push(a, b, c, b, d, c);
      }
    }
    const first = sections[0], last = sections[sections.length - 1];
    const frontCenter = positions.length / 3;
    positions.push(0, (first.bottom + first.top) * 0.5, first.z);
    const backCenter = positions.length / 3;
    positions.push(0, (last.bottom + last.top) * 0.5, last.z);
    const backStart = (sections.length - 1) * 4;
    for (let j = 0; j < 4; j++) {
      const next = (j + 1) % 4;
      indices.push(frontCenter, next, j);
      indices.push(backCenter, backStart + j, backStart + next);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    rod.position.copy(a).add(b).multiplyScalar(0.5);

function propPointHit(t, p) {
  if (!t || t.dead || p.y < t.y0 || p.y > t.y1) return false;
  if (t.box) {
    const dx = p.x - t.x, dz = p.z - t.z;
    const c = Math.cos(t.rot), s = Math.sin(t.rot);
    const lx = c * dx + s * dz, lz = -s * dx + c * dz;
    return Math.abs(lx) <= t.hw && Math.abs(lz) <= t.hd;
  }
  const dx = p.x - t.x, dz = p.z - t.z;
  return dx * dx + dz * dz <= (t.hitR || 1) * (t.hitR || 1);
}

function propBlastHit(t, pos, R) {
  if (!t || t.dead) return false;
  if (t.box) {
    const dx = pos.x - t.x, dz = pos.z - t.z;
    const c = Math.cos(t.rot), s = Math.sin(t.rot);
    const lx = c * dx + s * dz, lz = -s * dx + c * dz;
    const qx = Math.max(-t.hw, Math.min(t.hw, lx));
    const qz = Math.max(-t.hd, Math.min(t.hd, lz));
    const ddx = lx - qx, ddz = lz - qz;
    const dy = Math.max(0, Math.max(t.y0 - pos.y, pos.y - t.y1));
    return ddx * ddx + ddz * ddz + dy * dy <= R * R;
  }
  const dx = t.x - pos.x, dz = t.z - pos.z;
  if (dx * dx + dz * dz > (R + (t.hitR || 1) * 0.55) ** 2) return false;
  return pos.y > t.y0 - R && pos.y < t.y1 + R;
}

function trainCarPointHit(t, p) {
  if (!t || t.dead || !t.car) return false;
  const q = t.car.worldToLocal(p.clone());
  return Math.abs(q.x) < 2.5 && q.y > -0.8 && q.y < 5.5 && Math.abs(q.z) < 8.5;
}

function onBombImpact(pos) {
  spawnExplosion(pos, 3.6);
  Sound.boom(1.6);
  G.shake = Math.min(2.4, G.shake + 1.0);

  const R = BOMB_RADIUS;
  const nearby = queryBuildings(pos.x, pos.z, R + 160);
  for (let i = 0; i < nearby.length; i++) {
    const b = nearby[i];
    if (b.dead) continue;
    const dx = b.x - pos.x, dz = b.z - pos.z;
    if (Math.abs(dx) < R + b.hw && Math.abs(dz) < R + b.hd) {
      const dy = Math.abs((b.y0 + b.h * 0.5) - pos.y);
      if (dy < R + b.h * 0.5) {
        destroyBuilding(b);
      }
    }
  }

  /* 波及敌方单位 */
  for (const g of aaaGuns) {
    if (!g.dead && Math.hypot(g.x - pos.x, g.z - pos.z) < R) destroyAAA(g);
  }
  for (const s of samSites) {
    if (!s.dead && Math.hypot(s.x - pos.x, s.z - pos.z) < R) destroySAM(s);
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.dead && e.mesh.position.distanceTo(pos) < R) destroyEnemy(e, true);
  }

  /* 场景设施与植被：按爆炸半径逐目标判定，不做整片森林连坐。 */
  const props = queryPropTargets(pos.x, pos.z, R + 60);
  for (let i = 0; i < props.length; i++) {
    const t = props[i];
    if (propBlastHit(t, pos, R)) destroySceneryTarget(t, pos);
  }
  for (const t of trainTargets) {
    if (!t.dead && t.car && t.car.position.distanceTo(pos) < R + 8.5) {
      t.hp = 0;
      destroySceneryTarget(t, pos);
    }
  }
}

function fireBullet() {
  const fwd = getForward().clone();
  const side = new THREE.Vector3(1, 0, 0).applyQuaternion(plane.quaternion);
  const up   = new THREE.Vector3(0, 1, 0).applyQuaternion(plane.quaternion);

  let pos;
  let lateralSpeed = 0;
  const customMuzzles = plane.userData.gunMuzzles;
  if (customMuzzles && customMuzzles.length) {
    const muzzleIndex = plane.userData.gunMuzzleIndex || 0;
    plane.updateMatrixWorld(true);
    pos = new THREE.Vector3();
    customMuzzles[muzzleIndex % customMuzzles.length].getWorldPosition(pos);
    plane.userData.gunMuzzleIndex = (muzzleIndex + 1) % customMuzzles.length;
  } else {
    G.bulletSide = -G.bulletSide;
    pos = plane.position.clone()
      .addScaledVector(fwd, 13)
      .addScaledVector(side, G.bulletSide * 2.6)
      .addScaledVector(up, -0.9);
    lateralSpeed = G.bulletSide * 0.5;
  }

  const m = new THREE.Mesh(BULLET_GEO, BULLET_MAT);
  m.position.copy(pos);
  m.quaternion.copy(plane.quaternion);
  scene.add(m);

  const vel = fwd.clone().multiplyScalar(CFG.bulletSpd).addScaledVector(side, lateralSpeed);

  bullets.push({ mesh: m, vel: vel, age: 0 });

  spawnMuzzleFlash(pos);
  Sound.gun();
}

function spawnMuzzleFlash(pos) {
  const mat = new THREE.MeshBasicMaterial({
    color: 0xfff0a0, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  m.position.copy(pos);
