<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Open JET</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#8ec5e8;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  canvas{display:block;touch-action:none}

  /* 游戏中隐藏鼠标光标（Tab 键切换） */
  body.hide-cursor,body.hide-cursor *{cursor:none !important}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;
       text-shadow:0 2px 8px rgba(0,0,0,.65);font-size:13px;letter-spacing:.5px;z-index:5}
  .hud-row{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;
           display:flex;justify-content:space-between;padding:0 16px}
  .hud-item{background:rgba(10,25,45,.35);backdrop-filter:blur(6px);
            -webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);
            border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;
            align-items:center;min-width:64px}
  .hud-item .label{font-size:10px;opacity:.7;letter-spacing:1px}
  .hud-item .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .hud-item .hpbar{width:76px;height:9px;border-radius:5px;margin-top:5px;
                   background:rgba(255,255,255,.16);overflow:hidden}
  #hpFill{height:100%;width:100%;border-radius:5px;background:#5ee06a}
  #dmgFlash{position:fixed;inset:0;pointer-events:none;opacity:0;
            background:radial-gradient(ellipse at center,rgba(255,40,20,0) 40%,rgba(255,40,20,.6) 100%)}
  #lockMark{position:fixed;left:50%;top:50%;width:46px;height:46px;display:none;
            transform:translate(-50%,-50%);border:2px solid rgba(255,90,60,.95);
            border-radius:50%;pointer-events:none;z-index:7;
            box-shadow:0 0 12px rgba(255,70,40,.55),inset 0 0 8px rgba(255,70,40,.35)}
  #lockMark::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;
            transform:translate(-50%,-50%);background:rgba(255,90,60,.95);border-radius:50%}

  #overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
           background:radial-gradient(circle at 50% 40%,rgba(40,90,150,.72),rgba(6,16,32,.92));
           backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:20px}
  #overlay.hide{display:none}
  .panel{width:100%;max-width:420px;max-height:94vh;overflow:auto;text-align:center;color:#eaf4ff;
         background:rgba(12,28,52,.72);border:1px solid rgba(120,200,255,.3);
         border-radius:22px;padding:28px 22px;
         box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
  .panel h1{font-size:23px;letter-spacing:2px;margin-bottom:6px;
            background:linear-gradient(90deg,#8fd6ff,#ffd39b);
            -webkit-background-clip:text;background-clip:text;color:transparent}
  .panel .sub{font-size:12px;opacity:.65;margin-bottom:18px;letter-spacing:1px}
  .panel p{font-size:14px;line-height:1.8;opacity:.9;margin-bottom:16px}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;font-size:12px}
  .keys div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
            border-radius:10px;padding:8px 6px;opacity:.85}
  .panel button{width:100%;padding:15px;font-size:16px;font-weight:700;letter-spacing:3px;
    color:#04202f;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(135deg,#7fdcff,#b9f0ff 45%,#ffd9a0);
    box-shadow:0 8px 26px rgba(110,220,255,.4);transition:transform .1s}
  .panel button:active{transform:scale(.97)}
  .panel button.ghost{background:rgba(255,255,255,.12);color:#cfe6ff;
         border:1px solid rgba(255,255,255,.25);box-shadow:none;margin-top:10px}
  .panel button.mini{width:auto;padding:7px 11px;font-size:12px;font-weight:600;letter-spacing:0;
         border-radius:9px;background:rgba(255,255,255,.13);color:#eaf4ff;
         border:1px solid rgba(255,255,255,.22);box-shadow:none}
  .mapui{margin-bottom:14px;text-align:left}
  .mrow{display:flex;gap:7px;align-items:center;margin:8px 0}
  .mrow input{flex:1;min-width:0;padding:9px 10px;border-radius:10px;font-size:13px;letter-spacing:0;
         border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.3);color:#eaf4ff;outline:none}
  #mapCanvas{width:100%;height:auto;aspect-ratio:1/1;border-radius:12px;
         border:1px solid rgba(255,255,255,.2);background:#04101c;
         cursor:crosshair;touch-action:none;display:block}
  .mapHint{font-size:11px;opacity:.62;margin:6px 2px;line-height:1.6}
  .mrow .ulabel{font-size:12px;opacity:.82}
  .mrow .ucount{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700}
  .keysWrap{margin-bottom:16px;font-size:12px;text-align:left}
  .keysWrap summary{cursor:pointer;opacity:.72;padding:6px 2px;user-select:none}
  .keysWrap[open] summary{margin-bottom:8px}
  .keys{margin-bottom:0}
  .bigscore{font-size:38px;font-weight:800;color:#ffd98a;margin:6px 0 16px;
            font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="hud">
  <div class="hud-row">
    <div class="hud-item"><span class="label">机体</span><div class="hpbar"><div id="hpFill"></div></div></div>
    <div class="hud-item"><span class="label">得分</span><span class="val" id="hudScore">0</span></div>
    <div class="hud-item"><span class="label">击毁敌方单位</span><span class="val" id="hudDestroyed">0</span></div>
    <div class="hud-item"><span class="label">高度</span><span class="val" id="hudAlt">0</span></div>
  </div>
  <div id="dmgFlash"></div>
  <div id="lockMark"></div>
</div>

<div id="overlay">
  <div class="panel" id="panel">
    <h1>Open JET</h1>
    <div class="sub">AIR STRIKE</div>
    <p>自由飞行、机炮扫射、投弹轰炸。撞到建筑或地面就会坠毁。</p>
    <div class="keys">
      <div>W / S 俯仰升降</div>
      <div>A / D 横滚转向</div>
      <div>鼠标左键 按住扫射</div>
      <div>右键 按住瞄准 · 松开投弹</div>
      <div>滑动鼠标 拖动视角</div>
      <div>Alt 视角回正 · 左Shift 加力</div>
      <div style="grid-column:1/-1">Tab 显示 / 隐藏鼠标（进入任务自动隐藏）</div>
      <div style="grid-column:1/-1">R 锁定屏幕中心最近的单位（每帧居中跟随，再按 R 解除）</div>
      <div style="grid-column:1/-1">长按 Space 关闭发动机（减速、下坠）· 松开恢复</div>
    </div>
    <button id="startBtn">开始任务</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
'use strict';

/* =========================================================
   配置
========================================================= */
const CFG = {
  speed:      68,
  rollRate:   1.9,
  pitchRate:  1.35,
  yawRate:    0.75,
  gravity:    48,
  bombCD:     0.6,
  fireCD:     0.085,
  bulletSpd:  560,
  mapHalf:    3700,
  ceil:       1500,
  planeR:     6
};

const BOOST_MULT = 2.0;        // 左Shift 加力倍率（速度、尾焰、引擎声、视野同步强化）

const GUN_KILL_HITS = 10;      // 机枪命中 10 次摧毁建筑
const BOMB_RADIUS   = 195;     // 炸弹爆炸半径

/* 关车（长按 Space）动力学：推力回落 → 减速 + 低头下坠 */
const CUT_GLIDE     = 0.55;    // 滑翔速度下限（相对巡航；实际速度按 G.thrust 平滑过渡）
const CUT_SPOOL_DN  = 0.75;    // 关车后推力回落速率（/s）
const CUT_SPOOL_UP  = 1.0;     // 松开后推力恢复速率（/s）
const CUT_SINK_RATE = 1.0;     // 低头角速度上限（rad/s，乘以失推力比例）
const CUT_SINK_MAX  = -0.5;    // 下坠收敛下滑角（机头方向 y 分量，约 -30°）

const G = {
  started:false, over:false, crashing:false, crashTime:0,
  score:0, destroyed:0, fireTimer:0, shake:0, bulletSide:1,
  aiming:false, boost:0, cursorHidden:false,
  hp:32, hpMax:32, invuln:0, hitFlash:0,
  thrust:1, lockTarget: null, engCut: false
};

const keys = { left:false, right:false, up:false, down:false, fire:false, boost:false, engineCut:false };

let scene, camera, renderer, clock;
let plane, bombMark, gunReticle;
const bombs = [], bullets = [], effects = [], buildings = [];
const aaaGuns = [], samSites = [], enemies = [], eBullets = [], missiles = [];
const wingmen = [], wingRespawn = [0, 0];
let enemyTimer = 0;
let camInit = false;
const camLook = new THREE.Vector3();
const overlay = document.getElementById('overlay');

/* ---- 视角偏移（由鼠标拖动控制） ---- */
let camYawOff = 0, camPitchOff = 0;
/* 水平视角 360° 连续环绕（无死区）；垂直限幅 */
const CAM_PITCH_MIN = -0.85;
const CAM_PITCH_MAX = 1.05;
const MOUSE_SENS = 0.0042;          // 鼠标拖动视角灵敏度 rad/px

/* ---- 鼠标状态 ---- */
let mousePX = null, mousePY = null; // 上一次鼠标位置

const _tmpEuler = new THREE.Euler(0, 0, 0, 'YXZ');
const _tmpQuat  = new THREE.Quaternion();
const _tmpVec   = new THREE.Vector3();

/* =========================================================
   共享几何 / 材质
========================================================= */
const UNIT_BOX   = new THREE.BoxGeometry(1, 1, 1);
const FX_BALL    = new THREE.SphereGeometry(1, 12, 10);
const FX_SPARK   = new THREE.BoxGeometry(1, 1, 1);
const SMOKE_GEO  = new THREE.SphereGeometry(1, 8, 6);
const FX_RING    = (function () {
  const g = new THREE.RingGeometry(0.82, 1.0, 36);
  g.rotateX(-Math.PI / 2);
  return g;
})();
const BULLET_GEO = (function () {
  const g = new THREE.CylinderGeometry(0.18, 0.18, 5, 6);
  g.rotateX(Math.PI / 2);
  return g;
})();
const BULLET_MAT = new THREE.MeshBasicMaterial({
  color: 0xffe066, transparent: true, opacity: 0.92,
  blending: THREE.AdditiveBlending, depthWrite: false
});
/* 敌方曳光弹（红橙色，便于区分敌我） */
const E_BULLET_MAT = new THREE.MeshBasicMaterial({
  color: 0xff6644, transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const DEBRIS_MATS = new Map();
function getDebrisMat(hex) {
  let m = DEBRIS_MATS.get(hex);
  if (!m) { m = new THREE.MeshLambertMaterial({ color: hex }); DEBRIS_MATS.set(hex, m); }
  return m;
}

/* =========================================================
   音效
========================================================= */
const Sound = {
  ctx:null, master:null, ready:false,
  engOsc1:null, engOsc2:null, engGain:null, engFilter:null, noiseBuf:null,
  lastGun:0,

  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const ctx = this.ctx;

    this.master = ctx.createGain();
    this.master.gain.value = 0.55;
    this.master.connect(ctx.destination);

    const sr = ctx.sampleRate;
    const buf = ctx.createBuffer(1, sr * 2, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;

    this.engOsc1 = ctx.createOscillator();
    this.engOsc1.type = 'sawtooth';
    this.engOsc1.frequency.value = 58;

    this.engOsc2 = ctx.createOscillator();
    this.engOsc2.type = 'sawtooth';
    this.engOsc2.frequency.value = 61.5;

    const engNoise = ctx.createBufferSource();
    engNoise.buffer = buf;
    engNoise.loop = true;

    const noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.3;

    this.engFilter = ctx.createBiquadFilter();
    this.engFilter.type = 'lowpass';
    this.engFilter.frequency.value = 380;
    this.engFilter.Q.value = 2.5;

    this.engGain = ctx.createGain();
    this.engGain.gain.value = 0;

    this.engOsc1.connect(this.engFilter);
    this.engOsc2.connect(this.engFilter);
    engNoise.connect(noiseGain);
    noiseGain.connect(this.engFilter);
    this.engFilter.connect(this.engGain);
    this.engGain.connect(this.master);

    this.engOsc1.start();
    this.engOsc2.start();
    engNoise.start();

    this.engGain.gain.setTargetAtTime(0.085, ctx.currentTime, 0.6);
    this.ready = true;
  },

  setEngine(intensity, boost) {
    if (!this.ready) return;
    boost = boost || 0;
    const t = this.ctx.currentTime;
    /* 加力：转速更低沉、滤通更开、共振更强、音量明显更大 */
    this.engOsc1.frequency.setTargetAtTime(50 + intensity * 42 - boost * 24, t, 0.18);
    this.engOsc2.frequency.setTargetAtTime(53 + intensity * 44 - boost * 24, t, 0.18);
    this.engFilter.frequency.setTargetAtTime(290 + intensity * 880 + boost * 1500, t, 0.2);
    this.engFilter.Q.setTargetAtTime(2.5 + boost * 4, t, 0.25);
    this.engGain.gain.setTargetAtTime((0.06 + intensity * 0.055) * (1 + boost * 1.6), t, 0.25);
  },

  silenceEngine() {
    if (!this.ready) return;
    this.engGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.15);
  },

  gun() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    if (t - this.lastGun < 0.028) return;
    this.lastGun = t;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 1.5 + Math.random() * 0.4;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1500 + Math.random() * 600;
    bp.Q.value = 1.3;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.20, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);

    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.085);
  },

  boom(power) {
    if (!this.ready) return;
    power = power || 1;
    const ctx = this.ctx, t = ctx.currentTime;
    const dur = 0.5 + power * 0.65;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.5 + Math.random() * 0.3;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400 * power, t);
    lp.frequency.exponentialRampToValueAtTime(100, t + dur);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.34 * Math.min(1.7, power), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);

    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.15);
  },

  /* 防空机枪远距枪声：低频闷响，按距离衰减，带节流 */
  aaa(vol) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    if (t - (this.lastAaa || 0) < 0.055) return;
    this.lastAaa = t;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.9 + Math.random() * 0.3;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 900;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.14 * vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.1);
  },

  /* 导弹发射：噪声扫频上扬 */
  launch() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.8;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(260, t);
    bp.frequency.exponentialRampToValueAtTime(1900, t + 0.6);
    bp.Q.value = 1.1;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);

    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.85);
  },

  /* 玩家被命中的闷响 */
  hit() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.6 + Math.random() * 0.25;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 420;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);

    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.18);
  }
};

/* =========================================================
   世界生成（种子驱动 · Minecraft 式分层噪声）
   分层顺序：基础起伏 → 山脉 → 河流 → 湖泊 → 城市整平 → 出生地整平
   —— GEN-BLOCK-START ——（保持纯函数；外部校验脚本整段抽取）
========================================================= */
const WORLD_HALF = 4400;             // 地形网格半径（世界 8800×8800）
const SPAWN_X = 0, SPAWN_Z = 3550;   // 固定出生点：南侧边缘（朝北进场）
const WATER_LEVEL = 4;

function smoothstep(e0, e1, x) {
  let t = (x - e0) / (e1 - e0);
  t = Math.min(1, Math.max(0, t));
  return t * t * (3 - 2 * t);
}

/* ---- 种子与噪声（确定性哈希 / 值噪声 / 分形叠加） ---- */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(a) {
  let t = a >>> 0;
  return function () {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2i(ix, iz, seed) {
  let h = Math.imul(ix | 0, 374761393) + Math.imul(iz | 0, 668265263) + Math.imul(seed | 0, 1442695041);
  h ^= h >>> 13;
  h = Math.imul(h, 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z, seed) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2i(ix, iz, seed), b = hash2i(ix + 1, iz, seed);
  const c = hash2i(ix, iz + 1, seed), d = hash2i(ix + 1, iz + 1, seed);
  const top = a + (b - a) * ux, bot = c + (d - c) * ux;
  return top + (bot - top) * uz;
}
function fbm(x, z, seed, oct) {
  let v = 0, amp = 0.5, tot = 0;
  for (let i = 0; i < oct; i++) {
    v += vnoise(x, z, seed + i * 131) * amp;
    tot += amp;
    amp *= 0.5;
    x *= 2.03; z *= 1.97;
  }
  return v / tot;
}

/* ---- 当前世界参数（由种子生成；terrainHeight 全程只读 GEN） ---- */
let GEN = null;

function genWorld(seedNum) {
  const rng = mulberry32(seedNum);
  const g = { seed: seedNum >>> 0, mountains: [], cities: [], rivers: [], lakes: [] };

  /* 山脉：1~2 条（椭圆掩码 + 内部细节噪声；预存旋转三角） */
  const mCount = 1 + (rng() < 0.45 ? 1 : 0);
  for (let i = 0; i < mCount; i++) {
    for (let t = 0; t < 90; t++) {
      const mx = (rng() * 2 - 1) * WORLD_HALF * 0.7;
      const mz = (rng() * 2 - 1) * WORLD_HALF * 0.7;
      if (Math.hypot(mx - SPAWN_X, mz - SPAWN_Z) < 1600) continue;
      const mrx = 950 + rng() * 800, mrz = 620 + rng() * 600;
      let ok = true;
      for (const m of g.mountains) {
        if (Math.hypot(mx - m.x, mz - m.z) < (m.mrx + mrx) * 0.8) { ok = false; break; }
      }
      if (!ok) continue;
      const rot = rng() * Math.PI;
      g.mountains.push({
        x: mx, z: mz, rot, cr: Math.cos(rot), sr: Math.sin(rot), mrx, mrz,
        amp: 450 + rng() * 450,
        f1: 0.0042 + rng() * 0.0016, p1: rng() * 6.283,
        f2: 0.0095 + rng() * 0.0030, p2: rng() * 6.283
      });
      break;
    }
  }

  /* 城市：1~2 座（单座大小 1~3 倍随机等比缩放；以 RX 620 / RZ 600 为 1 倍参考） */
  const cCount = rng() < 0.5 ? 1 : 2;
  for (let i = 0; i < cCount; i++) {
    for (let t = 0; t < 240; t++) {
      const cs = 1 + rng() * 2;                       // 1~3 倍
      const rx = 620 * cs, rz = 600 * cs;
      const cx = (rng() * 2 - 1) * Math.max(250, WORLD_HALF - rx - 250);
      const cz = (rng() * 2 - 1) * Math.max(250, WORLD_HALF - rz - 250);
      if (Math.hypot(cx - SPAWN_X, cz - SPAWN_Z) < rx + 1000) continue;
      let ok = true;
      for (const c of g.cities) if (Math.hypot(cx - c.x, cz - c.z) < c.rx * 0.9 + rx * 0.9 + 900) { ok = false; break; }
      for (const m of g.mountains) if (Math.hypot(cx - m.x, cz - m.z) < m.mrx * 0.8 + rx * 0.7 + 500) { ok = false; break; }
      if (!ok) continue;
      g.cities.push({ x: cx, z: cz, rx, rz, s: cs });
      break;
    }
  }
  if (g.cities.length === 0) g.cities.push({ x: 0, z: 0, rx: 620, rz: 600, s: 1 });   // 兜底（极少数种子）

  /* 河流：1~2 条（正弦叠加中心线；避开城市与出生地） */
  const rCount = 1 + (rng() < 0.38 ? 1 : 0);
  for (let i = 0; i < rCount; i++) {
    for (let t = 0; t < 80; t++) {
      const rv = {
        dir: rng() < 0.5 ? 'z' : 'x',
        base: (rng() * 2 - 1) * WORLD_HALF * 0.5,
        a1: 120 + rng() * 260, f1: 0.0011 + rng() * 0.0018, ph1: rng() * 6.283,
        a2: 60 + rng() * 150, f2: 0.00035 + rng() * 0.0008, ph2: rng() * 6.283,
        w: 46 + rng() * 18
      };
      let ok = true;
      for (let k = 0; k <= 40 && ok; k++) {
        const c = -WORLD_HALF + 2 * WORLD_HALF * k / 40;
        const off = rv.base + Math.sin(c * rv.f1 + rv.ph1) * rv.a1 + Math.sin(c * rv.f2 + rv.ph2) * rv.a2;
        const px = rv.dir === 'z' ? off : c;
        const pz = rv.dir === 'z' ? c : off;
        if (Math.hypot(px - SPAWN_X, pz - SPAWN_Z) < 700) ok = false;
        for (const ct of g.cities) {
          if (Math.abs(px - ct.x) < ct.rx + 220 && Math.abs(pz - ct.z) < ct.rz + 220) ok = false;
        }
      }
      if (!ok) continue;
      g.rivers.push(rv);
      break;
    }
  }

  /* 湖泊：0~2 个（谐波岸线；避开城市与出生地） */
  const lCount = rng() < 0.22 ? 0 : (rng() < 0.75 ? 1 : 2);
  for (let i = 0; i < lCount; i++) {
    for (let t = 0; t < 90; t++) {
      const lx = (rng() * 2 - 1) * WORLD_HALF * 0.85;
      const lz = (rng() * 2 - 1) * WORLD_HALF * 0.85;
      if (Math.hypot(lx - SPAWN_X, lz - SPAWN_Z) < 1000) continue;
      let ok = true;
      for (const ct of g.cities) {
        if (Math.abs(lx - ct.x) < ct.rx + 260 && Math.abs(lz - ct.z) < ct.rz + 260) ok = false;
      }
      for (const l of g.lakes) if (Math.hypot(lx - l.x, lz - l.z) < 900) ok = false;
      if (!ok) continue;
      g.lakes.push({
        x: lx, z: lz, r: 260 + rng() * 160,
        h1a: 0.10 + rng() * 0.10, h1p: rng() * 6.283,
        h2a: 0.05 + rng() * 0.08, h2p: rng() * 6.283
      });
      break;
    }
  }
  return g;
}

/* ---- 地形高度（分层叠加，逐层由种子参数驱动） ---- */
function terrainHeight(x, z) {
  const g = GEN;
  let h = 70 + (fbm(x * 0.00055, z * 0.00055, g.seed ^ 0x9E37, 3) - 0.5) * 130;
  h += (vnoise(x * 0.0021, z * 0.0021, g.seed ^ 0x51ED) - 0.5) * 16;

  for (const m of g.mountains) {
    const dx = x - m.x, dz = z - m.z;
    const rx = m.cr * dx + m.sr * dz, rz = -m.sr * dx + m.cr * dz;
    const md = Math.hypot(rx / m.mrx, rz / m.mrz);
    if (md < 1) {
      const mask = 1 - md;
      const mm = mask * mask * (1 - mask * 0.25);
      h += mm * m.amp;
      h += Math.sin(x * m.f1 + m.p1) * Math.cos(z * m.f1 * 0.9 + m.p1 * 0.7) * mm * m.amp * 0.34;
      h += Math.sin(x * m.f2 + m.p2) * Math.cos(z * m.f2 * 0.85) * mm * m.amp * 0.10;
    }
  }

  for (const r of g.rivers) {
    const c = r.dir === 'z' ? z : x;
    const cen = r.base + Math.sin(c * r.f1 + r.ph1) * r.a1 + Math.sin(c * r.f2 + r.ph2) * r.a2;
    const d = Math.abs((r.dir === 'z' ? x : z) - cen);
    if (d < r.w * 2.9) {
      const t = smoothstep(r.w * 2.9, r.w * 0.75, d);
      h = h * (1 - t) + (-24 + Math.sin(c * 0.008) * 4) * t;
    }
  }

  for (const l of g.lakes) {
    const dx = x - l.x, dz = z - l.z;
    const d = Math.hypot(dx, dz);
    const ang = Math.atan2(dz, dx);
    const lr = l.r * (1 + Math.sin(ang * 3 + l.h1p) * l.h1a + Math.sin(ang * 5 + l.h2p) * l.h2a);
    if (d < lr * 1.75) {
      const t = smoothstep(lr * 1.75, lr * 0.55, d);
      h = h * (1 - t) + (-20 + Math.sin(ang * 4) * 3) * t;
    }
  }

  for (const ct of g.cities) {
    const cd = Math.hypot((x - ct.x) / ct.rx, (z - ct.z) / ct.rz);
    if (cd < 1.4) {
      const w = smoothstep(1.4, 0.82, cd);
      h = h * (1 - w) + 50 * w;
    }
  }

  const sd = Math.hypot(x - SPAWN_X, z - SPAWN_Z);
  if (sd < 520) {
    const w = smoothstep(520, 240, sd);
    h = h * (1 - w) + 55 * w;
  }
  return h;
}

/* ---- 地形配色（逐档锁定值） ---- */
const STOPS = [
  { h: -30, c: [0.19, 0.25, 0.17] },
  { h:  2,  c: [0.42, 0.40, 0.27] },
  { h: 12,  c: [0.56, 0.50, 0.34] },
  { h: 22,  c: [0.35, 0.49, 0.24] },
  { h: 120, c: [0.28, 0.46, 0.22] },
  { h: 215, c: [0.19, 0.35, 0.17] },
  { h: 300, c: [0.31, 0.29, 0.26] },
  { h: 400, c: [0.46, 0.44, 0.43] },
  { h: 520, c: [0.90, 0.93, 0.97] },
  { h: 720, c: [1.00, 1.00, 1.00] }
];

function terrainColor(h, out) {
  if (h <= STOPS[0].h) {
    out[0] = STOPS[0].c[0]; out[1] = STOPS[0].c[1]; out[2] = STOPS[0].c[2];
    return;
  }
  for (let i = 0; i < STOPS.length - 1; i++) {
    const a = STOPS[i], b = STOPS[i + 1];
    if (h >= a.h && h <= b.h) {
      const t = smoothstep(a.h, b.h, h);
      out[0] = a.c[0] + (b.c[0] - a.c[0]) * t;
      out[1] = a.c[1] + (b.c[1] - a.c[1]) * t;
      out[2] = a.c[2] + (b.c[2] - a.c[2]) * t;
      return;
    }
  }
  const L = STOPS[STOPS.length - 1].c;
  out[0] = L[0]; out[1] = L[1]; out[2] = L[2];
}

/* ---- 地面单位自动布点（不落水 / 避城市与出生地 / 相互留距 / 太陡不选） ---- */
function pickUnitSpot(minSep, others) {
  const rng = mulberry32((GEN.seed ^ 0xDEF0) >>> 0);
  for (let relax = 0; relax < 6; relax++) {
    const sep = minSep * Math.pow(0.72, relax);
    for (let t = 0; t < 1500; t++) {
      const x = (rng() * 2 - 1) * (WORLD_HALF - 400);
      const z = (rng() * 2 - 1) * (WORLD_HALF - 400);
      if (terrainHeight(x, z) < WATER_LEVEL + 12) continue;
      if (Math.hypot(x - SPAWN_X, z - SPAWN_Z) < 900) continue;
      let ok = true;
      for (const ct of GEN.cities) {
        if (Math.abs(x - ct.x) < ct.rx + 150 && Math.abs(z - ct.z) < ct.rz + 150) { ok = false; break; }
      }
      if (!ok) continue;
      const hs = [
        terrainHeight(x, z), terrainHeight(x + 60, z), terrainHeight(x - 60, z),
        terrainHeight(x, z + 60), terrainHeight(x, z - 60)
      ];
      if (Math.max(hs[0], hs[1], hs[2], hs[3], hs[4]) - Math.min(hs[0], hs[1], hs[2], hs[3], hs[4]) > 90) continue;
      for (const p of others) if (Math.hypot(x - p.x, z - p.z) < sep) { ok = false; break; }
      if (!ok) continue;
      return { x, z };
    }
  }
  return null;
}

function autoPlaceUnits(nAaa, nSam) {
  const out = { aaa: [], sam: [] };
  for (let i = 0; i < nAaa; i++) {
    const p = pickUnitSpot(550, out.aaa.concat(out.sam));
    if (!p) break;
    out.aaa.push(p);
  }
  for (let i = 0; i < nSam; i++) {
    const p = pickUnitSpot(650, out.aaa.concat(out.sam));
    if (!p) break;
    out.sam.push(p);
  }
  return out;
}

let worldTerrain = null, worldWater = null;

function createTerrain() {
  const SIZE = WORLD_HALF * 2, SEG = 400;      // 8800×8800，22m/格（保持原密度）
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);

  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const tmp = [0, 0, 0];

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = terrainHeight(x, z);
    pos.setY(i, h);
    terrainColor(h, tmp);

    /* 城市区域：水泥色地面 */
    for (const ct of GEN.cities) {
      const cd = Math.hypot((x - ct.x) / ct.rx, (z - ct.z) / ct.rz);
      if (cd < 1.15) {
        const w = smoothstep(1.15, 0.82, cd) * 0.68;
        tmp[0] = tmp[0] * (1 - w) + 0.40 * w;
        tmp[1] = tmp[1] * (1 - w) + 0.41 * w;
        tmp[2] = tmp[2] * (1 - w) + 0.42 * w;
      }
    }

    const n = (Math.sin(x * 0.31 + z * 0.27) * 0.5 + 0.5) * 0.06 - 0.03;
    colors[i * 3]     = Math.min(1, Math.max(0, tmp[0] + n));
    colors[i * 3 + 1] = Math.min(1, Math.max(0, tmp[1] + n));
    colors[i * 3 + 2] = Math.min(1, Math.max(0, tmp[2] + n));
  }

  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  worldTerrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  scene.add(worldTerrain);
}

function createWater() {
  const geo = new THREE.PlaneGeometry(WORLD_HALF * 2 + 4200, WORLD_HALF * 2 + 4200);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshPhongMaterial({
    color: 0x2f6f9e, transparent: true, opacity: 0.82,
    shininess: 110, specular: 0x88ccff, depthWrite: false
  });
  worldWater = new THREE.Mesh(geo, mat);
  worldWater.position.y = WATER_LEVEL;
  worldWater.renderOrder = 1;
  scene.add(worldWater);
}

function createSky() {
  const geo = new THREE.SphereGeometry(15000, 24, 16);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      topColor:    { value: new THREE.Color(0x1e5fa8) },
      midColor:    { value: new THREE.Color(0x76b0dd) },
      bottomColor: { value: new THREE.Color(0xd6e7f2) }
    },
    vertexShader: `
      varying vec3 vPos;
      void main(){ vPos = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor;
      varying vec3 vPos;
      void main(){
        float h = vPos.y;
        vec3 c = mix(bottomColor, midColor, smoothstep(-0.12, 0.28, h));
        c = mix(c, topColor, smoothstep(0.22, 0.78, h));
        gl_FragColor = vec4(c, 1.0); }`
  });
  scene.add(new THREE.Mesh(geo, mat));
}

let cloudAssets = null;
const worldClouds = [];
function createClouds() {
  if (!cloudAssets) {
    cloudAssets = {
      geo: new THREE.SphereGeometry(1, 8, 6),
      mat: new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.78, depthWrite: false })
    };
  }
  const rng = mulberry32((GEN.seed ^ 0xC10D) >>> 0);
  for (let i = 0; i < 36; i++) {
    const cl = new THREE.Group();
    const n = 3 + (rng() * 5 | 0);
    for (let j = 0; j < n; j++) {
      const m = new THREE.Mesh(cloudAssets.geo, cloudAssets.mat);
      m.position.set((rng() - 0.5) * 90, (rng() - 0.5) * 14, (rng() - 0.5) * 90);
      m.scale.set(26 + rng() * 38, 11 + rng() * 15, 26 + rng() * 38);
      cl.add(m);
    }
    cl.position.set((rng() - 0.5) * 8200, 400 + rng() * 560, (rng() - 0.5) * 8200);
    cl.renderOrder = 2;
    scene.add(cl);
    worldClouds.push(cl);
  }
}

let vegAssets = null;
const worldTrees = [];
function createVegetation() {
  const COUNT = 1850;                          // 密度 ×4（原 460 / 4400²）
  if (!vegAssets) {
    const trunkGeo = new THREE.CylinderGeometry(0.5, 0.85, 6, 5);
    trunkGeo.translate(0, 3, 0);
    const leafGeo = new THREE.ConeGeometry(3.4, 13, 7);
    leafGeo.translate(0, 10.5, 0);
    vegAssets = {
      trunkGeo, leafGeo,
      trunkMat: new THREE.MeshLambertMaterial({ color: 0x4a3524 }),
      leafMat: new THREE.MeshLambertMaterial({ color: 0x2c5c28 })
    };
  }
  const rng = mulberry32((GEN.seed ^ 0x7E33) >>> 0);
  const trunks = new THREE.InstancedMesh(vegAssets.trunkGeo, vegAssets.trunkMat, COUNT);
  const leaves = new THREE.InstancedMesh(vegAssets.leafGeo, vegAssets.leafMat, COUNT);
  const dummy = new THREE.Object3D();
  let placed = 0, tries = 0;

  while (placed < COUNT && tries < COUNT * 16) {
    tries++;
    const x = (rng() * 2 - 1) * (WORLD_HALF - 150);
    const z = (rng() * 2 - 1) * (WORLD_HALF - 150);
    const h = terrainHeight(x, z);
    if (h < 80 || h > 320) continue;
    if (h < WATER_LEVEL + 6) continue;
    let inCity = false;
    for (const ct of GEN.cities) {
      if (Math.abs(x - ct.x) < ct.rx * 1.2 && Math.abs(z - ct.z) < ct.rz * 1.2) { inCity = true; break; }
    }
    if (inCity) continue;
    const f = fbm(x * 0.00035, z * 0.00035, GEN.seed ^ 0xF0A5, 2);
    if (rng() > 0.18 + 1.1 * f) continue;      // 森林簇状分布（噪声密度）

    const s = 0.65 + rng() * 1.05;
    dummy.position.set(x, h, z);
    dummy.rotation.y = rng() * Math.PI * 2;
    dummy.scale.set(s, s * (0.75 + rng() * 0.65), s);
    dummy.updateMatrix();
    trunks.setMatrixAt(placed, dummy.matrix);
    leaves.setMatrixAt(placed, dummy.matrix);
    placed++;
  }
  trunks.count = leaves.count = placed;
  trunks.instanceMatrix.needsUpdate = true;
  leaves.instanceMatrix.needsUpdate = true;
  scene.add(trunks);
  scene.add(leaves);
  worldTrees.push(trunks, leaves);
}

/* =========================================================
   空间哈希
========================================================= */
const HASH_CELL = 110;
const bHash = new Map();
let queryFrame = 0;
const _qResult = [];

function addToHash(b) {
  const key = Math.floor(b.x / HASH_CELL) + ',' + Math.floor(b.z / HASH_CELL);
  let arr = bHash.get(key);
  if (!arr) { arr = []; bHash.set(key, arr); }
  arr.push(b);
  b._hashKey = key;
}
function removeFromHash(b) {
  const arr = bHash.get(b._hashKey);
  if (!arr) return;
  const i = arr.indexOf(b);
  if (i >= 0) arr.splice(i, 1);
}
function queryBuildings(x, z, radius) {
  queryFrame++;
  _qResult.length = 0;
  const minGx = Math.floor((x - radius) / HASH_CELL);
  const maxGx = Math.floor((x + radius) / HASH_CELL);
  const minGz = Math.floor((z - radius) / HASH_CELL);
  const maxGz = Math.floor((z + radius) / HASH_CELL);
  for (let gx = minGx; gx <= maxGx; gx++) {
    for (let gz = minGz; gz <= maxGz; gz++) {
      const arr = bHash.get(gx + ',' + gz);
      if (!arr) continue;
      for (let i = 0; i < arr.length; i++) {
        const b = arr[i];
        if (b._qf === queryFrame || b.dead) continue;
        b._qf = queryFrame;
        _qResult.push(b);
      }
    }
  }
  return _qResult;
}

   城市
========================================================= */
let cityAssets = null;
function createCity() {
  if (!cityAssets) {
    const bodyColors = [
      0x6d8fc4, 0x7ba0cf, 0x5d7fb5, 0x88aad6, 0x6385b8,
      0x7a94b8, 0x8fb0d4, 0x5a78a8, 0x96b8dc, 0x6b8cba
    ];
    const roofColors = [0xe8956a, 0xf0a868, 0xd97a5c, 0xf5c88a, 0xc96b52];
    cityAssets = {
      bodyMats: bodyColors.map(c => new THREE.MeshLambertMaterial({ color: c })),
      roofMats: roofColors.map(c => new THREE.MeshLambertMaterial({ color: c }))
    };
  }

  /* 逐城生成（同一种子 → 同一座城；重开一局也完全一致） */
  for (let ci = 0; ci < GEN.cities.length; ci++) {
    const ct = GEN.cities[ci];
    const CX = ct.x, CZ = ct.z, RX = ct.rx, RZ = ct.rz;
    const rng = mulberry32((((GEN.seed ^ 0xB0B0) + ci * 7919) >>> 0));
    const S = ct.s || 1;                        // 城市缩放（铺开 / 楼高 / 道路等比）
    const BS = 118 * S, ROAD = 24 * S;
    const plot = BS - ROAD;

    for (let bx = -RX; bx < RX - BS; bx += BS) {
      for (let bz = -RZ; bz < RZ - BS; bz += BS) {
        const ccx = bx + BS / 2, ccz = bz + BS / 2;
        const d = Math.hypot(ccx / RX, ccz / RZ);
        if (d > 0.92) continue;
        if (d > 0.6 && rng() < 0.38) continue;

        const core = Math.max(0, 1 - d / 0.92);

        const plots = [];
        if (rng() < 0.55) {
          const cell = plot / 2;
          for (let i = 0; i < 2; i++) {
            for (let j = 0; j < 2; j++) {
              if (rng() < 0.22) continue;
              plots.push({
                x: bx + ROAD / 2 + (i + 0.5) * cell,
                z: bz + ROAD / 2 + (j + 0.5) * cell,
                w: cell * 0.80, d: cell * 0.80
              });
            }
          }
        } else {
          if (rng() < 0.5) {
            plots.push({ x: bx + BS / 2, z: bz + BS / 2, w: plot * 0.86, d: plot * 0.86 });
          } else {
            for (let j = 0; j < 2; j++) {
              plots.push({
                x: bx + BS / 2,
                z: bz + ROAD / 2 + (j + 0.5) * (plot / 2),
                w: plot * 0.80, d: plot * 0.38
              });
            }
          }
        }

        for (const p of plots) {
          const wx = CX + p.x, wz = CZ + p.z;
          const gh = terrainHeight(wx, wz);
          if (gh < WATER_LEVEL + 8) continue;

          const hMax = 35 + core * 300;
          const h = (24 + Math.pow(rng(), 1.5) * hMax) * S;
          const w  = p.w * (0.75 + rng() * 0.25);
          const dd = p.d * (0.75 + rng() * 0.25);

          makeBuilding(wx, wz, gh, w, h, dd, cityAssets.bodyMats, cityAssets.roofMats, rng);
        }
      }
    }
  }
}

function makeBuilding(x, z, y, w, h, d, bodyMats, roofMats, rng) {
  const bodyMat = bodyMats[(rng() * bodyMats.length) | 0];
  const roofMat = roofMats[(rng() * roofMats.length) | 0];

  const rotY = (rng() - 0.5) * 0.16;

  const body = new THREE.Mesh(UNIT_BOX, bodyMat);
  body.position.set(x, y + h / 2, z);
  body.scale.set(w, h, d);
  body.rotation.y = rotY;
  scene.add(body);

  const roofH = 2.6 + h * 0.028;
  const roof = new THREE.Mesh(UNIT_BOX, roofMat);
  roof.position.set(x, y + h + roofH / 2 - 0.3, z);
  roof.scale.set(w * 1.07, roofH, d * 1.07);
  roof.rotation.y = rotY;
  scene.add(roof);

  const b = {
    body, roof,
    x, z,
    y0: y,
    y1: y + h + roofH,
    hw: (w * 1.07) / 2,
    hd: (d * 1.07) / 2,
    w, h, d,
    colorHex: bodyMat.color.getHex(),
    gunHits: 0,
    dead: false,
    _qf: -1
  };
  buildings.push(b);
  addToHash(b);
}

/* ---- 世界重建辅助（种子重新生成 / 开局重置共用） ---- */
function clearCity() {
  for (const b of buildings) {
    scene.remove(b.body);
    scene.remove(b.roof);
  }
  buildings.length = 0;
  bHash.clear();
}

function clearWorld() {
  if (worldTerrain) {
    scene.remove(worldTerrain);
    worldTerrain.geometry.dispose();
    worldTerrain.material.dispose();
    worldTerrain = null;
  }
  if (worldWater) {
    scene.remove(worldWater);
    worldWater.geometry.dispose();
    worldWater.material.dispose();
    worldWater = null;
  }
  while (worldTrees.length) scene.remove(worldTrees.pop());
  while (worldClouds.length) scene.remove(worldClouds.pop());
  clearCity();
}

function buildWorld() {
  createTerrain();
  createWater();
  createVegetation();
  createClouds();
  createCity();
}

function sphereHitsBuilding(px, py, pz, r, b) {
  const cx = Math.max(b.x - b.hw, Math.min(px, b.x + b.hw));
  const cy = Math.max(b.y0, Math.min(py, b.y1));
  const cz = Math.max(b.z - b.hd, Math.min(pz, b.z + b.hd));
  const dx = px - cx, dy = py - cy, dz = pz - cz;
  return dx * dx + dy * dy + dz * dz < r * r;
}

function hitByBullet(b, hitPos) {
  if (b.dead) return;
  b.gunHits++;
  if (b.gunHits >= GUN_KILL_HITS) {
    destroyBuilding(b);
  } else {
    spawnHitSpark(hitPos);
  }
}

function destroyBuilding(b) {
  if (b.dead) return;
  b.dead = true;

  scene.remove(b.body);
  scene.remove(b.roof);
  removeFromHash(b);

  const n = 6 + (Math.random() * 6 | 0);
  for (let i = 0; i < n; i++) spawnDebris(b);

  const center = new THREE.Vector3(b.x, b.y0 + b.h * 0.5, b.z);
  spawnExplosion(center, 1.6 + Math.min(1.8, b.h / 170));
  Sound.boom(0.7 + Math.min(1.0, b.h / 260));

  G.shake = Math.min(1.6, G.shake + 0.45);
  G.score += 10;                                        // 建筑只计分，不计入「击毁敌方单位」
}

function spawnDebris(b) {
  const s = 2 + Math.random() * 5;
  const m = new THREE.Mesh(UNIT_BOX, getDebrisMat(b.colorHex));
  m.scale.set(s, s * (0.6 + Math.random() * 0.9), s);
  m.position.set(
    b.x + (Math.random() - 0.5) * b.w,
    b.y0 + Math.random() * b.h,
    b.z + (Math.random() - 0.5) * b.d

  const dir = new THREE.Vector3(
    m.position.x - b.x,

function onBombImpact(pos) {
  spawnExplosion(pos, 3.6);
  Sound.boom(1.6);
  G.shake = Math.min(2.4, G.shake + 1.0);

  const R = BOMB_RADIUS;
  const nearby = queryBuildings(pos.x, pos.z, R + 160);
  for (let i = 0; i < nearby.length; i++) {
    const b = nearby[i];
    if (b.dead) continue;
    const dx = b.x - pos.x, dz = b.z - pos.z;
    if (Math.abs(dx) < R + b.hw && Math.abs(dz) < R + b.hd) {
      const dy = Math.abs((b.y0 + b.h * 0.5) - pos.y);
      if (dy < R + b.h * 0.5) {
        destroyBuilding(b);
      }
    }
  }

  /* 波及敌方单位 */
  for (const g of aaaGuns) {
    if (!g.dead && Math.hypot(g.x - pos.x, g.z - pos.z) < R) destroyAAA(g);
  }
  for (const s of samSites) {
    if (!s.dead && Math.hypot(s.x - pos.x, s.z - pos.z) < R) destroySAM(s);
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.dead && e.mesh.position.distanceTo(pos) < R) destroyEnemy(e, true);
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bu = bullets[i];
    bu.age += dt;

    const stepLen = bu.vel.length() * dt;
    const steps = Math.max(1, Math.ceil(stepLen / 6));
    let removed = false;

    for (let s = 0; s < steps; s++) {
      bu.mesh.position.addScaledVector(bu.vel, dt / steps);

      const p = bu.mesh.position;
      const gh = terrainHeight(p.x, p.z);
      if (p.y < gh) {
        spawnHitSpark(p);
        scene.remove(bu.mesh);
        bullets.splice(i, 1);
        removed = true;
        break;
      }

      const nearby = queryBuildings(p.x, p.z, 30);
      for (let j = 0; j < nearby.length; j++) {
        const b = nearby[j];
        if (b.dead) continue;
        if (p.x > b.x - b.hw && p.x < b.x + b.hw &&
            p.z > b.z - b.hd && p.z < b.z + b.hd &&
            p.y > b.y0 && p.y < b.y1) {
          hitByBullet(b, p.clone());
          scene.remove(bu.mesh);
          bullets.splice(i, 1);
          removed = true;
          break;
        }
      }

      /* 命中敌方单位（防空机枪 / 导弹阵地 / 敌机） */
      if (!removed) {
        for (let j = 0; j < aaaGuns.length; j++) {
          const g = aaaGuns[j];
          if (g.dead) continue;
          if (p.distanceToSquared(_u2.set(g.x, g.baseY + 3.0, g.z)) < 81) {
            g.hp--;
            if (g.hp <= 0) destroyAAA(g); else spawnHitSpark(p);
            scene.remove(bu.mesh);
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
      }
      if (!removed) {
        for (let j = 0; j < samSites.length; j++) {
          const s = samSites[j];
          if (s.dead) continue;
          if (p.distanceToSquared(_u2.set(s.x, s.baseY + 8.0, s.z)) < 576) {
            s.hp--;
            if (s.hp <= 0) destroySAM(s); else spawnHitSpark(p);
            scene.remove(bu.mesh);
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
      }
      if (!removed) {
        for (let j = 0; j < enemies.length; j++) {
          const en = enemies[j];
          if (en.dead) continue;
          if (p.distanceToSquared(en.mesh.position) < 81) {
            en.hp--;
            if (en.hp <= 0) destroyEnemy(en, true); else spawnHitSpark(p);
            scene.remove(bu.mesh);
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
      }

      if (removed) break;
    }

    if (removed) continue;

    if (bu.age > 2.2) {
      scene.remove(bu.mesh);
      bullets.splice(i, 1);
    }
  }
}

/* 双坡屋面（三棱柱）几何：底面宽 1.732r、脊高 1.5r、长 2L（小房子屋顶用） */
function makePrismGeo(r, L) {
  const w = r * 0.8660254, b = -r * 0.5, t = r;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    0, t, -L,   -w, b, -L,   w, b, -L,
    0, t,  L,    w, b,  L,  -w, b,  L,
  ]), 3));
  g.setIndex([0, 2, 1, 3, 4, 5, 0, 1, 5, 0, 5, 3, 0, 3, 4, 0, 4, 2]);
  g.computeVertexNormals();
  return g;
}

/* 让物体的 -Z 朝向 dir（可带滚转） */
const _oF = new THREE.Vector3(), _oR = new THREE.Vector3();
const _oU = new THREE.Vector3(), _oB = new THREE.Vector3();
const _oQ = new THREE.Quaternion(), _oM = new THREE.Matrix4();
function orientToward(obj, dir, bank) {
  _oF.copy(dir).normalize();
  _oR.crossVectors(_oF, _worldUp);
  if (_oR.lengthSq() < 1e-6) _oR.set(1, 0, 0); else _oR.normalize();
  _oU.crossVectors(_oR, _oF).normalize();
  if (bank) {
    _oQ.setFromAxisAngle(_oF, bank);
    _oR.applyQuaternion(_oQ);
    _oU.applyQuaternion(_oQ);
  }
  _oB.copy(_oF).negate();
  _oM.makeBasis(_oR, _oU, _oB);
  obj.quaternion.setFromRotationMatrix(_oM);
}

/* ---- 防空机枪：通古斯卡式履带防空车（炮塔两侧双管机炮）+ 营地小房子 ---- */
function createAAAGun(x, z) {
  const groundY = terrainHeight(x, z);
  const yaw0 = Math.atan2(x, z);                              // 车体朝向地图中心
  const fwdX = -Math.sin(yaw0), fwdZ = -Math.cos(yaw0);
  const half = 2.9 * AAA_SCALE;                               // 车体世界半长
  const hF = terrainHeight(x + fwdX * half, z + fwdZ * half);
  const hB = terrainHeight(x - fwdX * half, z - fwdZ * half);

  const g = new THREE.Group();
  g.rotation.order = 'YXZ';
  g.rotation.y = yaw0;
  g.rotation.x = Math.atan2(hF - hB, half * 2);               // 贴合坡向
  g.position.set(x, (hF + hB) / 2 - 0.4, z);

  /* 履带底盘 */
  const trackGeo = new THREE.BoxGeometry(0.8, 0.9, 5.8);
  for (const tx of [-1.35, 1.35]) {
    const track = new THREE.Mesh(trackGeo, M_S_WHEEL);
    track.position.set(tx, 0.55, 0.15);
    g.add(track);
  }
  const hull = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.0, 5.2), M_A_TUR);
  hull.position.y = 1.05;
  g.add(hull);
  const glacis = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.8, 0.9), M_A_MOUNT);
  glacis.position.set(0, 1.12, -2.85);
  glacis.rotation.x = -0.35;
  g.add(glacis);
  const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.42, 0.1), M_S_GLASS);
  windshield.position.set(0, 1.38, -2.5);
  windshield.rotation.x = -0.35;
  g.add(windshield);

  /* 炮塔（水平跟踪）+ 俯仰组（左右两侧双管机炮，炮管加大） */
  const turret = new THREE.Group();
  turret.position.set(0, 1.75, 0.1);

/* ---- 防空导弹阵地（锁定后发射，射后装填） ---- */

  const g = new THREE.Group();
  g.rotation.order = 'YXZ';

  g.rotation.x = Math.atan2(hF - hB, half * 2);               // 贴合坡向（长载具防插地）

  const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.14, 14), M_S_DARK);

  const msl = makeMissileMesh();

  msl.rotation.x = Math.PI / 2;                               // 弹头垂直朝上

  /* 雷达桅杆（独立支杆 + 旋转天线） */

  /* ---- 营地：5 栋小房子（墙体 + 双坡屋顶 + 门） ---- */
  [[-4.6, 3.4, -0.4, 1.7, 1.05, 1.6, M_H_WALL, M_H_ROOF],

/* ---- 敌机生成：从地图边缘进入 ---- */
