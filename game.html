function flashHint(msg) {
  const el = document.getElementById('mapHint');
  if (!el) return;
  el.textContent = msg;
  clearTimeout(flashHint._t);
  flashHint._t = setTimeout(() => { el.textContent = HINT_DEFAULT; }, 2200);
}

function canvasPos(e) {
  const r = mapCanvasEl.getBoundingClientRect();
  return {
    px: (e.clientX - r.left) / r.width * PREV_N,
    py: (e.clientY - r.top) / r.height * PREV_N
  };
}

function findMarker(wx, wz) {
  const m = worldToMap(wx, wz);
  let best = null, bestD = 12;
  const consider = (kind, arr) => {
    for (let i = 0; i < arr.length; i++) {
      const q = worldToMap(arr[i].x, arr[i].z);
      const d = Math.hypot(q.x - m.x, q.y - m.y);
      if (d < bestD) { bestD = d; best = { kind, idx: i }; }
    }
  };
  consider('aaa', PLAN.aaa);
  consider('sam', PLAN.sam);
  return best;
}

function changeCount(kind, d) {
  const arr = PLAN[kind];
  if (d > 0) {
    const p = pickUnitSpot(kind === 'aaa' ? 550 : 650, PLAN.aaa.concat(PLAN.sam));
    if (p) arr.push(p);
    else flashHint('地图上没有更多合适的位置了');
  } else {
    if (arr.length <= 0) return;
    arr.pop();
  }
  syncCountLabels();
  drawPreview();
}

function disposeAircraftPreview() {
  if (!aircraftPreview) return;
  const preview = aircraftPreview;
  aircraftPreview = null;
  if (preview.model) {
    preview.model.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(mat => mat.dispose());
      }
    });
  }
  if (preview.renderer) {
    preview.renderer.dispose();
    if (preview.renderer.forceContextLoss) preview.renderer.forceContextLoss();
  }
}

function resizeAircraftPreview() {
  if (!aircraftPreview) return;
  const canvas = document.getElementById('aircraftPreview');
  if (!canvas) return;
  const w = Math.max(320, canvas.clientWidth || 720);
  const h = Math.max(280, canvas.clientHeight || 480);
  aircraftPreview.camera.aspect = w / h;
  aircraftPreview.camera.updateProjectionMatrix();
  aircraftPreview.renderer.setSize(w, h, false);
}

function initAircraftPreview() {
  disposeAircraftPreview();
  const canvas = document.getElementById('aircraftPreview');
  if (!canvas || typeof THREE === 'undefined') return;

  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: true, alpha: true, powerPreference: 'low-power'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setClearColor(0x000000, 0);
  if ('outputEncoding' in renderer && THREE.sRGBEncoding !== undefined) {
    renderer.outputEncoding = THREE.sRGBEncoding;
  }
  if (THREE.ACESFilmicToneMapping !== undefined) {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
  }

  const previewScene = new THREE.Scene();
  const previewCamera = new THREE.PerspectiveCamera(32, 1.35, 0.1, 180);
  previewCamera.position.set(22, 11.5, -28);
  previewCamera.lookAt(0, 0.1, 0.7);

  const hemi = new THREE.HemisphereLight(0xd8f3ff, 0x44111a, 0.78);
  previewScene.add(hemi);
  const key = new THREE.DirectionalLight(0xffd2ae, 0.95);
  key.position.set(-11, 17, -12);
  previewScene.add(key);
  const rim = new THREE.DirectionalLight(0x72d8ff, 0.58);
  rim.position.set(14, 8, 16);
  previewScene.add(rim);
  const under = new THREE.PointLight(0xff5b68, 0.28, 42, 2);
  under.position.set(0, -3.5, 0);
  previewScene.add(under);

  const model = selectedAircraftSpec().factory();
  model.position.y = -0.45;
  model.rotation.z = 0.015;
  const pivot = new THREE.Group();
  pivot.rotation.y = 0.36;
  pivot.add(model);
  previewScene.add(pivot);

  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(10.2, 72),
    new THREE.MeshBasicMaterial({
      color: 0x6bd8f1, transparent: true, opacity: 0.026, depthWrite: false
    })
  );
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = -3.0;
  previewScene.add(disc);
  for (const radius of [7.4, 10.15]) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(radius, radius + 0.06, 96),
      new THREE.MeshBasicMaterial({
        color: radius > 9 ? 0xff6d75 : 0x74d9f2,
        transparent: true, opacity: radius > 9 ? 0.30 : 0.17,
        side: THREE.DoubleSide, depthWrite: false
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -2.98;
    previewScene.add(ring);
  }

  aircraftPreview = {
    renderer, scene: previewScene, camera: previewCamera,
    pivot, model, orbitYaw: Math.atan2(22, -28), orbitPitch: 0.31,
    orbitRadius: 35.2, time: 0, dragging: false, lastX: 0, lastY: 0
  };
  resizeAircraftPreview();

  canvas.addEventListener('pointerdown', e => {
    if (!aircraftPreview) return;
    aircraftPreview.dragging = true;
    aircraftPreview.lastX = e.clientX;
    aircraftPreview.lastY = e.clientY;
    canvas.classList.add('dragging');
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (!aircraftPreview || !aircraftPreview.dragging) return;
    const dx = e.clientX - aircraftPreview.lastX;
    const dy = e.clientY - aircraftPreview.lastY;
    aircraftPreview.orbitYaw -= dx * 0.009;
    aircraftPreview.orbitPitch = Math.max(-1.42, Math.min(1.42,
      aircraftPreview.orbitPitch + dy * 0.008));
    aircraftPreview.lastX = e.clientX;
    aircraftPreview.lastY = e.clientY;
  });
  const endAircraftDrag = () => {
    if (!aircraftPreview) return;
    aircraftPreview.dragging = false;
    canvas.classList.remove('dragging');
  };
  canvas.addEventListener('pointerup', endAircraftDrag);
  canvas.addEventListener('pointercancel', endAircraftDrag);
}

function updateAircraftPreview(dt) {
  const preview = aircraftPreview;
  if (!preview) return;
  preview.time += dt;
  if (!preview.dragging) preview.orbitYaw += dt * 0.17;
  const orbitRadius = preview.orbitRadius + Math.abs(preview.orbitPitch) * 6;
  const horizontal = Math.cos(preview.orbitPitch) * orbitRadius;
  preview.camera.position.set(
    Math.sin(preview.orbitYaw) * horizontal,
    0.1 + Math.sin(preview.orbitPitch) * orbitRadius,
    Math.cos(preview.orbitYaw) * horizontal
  );
  preview.camera.lookAt(0, 0.1, 0.7);
  preview.model.position.y = -0.45 + Math.sin(preview.time * 0.9) * 0.13;
  const flame = preview.model.userData.flame;
  if (flame) {
    const pulse = 0.92 + Math.sin(preview.time * 8.5) * 0.07;
    flame.scale.set(1, pulse, 1);
    const anchorZ = preview.model.userData.flameAnchorZ;
    const baseLength = preview.model.userData.flameBaseLength;
    if (Number.isFinite(anchorZ) && Number.isFinite(baseLength)) {
      flame.position.z = anchorZ + baseLength * 0.5 * pulse;
    }
  }
  preview.renderer.render(preview.scene, preview.camera);
}

            '<button class="btn btn-primary" id="aircraftBtn" type="button">选择座驾 <span>→</span></button>' +
          '</div>' +
        '</aside>' +
      '</main>' +
    '</div>';
  bindStartPanel();
  bindScreenBack(() => showSeedScreen());
}

function bindStartPanel() {
  const $ = id => document.getElementById(id);
  $('aircraftBtn').addEventListener('click', showAircraftScreen);
  $('aaaPlus').addEventListener('click', () => changeCount('aaa', 1));
  $('aaaMinus').addEventListener('click', () => changeCount('aaa', -1));
  $('samPlus').addEventListener('click', () => changeCount('sam', 1));
  $('samMinus').addEventListener('click', () => changeCount('sam', -1));
  $('reRoll').addEventListener('click', () => {
    PLAN = autoPlaceUnits(PLAN.aaa.length, PLAN.sam.length);
    syncCountLabels();
    drawPreview();
  });
  $('newMapBtn').addEventListener('click', () => showSeedScreen());
  const lightingButtons = document.querySelectorAll ?
    Array.from(document.querySelectorAll('.lighting-option')) : [];
  const syncLightingOptions = () => {
    lightingButtons.forEach(btn => {
      const on = btn.dataset.light === selectedLightMode;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  };
  lightingButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      selectedLightMode = btn.dataset.light;
      syncLightingOptions();
    });
  });
  syncLightingOptions();

  mapCanvasEl = $('mapCanvas');
  mapCanvasEl.addEventListener('pointerdown', e => {
    const c = canvasPos(e);
    const w = mapToWorld(c.px, c.py);
    const hit = findMarker(w.x, w.z);
    if (hit) {
      dragState = { kind: hit.kind, idx: hit.idx, moved: false, pos: null };
      mapCanvasEl.setPointerCapture(e.pointerId);
      e.preventDefault();
    } else {
      flashHint('用 + / − 增减数量；按住标记可拖动摆放');
    }
  });
  mapCanvasEl.addEventListener('pointermove', e => {
    if (!dragState) return;
    const c = canvasPos(e);
    dragState.pos = mapToWorld(c.px, c.py);
    dragState.moved = true;
    drawPreview();
  });
  const endDrag = () => {
    if (!dragState) return;
    const s = dragState;
    dragState = null;
    if (s.moved && s.pos) {
      const inB = Math.abs(s.pos.x) < WORLD_HALF && Math.abs(s.pos.z) < WORLD_HALF;
      if (inB && terrainHeight(s.pos.x, s.pos.z) >= WATER_LEVEL + 12) {
        PLAN[s.kind][s.idx] = s.pos;
      } else {
        flashHint('这里不能放：水面或越界');
      }
    } else {
      PLAN[s.kind].splice(s.idx, 1);      // 点击标记 = 删除（数量随之 -1）
    }
    syncCountLabels();
    drawPreview();
  };
  mapCanvasEl.addEventListener('pointerup', endDrag);
  mapCanvasEl.addEventListener('pointercancel', endDrag);

  syncCountLabels();
  drawPreview();
}

function buildStartPanel() {
  if (GEN && previewBase) showSetupScreen();
  else showSeedScreen();
}

/* =========================================================
   主更新
========================================================= */
function update(dt) {
  if (weaponNoticeTimer > 0) {
    weaponNoticeTimer -= dt;
    if (weaponNoticeTimer <= 0) {
      const el = document.getElementById('weaponWarn');
      if (el) el.className = '';
    }
  }
  if (!G.started || G.over) return;
  if (worldWater && worldWater.material.uniforms) {
    worldWater.material.uniforms.uTime.value += dt;
  }
  updateClouds(dt);
  for (const t of windTurbines) t.rotor.rotation.z += t.speed * dt;
  updateRailTrains(dt);

  if (G.crashing) { updateCrash(dt); return; }
  if (G.missileCooldown > 0) G.missileCooldown = Math.max(0, G.missileCooldown - dt);
  updatePLRecharge(dt);

  /* 加力（左Shift）：平滑升降，供速度 / 尾焰 / 引擎声共用 */
  G.boost += ((keys.boost ? 1 : 0) - G.boost) * (1 - Math.exp(-9 * dt));

  /* 关车推力（长按 Space）：平滑升降，供减速（curSpeed）与低头下坠共用 */
  G.thrust += ((keys.engineCut ? 0 : 1) - G.thrust) *
              (1 - Math.exp(-(keys.engineCut ? CUT_SPOOL_DN : CUT_SPOOL_UP) * dt));

  /* 受击无敌帧与红屏衰减 */
  if (G.invuln > 0) G.invuln -= dt;
  if (G.hitFlash > 0) G.hitFlash = Math.max(0, G.hitFlash - dt * 2.2);

  const rollIn  = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
  const pitchIn = (keys.up   ? 1 : 0) - (keys.down  ? 1 : 0);

  /* 姿态 */
  plane.rotateZ(rollIn * CFG.rollRate * dt);
  plane.rotateX(pitchIn * CFG.pitchRate * dt);
  plane.rotateY(rollIn * CFG.yawRate * dt);

  if (rollIn === 0) {
    const rightV = new THREE.Vector3(1, 0, 0).applyQuaternion(plane.quaternion);
    const rollAngle = Math.atan2(rightV.y, Math.hypot(rightV.x, rightV.z));
    plane.rotateZ(-rollAngle * 1.8 * dt);
  }

  /* 关车下坠：推力丧失越多机头越快下沉，收敛约 -30° 下滑角（可按 W 对抗拉起） */
  if (G.thrust < 0.999 && getForward().y > CUT_SINK_MAX) {
    plane.rotateX(-CUT_SINK_RATE * (1 - G.thrust) * dt);
  }

  /* 前进（加力时提速） */
  const forward = getForward().clone();
  plane.position.addScaledVector(forward, curSpeed() * dt);

  /* 升限 */
  if (plane.position.y > CFG.ceil) {
    plane.position.y = CFG.ceil;
    plane.rotateX(-1.8 * dt);
  }

  /* 方形软边界：与 8800×8800 地形同形，斜向飞行不再被内切圆提前挡住。 */
  const edgeDist = Math.max(Math.abs(plane.position.x), Math.abs(plane.position.z));
  const warnStart = CFG.mapHalf - 620;
  const atEdge = edgeDist > warnStart;
  if (edgeWarnEl) edgeWarnEl.classList.toggle('show', atEdge);
  if (atEdge && edgeDist > 1) {
    const cd = Math.hypot(plane.position.x, plane.position.z) || 1;
    const cx = -plane.position.x / cd, cz = -plane.position.z / cd;
    const fwdH = new THREE.Vector3(forward.x, 0, forward.z).normalize();
    const dot = fwdH.x * cx + fwdH.z * cz;
    const crossY = fwdH.z * cx - fwdH.x * cz;
    const turn = Math.atan2(crossY, dot);
    const urgency = smoothstep(warnStart, CFG.mapHalf, edgeDist);
    plane.rotateY(turn * (0.85 + urgency * 1.75) * dt);
    const overX = Math.abs(plane.position.x) > CFG.mapHalf;
    const overZ = Math.abs(plane.position.z) > CFG.mapHalf;
    if (overX) plane.position.x = Math.sign(plane.position.x) * CFG.mapHalf;
    if (overZ) plane.position.z = Math.sign(plane.position.z) * CFG.mapHalf;
    if (overX || overZ) {
      const push = (10 + urgency * 46) * dt;
      plane.position.x += cx * push;
      plane.position.z += cz * push;
    }
  }
  updateSunShadow(false);

  /* 碰撞检测 */
  checkPlaneCollision();
  if (G.crashing) { updateEffects(dt); updateCamera(dt); updateHUD(); return; }

  /* 尾焰（加力时向后拉长、更亮、偏白；长按 Space 关闭发动机时熄火） */
  const flame = plane.userData.flame;
  if (flame) {
    if (keys.engineCut) {
      flame.visible = false;
    } else {
      flame.visible = true;
      const bs = G.boost;
      const sw = (0.85 + Math.random() * 0.42) * (1 + bs * 0.3);   // 宽度
      const sh = sw * (0.85 + Math.random() * 0.55);               // 高度
      const kz = sw * (1 + bs * 1.9);                              // 长度（scale.y 对应世界 Z 向）
      flame.scale.set(sw, kz, sh);
      const anchorZ = plane.userData.flameAnchorZ;
      const baseLength = plane.userData.flameBaseLength;
      flame.position.z = (Number.isFinite(anchorZ) ? anchorZ : 5.95) +
                          (Number.isFinite(baseLength) ? baseLength : 2.8) * 0.5 * kz;
      flame.material.opacity = Math.min(1, 0.45 + Math.random() * 0.45 + bs * 0.4);
      flame.material.color.setRGB(0.5 + bs * 0.42, 0.88 + bs * 0.08, 1);
    }
  }

  /* 引擎音（加力时更响、更低沉、更震撼；长按 Space 关闭发动机则静音） */
  const engInt = 0.5 + (keys.up ? 0.18 : 0) - (keys.down ? 0.16 : 0);
  if (keys.engineCut) {
    if (!G.engCut) { G.engCut = true; Sound.silenceEngine(); }
  } else {
    G.engCut = false;
    Sound.setEngine(Math.max(0.25, Math.min(1, engInt)), G.boost);
  }

  /* 开火 */
  if (G.fireTimer > 0) G.fireTimer -= dt;
  if (keys.fire && G.fireTimer <= 0) {
    fireBullet();
    G.fireTimer = CFG.fireCD;
  }

  /* 子弹 */
  updateBullets(dt);
  updatePlayerMissiles(dt);

  /* 敌方单位（防空机枪 / 导弹阵地 / 敌机 / 弹幕） */
  updateAAA(dt);
  updateSAM(dt);
  updateEnemies(dt);
  updateWingmen(dt);
  updateThreats(dt);

  /* 炸弹 */
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    b.age += dt;
    b.vel.y -= CFG.gravity * dt;
    b.mesh.position.addScaledVector(b.vel, dt);

    const dir = b.vel.clone().normalize();
    b.mesh.lookAt(b.mesh.position.clone().add(dir));

    b.trail -= dt;
    if (b.trail <= 0 && b.age > 0.12) {
      b.trail = 0.055;
      spawnSmoke(b.mesh.position.clone(), 1.9, false);
    }

    const bgh = bombSurfaceY(b.mesh.position.x, b.mesh.position.z);
    if (b.mesh.position.y <= bgh) {
      b.mesh.position.y = bgh;
      onBombImpact(b.mesh.position.clone());
      scene.remove(b.mesh);
      bombs.splice(i, 1);
      continue;
    }
    if (b.age > 18) {
      scene.remove(b.mesh);
      bombs.splice(i, 1);
    }
  }

  /* 特效 */
  updateEffects(dt);

  /* 视角锁定 / 相机 / 瞄准 */
  updateLock(dt);
  updateCamera(dt);
  updateAim();
  updateGunAim();
  updateHUD();
}

/* =========================================================
   初始化
========================================================= */
function init() {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.sortObjects = true;
  renderer.outputEncoding = THREE.LinearEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.toneMappingExposure = 1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xa9c0c7, 11000, 22000);
  camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 1, 20000);
  clock = new THREE.Clock();

  worldHemi = new THREE.HemisphereLight(0xc7dde8, 0x414b38, 0.58);
  scene.add(worldHemi);
  worldSun = new THREE.DirectionalLight(0xffdb9f, 1.02);
  worldSun.position.copy(SHADOW_SUN_OFFSET);
  worldSun.castShadow = true;
  worldSun.shadow.mapSize.set(2048, 2048);
  worldSun.shadow.camera.left = -620;
  worldSun.shadow.camera.right = 620;
  worldSun.shadow.camera.top = 620;
  worldSun.shadow.camera.bottom = -620;
  worldSun.shadow.camera.near = 50;
  worldSun.shadow.camera.far = 4200;
  worldSun.shadow.bias = -0.00045;
  worldSun.shadow.camera.updateProjectionMatrix();
  scene.add(worldSun);
  scene.add(worldSun.target);
  worldFill = new THREE.DirectionalLight(0x789fc2, 0.12);
  worldFill.position.set(-900, 620, -780);
  scene.add(worldFill);

  createSky();
  currentSeed = randomSeedStr();     // 先进入种子界面，确认后才生成完整世界

  BOMB_PROTO = makeBombProto();

  plane = createSelectedAircraft();
  scene.add(plane);
  plane.visible = false;

  /* 投弹落点图标 —— 红色、与地面平行（机炮准星同款元素拍平），由 updateAim 定位 */
  bombMark = new THREE.Group();
  const aimMat = new THREE.MeshBasicMaterial({
    color: 0xff4433, transparent: true, opacity: 0.8,
    side: THREE.DoubleSide, depthWrite: false
  });
  const markRing = new THREE.Mesh(new THREE.RingGeometry(0.72, 0.86, 28), aimMat);
  markRing.rotation.x = -Math.PI / 2;                  // 圆环拍平贴地
  bombMark.add(markRing);
  const markBarH = new THREE.BoxGeometry(0.6, 0.05, 0.085);
  const markBarV = new THREE.BoxGeometry(0.085, 0.05, 0.6);
  [-1, 1].forEach(s => {
    const bh = new THREE.Mesh(markBarH, aimMat);
    bh.position.x = s * 1.25;
    bombMark.add(bh);
    const bv = new THREE.Mesh(markBarV, aimMat);
    bv.position.z = s * 1.25;
    bombMark.add(bv);
  });
  bombMark.add(new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 0.15), aimMat));
  bombMark.traverse(o => { o.renderOrder = 999; });
  bombMark.userData.mat = aimMat;
  bombMark.visible = false;
  scene.add(bombMark);

  /* 机炮准星：按住左键扫射时显示在弹着点 */
  gunReticle = new THREE.Group();
  const gunMat = new THREE.MeshBasicMaterial({
    color: 0xffcc44, transparent: true, opacity: 0.8,
    side: THREE.DoubleSide, depthTest: false, depthWrite: false
  });
  gunReticle.add(new THREE.Mesh(new THREE.RingGeometry(0.72, 0.86, 28), gunMat));
  const gunBarH = new THREE.BoxGeometry(0.6, 0.085, 0.06);
  const gunBarV = new THREE.BoxGeometry(0.085, 0.6, 0.06);
  [-1, 1].forEach(s => {
    const bh = new THREE.Mesh(gunBarH, gunMat);
    bh.position.x = s * 1.25;
    gunReticle.add(bh);
    const bv = new THREE.Mesh(gunBarV, gunMat);
    bv.position.y = s * 1.25;
    gunReticle.add(bv);
  });
  gunReticle.add(new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.06), gunMat));
  gunReticle.traverse(o => { o.renderOrder = 1000; });
  gunReticle.userData.mat = gunMat;
  gunReticle.visible = false;
  scene.add(gunReticle);

  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

  bindKeyboardMouse();

  buildStartPanel();

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
  });

  animate();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  resizeAircraftPreview();
}

/* =========================================================
   主循环
========================================================= */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
  updateAircraftPreview(dt);
}

/* =========================================================
   启动
========================================================= */
if (typeof THREE === 'undefined') {
  document.getElementById('panel').innerHTML =
    '<div class="result-view"><div class="result-card">' +
      '<div class="result-kicker">ENGINE OFFLINE</div>' +
      '<h1>飞行引擎未载入</h1>' +
      '<p>Three.js 没有加载成功。检查网络连接后刷新页面即可重试。</p>' +
    '</div></div>';
} else {
  init();
}

})();
</script>
