  worldWater = new THREE.Mesh(geo, mat);
  worldWater.position.y = WATER_LEVEL;
  worldWater.renderOrder = 1;
  scene.add(worldWater);
}

/* 河岸生态：浅滩碎石与芦苇，打散“水渠切进地形”的硬边。 */
function createShoreDetails() {
  const rng = mulberry32((GEN.seed ^ 0x5A0E) >>> 0);
  const reedSpots = [], rockSpots = [];
  for (const r of GEN.rivers) {
    for (let c = -WORLD_HALF + 100; c < WORLD_HALF - 100; c += 26) {
      if (rng() < 0.24) continue;
      const cen = r.base + Math.sin(c * r.f1 + r.ph1) * r.a1 +
        Math.sin(c * r.f2 + r.ph2) * r.a2;
      for (const side of [-1, 1]) {
        let edge = null;
        for (let d = r.w * 0.35; d < r.w * 4.8; d += 2.5) {
          const x = r.dir === 'z' ? cen + side * d : c;
          const z = r.dir === 'z' ? c : cen + side * d;
          const h = terrainHeight(x, z);
          if (h >= WATER_LEVEL + 0.35 && h < WATER_LEVEL + 8) {
            edge = { x, z, h };
            break;
          }
        }
        if (!edge || roadAt(GEN, edge.x, edge.z) > 0.03) continue;
        const n = 1 + (rng() * 3 | 0);
        for (let k = 0; k < n; k++) {
          const x = edge.x + (rng() - 0.5) * 7;
          const z = edge.z + (rng() - 0.5) * 7;
          const h = terrainHeight(x, z);
          if (h < WATER_LEVEL + 0.15 || roadAt(GEN, x, z) > 0.03) continue;
          reedSpots.push({ x, z, h, s: 0.55 + rng() * 0.85 });
        }
        if (rng() < 0.2) {
          rockSpots.push({
            x: edge.x + (rng() - 0.5) * 5, z: edge.z + (rng() - 0.5) * 5,
            h: edge.h, s: 2.0 + rng() * 5.0, rot: rng() * 6.2832
          });
        }
      }
    }
  }
  if (reedSpots.length) {
    const geo = new THREE.ConeGeometry(0.42, 2.4, 4);
    geo.translate(0, 1.15, 0);
    const mat = new THREE.MeshLambertMaterial({ color: 0x476b39 });
    const mesh = new THREE.InstancedMesh(geo, mat, reedSpots.length);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < reedSpots.length; i++) {
      const p = reedSpots[i];
      dummy.position.set(p.x, p.h - 0.08, p.z);
      dummy.rotation.set(0, rng() * 6.2832, (rng() - 0.5) * 0.14);
      dummy.scale.set(p.s, p.s * (0.8 + rng() * 0.5), p.s);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = false;
    scene.add(mesh);
    worldScenery.push(mesh);
  }
  if (rockSpots.length) {
    const geo = new THREE.IcosahedronGeometry(1, 0);
    const mat = new THREE.MeshLambertMaterial({ color: 0x7f8179 });
    const mesh = new THREE.InstancedMesh(geo, mat, rockSpots.length);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < rockSpots.length; i++) {
      const p = rockSpots[i];
      dummy.position.set(p.x, p.h + p.s * 0.2, p.z);
      dummy.rotation.set(rng() * 0.4, p.rot, rng() * 0.35);
      dummy.scale.set(p.s, p.s * 0.55, p.s * 0.8);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
    worldScenery.push(mesh);
  }
}

function createSky() {
  const geo = new THREE.SphereGeometry(15000, 32, 20);
  const sunDir = new THREE.Vector3(0.55, 0.48, 0.38).normalize();
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      topColor:    { value: new THREE.Color(0x245e96) },
      midColor:    { value: new THREE.Color(0x6da6c7) },
      bottomColor: { value: new THREE.Color(0xb6ced2) },
      sunDir:      { value: sunDir },
      sunColor:    { value: new THREE.Color(0xffe0a4) }
    },
    vertexShader: `
      varying vec3 vPos;
      void main(){ vPos = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor;
      uniform vec3 sunDir; uniform vec3 sunColor;
      varying vec3 vPos;
      void main(){
        float h = vPos.y;
        vec3 c = mix(bottomColor, midColor, smoothstep(-0.08, 0.30, h));
        c = mix(c, topColor, smoothstep(0.26, 0.82, h));
        float sd = max(dot(vPos, normalize(sunDir)), 0.0);
        c += sunColor * pow(sd, 760.0) * 1.25;
        c += sunColor * pow(sd, 18.0) * 0.045;
        gl_FragColor = vec4(c, 1.0); }`
  });
  worldSky = new THREE.Mesh(geo, mat);
  scene.add(worldSky);
}

let cloudAssets = null;
const worldClouds = [];
function createClouds() {
  if (!cloudAssets) {
    const geo = new THREE.SphereGeometry(1, 10, 7);
    const position = geo.attributes.position;
    const colors = new Float32Array(position.count * 3);
    for (let i = 0; i < position.count; i++) {
      const shade = 0.66 + 0.34 * smoothstep(-0.82, 0.72, position.getY(i));
      colors[i * 3] = shade;
      colors[i * 3 + 1] = shade * 1.01;
      colors[i * 3 + 2] = shade * 1.035;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    cloudAssets = {
      geo,
      mat: new THREE.MeshBasicMaterial({
        color: 0xf1f6f7, transparent: true, opacity: 0.62,
        vertexColors: true,
        depthWrite: false, depthTest: true
      })
    };
  }
  const rng = mulberry32((GEN.seed ^ 0xC10D) >>> 0);
  const CLOUD_COUNT = 180;
  const dummy = new THREE.Object3D();
  for (let i = 0; i < CLOUD_COUNT; i++) {
    const cl = new THREE.Group();
    const lowBand = i % 5 === 0;
    const n = 12 + (rng() * 8 | 0);
    const puffs = new THREE.InstancedMesh(cloudAssets.geo, cloudAssets.mat, n);
    puffs.frustumCulled = false;
    puffs.renderOrder = 3;
    const span = 170 + rng() * 230;
    const depth = 100 + rng() * 145;
    const relief = lowBand ? 42 + rng() * 50 : 86 + rng() * 110;
    for (let j = 0; j < n; j++) {
      const t = n === 1 ? 0 : j / (n - 1) - 0.5;
      const tier = j % 3;
      const layerY = (tier - 1) * relief * 0.22;
      dummy.position.set(
        t * span * 1.18 + (rng() - 0.5) * span * 0.18,
        layerY + (rng() - 0.5) * relief * 0.42,
        (rng() - 0.5) * depth + Math.sin(j * 1.9 + i) * depth * 0.12
      );
      dummy.rotation.set(0, rng() * 6.2832, 0);
      dummy.scale.set(
        span * (0.19 + rng() * 0.14),
        relief * (0.56 + rng() * 0.50),
        depth * (0.31 + rng() * 0.31)
      );
      dummy.updateMatrix();
      puffs.setMatrixAt(j, dummy.matrix);
    }
    puffs.instanceMatrix.needsUpdate = true;
    cl.add(puffs);
    cl.position.set(
      (rng() - 0.5) * 10000,
      lowBand ? 240 + rng() * 220 : 430 + rng() * 800,
      (rng() - 0.5) * 10000
    );
    cl.userData.drift = 4.5 + rng() * 7.5;
    cl.renderOrder = 3;
    scene.add(cl);
    worldClouds.push(cl);
  }
}

function updateClouds(dt) {
  for (const cloud of worldClouds) {
    cloud.position.x += cloud.userData.drift * dt;
    if (cloud.position.x > 10300) cloud.position.x -= 20600;
  }
}

function applyLightingPreset(mode) {
  if (!renderer) return;
  const key = LIGHT_PRESETS[mode] ? mode : 'war';
  const p = LIGHT_PRESETS[key];
  const prevTone = renderer.toneMapping;

  renderer.toneMapping = p.toneMapping;
  renderer.toneMappingExposure = p.exposure;
  renderer.outputEncoding = p.outputEncoding;
  renderer.domElement.style.filter = p.filter;
  renderer.shadowMap.enabled = p.shadows;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;

  if (gradeEl) gradeEl.className = p.grade;
  if (scene && scene.fog) {
    scene.fog.color.setHex(p.fog);
    scene.fog.near = p.fogNear;
    scene.fog.far = p.fogFar;
  }

  if (worldHemi) {
    worldHemi.color.setHex(p.hemiSky);
    worldHemi.groundColor.setHex(p.hemiGround);
    worldHemi.intensity = p.hemiI;
  }
  if (worldSun) {
    worldSun.color.setHex(p.sun);
    worldSun.intensity = p.sunI;
    worldSun.castShadow = p.shadows;
    worldSun.shadow.mapSize.set(p.shadowMap, p.shadowMap);
    worldSun.shadow.camera.left = -p.shadowCam;
    worldSun.shadow.camera.right = p.shadowCam;
    worldSun.shadow.camera.top = p.shadowCam;
    worldSun.shadow.camera.bottom = -p.shadowCam;
    worldSun.shadow.camera.near = 40;
    worldSun.shadow.camera.far = 3200;
    worldSun.shadow.bias = -0.00022;
    worldSun.shadow.normalBias = 0.32;
    worldSun.shadow.camera.updateProjectionMatrix();
    SHADOW_SUN_OFFSET.set(p.shadowOffset[0], p.shadowOffset[1], p.shadowOffset[2]);
  }
  if (worldFill) {
    worldFill.color.setHex(p.fill);
    worldFill.intensity = p.fillI;
  }

  if (worldSky && worldSky.material && worldSky.material.uniforms) {
    const u = worldSky.material.uniforms;
    u.topColor.value.setHex(p.skyTop);
    u.midColor.value.setHex(p.skyMid);
    u.bottomColor.value.setHex(p.skyBottom);
    u.sunColor.value.setHex(p.sunColor);
    u.sunDir.value.set(p.sunDir[0], p.sunDir[1], p.sunDir[2]).normalize();
  }
  if (worldWater && worldWater.material && worldWater.material.uniforms) {
    const wu = worldWater.material.uniforms;
    wu.fogColor.value.setHex(p.fog);
    wu.fogNear.value = p.fogNear * 0.72;
    wu.fogFar.value = p.fogFar;
  }
  if (cloudAssets) {
    cloudAssets.mat.transparent = true;
    cloudAssets.mat.depthWrite = false;
    cloudAssets.mat.color.setHex(p.cloud);
    cloudAssets.mat.opacity = key === 'war' ? 0.74 : 0.62;
    cloudAssets.mat.needsUpdate = true;
  }
  if (aoGroup) aoGroup.visible = !!p.contactShadows;
  if (vegAssets) vegAssets.shadowMat.opacity = p.contactShadows ? 0.48 : 0;

  if (scene && prevTone !== p.toneMapping) {
    scene.traverse(o => {
      if (!o.isMesh) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) if (m) m.needsUpdate = true;
    });
  }
  G.lightMode = key;
  updateSunShadow(true);
}

let vegAssets = null;
const worldTrees = [];

function ensureVegAssets() {
  if (vegAssets) return;
  const trunkGeo = new THREE.CylinderGeometry(1, 1.28, 1, 5);
  trunkGeo.translate(0, 0.5, 0);
  const leafGeo = new THREE.ConeGeometry(1, 1, 8);
  leafGeo.translate(0, 0.5, 0);
  const tallGeo = new THREE.ConeGeometry(0.62, 1, 6);
  tallGeo.translate(0, 0.5, 0);
  const broadGeo = new THREE.IcosahedronGeometry(1, 1);
  const bushGeo = new THREE.IcosahedronGeometry(1, 0);
  bushGeo.translate(0, 0.72, 0);
  const makePlantTuft = (blades, height, spread) => {
    const positions = [], colors = [];
    for (let i = 0; i < blades; i++) {
      const angle = i * Math.PI * 2 / blades + i * 0.37;
      const radialX = Math.cos(angle), radialZ = Math.sin(angle);
      const sideX = -radialZ * spread, sideZ = radialX * spread;
      const lean = spread * (0.35 + (i % 3) * 0.18);
      const bladeHeight = height * (0.72 + (i % 4) * 0.09);
      positions.push(
        -sideX, 0, -sideZ,
        sideX, 0, sideZ,
        radialX * lean, bladeHeight, radialZ * lean
      );
      colors.push(
        0.58, 0.66, 0.50,
        0.58, 0.66, 0.50,
        0.92, 0.98, 0.82
      );
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    return geo;
  };
  const grassGeo = makePlantTuft(4, 1.08, 0.24);
  const fernGeo = makePlantTuft(6, 0.88, 0.38);
  const flowerGeo = new THREE.ConeGeometry(0.18, 1, 5, 1, true);
  flowerGeo.translate(0, 0.5, 0);
  const shadowGeo = new THREE.PlaneGeometry(2, 2);
  shadowGeo.rotateX(-Math.PI / 2);
  vegAssets = {
    trunkGeo, leafGeo, tallGeo, broadGeo, bushGeo, grassGeo, fernGeo, flowerGeo, shadowGeo,
    trunkMat: new THREE.MeshLambertMaterial({ color: 0x594532 }),
    leafMat: new THREE.MeshLambertMaterial({ color: 0x315c3b }),
    leafMat2: new THREE.MeshLambertMaterial({ color: 0x456e43 }),
    broadMat: new THREE.MeshLambertMaterial({ color: 0x5c8147 }),
    tallMat: new THREE.MeshLambertMaterial({ color: 0x294f3d }),
    bushMat: new THREE.MeshLambertMaterial({ color: 0x3c622f }),
    hedgeMat: new THREE.MeshLambertMaterial({ color: 0x355a2f }),
    grassMat: new THREE.MeshLambertMaterial({
      color: 0x5c7e38, vertexColors: true, side: THREE.DoubleSide
    }),
    fernMat: new THREE.MeshLambertMaterial({
      color: 0x426c33, vertexColors: true, side: THREE.DoubleSide
    }),
    flowerMat: new THREE.MeshLambertMaterial({
      color: 0xd0b64e, side: THREE.DoubleSide
    }),
    shadowMat: new THREE.MeshBasicMaterial({
      map: getSoftShadowTexture(), color: 0x34463b,
      transparent: true, opacity: 0.48,
      depthWrite: false, polygonOffset: true,
      polygonOffsetFactor: -1, polygonOffsetUnits: -1
    })
  };
}

/* 多树种实例化：树干、树冠和接地暗斑都分别合并成一次 draw call。 */
function addTreeCluster(spots, random, scope) {
  ensureVegAssets();
  const group = new THREE.Group();
  const buckets = { pine: [], pine2: [], broad: [], tall: [] };
  for (const p of spots) {
    let kind = p.style;
    if (!kind) {
      const r = random ? random() : ((p.x * 0.013 + p.z * 0.017) % 1 + 1) % 1;
      kind = r < 0.43 ? 'pine' : r < 0.66 ? 'pine2' : r < 0.9 ? 'broad' : 'tall';
    }
    if (!buckets[kind]) kind = 'pine';
    buckets[kind].push(p);
  }
  const styles = {
    pine:  { geo: vegAssets.leafGeo,  mat: vegAssets.leafMat  },
    pine2: { geo: vegAssets.leafGeo,  mat: vegAssets.leafMat2 },
    broad: { geo: vegAssets.broadGeo, mat: vegAssets.broadMat },
    tall:  { geo: vegAssets.tallGeo,  mat: vegAssets.tallMat  }
  };
  const dummy = new THREE.Object3D();
  const all = [];
  for (const kind of Object.keys(buckets)) {
    const list = buckets[kind];
    if (!list.length) continue;
    const st = styles[kind];
    const trunks = new THREE.InstancedMesh(vegAssets.trunkGeo, vegAssets.trunkMat, list.length);
    const crowns = new THREE.InstancedMesh(st.geo, st.mat, list.length);
    trunks.frustumCulled = crowns.frustumCulled = false;
    trunks.castShadow = crowns.castShadow = true;
    trunks.receiveShadow = crowns.receiveShadow = true;
    for (let i = 0; i < list.length; i++) {
      const p = list[i];
      const s = p.s || 1;
      const trunkH = (kind === 'tall' ? 7 : kind === 'broad' ? 5.4 : 6.2) * s;
      const crownH = (kind === 'tall' ? 13 : kind === 'broad' ? 7.4 : 10.5) * s;
      const crownR = (kind === 'tall' ? 2.2 : kind === 'broad' ? 4.7 : 3.4) * s;
      dummy.position.set(p.x, p.h, p.z);
      dummy.rotation.set(0, p.rot || (p.x + p.z) * 0.07, 0);
      dummy.scale.set(0.42 * s, trunkH, 0.42 * s);
      dummy.updateMatrix();
      trunks.setMatrixAt(i, dummy.matrix);
      dummy.position.set(p.x, p.h + trunkH * (kind === 'broad' ? 0.72 : 0.45), p.z);
      dummy.scale.set(crownR, crownH, crownR);
      dummy.updateMatrix();
      crowns.setMatrixAt(i, dummy.matrix);
      const trunkMat = new THREE.Matrix4();
      const crownMat = new THREE.Matrix4();
      trunks.getMatrixAt(i, trunkMat);
      crowns.getMatrixAt(i, crownMat);
      const rec = {
        kind: 'tree', scope: scope || 'world',
        x: p.x, z: p.z, y0: p.h, y1: p.h + trunkH + crownH,
        hitR: Math.max(1.5, crownR * 0.62), gridR: Math.max(2, crownR),
        hp: 2, dead: false, score: 0,
        trunkMesh: trunks, crownMesh: crowns, shadowMesh: null,
        ti: i, si: all.length, trunkMat, crownMat, shadowMat: null,
        trunkH, leafColor: st.mat.color.getHex()
      };
      p._treeRec = rec;
      all.push(p);
    }
    trunks.instanceMatrix.needsUpdate = true;
    crowns.instanceMatrix.needsUpdate = true;
    group.add(trunks, crowns);
  }
  if (all.length) {
    const shadows = new THREE.InstancedMesh(vegAssets.shadowGeo, vegAssets.shadowMat, all.length);
    shadows.frustumCulled = false;
    shadows.renderOrder = 2;
    for (let i = 0; i < all.length; i++) {
      const p = all[i], s = p.s || 1;
      dummy.position.set(p.x + 1.6 * s, p.h + 0.16, p.z + 2.4 * s);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(3.1 * s, 1, 2.1 * s);
      dummy.updateMatrix();
      shadows.setMatrixAt(i, dummy.matrix);
    }
    shadows.instanceMatrix.needsUpdate = true;
    group.add(shadows);
    for (let i = 0; i < all.length; i++) {
      const rec = all[i]._treeRec;
      if (!rec) continue;
      const sm = new THREE.Matrix4();
      shadows.getMatrixAt(i, sm);
      rec.shadowMesh = shadows;
      rec.shadowMat = sm;
      treeTargets.push(rec);
      addPropTarget(rec);
    }
  }
  return group;
}

function removeTreeTargetsByScope(scope) {
  for (let i = treeTargets.length - 1; i >= 0; i--) {
    const t = treeTargets[i];
    if (t.scope !== scope) continue;
    removePropTarget(t);
    treeTargets.splice(i, 1);
  }
}

function createVegetation() {
  ensureVegAssets();
  const COUNT = 32000;
  const rng = mulberry32((GEN.seed ^ 0x7E33) >>> 0);
  const spots = [];
  let tries = 0;
  while (spots.length < COUNT && tries < COUNT * 16) {
    tries++;
    const x = (rng() * 2 - 1) * (WORLD_HALF - 150);
    const z = (rng() * 2 - 1) * (WORLD_HALF - 150);
    const h = terrainHeight(x, z);
    if (h < WATER_LEVEL + 3.5 || h > 330) continue;
    let inCity = false;
    for (const ct of GEN.cities) {
      if (Math.abs(x - ct.x) < ct.rx * 1.2 && Math.abs(z - ct.z) < ct.rz * 1.2) { inCity = true; break; }
    }
    if (inCity || insideVillage(x, z, 1.18) || insideFarmstead(x, z, 1.7) ||
        insideField(x, z, 1.12) || railNear(GEN, x, z, 22)) continue;
    if (roadAt(GEN, x, z) > 0.05) continue;
    const f = fbm(x * 0.00035, z * 0.00035, GEN.seed ^ 0xF0A5, 2);
    if (rng() > 0.22 + 1.12 * f) continue;
    const roll = rng();
    spots.push({
      x, z, h,
      s: 0.72 + rng() * 0.9,
      rot: rng() * Math.PI * 2,
      style: roll < 0.42 ? 'pine' : roll < 0.66 ? 'pine2' : roll < 0.9 ? 'broad' : 'tall'
    });
  }
  /* 牧野中的树丛 / 防风林，比全图均匀撒点更像真实植被群落。 */
  for (let gi = 0, added = 0; gi < 340 && added < 260; gi++) {
    const gx = (rng() * 2 - 1) * (WORLD_HALF - 500);
    const gz = (rng() * 2 - 1) * (WORLD_HALF - 500);
    const gh = terrainHeight(gx, gz);
    if (gh < WATER_LEVEL + 3.5 || gh > 360 || roadAt(GEN, gx, gz) > 0.03 ||
        insideVillage(gx, gz, 1.2) || insideFarmstead(gx, gz, 1.7) ||
        insideField(gx, gz, 1.15)) continue;
    let inCity = false;
    for (const ct of GEN.cities) {
      if (Math.hypot((gx - ct.x) / ct.rx, (gz - ct.z) / ct.rz) < 1.25) inCity = true;
    }
    if (inCity) continue;
    const count = 12 + (rng() * 19 | 0);
    const gr = 70 + rng() * 125;
    for (let k = 0; k < count; k++) {
      const a = rng() * 6.2832, rr = Math.sqrt(rng()) * gr;
      const x = gx + Math.cos(a) * rr, z = gz + Math.sin(a) * rr;
      const h = terrainHeight(x, z);
      if (h < WATER_LEVEL + 3 || roadAt(GEN, x, z) > 0.04 ||
          insideVillage(x, z, 1.1) || insideField(x, z, 1.08) ||
          insideFarmstead(x, z, 1.45) || railNear(GEN, x, z, 22)) continue;
      const roll = rng();
      spots.push({
        x, z, h, s: 0.62 + rng() * 0.95,
        rot: rng() * 6.2832,
        style: roll < 0.42 ? 'pine' : roll < 0.68 ? 'pine2' : roll < 0.92 ? 'broad' : 'tall'
      });
    }
    added++;
  }
  const treeGroup = addTreeCluster(spots);
  scene.add(treeGroup);
  worldTrees.push(treeGroup);

  /* 灌木：在低频噪声形成的灌丛带里加密，避免全图均匀撒点。 */
  const BCOUNT = 60000;
  const bushes = new THREE.InstancedMesh(vegAssets.bushGeo, vegAssets.bushMat, BCOUNT);
  bushes.frustumCulled = false;
  let bp = 0, bt = 0;
  const dummy = new THREE.Object3D();
  while (bp < BCOUNT && bt < BCOUNT * 12) {
    bt++;
    const x = (rng() * 2 - 1) * (WORLD_HALF - 120);
    const z = (rng() * 2 - 1) * (WORLD_HALF - 120);
    const h = terrainHeight(x, z);
    if (h < WATER_LEVEL + 2.5 || h > 430) continue;
    let inCity = false;
    for (const ct of GEN.cities) {
      if (Math.hypot((x - ct.x) / ct.rx, (z - ct.z) / ct.rz) < 1.0) { inCity = true; break; }
    }
    if (inCity || roadAt(GEN, x, z) > 0.03 || insideFarmstead(x, z, 1.55) ||
        insideField(x, z, 1.0) || railNear(GEN, x, z, 20)) continue;
    const f2 = fbm(x * 0.0012, z * 0.0012, (GEN.seed ^ 0x51B7) >>> 0, 2);
    if (rng() > 0.58 + 0.92 * f2) continue;
    const s = 0.7 + rng() * 1.75;
    dummy.position.set(x, h - 0.22, z);
    dummy.rotation.set(0, rng() * 6.2832, 0);
    dummy.scale.set(s * (0.82 + rng() * 0.42), s * (0.55 + rng() * 0.45), s * (0.82 + rng() * 0.42));
    dummy.updateMatrix();
    bushes.setMatrixAt(bp++, dummy.matrix);
  }
  bushes.count = bp;
  bushes.instanceMatrix.needsUpdate = true;
  scene.add(bushes);
  worldTrees.push(bushes);

  /* 田边树篱：缩短间距并加大重叠，让“珠子串”变成连续绿篱。 */
  const hedge = new THREE.InstancedMesh(vegAssets.bushGeo, vegAssets.hedgeMat, 70000);
  hedge.frustumCulled = false;
  let hp = 0;
  for (const f of GEN.fields) {
    if (hp >= 69960) break;
    if (f.kind === 'pasture' || f.kind === 'orchard') continue;
    for (let ei = 0; ei < f.poly.length && hp < 69960; ei++) {
      const a = f.poly[ei], b = f.poly[(ei + 1) % f.poly.length];
      const aw = fieldLocalToWorld(f, a[0], a[1]);
      const bw = fieldLocalToWorld(f, b[0], b[1]);
      const dx = bw[0] - aw[0], dz = bw[1] - aw[1];
      const len = Math.hypot(dx, dz);
      if (len < 2) continue;
      const nx = -dz / len, nz = dx / len;
      const n = Math.ceil(len / 4.4);
      for (let q = 0; q < n && hp < 69960; q++) {
        if (ei === f.gateEdge && Math.abs(q / n - 0.5) < 0.12) continue;
        const t = (q + 0.5) / n;
        let px = aw[0] + dx * t, pz = aw[1] + dz * t;
        const sgn = nx * (px - f.x) + nz * (pz - f.z) >= 0 ? 1 : -1;
        px += nx * sgn * 1.5 + (rng() - 0.5) * 0.55;
        pz += nz * sgn * 1.5 + (rng() - 0.5) * 0.55;
        if (px < -WORLD_HALF + 60 || px > WORLD_HALF - 60 ||
            pz < -WORLD_HALF + 60 || pz > WORLD_HALF - 60) continue;
        const h = terrainHeight(px, pz);
        if (h < WATER_LEVEL + 2.5 || roadAt(GEN, px, pz) > 0.04) continue;
        const ss = 1.25 + rng() * 0.7;
        dummy.position.set(px, h - 0.25, pz);
        dummy.rotation.set(0, Math.atan2(-dz, dx), 0);
        dummy.scale.set(ss * 1.7, ss * (0.82 + rng() * 0.35), ss * 1.15);
        dummy.updateMatrix();
        hedge.setMatrixAt(hp++, dummy.matrix);
      }
    }
  }
  hedge.count = hp;
  hedge.instanceMatrix.needsUpdate = true;
  scene.add(hedge);
  worldTrees.push(hedge);
}

/* =========================================================
   空间哈希
========================================================= */
/* =========================================================
   乡村 / 道路 / 农田 / 树林（场景表现）
======================================================== */
const worldScenery = [];
const ROAD_SHOULDER = 17, ROAD_ASPHALT = 10.5;

function pushRoadRibbon(dst, pts, halfW, lift, rgb, tint, offset) {
  const base = dst.pos.length / 3;
  const widthAt = typeof halfW === 'function' ? halfW : () => halfW;
  const offsetAt = typeof offset === 'function' ? offset : () => offset || 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b.x - a.x, dz = b.z - a.z;
    const dl = Math.hypot(dx, dz) || 1;
    dx /= dl; dz /= dl;
    const hw = widthAt(i, p);
    const shift = offsetAt(i, p);
    const nx = -dz * hw, nz = dx * hw;
    const ox = -dz * shift, oz = dx * shift;
    const y = p.h + lift;
    dst.pos.push(p.x + nx + ox, y, p.z + nz + oz,
                 p.x - nx + ox, y, p.z - nz + oz);
    const r = rgb[0] * tint, g = rgb[1] * tint, bl = rgb[2] * tint;
    dst.col.push(r, g, bl, r, g, bl);
    if (i > 0) {
      const q = base + (i - 1) * 2;
      dst.idx.push(q, q + 1, q + 2, q + 1, q + 3, q + 2);
    }
  }
}

/* 路段使用 GEN 已审计的桥涵设计标高；桥跨水平、引桥单调爬升。 */
function roadDeckHeights(pts) {
  return pts.map(p => Number.isFinite(p.designH)
    ? p.designH
    : terrainHeight(p.x, p.z));
}

/* 竖直方柱（桥墩）：直接并入带顶点色的批次 */
function pushBoxGeo(dst, x, z, y0, y1, sx, sz, rgb) {
  const hx = sx * 0.5, hz = sz * 0.5;
  const base = dst.pos.length / 3;
  const v = [
    x - hx, y0, z - hz, x + hx, y0, z - hz, x + hx, y0, z + hz, x - hx, y0, z + hz,
    x - hx, y1, z - hz, x + hx, y1, z - hz, x + hx, y1, z + hz, x - hx, y1, z + hz
  ];
  for (let i = 0; i < 8; i++) {
    dst.pos.push(v[i * 3], v[i * 3 + 1], v[i * 3 + 2]);
    dst.col.push(rgb[0], rgb[1], rgb[2]);
  }
  const f = [0, 1, 2, 0, 2, 3,   4, 6, 5, 4, 7, 6,   0, 4, 5, 0, 5, 1,
             1, 5, 6, 1, 6, 2,   2, 6, 7, 2, 7, 3,   3, 7, 4, 3, 4, 0];
  for (const i of f) dst.idx.push(base + i);
}

/* 竖直侧壁（路基护坡 / 桥栏）：沿折线生成一条带上下沿的竖带 */
function pushWallRibbon(dst, pts, off, topOff, botOff, rgb, tint) {
  const base = dst.pos.length / 3;
  const t = tint === undefined ? 1 : tint;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b.x - a.x, dz = b.z - a.z;
    const dl = Math.hypot(dx, dz) || 1;
    dx /= dl; dz /= dl;
    const nx = -dz * off, nz = dx * off;
    const y = p.h;
    dst.pos.push(p.x + nx, y + topOff, p.z + nz);
    dst.pos.push(p.x + nx, y + botOff, p.z + nz);
    dst.col.push(rgb[0] * t, rgb[1] * t, rgb[2] * t,
                 rgb[0] * t * 0.78, rgb[1] * t * 0.78, rgb[2] * t * 0.78);
    if (i > 0) {
      const q = base + (i - 1) * 2;
      dst.idx.push(q, q + 1, q + 2, q + 1, q + 3, q + 2);
    }
  }
}

function pushQuad(dst, p0, p1, p2, p3, rgb, bid) {
  const base = dst.pos.length / 3;
  const ps = [p0, p1, p2, p3];
  for (let i = 0; i < 4; i++) {
    dst.pos.push(ps[i][0], ps[i][1], ps[i][2]);
    dst.col.push(rgb[0], rgb[1], rgb[2]);
    if (dst.bid) dst.bid.push(bid === undefined ? -1 : bid);
  }
  dst.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
}

/* ---- 细节层：窗户 / 门 / 街道 / 屋顶设备，全部塞进一个合并网格（一次 draw call） ---- */
let detBatch = null;      // { pos, col, idx }
let detMesh = null;       // 已生成的合并网格
let detGroup = null;      // 生成后挂到场景的 Group，重建时整体移除
let aoBatch = null;       // 建筑 / 村落接地软阴影（独立透明批次）
let aoGroup = null;
let softShadowTex = null;
let detDeathTex = null;
let fieldPatternTex = null;
const DET_ID_CAP = 1024;

function getSoftShadowTexture() {
  if (softShadowTex) return softShadowTex;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 64;
  const c = canvas.getContext('2d');
  const g = c.createRadialGradient ? c.createRadialGradient(32, 32, 3, 32, 32, 32) : null;
  if (g && g.addColorStop) {
    g.addColorStop(0, 'rgba(255,255,255,0.78)');
    g.addColorStop(0.48, 'rgba(255,255,255,0.43)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
  } else {
    c.fillStyle = 'rgba(255,255,255,0.35)';
  }
  c.fillRect(0, 0, 64, 64);
  softShadowTex = new THREE.CanvasTexture(canvas);
  softShadowTex.needsUpdate = true;
  return softShadowTex;
}

function getFieldPatternTexture() {
  if (fieldPatternTex) return fieldPatternTex;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = 64;
  const c = cvs.getContext('2d');
  const img = c.createImageData(64, 64);
  for (let y = 0; y < 64; y++) {
    for (let x = 0; x < 64; x++) {
      const row = 0.82 + 0.16 * Math.pow(0.5 + 0.5 * Math.cos(x / 64 * 6.2832), 0.7);
      const grain = ((x * 37 + y * 19 + x * y * 3) % 17) / 17 * 0.025 - 0.0125;
      const v = Math.max(0, Math.min(1, row + grain));
      const o = (y * 64 + x) * 4;
      img.data[o] = img.data[o + 1] = img.data[o + 2] = v * 255;
      img.data[o + 3] = 255;
    }
  }
  c.putImageData(img, 0, 0);
  fieldPatternTex = new THREE.CanvasTexture(cvs);
  fieldPatternTex.wrapS = fieldPatternTex.wrapT = THREE.RepeatWrapping;
  if (renderer && renderer.capabilities && renderer.capabilities.getMaxAnisotropy) {
    fieldPatternTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  }
  fieldPatternTex.needsUpdate = true;
  return fieldPatternTex;
}

function detReset() {
  detBatch = { pos: [], col: [], idx: [], bid: [] };
  aoBatch = { pos: [], uv: [], idx: [] };
  detDeathTex = null;
  if (detGroup) { scene.remove(detGroup); detGroup = null; }
  if (aoGroup) { scene.remove(aoGroup); aoGroup = null; }
  detMesh = null;
}

function detLocal(x, z, rot, lx, lz) {
  const c = Math.cos(rot), s = Math.sin(rot);
  return [x + lx * c + lz * s, z - lx * s + lz * c];
}

/* 建筑立面上的四边形贴片。side: 0=+x 1=-x 2=+z 3=-z
   u0/u1 是沿立面的局部坐标，y0/y1 是高度；out 是相对半宽的外偏移 */
function detFace(x, z, rot, side, half, out, u0, u1, y0, y1, rgb, bid) {
  if (!detBatch) return;
  const off = half + out;
  let a, b;
  if (side === 0 || side === 1) {
    const lx = side === 0 ? off : -off;
    a = detLocal(x, z, rot, lx, u0); b = detLocal(x, z, rot, lx, u1);
  } else {
    const lz = side === 2 ? off : -off;
    a = detLocal(x, z, rot, u0, lz); b = detLocal(x, z, rot, u1, lz);
  }
  pushQuad(detBatch, [a[0], y0, a[1]], [b[0], y0, b[1]], [b[0], y1, b[1]], [a[0], y1, a[1]], rgb, bid);
}

/* 带旋转的方盒（屋顶设备 / 烟囱）；返回顶点已并入 detBatch */
function detBoxY(x, y0, y1, z, sx, sz, rot, rgb, bid) {
  if (!detBatch) return;
  const hx = sx * 0.5, hz = sz * 0.5;
  const c = Math.cos(rot), s = Math.sin(rot);
  const cs = [[-hx, -hz], [hx, -hz], [hx, hz], [-hx, hz]];
  const P = cs.map(([lx, lz]) => detLocal(x, z, rot, lx, lz));
  const base = detBatch.pos.length / 3;
  for (let i = 0; i < 4; i++) {
    detBatch.pos.push(P[i][0], y0, P[i][1]);
    detBatch.col.push(rgb[0] * 0.8, rgb[1] * 0.8, rgb[2] * 0.8);
    detBatch.bid.push(bid === undefined ? -1 : bid);
  }
  for (let i = 0; i < 4; i++) {
    detBatch.pos.push(P[i][0], y1, P[i][1]);
    detBatch.col.push(rgb[0], rgb[1], rgb[2]);
    detBatch.bid.push(bid === undefined ? -1 : bid);
  }
  const f = [0, 1, 2, 0, 2, 3, 4, 6, 5, 4, 7, 6, 0, 4, 5, 0, 5, 1,
             1, 5, 6, 1, 6, 2, 2, 6, 7, 2, 7, 3, 3, 7, 4, 3, 4, 0];
  for (const i of f) detBatch.idx.push(base + i);
}

/* 贴地条带（街道 / 人行道）。ex/ez/rx/rz 给椭圆裁剪，省略则整段都画 */
function detStreet(x0, z0, x1, z1, halfW, lift, rgb, ex, ez, erx, erz) {
  if (!detBatch) return;
  const dx = x1 - x0, dz = z1 - z0;
  const len = Math.hypot(dx, dz);
  if (len < 1) return;
  const n = Math.max(1, Math.ceil(len / 18));
  const px = (-dz / len) * halfW, pz = (dx / len) * halfW;
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n;
    const ax = x0 + dx * t0, az = z0 + dz * t0;
    const bx = x0 + dx * t1, bz = z0 + dz * t1;
    if (erx !== undefined) {
      const mx = (ax + bx) * 0.5, mz = (az + bz) * 0.5;
      if (Math.hypot((mx - ex) / erx, (mz - ez) / erz) > 1.0) continue;
    }
    const ya = terrainHeight(ax, az) + lift, yb = terrainHeight(bx, bz) + lift;
    pushQuad(detBatch,
      [ax - px, ya, az - pz], [ax + px, ya, az + pz],
      [bx + px, yb, bz + pz], [bx - px, yb, bz - pz], rgb);
  }
}

/* 贴地矩形（城市街区地坪）。按网格细分以贴合地形，椭圆外裁剪 */
function detGroundRect(cx, cz, hx, hz, lift, rgb, ex, ez, erx, erz) {
  if (!detBatch) return;
  const N = 4;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const x0 = cx - hx + (2 * hx * i) / N, x1 = cx - hx + (2 * hx * (i + 1)) / N;
      const z0 = cz - hz + (2 * hz * j) / N, z1 = cz - hz + (2 * hz * (j + 1)) / N;
      const mx = (x0 + x1) * 0.5, mz = (z0 + z1) * 0.5;
      if (erx !== undefined && Math.hypot((mx - ex) / erx, (mz - ez) / erz) > 1.0) continue;
      pushQuad(detBatch,
        [x0, terrainHeight(x0, z0) + lift, z0], [x0, terrainHeight(x0, z1) + lift, z1],
        [x1, terrainHeight(x1, z1) + lift, z1], [x1, terrainHeight(x1, z0) + lift, z0], rgb);
    }
  }
}

/* 接地阴影：用贴地暗斑替代开销很大的实时阴影，给建筑一个“落地”的重量感。 */
function aoFootprint(x, z, hx, hz, rot, strength) {
  if (!aoBatch) return;
  const ox = 4.5, oz = 7.5;                      // 主光从西北侧来，影子往东南偏
  const c = Math.cos(rot), s = Math.sin(rot);
  const pts = [
    [-hx + ox, -hz + oz], [hx + ox, -hz + oz],
    [hx + ox, hz + oz], [-hx + ox, hz + oz]
  ].map(([lx, lz]) => {
    const wx = x + lx * c + lz * s;
    const wz = z - lx * s + lz * c;
    return [wx, terrainHeight(wx, wz) + 0.48, wz];
  });
  const base = aoBatch.pos.length / 3;
  for (const p of pts) aoBatch.pos.push(p[0], p[1], p[2]);
  aoBatch.uv.push(0, 0, 0, 1, 1, 1, 1, 0);
  aoBatch.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
}

function detBuild() {  if (!detBatch || !detBatch.pos.length) { detBatch = null; return; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(detBatch.pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(detBatch.col, 3));
  g.setAttribute('aBid', new THREE.Float32BufferAttribute(detBatch.bid, 1));
  g.setIndex(detBatch.idx);
  g.computeVertexNormals();          // 不算法线 → Lambert 无光照 → 整层全黑
  g.computeBoundingSphere();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  const deathData = new Uint8Array(DET_ID_CAP * 4);
  detDeathTex = new THREE.DataTexture(deathData, DET_ID_CAP, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
  detDeathTex.minFilter = THREE.NearestFilter;
  detDeathTex.magFilter = THREE.NearestFilter;
  detDeathTex.needsUpdate = true;
  mat.onBeforeCompile = shader => {
    shader.uniforms.uDeadTex = { value: detDeathTex };
    shader.vertexShader =
      'attribute float aBid;\nvarying float vBid;\n' +
      shader.vertexShader.replace('#include <begin_vertex>',
        '#include <begin_vertex>\nvBid = aBid;');
    shader.fragmentShader =
      'uniform sampler2D uDeadTex;\nvarying float vBid;\n' +
      shader.fragmentShader.replace('void main() {',
        'void main() {\n  if (vBid > -0.5) {\n' +
        '    float dd = texture2D(uDeadTex, vec2((vBid + 0.5) / ' + DET_ID_CAP + '.0, 0.5)).r;\n' +
        '    if (dd > 0.5) discard;\n  }');
  };
  mat.customProgramCacheKey = () => 'jet-detail-death-v2';
  detMesh = new THREE.Mesh(g, mat);
  detGroup = new THREE.Group();
  detGroup.add(detMesh);
  scene.add(detGroup);
  detBatch = null;

  if (aoBatch && aoBatch.idx.length) {
    const ag = new THREE.BufferGeometry();
    ag.setAttribute('position', new THREE.Float32BufferAttribute(aoBatch.pos, 3));
    ag.setAttribute('uv', new THREE.Float32BufferAttribute(aoBatch.uv, 2));
    ag.setIndex(aoBatch.idx);
    ag.computeVertexNormals();
    const am = new THREE.MeshBasicMaterial({
      map: getSoftShadowTexture(), color: 0x34463b,
      transparent: true, opacity: 0.43,
      depthWrite: false, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3
    });
    const amesh = new THREE.Mesh(ag, am);
    amesh.renderOrder = 3;
    aoGroup = new THREE.Group();
    aoGroup.add(amesh);
    aoGroup.visible = !!(LIGHT_PRESETS[G.lightMode] && LIGHT_PRESETS[G.lightMode].contactShadows);
    scene.add(aoGroup);
  }
  aoBatch = null;
}

/* 开顶箱梁公路桥：沥青就是桥面顶面，结构只存在于车道外缘和梁底以下。 */
function pushRoadBridgeStructure(dst, span) {
  if (!span || span.length < 2) return;
  const deckY = span[0].h;
  const bodyBottom = deckY - 1.55;
  for (let i = 1; i < span.length; i++) {
    const a = span[i - 1], b = span[i];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    if (len < 0.1) continue;
    const ux = dx / len, uz = dz / len;
    const nx = -uz, nz = ux;
    const ang = Math.atan2(-dz, dx);
    const mx = (a.x + b.x) * 0.5, mz = (a.z + b.z) * 0.5;
    const axl = a.x + nx * ROAD_SHOULDER, azl = a.z + nz * ROAD_SHOULDER;
    const axr = a.x - nx * ROAD_SHOULDER, azr = a.z - nz * ROAD_SHOULDER;
    const bxl = b.x + nx * ROAD_SHOULDER, bzl = b.z + nz * ROAD_SHOULDER;
    const bxr = b.x - nx * ROAD_SHOULDER, bzr = b.z - nz * ROAD_SHOULDER;
    /* 只有底面和侧壁，没有横跨车道的桥面板顶面。 */
    pushQuad(dst,
      [axr, bodyBottom, azr], [axl, bodyBottom, azl],
      [bxl, bodyBottom, bzl], [bxr, bodyBottom, bzr], [0.33, 0.34, 0.33]);
    for (const side of [-1, 1]) {
      const off = side * (ROAD_SHOULDER + 0.72);
      addRotBox(dst, mx + nx * off, mz + nz * off,
        deckY - 2.28, deckY - 0.10, len + 0.35, 0.86, ang, [0.47, 0.49, 0.48]);
      const poff = side * (ROAD_SHOULDER + 0.34);
      addRotBox(dst, mx + nx * poff, mz + nz * poff,
        deckY + 0.40, deckY + 1.12, len + 0.22, 0.28, ang, [0.70, 0.68, 0.61]);
      addRotBox(dst, mx + nx * poff, mz + nz * poff,
        deckY + 1.12, deckY + 1.26, len + 0.22, 0.20, ang, [0.27, 0.30, 0.29]);
      for (let sPos = 7; sPos < len - 4; sPos += 18) {
        addRotBox(dst, a.x + ux * sPos + nx * poff, a.z + uz * sPos + nz * poff,
          deckY + 0.38, deckY + 1.38, 0.24, 0.38, ang, [0.57, 0.56, 0.51]);
      }
    }
  }
  pushWallRibbon(dst, span, ROAD_SHOULDER, 0.30, -1.55, [0.52, 0.51, 0.47], 1);
  pushWallRibbon(dst, span, -ROAD_SHOULDER, 0.30, -1.55, [0.52, 0.51, 0.47], 1);

  for (const end of [span[0], span[span.length - 1]]) {
    const gh = rawHeight(GEN, end.x, end.z);
    const baseY = gh < WATER_LEVEL + 1 ? WATER_LEVEL - 3.5 : gh - 1.5;
    addRotBox(dst, end.x, end.z, baseY, deckY - 1.57,
      2.8, ROAD_SHOULDER * 2 + 1.2,
      Math.atan2(-(span[1].z - span[0].z), span[1].x - span[0].x), [0.57, 0.55, 0.50]);
  }
  let acc = 0, nextPier = 48;
  for (let i = 1; i < span.length; i++) {
    const a = span[i - 1], b = span[i];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    acc += len;
    if (acc < nextPier || i >= span.length - 1) continue;
    nextPier += 76;
    const p = b;
    const nx = -dz / (len || 1), nz = dx / (len || 1);
    const ang = Math.atan2(-dz, dx);
    const gh = rawHeight(GEN, p.x, p.z);
    const baseY = gh < WATER_LEVEL + 1 ? WATER_LEVEL - 4.0 : gh - 1.4;
    addRotBox(dst, p.x, p.z, deckY - 2.32, deckY - 1.58,
      2.5, ROAD_SHOULDER * 1.55, ang, [0.56, 0.54, 0.49]);
    for (const side of [-1, 1]) {
      addRotBox(dst, p.x + nx * side * ROAD_ASPHALT * 0.68,
        p.z + nz * side * ROAD_ASPHALT * 0.68,
        baseY, deckY - 2.34, 1.9, 1.8, ang, [0.49, 0.49, 0.46]);
    }
  }
}

function createRoads() {
  if (!GEN.roads.length) return;
  const S = { pos: [], col: [], idx: [] };   // 路基 / 护坡 / 桥墩 / 桥栏
  const A = { pos: [], col: [], idx: [] };   // 沥青面
  const D = { pos: [], col: [], idx: [] };   // 中线虚线 / 边线
  const DASH = [0.86, 0.84, 0.74];
  const pushRoadBanks = (dst, pts) => {
    let run = [];
    const flush = () => {
      if (run.length > 1) {
        pushWallRibbon(dst, run, ROAD_SHOULDER, 0.42, -4.5, [0.40, 0.35, 0.28], 1);
        pushWallRibbon(dst, run, -ROAD_SHOULDER, 0.42, -4.5, [0.40, 0.35, 0.28], 1);
      }
      run = [];
    };
    for (const p of pts) {
      if (p.bridge || p.cityLink) flush();
      else run.push(p);
    }
    flush();
  };
  for (let ri = 0; ri < GEN.roads.length; ri++) {
    const pts = GEN.roads[ri];
    if (pts.length < 2) continue;
    const ys = roadDeckHeights(pts);
    const dp = pts.map((p, i) => ({
      x: p.x, z: p.z, h: ys[i],
      asphaltHalf: p.asphaltHalf, shoulderHalf: p.shoulderHalf,
      cityLink: p.cityLink
    }));
    /* 桥段拉成直线跨径，避免河湾处宽路面自交，桥头再与原有弯道衔接。 */
    for (let i = 1; i < pts.length; i++) {
      if (pts[i - 1].bridge || !pts[i].bridge) continue;
      let e = i;
      while (e + 1 < pts.length && pts[e].bridge) e++;
      const a = dp[i], b = dp[e];
      for (let k = i + 1; k < e; k++) {
        const t = (k - i) / (e - i);
        dp[k].x = a.x + (b.x - a.x) * t;
        dp[k].z = a.z + (b.z - a.z) * t;
        dp[k].h = a.h + (b.h - a.h) * t;
      }
      i = e;
    }
    const tint = 0.86 + ((ri * 37) % 13) / 13 * 0.22;

    const asphaltAt = (i, p) => p.asphaltHalf || ROAD_ASPHALT;
    const shoulderAt = (i, p) => p.shoulderHalf || ROAD_SHOULDER;
    pushRoadRibbon(S, dp, shoulderAt, 0.42, [0.48, 0.45, 0.37], tint);
    pushRoadRibbon(A, dp, asphaltAt, 0.66, [0.25, 0.26, 0.27], tint);
    for (const s of [-1, 1]) {
      pushRoadRibbon(D, dp, 0.15, 0.72, [0.82, 0.79, 0.67], 1,
        (i, p) => s * ((p.asphaltHalf || ROAD_ASPHALT) - 0.75));
    }
    /* 两侧护坡只铺在路基段，桥下水道不能被一道假堤墙封住。 */
    pushRoadBanks(S, dp);

    /* 中线虚线：桥面与普通路段保持同一车道标线，不再在桥头中断。 */
    for (let i = 1; i < dp.length; i++) {
      const a = dp[i - 1], b = dp[i];
      const seg = Math.hypot(b.x - a.x, b.z - a.z);
      if (seg < 2) continue;
      const ux = (b.x - a.x) / seg, uz = (b.z - a.z) / seg;
      const nx = -uz, nz = ux;
      for (let s = 4; s + 5 < seg; s += 13) {
        const t0 = s / seg, t1 = (s + 5) / seg;
        const y0 = a.h + (b.h - a.h) * t0 + 0.80;
        const y1 = a.h + (b.h - a.h) * t1 + 0.80;
        const ax = a.x + (b.x - a.x) * t0, az = a.z + (b.z - a.z) * t0;
        const bx = a.x + (b.x - a.x) * t1, bz = a.z + (b.z - a.z) * t1;
        pushQuad(D,
          [ax - nx * 0.55, y0, az - nz * 0.55], [ax + nx * 0.55, y0, az + nz * 0.55],
          [bx + nx * 0.55, y1, bz + nz * 0.55], [bx - nx * 0.55, y1, bz - nz * 0.55], DASH);
      }
    }

    /* 使用开顶箱梁桥体：沥青是唯一桥面，结构顶面永远低于车道。 */
    let bs = -1;
    for (let i = 0; i <= pts.length; i++) {
      const isB = i < pts.length && pts[i].bridge;
      if (isB && bs < 0) bs = i;
      if (!isB && bs >= 0) {
        const span = dp.slice(bs, i);
        if (span.length > 1) pushRoadBridgeStructure(S, span);
        bs = -1;
      }
    }
  }
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  for (const d of [S, A, D]) {
    if (!d.idx.length) continue;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(d.pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(d.col, 3));
    geo.setIndex(d.idx);
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    scene.add(mesh);
    worldScenery.push(mesh);
  }
}

function getStationClockTexture() {
  if (stationClockTex) return stationClockTex;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = 192;
  const c = cvs.getContext('2d');
  c.fillStyle = '#eef1ec';
  c.beginPath();
  c.arc(96, 96, 88, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = '#263b43';
  c.lineWidth = 9;
  c.stroke();
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    c.lineWidth = i % 3 === 0 ? 7 : 4;
    c.beginPath();
    c.moveTo(96 + Math.sin(a) * 66, 96 - Math.cos(a) * 66);
    c.lineTo(96 + Math.sin(a) * 78, 96 - Math.cos(a) * 78);
    c.stroke();
  }
  c.lineWidth = 8;
  c.beginPath();
  c.moveTo(96, 96);
  c.lineTo(96 + Math.sin(1.75) * 43, 96 - Math.cos(1.75) * 43);
  c.moveTo(96, 96);
  c.lineTo(96 + Math.sin(4.25) * 54, 96 - Math.cos(4.25) * 54);
  c.stroke();
  stationClockTex = new THREE.CanvasTexture(cvs);
  stationClockTex.needsUpdate = true;
  return stationClockTex;
}

  scene.add(sign);
  worldScenery.push(sign);
  const signTarget = registerMeshTarget(sign, sp[0], sp[1],
    11.2, 1.2, y + 6.5, y + 11.4, 3, 8);

  const clockTex = getStationClockTexture();
  const clock = new THREE.Mesh(
    new THREE.PlaneGeometry(3.6, 3.6),

  const clockTarget = registerMeshTarget(clock, cp[0], cp[1],
    2.2, 1.0, y + 10.3, y + 14.2, 3, 8);

  lamp.position.y = 6.4;
  sig.add(lamp);
  sig.position.set(sigP[0], y, sigP[1]);
  scene.add(sig);
  worldScenery.push(sig);
  registerMeshTarget(sig, sigP[0], sigP[1], 0.9, 0.9, y, y + 7.0, 2, 5);

function railSample(train, s) {
  const line = train.line, dist = train.dist;
  s = Math.max(0, Math.min(train.total, s));
  let lo = 0, hi = dist.length - 1;
  while (lo + 1 < hi) {
    const md = (lo + hi) >> 1;
    if (dist[md] <= s) lo = md; else hi = md;
  }
  const a = line[lo], b = line[Math.min(line.length - 1, hi)];
  const seg = Math.max(0.001, dist[hi] - dist[lo]);
  const t = Math.max(0, Math.min(1, (s - dist[lo]) / seg));
  const dx = b.x - a.x, dz = b.z - a.z;
  const dl = Math.hypot(dx, dz) || 1;
  return {
    x: a.x + dx * t, z: a.z + dz * t,
    h: a.h + (b.h - a.h) * t,
    ux: dx / dl, uz: dz / dl
  };
}

function updateRailTrainPose(train) {
  for (let i = 0; i < train.cars.length; i++) {
    const p = railSample(train, train.s - i * train.gap);
    const car = train.cars[i];
    car.position.set(p.x, p.h + 0.02, p.z);
    car.rotation.y = Math.atan2(-p.ux, -p.uz);
    car.rotation.z = 0;
  }
}

function updateRailTrains(dt) {
  for (const tr of railTrains) {
    const tail = tr.gap * (tr.cars.length - 1) + 1;
    if (tr.wait > 0) {
      tr.wait -= dt;
      continue;
    }
    tr.s += tr.dir * tr.speed * dt;
    if (tr.s >= tr.total - 2) {
      tr.s = tr.total - 2;
      tr.dir = -1;
      tr.wait = 3.8;
    } else if (tr.s <= tail) {
      tr.s = tail;
      tr.dir = 1;
      tr.wait = 3.8;
    }
    updateRailTrainPose(tr);
  }
}

/* 连续铁路桥：水平梁面 + 两侧主梁 + 栏杆 + 成对桥墩，避免逐段盒子形成阶梯。 */
function pushRailBridgeSpan(dst, span) {
  if (!span || span.length < 2) return;
  const deckY = span[0].h;
  const HALF = 4.7;
  const DECK_TOP = 0.04;
  const DECK_BOT = -1.52;
  for (let i = 1; i < span.length; i++) {
    const a = span[i - 1], b = span[i];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    if (len < 0.1) continue;
    const nx = -dz / len * HALF, nz = dx / len * HALF;
    const at = deckY + DECK_TOP, ab = deckY + DECK_BOT;
    pushQuad(dst,
      [a.x + nx, at, a.z + nz], [a.x - nx, at, a.z - nz],
      [b.x - nx, at, b.z - nz], [b.x + nx, at, b.z + nz], [0.38, 0.37, 0.33]);
    pushQuad(dst,
      [a.x - nx, ab, a.z - nz], [a.x + nx, ab, a.z + nz],
      [b.x + nx, ab, b.z + nz], [b.x - nx, ab, b.z - nz], [0.29, 0.30, 0.29]);
  }
  for (let i = 1; i < span.length; i++) {
    const a = span[i - 1], b = span[i];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    if (len < 0.1) continue;
    const nx = -dz / len, nz = dx / len;
    const ang = Math.atan2(-dz, dx);
    const mx = (a.x + b.x) * 0.5, mz = (a.z + b.z) * 0.5;
    for (const side of [-1, 1]) {
      const ox = nx * side * (HALF - 0.16);
      const oz = nz * side * (HALF - 0.16);
      /* 钢梁腹板：连续箱梁的可见外轮廓。 */
      addRotBox(dst, mx + ox, mz + oz, deckY - 1.72, deckY + 0.42,
        len + 0.18, 0.48, ang, [0.38, 0.42, 0.43]);
      /* 实体护栏与顶部扶手，避免桥面只剩一条细带。 */
      addRotBox(dst, mx + ox, mz + oz, deckY + 0.43, deckY + 1.00,
        len + 0.12, 0.24, ang, [0.55, 0.54, 0.49]);
      addRotBox(dst, mx + ox, mz + oz, deckY + 1.00, deckY + 1.10,
        len + 0.12, 0.30, ang, [0.29, 0.32, 0.32]);
    }
  }
  for (let i = 1; i + 1 < span.length; i += 2) {
    const a = span[i], b = span[i + 1];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    if (len < 0.1) continue;
    const nx = -dz / len, nz = dx / len;
    const ang = Math.atan2(-dz, dx);
    for (const side of [-1, 1]) {
      addRotBox(dst, a.x + nx * side * (HALF - 0.24),
        a.z + nz * side * (HALF - 0.24),
        deckY - 1.62, deckY + 1.02, 0.28, 0.56, ang, [0.30, 0.34, 0.34]);
    }
  }

  /* 桥台始终在梁底以下，桥墩顶部同样留出净空。 */
  for (const end of [span[0], span[span.length - 1]]) {
    const gh = rawHeight(GEN, end.x, end.z);
    const baseY = gh < WATER_LEVEL + 1 ? WATER_LEVEL - 4.0 : gh - 2.0;
    addRotBox(dst, end.x, end.z, baseY,
      deckY + DECK_BOT - 0.04, 2.6, HALF * 2 + 0.8,
      Math.atan2(-(span[1].z - span[0].z), span[1].x - span[0].x), [0.55, 0.54, 0.49]);
  }
  let acc = 0, nextPier = 42;
  for (let i = 1; i < span.length; i++) {
    const a = span[i - 1], b = span[i];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    acc += len;
    if (acc < nextPier || i >= span.length - 1) continue;
    nextPier += 76;
    const p = b;
    const gh = rawHeight(GEN, p.x, p.z);
    const baseY = gh < WATER_LEVEL + 1 ? WATER_LEVEL - 4.0 : gh - 1.3;
    const nx = -dz / (len || 1), nz = dx / (len || 1);
    const ang = Math.atan2(-dz, dx);
    const onRoad = [0, -3.2, 3.2].some(off =>
      roadAt(GEN, p.x + nx * off, p.z + nz * off) > 0.015);
    if (onRoad) continue;
    addRotBox(dst, p.x, p.z, deckY - 2.24, deckY + DECK_BOT - 0.04,
      2.5, HALF * 2 - 0.2, ang, [0.54, 0.53, 0.48]);
    for (const side of [-1, 1]) {
      addRotBox(dst, p.x + nx * side * 2.55, p.z + nz * side * 2.55,
        baseY, deckY - 2.26, 1.75, 1.65, ang, [0.50, 0.50, 0.47]);
    }
  }
}

function createRailways() {
  railTrains.length = 0;
  if (!GEN.railStations || !GEN.railStations.length) return;
  const TRACK = { pos: [], col: [], idx: [] };
  const SLEEPERS = [];
  const poleSpots = [];
  const wireLinks = [];

  for (const line of GEN.railways) {
    if (line.length < 2) continue;
    let lastPole = -1;
    for (let i = 0; i < line.length;) {
      if (!line[i].bridge) { i++; continue; }
      let e = i;
      while (e + 1 < line.length && line[e + 1].bridge) e++;
      pushRailBridgeSpan(TRACK, line.slice(i, e + 1));
      i = e + 1;
    }
    pushRoadRibbon(TRACK, line, 4.3, 0.10, [0.43, 0.39, 0.31], 1);
    for (const side of [-1, 1]) {
      pushRoadRibbon(TRACK, line, 0.13, 0.40, [0.26, 0.29, 0.30], 1, side * 0.86);
    }
    for (let i = 1; i < line.length; i++) {
      const a = line[i - 1], b = line[i];
      const dx = b.x - a.x, dz = b.z - a.z;
      const seg = Math.hypot(dx, dz);
      if (seg < 0.01) continue;
      for (let s = 0; s < seg; s += 4.2) {
        const t = s / seg;
        SLEEPERS.push({
          x: a.x + dx * t, z: a.z + dz * t,
          h: a.h + (b.h - a.h) * t + 0.17,
          yaw: Math.atan2(dx / seg, dz / seg)
        });
      }
      if ((i % 3) === 0) {
        const ux = dx / seg, uz = dz / seg;
        const nx = -uz, nz = ux;
        const px = a.x + nx * 4.0, pz = a.z + nz * 4.0;
        if (roadAt(GEN, px, pz) < 0.015) {
          const pi = poleSpots.length;
          poleSpots.push({
            x: px, z: pz, baseY: a.h, height: 7.8, armLen: 4.2,
            rot: Math.atan2(uz, ux) + Math.PI * 0.5,
            wireY: a.h + 5.70
          });
          if (lastPole >= 0) wireLinks.push({ a: lastPole, b: pi, sag: 0.18 });
          lastPole = pi;
        } else {
          lastPole = -1;
        }
      }
    }
  }

  /* 单城市地图也保留一段贯通站台的尽头线，车站不会孤零零地落在草地上。 */
  for (const st of GEN.railStations) {
    const hasMain = GEN.railways.some(line =>
      line.some(p => Math.hypot(p.x - st.x, p.z - st.z) < 12));
    if (hasMain) continue;
    const pts = [];
    for (let k = -5; k <= 5; k++) {
      const p = detLocal(st.x, st.z, st.rot, k * st.len * 0.1, 0);
      pts.push({ x: p[0], z: p[1], h: terrainHeight(p[0], p[1]) });
    }
    pushRoadRibbon(TRACK, pts, 4.3, 0.10, [0.43, 0.39, 0.31], 1);
    for (const side of [-1, 1]) {
      pushRoadRibbon(TRACK, pts, 0.13, 0.40, [0.26, 0.29, 0.30], 1, side * 0.86);
    }
    for (let k = 0; k < 10; k++) {
      const t = (k + 0.5) / 10;
      const x = pts[0].x + (pts[pts.length - 1].x - pts[0].x) * t;
      const z = pts[0].z + (pts[pts.length - 1].z - pts[0].z) * t;
      SLEEPERS.push({
        x, z, h: terrainHeight(x, z) + 0.17,
        yaw: Math.atan2(Math.cos(st.rot), -Math.sin(st.rot))
      });
    }
  }

  if (TRACK.idx.length) {
    const mesh = finishBatchMesh(TRACK);
    scene.add(mesh);
    worldScenery.push(mesh);
  }
  if (SLEEPERS.length) {
    const geo = new THREE.BoxGeometry(2.9, 0.14, 0.36);
    const mat = new THREE.MeshLambertMaterial({ color: 0x5c4631 });
    const mesh = new THREE.InstancedMesh(geo, mat, SLEEPERS.length);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < SLEEPERS.length; i++) {
      const p = SLEEPERS[i];
      dummy.position.set(p.x, p.h, p.z);
      dummy.rotation.set(0, p.yaw, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
    worldScenery.push(mesh);
  }
  buildSceneryPoles(poleSpots, wireLinks, 0x242b2c);

  for (const st of GEN.railStations) createRailStation(st);

  for (const line of GEN.railways) {
    if (line.length < 6) continue;
    const dist = [0];
    for (let i = 1; i < line.length; i++) {
      dist.push(dist[i - 1] + Math.hypot(line[i].x - line[i - 1].x, line[i].z - line[i - 1].z));
    }
    const total = dist[dist.length - 1];
    if (total < 260) continue;
    const cars = [];
    for (let i = 0; i < 4; i++) {
      const car = makeRailCar(i === 0);
      scene.add(car);
      worldScenery.push(car);
      cars.push(car);
    }
    const train = {
      line, dist, total, s: Math.min(total * 0.22, 500), dir: 1,
      speed: 23, baseSpeed: 23, disabled: false, wait: 0, cars, gap: 17, carTargets: []
    };
    for (let ci = 0; ci < cars.length; ci++) {
      const t = {
        kind: 'train', car: cars[ci], train, index: ci,
        x: cars[ci].position.x, z: cars[ci].position.z,
        y0: cars[ci].position.y, y1: cars[ci].position.y + 5.5,
        hp: ci === 0 ? 12 : 8, hpMax: ci === 0 ? 12 : 8,
        dead: false, score: ci === 0 ? 120 : 70,
        blastScale: ci === 0 ? 2.4 : 1.9,
        debrisColor: ci === 0 ? 0xd9d9cf : 0xcfd6d6
      };
      train.carTargets.push(t);
      trainTargets.push(t);
    }
    railTrains.push(train);
    updateRailTrainPose(train);
  }
}

/* 电线杆/接触网支柱统一做成实例化目标：单根可被机炮或炸弹摧毁，邻近导线同步断开。 */
function buildSceneryPoles(poleSpots, wireLinks, wireColor) {
  if (!poleSpots.length) return;
  const postMat = new THREE.MeshLambertMaterial({ color: 0x4d4637 });
  const armMat = new THREE.MeshLambertMaterial({ color: 0x39382f });
  const posts = new THREE.InstancedMesh(UNIT_BOX, postMat, poleSpots.length);
  const armList = poleSpots.filter(p => p.armLen);
  const arms = armList.length ? new THREE.InstancedMesh(UNIT_BOX, armMat, armList.length) : null;
  const dummy = new THREE.Object3D();
  let ai = 0;

  for (let i = 0; i < poleSpots.length; i++) {
    const p = poleSpots[i];
    dummy.position.set(p.x, p.baseY + p.height * 0.5, p.z);
    dummy.rotation.set(0, p.rot || 0, 0);
    dummy.scale.set(0.24, p.height, 0.24);
    dummy.updateMatrix();
    posts.setMatrixAt(i, dummy.matrix);
    p.kind = 'pole';
    p.y0 = p.baseY;
    p.y1 = p.baseY + p.height;
    p.hitR = 1.05;
    p.gridR = 1.4;
    p.hp = 1;
    p.dead = false;
    p.postMesh = posts;
    p.pi = i;
    p.postMat = dummy.matrix.clone();
    p.wires = [];
    if (p.armLen) {
      dummy.position.set(p.x, p.baseY + p.height - 1.05, p.z);
      dummy.rotation.set(0, p.rot || 0, 0);
      dummy.scale.set(p.armLen, 0.16, 0.18);
      dummy.updateMatrix();
      arms.setMatrixAt(ai, dummy.matrix);
      p.armMesh = arms;
      p.ai = ai++;
      p.armMat = dummy.matrix.clone();
    }
    poleTargets.push(p);
    addPropTarget(p);
  }
  posts.instanceMatrix.needsUpdate = true;
  posts.castShadow = true;
  scene.add(posts);
  worldScenery.push(posts);
  if (arms) {
    arms.instanceMatrix.needsUpdate = true;
    arms.castShadow = true;
    scene.add(arms);
    worldScenery.push(arms);
  }

  if (wireLinks.length) {
    const wp = [];
    const segments = [];
    for (const link of wireLinks) {
      const a = poleSpots[link.a], b = poleSpots[link.b];
      if (!a || !b) continue;
      const ay = a.wireY === undefined ? a.baseY + a.height * 0.98 : a.wireY;
      const by = b.wireY === undefined ? b.baseY + b.height * 0.98 : b.wireY;
      const mx = (a.x + b.x) * 0.5, mz = (a.z + b.z) * 0.5;
      const my = (ay + by) * 0.5 - (link.sag === undefined ? 0.25 : link.sag);
      const i0 = wp.length / 3;
      const p0 = [a.x, ay, a.z], p1 = [mx, my, mz], p2 = [mx, my, mz], p3 = [b.x, by, b.z];
      wp.push(...p0, ...p1, ...p2, ...p3);
      const seg = { i0, i1: i0 + 1, i2: i0 + 2, i3: i0 + 3, p0, p1, p2, p3, hidden: false, attr: null };
      a.wires.push(seg);
      b.wires.push(seg);
      segments.push(seg);
    }
    if (wp.length) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
      const attr = geo.attributes.position;
      for (const seg of segments) seg.attr = attr;
      const wires = new THREE.LineSegments(geo,
        new THREE.LineBasicMaterial({ color: wireColor || 0x252b29, transparent: true, opacity: 0.58 }));
      scene.add(wires);
      worldScenery.push(wires);
    }
  }
}

function createRoadsideInfrastructure() {
  ensureVegAssets();
  const rng = mulberry32((GEN.seed ^ 0x7A11) >>> 0);
  const poleSpots = [];
  const wireLinks = [];
  const treeSpots = [];
  for (let ri = 0; ri < GEN.roads.length; ri++) {
    const road = GEN.roads[ri];
    if (road.length < 8 || (road[0] && road[0].cityLink)) continue;
    const side = ri % 2 === 0 ? 1 : -1;
    let lastPole = -1;
    for (let i = 6; i < road.length - 6; i += 6) {
      const p = road[i];
      if (p.bridge) { lastPole = -1; continue; }
      const a = road[i - 1], b = road[i + 1];
      let ux = b.x - a.x, uz = b.z - a.z;
      const ul = Math.hypot(ux, uz) || 1;
      ux /= ul; uz /= ul;
      const nx = -uz * side, nz = ux * side;
      const px = p.x + nx * 24, pz = p.z + nz * 24;
      if (Math.abs(px) > WORLD_HALF - 80 || Math.abs(pz) > WORLD_HALF - 80) continue;
      const gy = terrainHeight(px, pz);
      if (gy < WATER_LEVEL + 3) continue;
      const ang = Math.atan2(-uz, ux);
      const pi = poleSpots.length;
      poleSpots.push({
        x: px, z: pz, baseY: gy, height: 10.2, armLen: 4.2,
        rot: ang + Math.PI * 0.5, wireY: gy + 10.0
      });
      if (lastPole >= 0) wireLinks.push({ a: lastPole, b: pi, sag: 1.25 });
      lastPole = pi;

      if ((i / 6) % 3 === 1) {
        const tx = p.x + nx * 35, tz = p.z + nz * 35;
        const th = terrainHeight(tx, tz);
        if (th >= WATER_LEVEL + 2 && !insideField(tx, tz, 1.02) &&
            !insideFarmstead(tx, tz, 1.35) && roadAt(GEN, tx, tz) < 0.03) {
          treeSpots.push({
            x: tx, z: tz, h: th, s: 0.62 + rng() * 0.52,
            rot: rng() * 6.2832,
            style: rng() < 0.68 ? 'broad' : 'pine2'
          });
        }
      }
    }
  }
  buildSceneryPoles(poleSpots, wireLinks, 0x252b29);
  if (treeSpots.length) {
    const trees = addTreeCluster(treeSpots);
    scene.add(trees);
    worldScenery.push(trees);
  }
}

/* 中尺度地标：山脊风机，给空旷区域提供方向和距离参照。 */
function createRuralLandmarks() {
  windTurbines.length = 0;
  const rng = mulberry32((GEN.seed ^ 0x71A2E) >>> 0);
  const towerMat = new THREE.MeshLambertMaterial({ color: 0xd3d6d0 });
  const bladeMat = new THREE.MeshLambertMaterial({ color: 0xe5e6df });
  const nacelleMat = new THREE.MeshLambertMaterial({ color: 0xaeb4b2 });
  let made = 0;
  for (let tries = 0; tries < 260 && made < 7; tries++) {
    const x = (rng() * 2 - 1) * (WORLD_HALF - 500);
    const z = (rng() * 2 - 1) * (WORLD_HALF - 500);
    const h = terrainHeight(x, z);
    if (h < 120 || h > 430) continue;
    if (Math.hypot(x - SPAWN_X, z - SPAWN_Z) < 900) continue;
    if (roadAt(GEN, x, z) > 0.025 || insideField(x, z, 1.08) ||
        insideFarmstead(x, z, 1.8) || insideVillage(x, z, 1.2)) continue;
    let inCity = false;
    for (const ct of GEN.cities) {
      if (Math.hypot((x - ct.x) / ct.rx, (z - ct.z) / ct.rz) < 1.25) { inCity = true; break; }
    }
    if (inCity) continue;
    const slope = Math.max(
      Math.abs(terrainHeight(x + 45, z) - terrainHeight(x - 45, z)),
      Math.abs(terrainHeight(x, z + 45) - terrainHeight(x, z - 45))
    );
    if (slope > 34) continue;

    const g = new THREE.Group();
    const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 2.6, 58, 8), towerMat);
    tower.position.y = 29;
    tower.castShadow = true;
    g.add(tower);
    const nacelle = new THREE.Mesh(new THREE.BoxGeometry(4.8, 2.6, 2.6), nacelleMat);
    nacelle.position.set(0, 59.2, 0.5);
    nacelle.castShadow = true;
    g.add(nacelle);
    const rotor = new THREE.Group();
    rotor.position.set(0, 59.2, -1.1);
    for (let k = 0; k < 3; k++) {
      const holder = new THREE.Group();
      holder.rotation.z = k * Math.PI * 2 / 3;
      const blade = new THREE.Mesh(new THREE.BoxGeometry(1.0, 18, 0.5), bladeMat);
      blade.position.y = 9;
      blade.castShadow = true;
      holder.add(blade);
      rotor.add(holder);
    }
    g.add(rotor);
    g.position.set(x, h, z);
    g.rotation.y = rng() * Math.PI * 2;
    scene.add(g);
    worldScenery.push(g);
    windTurbines.push({ rotor, speed: 0.38 + rng() * 0.38 });
    made++;
  }
}

let villageAssets = null;
let villageTreeGroup = null;
let farmDecorGroup = null;

function detGroundLocal(x, z, rot, cx, cz, hx, hz, lift, rgb) {
  if (!detBatch) return;
  const p0 = detLocal(x, z, rot, cx - hx, cz - hz);
  const p1 = detLocal(x, z, rot, cx - hx, cz + hz);
  const p2 = detLocal(x, z, rot, cx + hx, cz + hz);
  const p3 = detLocal(x, z, rot, cx + hx, cz - hz);
  pushQuad(detBatch,
    [p0[0], terrainHeight(p0[0], p0[1]) + lift, p0[1]],
    [p1[0], terrainHeight(p1[0], p1[1]) + lift, p1[1]],
    [p2[0], terrainHeight(p2[0], p2[1]) + lift, p2[1]],
    [p3[0], terrainHeight(p3[0], p3[1]) + lift, p3[1]], rgb);
}

function detFenceLine(x, z, rot, lx0, lz0, lx1, lz1, rgb, bid) {
  if (!detBatch) return;
  const a = detLocal(x, z, rot, lx0, lz0);
  const b = detLocal(x, z, rot, lx1, lz1);
  const dx = b[0] - a[0], dz = b[1] - a[1];
  const len = Math.hypot(dx, dz);
  if (len < 0.5) return;
  const ang = Math.atan2(-dz, dx);
  const n = Math.max(1, Math.ceil(len / 2.15));
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const px = a[0] + dx * t, pz = a[1] + dz * t;
    const gy = terrainHeight(px, pz);
    detBoxY(px, gy, gy + 1.28, pz, 0.22, 0.22, ang, [0.34, 0.27, 0.18], bid);
  }
  const mx = (a[0] + b[0]) * 0.5, mz = (a[1] + b[1]) * 0.5;
  const gy = terrainHeight(mx, mz);
  detBoxY(mx, gy + 0.62, gy + 0.78, mz, len, 0.13, ang, rgb || [0.42, 0.33, 0.21], bid);
  detBoxY(mx, gy + 1.02, gy + 1.16, mz, len, 0.13, ang, rgb || [0.42, 0.33, 0.21], bid);
}

function makeGableRoofGeo() {
  const g = new THREE.BufferGeometry();
  const v = [
    -0.5, 0, -0.5,  0.5, 0, -0.5,  0.5, 1, 0, -0.5, 1, 0,
    -0.5, 0, 0.5,   0.5, 0, 0.5
  ];
  const idx = [
    0, 2, 1, 0, 3, 2,
    3, 5, 2, 3, 4, 5,
    0, 1, 5, 0, 5, 4,
    0, 4, 3, 1, 2, 5
  ];
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function makeVillageHouse(x, z, y, w, h, d, rot, rng, barn, frontFace, variant) {
  const a = villageAssets;
  const wallMat = a.wallMats[(rng() * a.wallMats.length) | 0];
  const roofMat = a.roofMats[(rng() * a.roofMats.length) | 0];
  const detailId = buildings.length < DET_ID_CAP ? buildings.length : -1;
  const batch = { pos: [], col: [], idx: [] };
  const addPart = (px, pz, py, pw, ph, pd, mat) => {
    const c = mat.color;
    addRotBox(batch, px, pz, py, py + ph, pw, pd, rot, [c.r, c.g, c.b]);
  };
  addPart(x, z, y, w + 0.22, 0.48, d + 0.22, a.plinthMat);
  addPart(x, z, y + 0.42, w, h, d, wallMat);

  const roofH = barn ? 4.8 + rng() * 1.5 : variant === 'chapel' ? 4.7 : 2.8 + Math.min(2.1, w * 0.13);
  const gable = barn || variant === 'chapel' || rng() < 0.48;
  const roofC = roofMat.color;
  addRoofBatch(batch, x, z, y + h + 0.4, w * 1.16, d * 1.16, roofH, rot,
    [roofC.r, roofC.g, roofC.b], gable);

  if (variant === 'chapel') {
    const lp = detLocal(x, z, rot, -(w * 0.5 + 1.7), d * 0.12);
    addPart(lp[0], lp[1], y, 4.0, h + 5.4, 4.0, wallMat);
    addRoofBatch(batch, lp[0], lp[1], y + h + 5.4, 4.3, 4.3, 6.2, rot,
      [roofC.r, roofC.g, roofC.b], false);
    detFace(lp[0], lp[1], rot, frontFace, 2.0, 0.06, -0.7, 0.7,
      y + h + 1.1, y + h + 3.2, [0.72, 0.57, 0.32], detailId);
  } else if (!barn && rng() < 0.24) {
    const ex = w * 0.5 + 2.3;
    const ep = detLocal(x, z, rot, ex, -d * 0.08);
    const ew = 3.8 + rng() * 1.5;
    addPart(ep[0], ep[1], y + 0.35, ew, h * 0.68, d * 0.72, wallMat);
  }
  const mesh = finishBatchMesh(batch);
  scene.add(mesh);

  const baseW = variant === 'chapel' ? w + 7.5 : w;
  const baseD = d;
  const front = frontFace === 2 || frontFace === 3 ? frontFace : (rng() < 0.5 ? 2 : 3);
  const fs = front === 2 ? 1 : -1;
  const win = [0.20, 0.29, 0.34];
  const trim = [0.77, 0.69, 0.54];
  const halfFront = d * 0.5;

  /* 门、门框、窗框与窗格，全部朝向院子和村道。 */
  const dw = Math.min(1.65, w * 0.21);
  detFace(x, z, rot, front, halfFront, 0.065, -dw * 0.64, dw * 0.64,
    y + 0.45, y + 2.95, trim, detailId);
  detFace(x, z, rot, front, halfFront, 0.072, -dw * 0.5, dw * 0.5,
    y + 0.50, y + 2.83, [0.27, 0.18, 0.12], detailId);
  const frontOffsets = [-w * 0.29, w * 0.29];
  for (const u of frontOffsets) {
    detFace(x, z, rot, front, halfFront, 0.07, u - 0.85, u + 0.85,
      y + 1.65, y + 3.0, trim, detailId);
    detFace(x, z, rot, front, halfFront, 0.078, u - 0.68, u + 0.68,
      y + 1.79, y + 2.88, win, detailId);
    if (h > 6.4) {
      detFace(x, z, rot, front, halfFront, 0.07, u - 0.82, u + 0.82,
        y + 4.15, y + 5.35, trim, detailId);
      detFace(x, z, rot, front, halfFront, 0.078, u - 0.65, u + 0.65,
        y + 4.27, y + 5.23, win, detailId);
    }
  }
  for (const side of [0, 1]) {
    for (const u of [-d * 0.22, d * 0.22]) {
      detFace(x, z, rot, side, w * 0.5, 0.07, u - 0.62, u + 0.62,
        y + 1.72, y + 2.82, trim, detailId);
      detFace(x, z, rot, side, w * 0.5, 0.078, u - 0.48, u + 0.48,
        y + 1.84, y + 2.70, win, detailId);
    }
  }
  if (variant !== 'chapel') {
    detBoxY(x, y + h + roofH * 0.35, y + h + roofH + 1.25,
      z, 0.85, 0.85, rot, [0.38, 0.35, 0.32], detailId);
  }

  /* 前院：菜地、栅栏与门前小径。 */
  if (!barn) {
    const yardD = 5.2 + rng() * 2.2;
    const fenceZ = fs * (d * 0.5 + yardD);
    const fenceX = baseW * 0.5 + 2.2;
    const gate = 1.35;
    if (variant !== 'chapel') {
      detFenceLine(x, z, rot, -fenceX, fenceZ, -gate, fenceZ, [0.42, 0.32, 0.20], detailId);
      detFenceLine(x, z, rot, gate, fenceZ, fenceX, fenceZ, [0.42, 0.32, 0.20], detailId);
      detFenceLine(x, z, rot, -fenceX, fenceZ, -fenceX, fs * (d * 0.5 + 1.2), [0.42, 0.32, 0.20], detailId);
      detFenceLine(x, z, rot, fenceX, fenceZ, fenceX, fs * (d * 0.5 + 1.2), [0.42, 0.32, 0.20], detailId);
      detGroundLocal(x, z, rot, 0, fs * (d * 0.5 + yardD * 0.52),
        Math.max(2.2, w * 0.32), yardD * 0.33, 0.41,
        rng() < 0.45 ? [0.33, 0.42, 0.23] : [0.49, 0.39, 0.24]);
      const dp = detLocal(x, z, rot, 0, fs * (d * 0.5 + 1.1));
      const gp = detLocal(x, z, rot, 0, fenceZ + fs * 1.1);
      detStreet(dp[0], dp[1], gp[0], gp[1], 0.62, 0.43, [0.64, 0.58, 0.45]);
    }
  }
  aoFootprint(x, z, baseW * 0.58, baseD * 0.60, rot, barn ? 0.04 : 0.045);

  const b = {
    body: mesh, roof: null, x, z,
    detailId,
    y0: y,
    y1: y + h + roofH + 0.4,
    hw: (baseW * 1.14) / 2,
    hd: (d * 1.14) / 2,
    w: baseW, h: h + roofH, d,
    colorHex: wallMat.color.getHex(),
    gunHits: 0,
    dead: false,
    _qf: -1
  };
  buildings.push(b);
  addToHash(b);
}

function ensureVillageAssets() {
  if (villageAssets) return;
  const roofGeo = new THREE.ConeGeometry(0.7071, 1, 4);
  roofGeo.rotateY(Math.PI / 4);
  roofGeo.translate(0, 0.5, 0);
  villageAssets = {
    roofGeo, gableGeo: makeGableRoofGeo(),
    wellGeo: new THREE.CylinderGeometry(1.45, 1.65, 1.15, 10),
    hayGeo: new THREE.CylinderGeometry(1.5, 1.65, 2.6, 8),
    tankGeo: new THREE.CylinderGeometry(3.7, 4.1, 4.2, 10),
    tankCapGeo: new THREE.ConeGeometry(4.2, 2.0, 10),
    siloGeo: new THREE.CylinderGeometry(2.2, 2.5, 8.4, 10),
    siloCapGeo: new THREE.ConeGeometry(2.55, 2.2, 10),
    wallMats: [0xd8c8aa, 0xc9b89a, 0xc2a98c, 0xd3b996, 0xbda98d, 0xcfbda5]
      .map(c => new THREE.MeshLambertMaterial({ color: c })),
    roofMats: [0x85473b, 0x6f372f, 0x995344, 0x5c3b35, 0x7c4a3a]
      .map(c => new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide })),
    plinthMat: new THREE.MeshLambertMaterial({ color: 0x706b61 }),
    hayMat: new THREE.MeshLambertMaterial({ color: 0xc2a55f }),
    stoneMat: new THREE.MeshLambertMaterial({ color: 0x918d82 }),
    siloMat: new THREE.MeshLambertMaterial({ color: 0xb0aca2 })
  };
}

/* 村庄主街方向：对准最近那条路的端点，让公路顺着主街进村（房子也就不会压在路面上） */
function villageStreetRot(v) {
  let best = 1e9, bx = 0, bz = 0;
  for (const road of GEN.roads) {
    if (!road.length) continue;
    for (let e = 0; e < 2; e++) {
      const p = e ? road[road.length - 1] : road[0];
      const d = Math.hypot(p.x - v.x, p.z - v.z);
      if (d < best) { best = d; bx = p.x; bz = p.z; }
    }
  }
  if (best > v.r * 2.4) return v.rot;
  return Math.atan2(bz - v.z, bx - v.x);
}

/* 民居 / 谷仓：登记进 buildings + 空间哈希，可被机炮与炸弹摧毁（分数 +10，不计击毁数） */
function createVillageHouses() {
  removeTreeTargetsByScope('village');
  if (villageTreeGroup) {
    scene.remove(villageTreeGroup);
    villageTreeGroup = null;
  }
  villageTreeGroup = new THREE.Group();
  scene.add(villageTreeGroup);
  if (!GEN.villages.length) return;
  ensureVillageAssets();
  for (let vi = 0; vi < GEN.villages.length; vi++) {
    const v = GEN.villages[vi];
    const rng = mulberry32((((GEN.seed ^ 0x51A7) + vi * 9173) >>> 0));
    const vrot = villageStreetRot(v);
    const placed = [];
    const laneOff = v.r * 0.21;
    const treeSpots = [];

    const onVillageLane = (lx, lz) => {
      if (Math.abs(lz) < 7.2) return true;
      if (Math.abs(Math.abs(lz) - laneOff) < 4.8 && Math.abs(lx) < v.r * 0.64) return true;
      if (Math.abs(lz) < laneOff + 4 &&
          (Math.abs(lx - v.r * 0.38) < 3.6 || Math.abs(lx + v.r * 0.38) < 3.6)) return true;
      return false;
    };

    const addHouse = (lx, lz, w, h, d, barn, front, variant) => {
      const p = detLocal(v.x, v.z, vrot, lx, lz);
      const x = p[0], z = p[1];
      if (Math.hypot(x - v.x, z - v.z) > v.r * 1.12) return;
      if (onVillageLane(lx, lz)) return;
      const gh = terrainHeight(x, z);
      if (gh < WATER_LEVEL + 2) return;
      if (roadAt(GEN, x, z) > 0.02) return;
      const rr = Math.hypot(w, d) * 0.56;
      for (const o of placed) {
        if (Math.hypot(x - o.x, z - o.z) < rr + o.r + 4.5) return;
      }
      placed.push({ x, z, r: rr });
      makeVillageHouse(x, z, gh, w, h, d, vrot + (rng() - 0.5) * 0.26,
        rng, barn, front, variant);
      return true;
    };

    /* 主街两侧：每户面向道路，前院保持 3~6m，不再让房子压在土路上。 */
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 7; i++) {
        const t = (i + 0.5) / 7;
        const along = (-0.76 + 1.52 * t + (rng() - 0.5) * 0.11) * v.r;
        if (Math.abs(along) < v.r * 0.14) continue;
        const d = 8.5 + rng() * 4.2;
        const w = 7.5 + rng() * 4.2;
        const off = (7.6 + 3.0 + d * 0.5 + rng() * 4.2) * side;
        addHouse(along, off, w, 5.2 + rng() * 2.4, d, false,
          side > 0 ? 3 : 2, null);
      }
    }

    /* 两条支路：房屋沿路排布，围出第二个小聚落，避免“一横一竖插在空地上”。 */
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 4; i++) {
        const along = (-0.48 + i * 0.31 + (rng() - 0.5) * 0.12) * v.r;
        const d = 9 + rng() * 4.5;
        const w = 8 + rng() * 4;
        const off = (laneOff + 6.2 + d * 0.5 + rng() * 1.4) * side;
        addHouse(along, off, w, 5.4 + rng() * 2.2, d, false,
          side > 0 ? 3 : 2, null);
      }
    }

    /* 一座小教堂作为村落视觉锚点；被其他住宅占位时换一个村口位置。 */
    const chapelTries = [
      [-v.r * 0.54, -(laneOff + 16), 2],
      [v.r * 0.56, -(laneOff + 16), 2],
      [-v.r * 0.42, laneOff + 17, 3],
      [v.r * 0.55, laneOff + 17, 3]
    ];
    for (const c of chapelTries) {
      if (addHouse(c[0], c[1], 11.5, 7.0, 14, false, c[2], 'chapel')) break;
    }

    /* 谷仓 1~2 座，尺寸更接近真实谷仓，不再像巨型工业厂房。 */
    for (let i = 0; i < 2; i++) {
      if (i > 0 && rng() > 0.55) continue;
      for (let t = 0; t < 12; t++) {
        const ang = rng() * 6.2832, dist = v.r * (0.55 + rng() * 0.35);
        const lx = Math.cos(ang) * dist, lz = Math.sin(ang) * dist;
        if (addHouse(lx, lz, 12 + rng() * 3, 7 + rng() * 2, 17 + rng() * 4,
          true, lz > 0 ? 3 : 2, null)) break;
      }
    }

    /* 宅旁与村口树木：成簇但不压房屋、不挡主路。 */
    const wantTrees = 13 + (rng() * 8 | 0);
    for (let tries = 0; treeSpots.length < wantTrees && tries < 180; tries++) {
      const ang = rng() * 6.2832;
      const dist = v.r * (0.18 + rng() * 0.92);
      const lx = Math.cos(ang) * dist, lz = Math.sin(ang) * dist;
      if (onVillageLane(lx, lz)) continue;
      const p = detLocal(v.x, v.z, vrot, lx, lz);
      const x = p[0], z = p[1];
      let clear = true;
      for (const o of placed) {
        if (Math.hypot(x - o.x, z - o.z) < o.r + 5.2) { clear = false; break; }
      }
      if (!clear || roadAt(GEN, x, z) > 0.03) continue;
      const h = terrainHeight(x, z);
      if (h < WATER_LEVEL + 2) continue;
      treeSpots.push({
        x, z, h,
        s: 0.62 + rng() * 0.48,
        rot: rng() * Math.PI * 2,
        style: rng() < 0.58 ? 'broad' : rng() < 0.8 ? 'pine2' : 'pine'
      });
    }
    if (treeSpots.length) {
      villageTreeGroup.add(addTreeCluster(treeSpots, null, 'village'));
    }
  }
  /* 细节统一在农庄建筑加入后由调用方合批。 */
}

/* 村庄一次性装饰：土街 / 水井 / 草垛（随世界重建，不进哈希） */
function createVillages() {
  if (!GEN.villages.length) return;
  ensureVillageAssets();
  const ST = { pos: [], col: [], idx: [] };
  for (let vi = 0; vi < GEN.villages.length; vi++) {
    const v = GEN.villages[vi];
    const rng = mulberry32((((GEN.seed ^ 0x77A3) + vi * 5501) >>> 0));
    const vrot = villageStreetRot(v);
    const cr = Math.cos(vrot), sr = Math.sin(vrot);
    const laneOff = v.r * 0.21;
    const lane = (x0, z0, x1, z1, halfW, lift, rgb, bend) => {
      const pts = [];
      const len = Math.hypot(x1 - x0, z1 - z0);
      const n = Math.max(2, Math.ceil(len / 10));
      const dx = (x1 - x0) / (len || 1), dz = (z1 - z0) / (len || 1);
      const nx = -dz, nz = dx;
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const curve = Math.sin(t * Math.PI) * (bend || 0);
        const lx = x0 + (x1 - x0) * t + nx * curve;
        const lz = z0 + (z1 - z0) * t + nz * curve;
        const p = detLocal(v.x, v.z, vrot, lx, lz);
        pts.push({ x: p[0], z: p[1], h: terrainHeight(p[0], p[1]) });
      }
      pushRoadRibbon(ST, pts, halfW, lift, rgb, 1.0);
    };

    /* 双主街 + 两条支路 + 两条横向连接，形成可读的村落路网。 */
    const mainBend = (rng() - 0.5) * v.r * 0.18;
    lane(-0.88 * v.r, 0, 0.88 * v.r, 0, 6.4, 0.22, [0.47, 0.42, 0.32], mainBend);
    lane(-0.88 * v.r, 0, 0.88 * v.r, 0, 3.1, 0.33, [0.56, 0.47, 0.34], mainBend);
    for (const side of [-1, 1]) {
      lane(-0.62 * v.r, side * laneOff, 0.64 * v.r, side * laneOff,
        4.0, 0.22, [0.45, 0.40, 0.30], (rng() - 0.5) * v.r * 0.08);
      lane(-0.62 * v.r, side * laneOff, 0.64 * v.r, side * laneOff,
        2.35, 0.32, [0.53, 0.45, 0.33], (rng() - 0.5) * v.r * 0.08);
    }
    for (const cx of [-0.38, 0.38]) {
      lane(cx * v.r, -laneOff, cx * v.r, laneOff, 3.0, 0.24, [0.48, 0.42, 0.31]);
      lane(cx * v.r, -laneOff, cx * v.r, laneOff, 1.9, 0.34, [0.55, 0.46, 0.34]);
    }

    /* 村心小广场：尺度只比主街略宽，保留穿行感。 */
    lane(-8.5, 0, 8.5, 0, 8.0, 0.38, [0.61, 0.55, 0.43]);
    for (const side of [-1, 1]) {
      for (let t = -0.78; t <= 0.78; t += 0.24) {
        if (Math.abs(t) < 0.13) continue;
        const p = detLocal(v.x, v.z, vrot, t * v.r, side * 5.35);
        const gy = terrainHeight(p[0], p[1]);
        pushBoxGeo(ST, p[0], p[1], gy, gy + 4.3, 0.19, 0.19, [0.25, 0.27, 0.25]);
        pushBoxGeo(ST, p[0], p[1], gy + 4.3, gy + 4.72, 0.66, 0.66, [0.92, 0.71, 0.34]);
      }
    }

    /* 水塔：村口地标 */
    const wtA = rng() * 6.2832, wtD = v.r * (0.5 + rng() * 0.28);
    const wtx = v.x + Math.cos(wtA) * wtD, wtz = v.z + Math.sin(wtA) * wtD;
    if (roadAt(GEN, wtx, wtz) < 0.02) {
      const wb = terrainHeight(wtx, wtz);
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2 + Math.PI / 4;
        pushBoxGeo(ST, wtx + Math.cos(a) * 3.2, wtz + Math.sin(a) * 3.2,
                   wb, wb + 9.5, 0.7, 0.7, [0.50, 0.49, 0.45]);
      }
      const tank = new THREE.Mesh(villageAssets.tankGeo, villageAssets.stoneMat);
      tank.position.set(wtx, wb + 11.2, wtz);
      scene.add(tank);
      worldScenery.push(tank);
      const cap = new THREE.Mesh(villageAssets.tankCapGeo, villageAssets.hayMat);
      cap.position.set(wtx, wb + 14.3, wtz);
      scene.add(cap);
      worldScenery.push(cap);
    }

    /* 村中心水井 */
    const wh = terrainHeight(v.x, v.z);
    const well = new THREE.Mesh(villageAssets.wellGeo, villageAssets.stoneMat);
    well.position.set(v.x, wh + 0.58, v.z);
    scene.add(well);
    worldScenery.push(well);
    const wellRoof = new THREE.Mesh(villageAssets.roofGeo,
      villageAssets.roofMats[vi % villageAssets.roofMats.length]);
    wellRoof.position.set(v.x, wh + 4.2, v.z);
    wellRoof.scale.set(4.5, 1.8, 4.5);
    wellRoof.rotation.y = vrot;
    scene.add(wellRoof);
    worldScenery.push(wellRoof);
    for (const s of [-1, 1]) {
      const p = detLocal(v.x, v.z, vrot, s * 1.8, 1.1);
      pushBoxGeo(ST, p[0], p[1], wh, wh + 4.2, 0.24, 0.24, [0.35, 0.28, 0.20]);
    }

    /* 草垛 */
    for (let i = 0; i < 8; i++) {
      if (rng() > 0.62) continue;
      const ang = rng() * 6.2832, dist = v.r * (0.72 + rng() * 0.5);
      const hx = v.x + Math.cos(ang) * dist, hz = v.z + Math.sin(ang) * dist;
      const hh = terrainHeight(hx, hz);
      if (hh < WATER_LEVEL + 2) continue;
      const hay = new THREE.Mesh(villageAssets.hayGeo, villageAssets.hayMat);
      hay.position.set(hx, hh + 1.32, hz);
      hay.rotation.y = rng() * 3;
      scene.add(hay);
      worldScenery.push(hay);
    }
  }
  if (ST.idx.length) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(ST.pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(ST.col, 3));
    geo.setIndex(ST.idx);
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo,
      new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    mesh.receiveShadow = true;
    scene.add(mesh);
    worldScenery.push(mesh);
  }
}

/* 农庄建筑与场院：每次开局重建；麦秸、筒仓和防风树归入独立装饰组。 */
function createFarmsteads() {
  removeTreeTargetsByScope('farm');
  if (farmDecorGroup) {
    scene.remove(farmDecorGroup);
    farmDecorGroup = null;
  }
  farmDecorGroup = new THREE.Group();
  scene.add(farmDecorGroup);
  ensureVillageAssets();
  if (!GEN.farmsteads || !GEN.farmsteads.length) return;

  for (let i = 0; i < GEN.farmsteads.length; i++) {
    const fs = GEN.farmsteads[i];
    const rng = mulberry32(fs.rngSeed);
    const c = Math.cos(fs.rot), s = Math.sin(fs.rot);
    const local = (lx, lz) => [fs.x + lx * c - lz * s, fs.z + lx * s + lz * c];
    const ghAt = (p) => terrainHeight(p[0], p[1]);

    const barnP = local(-8, 1);
    makeVillageHouse(barnP[0], barnP[1], ghAt(barnP),
      14 + rng() * 3, 6.8 + rng() * 1.8, 18 + rng() * 3,
      fs.rot, rng, true, fs.front || 2, null);

    if (rng() < 0.68) {
      const homeP = local(14, -7);
      makeVillageHouse(homeP[0], homeP[1], ghAt(homeP),
        8.5 + rng() * 2.5, 5.4 + rng() * 1.4, 10.5 + rng() * 2.5,
        fs.rot + (rng() - 0.5) * 0.12, rng, false,
        fs.front === 2 ? 3 : 2, null);
    }

    const siloP = local(19, 12);
    const siloY = ghAt(siloP);
    const silo = new THREE.Mesh(villageAssets.siloGeo, villageAssets.siloMat);
    silo.position.set(siloP[0], siloY + 4.2, siloP[1]);
    silo.castShadow = true;
    farmDecorGroup.add(silo);
    const siloCap = new THREE.Mesh(villageAssets.siloCapGeo, villageAssets.roofMats[0]);
    siloCap.position.set(siloP[0], siloY + 9.5, siloP[1]);
    siloCap.castShadow = true;
    farmDecorGroup.add(siloCap);

    const hayCount = 3 + (rng() * 4 | 0);
    for (let k = 0; k < hayCount; k++) {
      const p = local(-22 + rng() * 42, -17 + rng() * 28);
      const gy = ghAt(p);
      if (gy < WATER_LEVEL + 2) continue;
      const hay = new THREE.Mesh(villageAssets.hayGeo, villageAssets.hayMat);
      hay.position.set(p[0], gy + 1.32, p[1]);
      hay.rotation.y = rng() * 6.2832;
      hay.scale.setScalar(0.8 + rng() * 0.45);
      hay.castShadow = true;
      farmDecorGroup.add(hay);
    }

    /* 场院围栏，门朝主土路。 */
    const fhx = 31, fhz = 24, gate = 5;
    detFenceLine(fs.x, fs.z, fs.rot, -fhx, fhz, -gate, fhz, [0.43, 0.33, 0.20]);
    detFenceLine(fs.x, fs.z, fs.rot, gate, fhz, fhx, fhz, [0.43, 0.33, 0.20]);
    detFenceLine(fs.x, fs.z, fs.rot, -fhx, -fhz, -fhx, fhz, [0.43, 0.33, 0.20]);
    detFenceLine(fs.x, fs.z, fs.rot, fhx, -fhz, fhx, fhz, [0.43, 0.33, 0.20]);

    const winds = [];
    for (let k = 0; k < 11; k++) {
