<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Open JET</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#180a0d;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  canvas{display:block;touch-action:none}

  /* 游戏中隐藏鼠标光标（Tab 键切换） */
  body.hide-cursor,body.hide-cursor *{cursor:none !important}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;
       --hud-bg:rgba(8,24,37,.68);--hud-bg-deep:rgba(5,17,28,.84);
       --hud-line:rgba(126,170,191,.25);--hud-line-hot:rgba(159,214,229,.62);
       --hud-text:#dce9ec;--hud-muted:#7f98a4;--hud-faint:#526c78;
       --hud-cyan:#9cd4df;--hud-friend:#75b8cf;--hud-danger:#b87978;
       --hud-warn:#c3aa76;color:var(--hud-text);
       font-family:"Bahnschrift","DIN Alternate","Microsoft YaHei",sans-serif;
       font-size:12px;letter-spacing:.04em;text-shadow:0 1px 8px rgba(0,10,18,.55)}
  .hud-tech-panel{position:absolute;background:
           linear-gradient(145deg,rgba(14,36,52,.72),rgba(5,17,28,.58));
           border:1px solid var(--hud-line);backdrop-filter:blur(14px) saturate(.72);
           -webkit-backdrop-filter:blur(14px) saturate(.72);
           box-shadow:0 16px 34px rgba(0,8,14,.22),inset 0 1px 0 rgba(204,235,241,.06);
           animation:hudPanelIn .5s cubic-bezier(.2,.72,.2,1) both}
  .hud-tech-panel::before,.hud-tech-panel::after{content:'';position:absolute;pointer-events:none}
  .hud-tech-panel::before{left:-1px;top:12px;width:10px;height:26px;
           border-left:2px solid var(--hud-line-hot);border-top:1px solid var(--hud-line-hot);
           border-bottom:1px solid var(--hud-line-hot)}
  .hud-tech-panel::after{right:7px;bottom:6px;width:28px;height:1px;
           background:linear-gradient(90deg,transparent,var(--hud-line-hot))}
  @keyframes hudPanelIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .hud-tech-kicker{display:flex;align-items:center;justify-content:space-between;gap:12px;
           min-height:25px;padding:0 11px;border-bottom:1px solid rgba(126,170,191,.14);
           color:var(--hud-muted);font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
           letter-spacing:.14em;text-transform:uppercase}
  .hud-tech-kicker b{color:var(--hud-cyan);font-weight:600}

  .flight-panel{left:max(18px,env(safe-area-inset-left,0px));top:max(16px,env(safe-area-inset-top,0px));
           width:clamp(286px,21vw,336px);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,12px 100%,0 calc(100% - 12px))}
  .flight-head{display:flex;align-items:center;justify-content:space-between;padding:11px 12px 9px}
  .flight-id{display:flex;align-items:center;gap:9px;min-width:0}
  .flight-id-mark{width:3px;height:28px;background:linear-gradient(var(--hud-cyan),rgba(156,212,223,.12))}
  .flight-id strong{display:block;font-size:15px;line-height:1.05;font-weight:650;letter-spacing:.09em}
  .flight-id span{display:block;margin-top:4px;color:var(--hud-faint);font:500 8px/1 ui-monospace,Consolas,monospace;
           letter-spacing:.16em}
  .flight-class{color:var(--hud-muted);font:500 8px/1.35 ui-monospace,Consolas,monospace;
           letter-spacing:.1em;text-align:right}
  .integrity-block{padding:0 12px 11px}
  .integrity-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
  .integrity-head span{color:var(--hud-muted);font:600 9px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em}
  .integrity-value{font:600 17px/1 ui-monospace,Consolas,monospace;color:var(--hud-text);font-variant-numeric:tabular-nums}
  .integrity-value small{font-size:9px;color:var(--hud-faint)}
  .hpbar{position:relative;height:8px;background:rgba(92,130,145,.14);overflow:hidden;
           border:1px solid rgba(126,170,191,.12)}
  .hpbar::after{content:'';position:absolute;inset:0;pointer-events:none;
           background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(7,20,29,.75) calc(10% - 1px),rgba(7,20,29,.75) 10%)}
  #hpFill{height:100%;width:100%;background:#78aeb4;transition:width .18s ease,background .18s ease;
           box-shadow:0 0 14px rgba(120,174,180,.34)}
  .telemetry-grid{display:grid;grid-template-columns:1.05fr 1.25fr .8fr;
           border-top:1px solid rgba(126,170,191,.13)}
  .telemetry-cell{min-width:0;padding:10px 11px 12px;border-right:1px solid rgba(126,170,191,.11)}
  .telemetry-cell:last-child{border-right:0}
  .telemetry-cell span{display:block;color:var(--hud-faint);font:600 8px/1 ui-monospace,Consolas,monospace;
           letter-spacing:.12em;text-transform:uppercase}
  .telemetry-cell strong{display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
           color:var(--hud-text);font:600 16px/1 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
  .telemetry-cell small{display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
           color:var(--hud-muted);font:500 8px/1 ui-monospace,Consolas,monospace;letter-spacing:.08em}
  .telemetry-cell strong.alert{color:var(--hud-warn)}
  .telemetry-cell strong.boost{color:var(--hud-cyan);text-shadow:0 0 10px rgba(156,212,223,.35)}
  .telemetry-cell strong.danger{color:var(--hud-danger)}

  .mission-strip{position:absolute;left:50%;top:max(16px,env(safe-area-inset-top,0px));
           transform:translateX(-50%);display:flex;align-items:stretch;min-width:214px;
           background:rgba(7,22,34,.54);border:1px solid rgba(126,170,191,.18);
           backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
           clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%,0 10px)}
  .mission-cell{min-width:94px;padding:8px 15px;text-align:center}
  .mission-cell+.mission-cell{border-left:1px solid rgba(126,170,191,.14)}
  .mission-cell span{display:block;color:var(--hud-faint);font:600 8px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em}
  .mission-cell b{display:block;margin-top:5px;color:var(--hud-text);font:600 15px/1 ui-monospace,Consolas,monospace;
           font-variant-numeric:tabular-nums}

  .radar-panel{right:max(18px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));
           width:clamp(220px,18vw,264px);clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
  .radar-shell{position:relative;width:calc(100% - 28px);aspect-ratio:1/1;margin:12px auto 8px}
  #radarCanvas{width:100%;height:100%;border-radius:50%;
           filter:drop-shadow(0 0 13px rgba(93,157,181,.12))}
  .radar-axis-label{position:absolute;color:var(--hud-faint);font:600 7px/1 ui-monospace,Consolas,monospace;
           letter-spacing:.1em}
  .radar-axis-label.forward{left:50%;top:4px;transform:translateX(-50%)}
  .radar-axis-label.range{right:8%;bottom:10%}
  .radar-readout{display:flex;align-items:center;justify-content:space-between;
           padding:0 12px 9px;color:var(--hud-muted);font:600 8px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em}
  .radar-readout b{color:var(--hud-cyan);font-weight:600}
  .radar-legend{display:flex;align-items:center;justify-content:center;gap:11px;
           min-height:29px;border-top:1px solid rgba(126,170,191,.13);
           color:var(--hud-muted);font:500 8px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em}
  .radar-legend span{display:inline-flex;align-items:center;gap:5px}
  .radar-dot{width:6px;height:6px;transform:rotate(45deg);border:1px solid currentColor}
  .radar-dot.friend{border-color:var(--hud-friend);background:rgba(117,184,207,.2)}
  .radar-dot.hostile{border-color:var(--hud-danger);background:rgba(184,121,120,.16)}
  .radar-dot.ground{border-color:var(--hud-warn);background:rgba(195,170,118,.15)}

  .weapon-panel{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));
           width:min(520px,calc(100vw - 310px));
           background:linear-gradient(135deg,rgba(8,24,37,.68),rgba(5,17,28,.50));
           border:1px solid rgba(126,170,191,.2);backdrop-filter:blur(13px) saturate(.72);
           -webkit-backdrop-filter:blur(13px) saturate(.72);
           clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
  .weapon-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 7px;
           border-bottom:1px solid rgba(126,170,191,.14);color:var(--hud-muted);
           font:600 8px/1 ui-monospace,Consolas,monospace;letter-spacing:.13em}
  .weapon-head b{color:var(--hud-cyan);font-weight:600}
  .weapon-rack{display:flex;gap:7px;padding:8px}
  .weapon-slice{position:relative;flex:1 1 150px;min-width:132px;height:92px;overflow:hidden;
           border:1px solid rgba(126,170,191,.17);background:rgba(10,29,43,.48);
           color:rgba(189,211,218,.46);transition:color .14s,border-color .14s,background .14s,box-shadow .14s,opacity .14s}
  .weapon-slice[hidden]{display:none}
  .weapon-slice::after{content:'';position:absolute;inset:0;pointer-events:none;
           background:linear-gradient(105deg,transparent 35%,rgba(173,225,235,.055) 50%,transparent 66%);
           transform:translateX(-120%)}
  .weapon-slice.active{color:var(--hud-cyan);border-color:rgba(156,212,223,.67);
           background:linear-gradient(135deg,rgba(37,84,103,.56),rgba(11,39,54,.66));
           box-shadow:inset 0 0 24px rgba(122,191,210,.09),0 0 18px rgba(81,151,171,.09)}
  .weapon-slice.active::after{animation:weaponScan .75s ease-in-out infinite}
  @keyframes weaponScan{to{transform:translateX(120%)}}
  .weapon-slice.unavailable{opacity:.42}
  .weapon-index{position:absolute;left:8px;top:7px;color:var(--hud-faint);font:600 8px/1 ui-monospace,Consolas,monospace;
           letter-spacing:.12em}
  .weapon-icon{position:absolute;left:15px;top:25px;width:72px;height:38px;opacity:.92}
  .weapon-icon svg{width:100%;height:100%;overflow:visible;color:currentColor}
  .weapon-copy{position:absolute;right:9px;top:24px;text-align:right}
  .weapon-copy strong{display:block;color:var(--hud-text);font-size:12px;line-height:1;font-weight:650;letter-spacing:.08em}
  .weapon-copy span{display:block;margin-top:6px;color:var(--hud-muted);
           font:500 8px/1 ui-monospace,Consolas,monospace;letter-spacing:.09em}
  .weapon-ammo{position:absolute;right:9px;bottom:8px;font:600 12px/1 ui-monospace,Consolas,monospace;
           color:var(--hud-cyan);font-variant-numeric:tabular-nums}
  .weapon-state{position:absolute;left:8px;bottom:8px;color:var(--hud-faint);
           font:600 8px/1 ui-monospace,Consolas,monospace;letter-spacing:.08em}
  .weapon-slice.active .weapon-state{color:var(--hud-cyan)}
  .weapon-slice.reload .weapon-state{color:var(--hud-warn)}
  .weapon-slice.empty{opacity:.48}
  .weapon-slice.empty .weapon-ammo{color:var(--hud-danger)}

  /* 无面板 HUD：信息直接悬浮于场景，不使用矩形框。 */
  .flight-panel{position:absolute;left:max(22px,env(safe-area-inset-left,0px));
           top:max(18px,env(safe-area-inset-top,0px));width:clamp(280px,21vw,334px);
           background:none;border:0;box-shadow:none;
           backdrop-filter:none;-webkit-backdrop-filter:none;clip-path:none;animation:none}
  .flight-ident{display:flex;align-items:baseline;gap:9px;min-height:24px;
           color:var(--hud-muted);font:500 9px/1 ui-monospace,Consolas,monospace;letter-spacing:.11em}
  .flight-ident b{color:var(--hud-cyan);font-size:12px;font-weight:600;letter-spacing:.08em}
  .flight-ident strong{color:var(--hud-text);font-size:16px;font-weight:550;letter-spacing:.06em}
  .flight-ident span:last-child{margin-left:auto;text-align:right}
  .flight-line{position:relative;display:grid;align-items:center;min-height:34px;
           border-bottom:1px solid rgba(126,170,191,.18)}
  .flight-line::before{content:'';position:absolute;left:0;bottom:-1px;width:34px;height:1px;
           background:linear-gradient(90deg,var(--hud-line-hot),transparent)}
  .flight-line-label{color:var(--hud-faint);font:600 8px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em}
  .flight-line-value{color:var(--hud-text);font:600 16px/1 ui-monospace,Consolas,monospace;
           font-variant-numeric:tabular-nums;text-align:right}
  .flight-line-value small{font-size:8px;color:var(--hud-faint)}
  .hull-line{grid-template-columns:48px minmax(0,1fr) 56px;gap:9px}
  .hull-line .hpbar{height:7px;background:rgba(76,111,127,.12);border:0}
  .alt-line{grid-template-columns:48px minmax(0,1fr) 74px;gap:9px}
  .alt-line .flight-line-value{font-size:19px}
  .engine-line{grid-template-columns:48px 112px minmax(45px,1fr) 38px;gap:8px;min-height:42px}
  .engine-graphic{display:block;width:108px;height:34px;overflow:visible;color:rgba(173,207,217,.64);
           transition:color .16s,filter .16s}
  .engine-graphic .engine-core{fill:rgba(64,112,128,.16);stroke:currentColor;stroke-width:1.4}
  .engine-graphic .engine-detail{fill:none;stroke:currentColor;stroke-width:1;opacity:.72}
  .engine-graphic .engine-fan{fill:none;stroke:currentColor;stroke-width:1.2;
           transform-origin:25px 18px;animation:engineSpin .9s linear infinite}
  .engine-graphic .engine-rotor{fill:currentColor;opacity:.56}
  .engine-graphic .engine-heat{fill:#c3aa76;opacity:.38}
  .engine-graphic .engine-flame{fill:#9cd4df;opacity:.38;transform-box:fill-box;
           transform-origin:left center;transition:opacity .16s,transform .16s}
  .engine-graphic.boost{color:var(--hud-cyan);filter:drop-shadow(0 0 7px rgba(156,212,223,.40))}
  .engine-graphic.boost .engine-heat{fill:#bcdde3;opacity:.8}
  .engine-graphic.boost .engine-flame{opacity:.88}
  .engine-graphic.cut{color:rgba(87,116,128,.42);filter:none}
  .engine-graphic.cut .engine-fan{animation-play-state:paused}
  .engine-graphic.cut .engine-heat,.engine-graphic.cut .engine-flame{opacity:0}
  @keyframes engineSpin{to{transform:rotate(360deg)}}
  .engine-power{height:4px;background:rgba(81,118,132,.13);overflow:hidden}
  .engine-power i{display:block;height:100%;width:100%;background:var(--hud-cyan);opacity:.62;
           box-shadow:0 0 8px rgba(156,212,223,.34);transition:width .15s linear,opacity .15s}
  .engine-percent{font-size:11px!important}
  .enemy-line{grid-template-columns:48px 1fr 46px;gap:9px;border-bottom:0}
  .enemy-line .flight-line-label{color:var(--hud-muted)}
  .enemy-line .flight-line-value{color:var(--hud-danger);font-size:19px}
  .enemy-scan{display:flex;align-items:center;gap:4px;min-width:0;height:14px}
  .enemy-scan i{display:block;height:1px;flex:1;background:rgba(184,121,120,.22)}
  .enemy-scan i:nth-child(2){background:rgba(184,121,120,.48);flex:1.6}
  .enemy-scan i:nth-child(3){background:rgba(184,121,120,.30)}

  .mission-strip{background:none;border:0;box-shadow:none;backdrop-filter:none;
           -webkit-backdrop-filter:none;clip-path:none;gap:1px}
  .mission-cell{padding:0 18px}
  .mission-cell+.mission-cell{border-left:1px solid rgba(126,170,191,.24)}
  .mission-cell span{font-size:7px;color:rgba(126,156,168,.72)}
  .mission-cell b{font-size:14px;color:rgba(220,233,236,.86)}

  .radar-panel{position:absolute;right:max(20px,env(safe-area-inset-right,0px));
           top:max(18px,env(safe-area-inset-top,0px));width:clamp(218px,18vw,258px);
           background:none;border:0;box-shadow:none;
           backdrop-filter:none;-webkit-backdrop-filter:none;clip-path:none;animation:none}
  .radar-panel::before,.radar-panel::after{display:none}
  .radar-shell{width:100%;margin:0;background:none}
  #radarCanvas{border-radius:50%;background:transparent;
           filter:drop-shadow(0 0 16px rgba(84,145,166,.16))}
  .radar-axis-label{color:rgba(139,173,185,.72)}
  .radar-axis-label.range{right:13%;bottom:12%}

  .weapon-panel{width:min(456px,calc(100vw - 270px));background:none;border:0;box-shadow:none;
           backdrop-filter:none;-webkit-backdrop-filter:none;clip-path:none;animation:none}
  .weapon-panel::before,.weapon-panel::after{display:none}
  .weapon-rack{display:flex;align-items:flex-end;gap:34px;padding:0 4px}
  .weapon-slice{flex:0 1 196px;min-width:168px;height:88px;overflow:visible;
           border:0;background:none;box-shadow:none;color:rgba(143,171,183,.52)}
  .weapon-slice::after{background:radial-gradient(ellipse at 46% 56%,rgba(101,187,207,.18),transparent 66%);
           transform:none;opacity:0;transition:opacity .15s}
  .weapon-slice.active{background:none;border:0;box-shadow:none;color:var(--hud-cyan);
           filter:drop-shadow(0 0 8px rgba(137,209,223,.20))}
  .weapon-slice.active::after{opacity:1;animation:none}
  .weapon-index{left:1px;top:0;font-size:11px;color:var(--hud-muted);letter-spacing:.16em}
  .weapon-index b{color:var(--hud-cyan);font-weight:600}
  .weapon-icon{left:17px;top:22px;width:112px;height:43px;opacity:.9;transition:transform .15s,filter .15s}
  .weapon-slice.active .weapon-icon{transform:translateY(-1px) scale(1.035);
           filter:drop-shadow(0 0 7px rgba(156,212,223,.44))}
  .weapon-copy{right:1px;top:25px}
  .weapon-copy strong{font-size:13px;color:currentColor}
  .weapon-copy span{color:rgba(126,156,168,.70);font-size:7px}
  .weapon-ammo{right:1px;bottom:1px;font-size:13px;color:currentColor}
  .weapon-state{left:1px;bottom:1px;font-size:8px;color:rgba(113,145,157,.70)}
  .weapon-slice.active .weapon-state{color:var(--hud-cyan)}
  .weapon-slice.reload .weapon-state{color:var(--hud-warn)}
  .weapon-slice.empty{opacity:.46}
  .weapon-slice.empty .weapon-ammo{color:var(--hud-danger)}
  #dmgFlash{position:fixed;inset:0;pointer-events:none;opacity:0;
            background:radial-gradient(ellipse at center,rgba(98,55,60,0) 42%,rgba(131,72,75,.30) 100%)}
  #lockMark{position:fixed;left:50%;top:50%;width:46px;height:46px;display:none;
            transform:translate(-50%,-50%);border:1.5px solid rgba(214,92,92,.94);
            border-radius:50%;pointer-events:none;z-index:7;
            box-shadow:0 0 16px rgba(206,75,75,.42),inset 0 0 10px rgba(206,75,75,.18)}
  #lockMark::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;
            transform:translate(-50%,-50%);background:rgba(238,126,126,.98);border-radius:50%}
  #edgeWarn{position:fixed;left:50%;top:82px;transform:translate(-50%,-8px);
            padding:8px 16px;border-radius:3px;background:rgba(8,25,39,.84);
            border:1px solid rgba(126,170,191,.42);color:#c8dce2;font-size:10px;
            letter-spacing:1px;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap}
  #edgeWarn.show{opacity:1;transform:translate(-50%,0)}
  #weaponWarn{position:fixed;left:50%;top:122px;transform:translate(-50%,-7px);
            padding:7px 13px;border-radius:3px;background:rgba(7,23,36,.88);
            border:1px solid rgba(126,170,191,.32);color:#cadde2;font-size:10px;
            letter-spacing:.06em;opacity:0;pointer-events:none;
            transition:opacity .16s,transform .16s,border-color .16s;white-space:nowrap}
  #weaponWarn.show{opacity:1;transform:translate(-50%,0)}
  #weaponWarn.ready{border-color:rgba(156,212,223,.58);color:#d5f0f5}
  #grade{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .45s ease}
  #grade.war{opacity:1;background:
           radial-gradient(ellipse at 50% 44%,rgba(106,121,126,0) 26%,rgba(30,42,45,.13) 68%,rgba(6,12,14,.46) 100%)}
  #grade.war::after{content:'';position:absolute;inset:0;opacity:.16;
           background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0,rgba(255,255,255,.13) 1px,transparent 1px,transparent 3px)}

  /* ---------- 开局 / 生成 / 部署 / 结算界面 ---------- */
  #overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:stretch;justify-content:center;
           color:#fff1ee;padding:clamp(14px,2.1vw,30px);overflow:hidden;
           background:#180a0d;
           backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
  #overlay.hide{display:none}
  #panel{position:relative;z-index:1;width:min(1500px,100%);height:100%;min-height:0}
  .start-shell{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;
           animation:screenIn .34s cubic-bezier(.2,.75,.25,1) both}

  init() {

    if (!AC) return;

    const ctx = this.ctx;

    this.master = ctx.createGain();
    this.master.gain.value = 0.55;
    this.master.connect(ctx.destination);

    const sr = ctx.sampleRate;
    const buf = ctx.createBuffer(1, sr * 2, sr);

    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;

    this.engOsc1 = ctx.createOscillator();

    this.engOsc2 = ctx.createOscillator();

    this.engFilter.frequency.value = 380;
    this.engFilter.Q.value = 2.5;

    this.engGain = ctx.createGain();
    this.engGain.gain.value = 0;

    this.engOsc1.connect(this.engFilter);
    this.engOsc2.connect(this.engFilter);
    engNoise.connect(noiseGain);
    noiseGain.connect(this.engFilter);
    this.engFilter.connect(this.engGain);
    this.engGain.connect(this.master);

    this.engOsc1.start();
    this.engOsc2.start();
    engNoise.start();

    this.engGain.gain.setTargetAtTime(0.085, ctx.currentTime, 0.6);
    this.ready = true;
  },

  setEngine(intensity, boost) {
    if (!this.ready) return;
    boost = boost || 0;
    const t = this.ctx.currentTime;
    /* 加力：转速更低沉、滤通更开、共振更强、音量明显更大 */
    this.engOsc1.frequency.setTargetAtTime(50 + intensity * 42 - boost * 24, t, 0.18);
    this.engOsc2.frequency.setTargetAtTime(53 + intensity * 44 - boost * 24, t, 0.18);
    this.engFilter.frequency.setTargetAtTime(290 + intensity * 880 + boost * 1500, t, 0.2);
    this.engFilter.Q.setTargetAtTime(2.5 + boost * 4, t, 0.25);
    this.engGain.gain.setTargetAtTime((0.06 + intensity * 0.055) * (1 + boost * 1.6), t, 0.25);
  },

  silenceEngine() {
    if (!this.ready) return;
    this.engGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.15);
  },

  gun() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    if (t - this.lastGun < 0.028) return;
    this.lastGun = t;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 1.5 + Math.random() * 0.4;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1500 + Math.random() * 600;
    bp.Q.value = 1.3;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.20, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);

    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.085);
  },

  boom(power) {
    if (!this.ready) return;
    power = power || 1;
    const ctx = this.ctx, t = ctx.currentTime;
    const dur = 0.5 + power * 0.65;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.5 + Math.random() * 0.3;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400 * power, t);
    lp.frequency.exponentialRampToValueAtTime(100, t + dur);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.34 * Math.min(1.7, power), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);

    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.15);
  },

  /* 防空机枪远距枪声：低频闷响，按距离衰减，带节流 */
  aaa(vol) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    if (t - (this.lastAaa || 0) < 0.055) return;
    this.lastAaa = t;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.9 + Math.random() * 0.3;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 900;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.14 * vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.1);
  },

  /* 导弹发射：噪声扫频上扬 */
  launch() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.8;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(260, t);
    bp.frequency.exponentialRampToValueAtTime(1900, t + 0.6);
    bp.Q.value = 1.1;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);

    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.85);
  },

  /* 玩家被命中的闷响 */
  hit() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.6 + Math.random() * 0.25;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 420;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);

    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.18);
  }
};

/* =========================================================
   世界生成（种子驱动 · Minecraft 式分层噪声）
   分层顺序：基础起伏 → 山脉 → 河流 → 湖泊 → 城市整平 → 出生地整平
   —— GEN-BLOCK-START ——（保持纯函数；外部校验脚本整段抽取）
========================================================= */
const WORLD_HALF = 4400;             // 地形网格半径（世界 8800×8800）
const SPAWN_X = 0, SPAWN_Z = 3550;   // 固定出生点：南侧边缘（朝北进场）
const WATER_LEVEL = 4;

function smoothstep(e0, e1, x) {
  let t = (x - e0) / (e1 - e0);
  t = Math.min(1, Math.max(0, t));
  return t * t * (3 - 2 * t);
}

/* ---- 种子与噪声（确定性哈希 / 值噪声 / 分形叠加） ---- */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(a) {
  let t = a >>> 0;
  return function () {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2i(ix, iz, seed) {
  let h = Math.imul(ix | 0, 374761393) + Math.imul(iz | 0, 668265263) + Math.imul(seed | 0, 1442695041);
  h ^= h >>> 13;
  h = Math.imul(h, 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z, seed) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2i(ix, iz, seed), b = hash2i(ix + 1, iz, seed);
  const c = hash2i(ix, iz + 1, seed), d = hash2i(ix + 1, iz + 1, seed);
  const top = a + (b - a) * ux, bot = c + (d - c) * ux;
  return top + (bot - top) * uz;
}
function fbm(x, z, seed, oct) {
  let v = 0, amp = 0.5, tot = 0;
  for (let i = 0; i < oct; i++) {
    v += vnoise(x, z, seed + i * 131) * amp;
    tot += amp;
    amp *= 0.5;
    x *= 2.03; z *= 1.97;
  }
  return v / tot;
}
function ridgedNoise(x, z, seed, oct) {
  let v = 0, amp = 0.56, tot = 0;
  for (let i = 0; i < oct; i++) {
    const n = 1 - Math.abs(vnoise(x, z, seed + i * 193) * 2 - 1);
    v += n * n * amp;
    tot += amp;
    amp *= 0.48;
    x = x * 2.07 + 17.3; z = z * 1.93 - 9.1;
  }
  return v / tot;
}

/* ---- 当前世界参数（由种子生成；terrainHeight 全程只读 GEN） ---- */
let GEN = null;

/* 分阶段生成器：同步入口会一次跑完；开局界面逐阶段驱动以刷新真实进度。 */
function* genWorldSteps(seedNum) {
  const rng = mulberry32(seedNum);
  const g = {
    seed: seedNum >>> 0, mountains: [], cities: [], rivers: [], lakes: [],
    villages: [], roads: [], fields: [], forests: [], meadows: [], railStations: [], railways: [],
    roadN: 0, roadCell: ROAD_CELL, roadW: null, roadH: null,
    railN: 0, railCell: 10, railW: null, railH: null
  };

  yield 'mountains';
  /* 山脉：1~2 条多峰山系。每条山系由连续山脊、次级山肩和侵蚀沟谷组成。 */
  const mCount = 1 + (rng() < 0.48 ? 1 : 0);
  for (let i = 0; i < mCount; i++) {
    for (let t = 0; t < 90; t++) {
      const mx = (rng() * 2 - 1) * WORLD_HALF * 0.7;
      const mz = (rng() * 2 - 1) * WORLD_HALF * 0.7;
      if (Math.hypot(mx - SPAWN_X, mz - SPAWN_Z) < 1600) continue;
      const mrx = 1150 + rng() * 900, mrz = 720 + rng() * 640;
      let ok = true;
      for (const m of g.mountains) {
        if (Math.hypot(mx - m.x, mz - m.z) < (m.mrx + mrx) * 0.8) { ok = false; break; }
      }
      if (!ok) continue;
      const rot = rng() * Math.PI;
      const baseAmp = 430 + rng() * 390;
      const peaks = [];
      const peakCount = 3 + ((rng() * 3) | 0);
      for (let k = 0; k < peakCount; k++) {
        const u = peakCount === 1 ? 0 : k / (peakCount - 1) - 0.5;
        const central = 1 - Math.min(1, Math.abs(u) * 1.75);
        peaks.push({
          x: u * mrx * 1.28 + (rng() - 0.5) * 210,
          z: (rng() - 0.5) * mrz * 0.52,
          rx: 210 + rng() * 190,
          rz: 190 + rng() * 180,
          amp: baseAmp * (0.16 + central * 0.34 + rng() * 0.10),
          rot: (rng() - 0.5) * 0.8
        });
      }
      g.mountains.push({
        x: mx, z: mz, rot, cr: Math.cos(rot), sr: Math.sin(rot), mrx, mrz,
        amp: baseAmp, peaks,
        ridgeW: 0.52 + rng() * 0.20,
        ridgeBend: 0.20 + rng() * 0.23,
        ridgePhase: rng() * 6.283,
        f1: 0.0042 + rng() * 0.0016, p1: rng() * 6.283,
        f2: 0.0095 + rng() * 0.0030, p2: rng() * 6.283
      });
      buildMountainField(g, g.mountains[g.mountains.length - 1]);
      break;
    }
  }

  yield 'rivers';
  /* 河流优先于城市生成，保证城市数量放开后每张图仍有完整水系。 */
  const rCount = 1 + (rng() < 0.38 ? 1 : 0);
  for (let i = 0; i < rCount; i++) {
    for (let t = 0; t < 420; t++) {
      const rv = {
        dir: rng() < 0.5 ? 'z' : 'x',
        base: (rng() * 2 - 1) * WORLD_HALF * 0.5,
        a1: 120 + rng() * 260, f1: 0.0011 + rng() * 0.0018, ph1: rng() * 6.283,
        a2: 60 + rng() * 150, f2: 0.00035 + rng() * 0.0008, ph2: rng() * 6.283,
        w: 46 + rng() * 18
      };
      let ok = true;
      for (let k = 0; k <= 40 && ok; k++) {
        const c = -WORLD_HALF + 2 * WORLD_HALF * k / 40;
        const off = rv.base + Math.sin(c * rv.f1 + rv.ph1) * rv.a1 + Math.sin(c * rv.f2 + rv.ph2) * rv.a2;
        const px = rv.dir === 'z' ? off : c;
        const pz = rv.dir === 'z' ? c : off;
        if (Math.hypot(px - SPAWN_X, pz - SPAWN_Z) < 700) ok = false;
      }
      if (!ok) continue;
      g.rivers.push(rv);
      break;
    }
  }

  yield 'cities';
  /* 城市：不再预设数量上限；由可用地形持续落位，直到连续多次找不到合法位置。 */
  let cityTries = 0, cityMisses = 0;
  while (cityTries < 900 && cityMisses < 140) {
    cityTries++;
    const cs = 1 + rng() * 2;
    const rx = 620 * cs, rz = 600 * cs;
    const cx = (rng() * 2 - 1) * Math.max(250, WORLD_HALF - rx - 250);
    const cz = (rng() * 2 - 1) * Math.max(250, WORLD_HALF - rz - 250);
    if (Math.hypot(cx - SPAWN_X, cz - SPAWN_Z) < rx + 1000) { cityMisses++; continue; }
    let ok = true;
    for (const c of g.cities) if (Math.hypot(cx - c.x, cz - c.z) < c.rx * 0.9 + rx * 0.9 + 900) { ok = false; break; }
    for (const m of g.mountains) if (Math.hypot(cx - m.x, cz - m.z) < m.mrx * 0.8 + rx * 0.7 + 500) { ok = false; break; }
    if (ok) for (const r of g.rivers) {
      for (let k = 0; k <= 40; k++) {
        const c = -WORLD_HALF + 2 * WORLD_HALF * k / 40;
        const off = r.base + Math.sin(c * r.f1 + r.ph1) * r.a1 + Math.sin(c * r.f2 + r.ph2) * r.a2;
        const px = r.dir === 'z' ? off : c;
        const pz = r.dir === 'z' ? c : off;
        if (Math.abs(px - cx) < rx + 240 && Math.abs(pz - cz) < rz + 240) { ok = false; break; }
      }
      if (!ok) break;
    }
    if (!ok) { cityMisses++; continue; }
    g.cities.push({ x: cx, z: cz, rx, rz, s: cs });
    cityMisses = 0;
  }
  if (g.cities.length === 0) g.cities.push({ x: 0, z: 0, rx: 620, rz: 600, s: 1 });

  yield 'lakes';
  /* 湖泊：0~2 个（谐波岸线；避开城市与出生地） */
  const lCount = rng() < 0.22 ? 0 : (rng() < 0.75 ? 1 : 2);
  for (let i = 0; i < lCount; i++) {
    for (let t = 0; t < 90; t++) {
      const lx = (rng() * 2 - 1) * WORLD_HALF * 0.85;
      const lz = (rng() * 2 - 1) * WORLD_HALF * 0.85;
      if (Math.hypot(lx - SPAWN_X, lz - SPAWN_Z) < 1000) continue;
      let ok = true;
      for (const ct of g.cities) {
        if (Math.abs(lx - ct.x) < ct.rx + 260 && Math.abs(lz - ct.z) < ct.rz + 260) ok = false;
      }
      for (const l of g.lakes) if (Math.hypot(lx - l.x, lz - l.z) < 900) ok = false;
      if (!ok) continue;
      g.lakes.push({
        x: lx, z: lz, r: 260 + rng() * 160,
        h1a: 0.10 + rng() * 0.10, h1p: rng() * 6.283,
        h2a: 0.05 + rng() * 0.08, h2p: rng() * 6.283
      });
      break;
    }
  }

  /* ---- 第二层：乡村 → 路网 → 农田 → 树林（泰拉瑞亚式逐层叠加，后层避让前层） ---- */
  yield 'villages';
  genVillages(g, rng);
  yield 'terrainBase';
  bakeTerrainHeightGrid(g, true);
  yield 'roads';
  genRoads(g, rng);
  yield 'cityRoads';
  connectCityRoads(g);
  yield 'roadField';
  buildRoadField(g);
  yield 'roadBridges';
  designRoadBridges(g);
  yield 'roadFieldFix';
  buildRoadField(g);
  yield 'railways';
  genRailways(g, rng);
  yield 'railField';
  buildRailField(g);
  yield 'fields';
  genFields(g, rng);
  yield 'forests';
  genForests(g, rng);
  yield 'meadows';
  genMeadows(g, rng);
  yield 'rocks';
  genRocks(g, rng);
  yield 'terrainSmooth';
  bakeTerrainHeightGrid(g);
  yield 'transportClearance';
  auditTransportClearance(g);
  yield 'audit';
  auditBridgePlacement(g);

  return g;
}

function genWorld(seedNum) {
  const steps = genWorldSteps(seedNum);
  let step;
  do { step = steps.next(); } while (!step.done);
  return step.value;
}

/* =========================================================
   第二层世界生成：乡村 / 道路 / 农田 / 树林
   ========================================================= */

const ROAD_CELL = 11;          // 路网高度场栅格边长（米）
const ROAD_HALF_FLAT = 18;     // 道路完全压平的半宽
const ROAD_HALF_BLEND = 42;    // 压平过渡到自然地形的半宽
const FIELD_CAP = 720;         // 农田地块上限（用连续农业区填满平原空隙）

let _roadW = 0, _roadH = 0;

/* ---- 乡村：4~6 个（避开城市 / 山体 / 水域 / 出生地，取相对平整处） ---- */
function genVillages(g, rng) {
  const count = 6 + ((rng() * 4) | 0);          // 6~9 个（密集）
  for (let i = 0; i < count; i++) {
    for (let t = 0; t < 400; t++) {
      const r = 150 + rng() * 90;
      const x = (rng() * 2 - 1) * (WORLD_HALF - r - 400);
      const z = (rng() * 2 - 1) * (WORLD_HALF - r - 400);
      if (Math.hypot(x - SPAWN_X, z - SPAWN_Z) < 900) continue;

      let ok = true;
      for (const ct of g.cities) {
        if (Math.hypot(x - ct.x, z - ct.z) < ct.rx + r + 520) { ok = false; break; }
      }
      if (ok) for (const v of g.villages) {
        if (Math.hypot(x - v.x, z - v.z) < v.r + r + 650) { ok = false; break; }
      }
      if (ok) for (const m of g.mountains) {
        const dx = x - m.x, dz = z - m.z;
        const rx = m.cr * dx + m.sr * dz, rz = -m.sr * dx + m.cr * dz;
        if (Math.hypot(rx / m.mrx, rz / m.mrz) < 1.1) { ok = false; break; }
      }
      if (ok) for (const l of g.lakes) {
        if (Math.hypot(x - l.x, z - l.z) < l.r * 1.9 + r) { ok = false; break; }
      }
      if (ok) for (const rv of g.rivers) {
        const c = rv.dir === 'z' ? z : x;
        const cen = rv.base + Math.sin(c * rv.f1 + rv.ph1) * rv.a1 + Math.sin(c * rv.f2 + rv.ph2) * rv.a2;
        if (Math.abs((rv.dir === 'z' ? x : z) - cen) < rv.w * 3.4 + r) { ok = false; break; }
      }
      if (!ok) continue;

      const h0 = rawHeight(g, x, z);
      if (h0 < WATER_LEVEL + 14 || h0 > 330) continue;
      const hs = [
        h0, rawHeight(g, x + r, z), rawHeight(g, x - r, z),
        rawHeight(g, x, z + r), rawHeight(g, x, z - r)
      ];
      if (Math.max(hs[0], hs[1], hs[2], hs[3], hs[4]) - Math.min(hs[0], hs[1], hs[2], hs[3], hs[4]) > 85) continue;

      g.villages.push({ x, z, r, h: h0, rot: rng() * Math.PI * 2 });
      break;
    }
  }
}

/* ---- 修路：城市 + 村庄最小生成树，每条边用 A* 找线（避水 / 避陡 / 避城区） ---- */
const ROAD_GRID_N = 88;

function buildRoadCostGrid(g) {
  const N = ROAD_GRID_N, CELL = (WORLD_HALF * 2) / N, size = N * N;
  const hgt = new Float32Array(size), cost = new Float32Array(size);
  for (let ix = 0; ix < N; ix++) {
    const x = -WORLD_HALF + (ix + 0.5) * CELL;
    for (let iz = 0; iz < N; iz++) {
      const z = -WORLD_HALF + (iz + 0.5) * CELL;
      const h = groundHeight(g, x, z);
      let c = 1;
      if (h < WATER_LEVEL + 3) c += 4000;        // 尽量不过水
      if (h > 280) c += (h - 280) * 5;           // 尽量不翻高山
      for (const ct of g.cities) {
        const cd = Math.hypot((x - ct.x) / ct.rx, (z - ct.z) / ct.rz);
        if (cd < 1.02) { c += 1200; break; }     // 不切城区
      }
      const k = iz * N + ix;
      hgt[k] = h; cost[k] = c;
    }
  }
  return { N, CELL, hgt, cost };
}

function roadHeapPush(heap, f, k) {
  heap.push({ f, k });
  let i = heap.length - 1;
  while (i > 0) {
    const p = (i - 1) >> 1;
    if (heap[p].f <= heap[i].f) break;
    const t = heap[p]; heap[p] = heap[i]; heap[i] = t;
    i = p;
  }
}

function roadHeapPop(heap) {
  const top = heap[0];
  const last = heap.pop();
  if (heap.length) {
    heap[0] = last;
    let i = 0;
    for (;;) {
      const l = i * 2 + 1, r = l + 1;
      let m = i;
      if (l < heap.length && heap[l].f < heap[m].f) m = l;
      if (r < heap.length && heap[r].f < heap[m].f) m = r;
      if (m === i) break;
      const t = heap[m]; heap[m] = heap[i]; heap[i] = t;
      i = m;
    }
  }
  return top;
}

function chaikinPath(pts, iters) {
  let out = pts;
  for (let it = 0; it < iters; it++) {
    if (out.length < 3) break;
    const nex = [out[0]];
    for (let i = 0; i < out.length - 1; i++) {
      const a = out[i], b = out[i + 1];
      nex.push({ x: a.x * 0.75 + b.x * 0.25, z: a.z * 0.75 + b.z * 0.25 });
      nex.push({ x: a.x * 0.25 + b.x * 0.75, z: a.z * 0.25 + b.z * 0.75 });
    }
    nex.push(out[out.length - 1]);
    out = nex;
  }
  return out;
}

function resamplePath(pts, step) {
  const out = [{ x: pts[0].x, z: pts[0].z }];
  let remain = 0;
  let cx = pts[0].x, cz = pts[0].z;
  for (let i = 1; i < pts.length; i++) {
    const tx = pts[i].x, tz = pts[i].z;
    let seg = Math.hypot(tx - cx, tz - cz);
    while (seg > 1e-9) {
      const need = step - remain;
      if (seg >= need) {
        const t = need / seg;
        cx += (tx - cx) * t;
        cz += (tz - cz) * t;
        out.push({ x: cx, z: cz });
        seg = Math.hypot(tx - cx, tz - cz);
        remain = 0;
      } else {
        remain += seg;
        cx = tx; cz = tz;
        seg = 0;
      }
    }
  }
  const last = pts[pts.length - 1], lp = out[out.length - 1];
  if (Math.hypot(last.x - lp.x, last.z - lp.z) > step * 0.4) out.push({ x: last.x, z: last.z });
  return out;
}

function findRoadPath(g, grid, A, B) {
  const N = grid.N, CELL = grid.CELL, hgt = grid.hgt, cost = grid.cost;
  const toI = v => Math.min(N - 1, Math.max(0, Math.floor((v + WORLD_HALF) / CELL)));
  const cxs = i => -WORLD_HALF + (i + 0.5) * CELL;

  /* 端点沿连线内缩，避免把路修进城里 / 村子中心 */
  let ax = A.x, az = A.z, bx = B.x, bz = B.z;
  let dx = bx - ax, dz = bz - az;
  const dd = Math.hypot(dx, dz) || 1;
  dx /= dd; dz /= dd;
  ax += dx * (A.r + 30); az += dz * (A.r + 30);
  bx -= dx * (B.r + 30); bz -= dz * (B.r + 30);

  const sx = toI(ax), sz = toI(az), tx = toI(bx), tz = toI(bz);
  const size = N * N;
  const gScore = new Float32Array(size).fill(Infinity);
  const prev = new Int32Array(size).fill(-1);
  const closed = new Uint8Array(size);
  const start = sz * N + sx, goal = tz * N + tx;

  const hd = (x, z) => {
    const ddx = Math.abs(x - tx), ddz = Math.abs(z - tz);
    return ddx + ddz - 0.5858 * Math.min(ddx, ddz);
  };

  const heap = [];
  gScore[start] = 0;
  roadHeapPush(heap, hd(sx, sz), start);
  let found = start === goal;
  while (heap.length) {
    const cur = roadHeapPop(heap).k;
    if (closed[cur]) continue;
    closed[cur] = 1;
    if (cur === goal) { found = true; break; }
    const cx = cur % N, cz = (cur / N) | 0;
    for (let oz = -1; oz <= 1; oz++) {
      for (let ox = -1; ox <= 1; ox++) {
        if (!ox && !oz) continue;
        const nx = cx + ox, nz = cz + oz;
        if (nx < 0 || nz < 0 || nx >= N || nz >= N) continue;
        const nk = nz * N + nx;
        if (closed[nk]) continue;
        const step = (ox && oz) ? 1.4142 : 1;
        const slope = Math.abs(hgt[nk] - hgt[cur]) / CELL;
        const ng = gScore[cur] + (cost[nk] + slope * 260) * step;
        if (ng < gScore[nk]) {
          gScore[nk] = ng;
          prev[nk] = cur;
          roadHeapPush(heap, ng + hd(nx, nz), nk);
        }
      }
    }
  }
  if (!found) return null;

  const cells = [];
  for (let k = goal; k !== -1; k = prev[k]) {
    cells.push(k);
    if (k === start) break;
  }
  cells.reverse();
  if (cells.length < 2) return null;

  let pts = cells.map(k => ({ x: cxs(k % N), z: cxs((k / N) | 0) }));
  pts[0] = { x: ax, z: az };
  pts[pts.length - 1] = { x: bx, z: bz };

  pts = chaikinPath(pts, 3);
  pts = resamplePath(pts, 26);

  const road = pts.map(p => ({ x: p.x, z: p.z, h: groundHeight(g, p.x, p.z) }));
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 1; i < road.length - 1; i++) {
      road[i].h = road[i - 1].h * 0.25 + road[i].h * 0.5 + road[i + 1].h * 0.25;
    }
  }
  for (const p of road) {
    p.bridge = p.h < WATER_LEVEL + 1.6;          // 原河床在水下 → 这一段要架桥
    if (p.h < WATER_LEVEL + 1.2) p.h = WATER_LEVEL + 1.2;
  }
  return road;
}

function genRoads(g, rng) {
  const nodes = [];
  /* 城市：路只修到城边缘（0.86 倍半径），城内另有自己的街区，避免与楼房穿模 */
  for (const c of g.cities) nodes.push({ x: c.x, z: c.z, r: Math.min(c.rx, c.rz) * 0.86 });
  for (const v of g.villages) nodes.push({ x: v.x, z: v.z, r: v.r * 0.7 });
  if (nodes.length < 2) return;

  const grid = buildRoadCostGrid(g);
  const edges = [];
  const inTree = [0];
  while (inTree.length < nodes.length) {
    let best = null;
    for (const i of inTree) {
      for (let j = 0; j < nodes.length; j++) {
        if (inTree.indexOf(j) >= 0) continue;
        const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].z - nodes[j].z);
        if (!best || d < best.d) best = { i, j, d };
      }
    }
    inTree.push(best.j);
    edges.push([best.i, best.j]);
  }

  /* 额外环路：在已连通的基础上再连若干条，形成回路（路网更密、更像真实乡村） */
  const already = (i, j) => edges.some(e => (e[0] === i && e[1] === j) || (e[0] === j && e[1] === i));
  const extra = Math.max(1, Math.round(nodes.length * 0.45));
  for (let k = 0; k < extra * 6 && edges.length < nodes.length - 1 + extra; k++) {
    const i = (rng() * nodes.length) | 0, j = (rng() * nodes.length) | 0;
    if (i === j || already(i, j)) continue;
    const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].z - nodes[j].z);
    if (d > 2600) continue;                      // 太远的斜线不连
    edges.push([i, j]);
  }

  for (const [i, j] of edges) {
    const path = findRoadPath(g, grid, nodes[i], nodes[j]);
    if (path && path.length > 1) g.roads.push(path);
  }
}

/* 城市街道与外部公路共用同一套平面布局，避免场景层和生成层各算一遍。 */
function cityRoadLayout(c) {
  const S = c.s || 1;
  const BS = 94 * S + 24, ROAD = 20 + 5 * S;
  const RX = c.rx, RZ = c.rz;
  const SW = 2.5 + S * 0.7;
  const xLines = [], zLines = [];
  const nx = Math.max(2, Math.floor((RX * 2) / BS));
  const nz = Math.max(2, Math.floor((RZ * 2) / BS));
  for (let k = 1; k < nx; k++) {
    const v = -RX + k * BS;
    const major = k % 3 === 0 || Math.abs(v) < BS * 0.55;
    xLines.push({ v, half: ROAD * (major ? 0.48 : 0.33), major });
  }
  for (let k = 1; k < nz; k++) {
    const v = -RZ + k * BS;
    const major = k % 3 === 0 || Math.abs(v) < BS * 0.55;
    zLines.push({ v, half: ROAD * (major ? 0.48 : 0.33), major });
  }
  for (const xl of xLines) {
    const hits = zLines.filter(zl =>
      (xl.v / RX) ** 2 + (zl.v / RZ) ** 2 <= 1.02 * 1.02);
    if (hits.length > 1) { xl.span0 = hits[0].v; xl.span1 = hits[hits.length - 1].v; }
  }
  for (const zl of zLines) {
    const hits = xLines.filter(xl =>
      (xl.v / RX) ** 2 + (zl.v / RZ) ** 2 <= 1.02 * 1.02);
    if (hits.length > 1) { zl.span0 = hits[0].v; zl.span1 = hits[hits.length - 1].v; }
  }
  return { S, BS, ROAD, plot: BS - ROAD, SW, xLines, zLines };
}

/* 城门式接入：从外圈直角路口沿水平/垂直街道方向引出，受限曲率弯入公路主线。 */
const ROAD_LINK_MIN_RADIUS = 85;
const ROAD_GATE_LEAD = 42;
const LINK_ASPHALT_HALF = 10.5;
const LINK_SHOULDER_HALF = 17;

function connectCityRoads(g) {
  const usedGates = new Map();
  const audit = { links: 0, trimmed: 0, maxCurvature: 0 };

  function cityForPoint(x, z) {
    let best = null;
    for (const c of g.cities) {
      const q = Math.hypot((x - c.x) / c.rx, (z - c.z) / c.rz);
      if (q > 1.3) continue;
      if (!best || q < best.q) best = { c, q };
    }
    return best && best.c;
  }

  function gatesFor(c) {
    const L = cityRoadLayout(c);
    const gates = [];
    for (const ln of L.xLines) {
      if (ln.span0 === undefined) continue;
      gates.push({ x: c.x + ln.v, z: c.z + ln.span0, dx: 0, dz: -1, half: ln.half, key: `${c.x}|x|${ln.v}|2` });
      gates.push({ x: c.x + ln.v, z: c.z + ln.span1, dx: 0, dz: 1, half: ln.half, key: `${c.x}|x|${ln.v}|3` });
    }
    for (const ln of L.zLines) {
      if (ln.span0 === undefined) continue;
      gates.push({ x: c.x + ln.span0, z: c.z + ln.v, dx: -1, dz: 0, half: ln.half, key: `${c.x}|z|${ln.v}|2` });
      gates.push({ x: c.x + ln.span1, z: c.z + ln.v, dx: 1, dz: 0, half: ln.half, key: `${c.x}|z|${ln.v}|3` });
    }
    return gates;
  }

  function curveStats(pts) {
    let maxCur = 0;
    for (let i = 1; i + 1 < pts.length; i++) {
      const ax = pts[i].x - pts[i - 1].x, az = pts[i].z - pts[i - 1].z;
      const bx = pts[i + 1].x - pts[i].x, bz = pts[i + 1].z - pts[i].z;
      const al = Math.hypot(ax, az), bl = Math.hypot(bx, bz);
      if (al < 1 || bl < 1) continue;
      const dot = Math.max(-1, Math.min(1, (ax * bx + az * bz) / (al * bl)));
      const angle = Math.acos(dot);
      maxCur = Math.max(maxCur, angle / ((al + bl) * 0.5));
    }
    return maxCur;
  }

  function buildConnector(c, gate, end, routeOut) {
    const dx = end.x - gate.x, dz = end.z - gate.z;
    const chord = Math.hypot(dx, dz);
    if (chord < 12) return null;
    const lead = Math.min(ROAD_GATE_LEAD, chord * 0.32);
    const gx = gate.x + gate.dx * lead, gz = gate.z + gate.dz * lead;
    let best = null;
    for (const kf of [0.52, 0.72, 0.92, 1.12]) {
      const K = Math.max(45, Math.min(260, chord * kf));
      const c1x = gx + gate.dx * K, c1z = gz + gate.dz * K;
      const c2x = end.x - routeOut.x * K, c2z = end.z - routeOut.z * K;
      const rawPts = [{ x: gate.x, z: gate.z }];
      const nLead = Math.max(2, Math.ceil(lead / 14));
      for (let i = 1; i <= nLead; i++) {
        const t = i / nLead;
        rawPts.push({ x: gate.x + (gx - gate.x) * t, z: gate.z + (gz - gate.z) * t });
      }
      for (let i = 1; i <= 72; i++) {
        const t = i / 72, u = 1 - t;
        rawPts.push({
          x: u * u * u * gx + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * end.x,
          z: u * u * u * gz + 3 * u * u * t * c1z + 3 * u * t * t * c2z + t * t * t * end.z
        });
      }
      const pts = resamplePath(rawPts, 13);
      let inside = 0;
      for (let i = 1; i < pts.length - 1; i++) {
        const q = Math.hypot((pts[i].x - c.x) / c.rx, (pts[i].z - c.z) / c.rz);
        if (q < 1.015) inside++;
      }
      const curv = curveStats(pts);
      const valid = curv <= 1 / ROAD_LINK_MIN_RADIUS;
      const score = pts.length * 13 + (1 - gate.dx * routeOut.x - gate.dz * routeOut.z) * 95 +
        (valid ? 0 : 4200) + inside * 160;
      if (!best || score < best.score) best = { pts, curv, valid, score };
    }
    return best;
  }

  function attachAt(ri, c, fromStart) {
    const road = g.roads[ri];
    if (road.length < 3) return;
    let edge = fromStart ? 0 : road.length - 1;
    const dir = fromStart ? 1 : -1;
    let ei = edge;
    while (ei !== (fromStart ? road.length - 1 : 0) &&
           Math.hypot((road[ei].x - c.x) / c.rx, (road[ei].z - c.z) / c.rz) < 1.055) {
      ei += dir;
    }
    if (Math.hypot((road[ei].x - c.x) / c.rx, (road[ei].z - c.z) / c.rz) < 1.015) return;
    const used = usedGates.get(c) || new Set();
    let best = null;
    const gates = gatesFor(c);
    for (let step = 0, scan = ei; step < 14; step++, scan += dir) {
      if (scan < 1 || scan >= road.length - 1) break;
      const end = road[scan];
      const next = road[scan + dir];
      let tx = next.x - end.x, tz = next.z - end.z;
      const tl = Math.hypot(tx, tz);
      if (tl < 1) continue;
      tx /= tl; tz /= tl;
      for (const gate of gates) {
        const r = buildConnector(c, gate, end, { x: tx, z: tz });
        if (!r) continue;
        const score = r.score + step * 18 + (used.has(gate.key) ? 160 : 0);
        if (!best || score < best.score) best = { gate, end, scan, ...r, score };
      }
      if (Math.hypot((end.x - c.x) / c.rx, (end.z - c.z) / c.rz) > 1.32) break;
    }
    if (!best) return;
    ei = best.scan;
    const end = best.end;
    const gate = best.gate;
    const line = best.pts.map((p, i) => {
      const t = i / Math.max(1, best.pts.length - 1);
      return {
        x: p.x, z: p.z, h: groundHeight(g, p.x, p.z), bridge: false,
        cityLink: true,
        asphaltHalf: gate.half + (LINK_ASPHALT_HALF - gate.half) * t,
        shoulderHalf: gate.half + 5.5 + (LINK_SHOULDER_HALF - gate.half - 5.5) * t
      };
    });
    line[0].h = groundHeight(g, gate.x, gate.z);
    line[line.length - 1].h = end.h;
    if (fromStart) {
      const tail = road.slice(ei + 1);
      g.roads[ri] = line.concat(tail);
    } else {
      const head = road.slice(0, ei);
      g.roads[ri] = head.concat(line.slice().reverse());
    }
    audit.links++;
    audit.trimmed += fromStart ? ei : road.length - 1 - ei;
    audit.maxCurvature = Math.max(audit.maxCurvature, best.curv);
    used.add(gate.key);
    usedGates.set(c, used);
  }

  for (let ri = 0; ri < g.roads.length; ri++) {
    let road = g.roads[ri];
    if (road.length < 3) continue;
    const ca = cityForPoint(road[0].x, road[0].z);
    if (ca) attachAt(ri, ca, true);
    road = g.roads[ri];
    const cb = cityForPoint(road[road.length - 1].x, road[road.length - 1].z);
    if (cb) attachAt(ri, cb, false);
  }
  g.cityLinkAudit = audit;
}

/* ---- 路网栅格场：把道路走廊压平成 O(1) 查询（供 terrainHeight 与布点使用） ---- */
function buildRoadField(g) {
  const N = Math.ceil((WORLD_HALF * 2) / ROAD_CELL);
  g.roadN = N; g.roadCell = ROAD_CELL;
  if (!g.roads.length) { g.roadW = null; g.roadH = null; return; }
  const W = new Float32Array(N * N), H = new Float32Array(N * N);
  for (const road of g.roads) {
    for (let i = 0; i < road.length - 1; i++) {
      const a = road[i], b = road[i + 1];
      const vx = b.x - a.x, vz = b.z - a.z;
      const vv = vx * vx + vz * vz || 1;
      const i0 = Math.max(0, Math.floor((Math.min(a.x, b.x) - ROAD_HALF_BLEND + WORLD_HALF) / ROAD_CELL));
      const i1 = Math.min(N - 1, Math.ceil((Math.max(a.x, b.x) + ROAD_HALF_BLEND + WORLD_HALF) / ROAD_CELL));
      const j0 = Math.max(0, Math.floor((Math.min(a.z, b.z) - ROAD_HALF_BLEND + WORLD_HALF) / ROAD_CELL));
      const j1 = Math.min(N - 1, Math.ceil((Math.max(a.z, b.z) + ROAD_HALF_BLEND + WORLD_HALF) / ROAD_CELL));
      for (let ix = i0; ix <= i1; ix++) {
        const px = -WORLD_HALF + (ix + 0.5) * ROAD_CELL;
        for (let iz = j0; iz <= j1; iz++) {
          const pz = -WORLD_HALF + (iz + 0.5) * ROAD_CELL;
          let t = ((px - a.x) * vx + (pz - a.z) * vz) / vv;
          t = t < 0 ? 0 : (t > 1 ? 1 : t);
          const d = Math.hypot(px - (a.x + vx * t), pz - (a.z + vz * t));
          if (d >= ROAD_HALF_BLEND) continue;
          const w = d <= ROAD_HALF_FLAT ? 1 : smoothstep(ROAD_HALF_BLEND, ROAD_HALF_FLAT, d);
          const k = ix * N + iz;
          if (w > W[k]) {
            if (groundHeight(g, px, pz) < WATER_LEVEL - 0.5) continue;   // 河床不填，留给桥梁
            W[k] = w; H[k] = a.h + (b.h - a.h) * t;
          }
        }
      }
    }
  }
  g.roadW = W; g.roadH = H;
}

/* 双线性采样路网场：返回压平权重，路面高度写入 _roadH */
function sampleRoadField(g, x, z) {
  const N = g.roadN;
  if (!N || !g.roadW) return 0;
  const fx = (x + WORLD_HALF) / ROAD_CELL - 0.5;
  const fz = (z + WORLD_HALF) / ROAD_CELL - 0.5;
  const ix = Math.floor(fx), iz = Math.floor(fz);
  if (ix < 0 || iz < 0 || ix >= N - 1 || iz >= N - 1) return 0;
  const tx = fx - ix, tz = fz - iz;
  const k = ix * N + iz;
  const W = g.roadW, H = g.roadH;
  const w00 = W[k] * (1 - tx) * (1 - tz);
  const w10 = W[k + N] * tx * (1 - tz);
  const w01 = W[k + 1] * (1 - tx) * tz;
  const w11 = W[k + N + 1] * tx * tz;
  const w = w00 + w10 + w01 + w11;
  if (w < 0.002) return 0;
  _roadH = (H[k] * w00 + H[k + N] * w10 + H[k + 1] * w01 + H[k + N + 1] * w11) / w;
  _roadW = w;
  return w;
}

function roadAt(g, x, z) { return sampleRoadField(g, x, z); }

/* ---- 公路桥设计层：先求桥跨与两岸标高，再由检测阶段统一修正 ---- */
const ROAD_BRIDGE_DECK = WATER_LEVEL + 10;
const ROAD_BRIDGE_MAX_GRADE = 0.045;
const ROAD_BRIDGE_MIN_RAMP = 90;
const ROAD_STRUCTURE_TOP = 0.30;   // 桥侧结构相对桥面基准的最高点
const ROAD_SURFACE_LIFT = 0.66;    // 沥青相对桥面基准的高度

function roadGroundHeight(g, x, z) {
  let h = groundHeight(g, x, z);
  if (g.roadN && g.roadW) {
    const w = sampleRoadField(g, x, z);
    if (w > 0) h = h * (1 - w) + _roadH * w;
  }
  return h;
}

function designRoadBridges(g) {
  const audit = { spans: 0, adjusted: 0, errors: [], minClearance: ROAD_SURFACE_LIFT - ROAD_STRUCTURE_TOP, maxRoadApproachGrade: 0 };
  for (const road of g.roads) {
    if (road.length < 2) continue;
    const base = road.map(p => roadGroundHeight(g, p.x, p.z));
    const dist = [0];
    for (let i = 1; i < road.length; i++) {
      dist[i] = dist[i - 1] + Math.hypot(road[i].x - road[i - 1].x, road[i].z - road[i - 1].z);
    }
    for (const p of road) {
      p.bridge = false;
      p.designH = undefined;
    }
    for (let i = 1; i < road.length - 1; i++) {
      const p = road[i];
      p.bridge = groundHeight(g, p.x, p.z) < WATER_LEVEL + 1.8 ||
        roadGroundHeight(g, p.x, p.z) < WATER_LEVEL + 1.2;
    }
    const groups = [];
    for (let i = 1; i < road.length - 1;) {
      if (!road[i].bridge) { i++; continue; }
      let e = i;
      while (e + 1 < road.length - 1 && road[e + 1].bridge) e++;
      if (e === i) {
        if (e + 1 < road.length - 1) e++;
        else i--;
      }
      groups.push({ s: i, e });
      i = e + 1;
    }
    for (const grp of groups) {
      const li = Math.max(0, grp.s - 1), ri = Math.min(road.length - 1, grp.e + 1);
      grp.deckY = Math.max(ROAD_BRIDGE_DECK, base[li] + 0.65, base[ri] + 0.65);
      for (let k = grp.s; k <= grp.e; k++) {
        road[k].bridge = true;
        road[k].designH = grp.deckY;
      }
      audit.spans++;
    }

    /* 引道按竖向缓变曲线分配长度：桥端斜率约为 0，外端回到地面。 */
    for (let gi = 0; gi < groups.length; gi++) {
      const grp = groups[gi];
      const sides = [
        { start: grp.s, end: gi > 0 ? groups[gi - 1].e + 1 : 0, dir: -1 },
        { start: grp.e, end: gi + 1 < groups.length ? groups[gi + 1].s - 1 : road.length - 1, dir: 1 }
      ];
      for (const side of sides) {
        const avail = Math.abs(dist[side.start] - dist[side.end]);
        if (avail < 1) continue;
        const bankH = base[side.end];
        const needed = Math.max(ROAD_BRIDGE_MIN_RAMP, Math.abs(grp.deckY - bankH) * 1.5 / ROAD_BRIDGE_MAX_GRADE);
        const L = Math.min(avail, needed);
        let outer = side.start;
        while (outer !== side.end && Math.abs(dist[outer] - dist[side.start]) < L) {
          outer += side.dir;
        }
        const actualL = Math.abs(dist[outer] - dist[side.start]);
        if (actualL < 1) continue;
        const outerH = base[outer];
        for (let j = side.start + side.dir; j !== outer + side.dir; j += side.dir) {
          if (road[j].bridge) break;
          const s = Math.min(1, Math.max(0, Math.abs(dist[j] - dist[side.start]) / actualL));
          const smooth = s * s * (3 - 2 * s);
          road[j].designH = grp.deckY + (outerH - grp.deckY) * smooth;
        }
        let prevIdx = side.start;
        for (let j = side.start + side.dir; j !== outer + side.dir; j += side.dir) {
          const d = Math.abs(dist[j] - dist[prevIdx]);
          if (d > 1) audit.maxRoadApproachGrade = Math.max(
            audit.maxRoadApproachGrade,
            Math.abs(road[j].designH - road[prevIdx].designH) / d);
          prevIdx = j;
        }
      }
    }
    for (let i = 0; i < road.length; i++) {
      if (road[i].designH === undefined) road[i].designH = base[i] + 0.12;
      road[i].h = road[i].designH;
    }
    /* 全局限坡做最终保险：桥跨固定，所有普通路段逐步爬升到桥面。 */
    for (let pass = 0; pass < 28; pass++) {
      for (let i = 1; i < road.length; i++) {
        if (road[i].bridge) continue;
        const d = Math.hypot(road[i].x - road[i - 1].x, road[i].z - road[i - 1].z);
        const step = Math.max(0.01, d * ROAD_BRIDGE_MAX_GRADE);
        road[i].designH = Math.max(road[i - 1].designH - step,
          Math.min(road[i - 1].designH + step, road[i].designH));
      }
      for (let i = road.length - 2; i >= 0; i--) {
        if (road[i].bridge) continue;
        const d = Math.hypot(road[i].x - road[i + 1].x, road[i].z - road[i + 1].z);
        const step = Math.max(0.01, d * ROAD_BRIDGE_MAX_GRADE);
        road[i].designH = Math.max(road[i + 1].designH - step,
          Math.min(road[i + 1].designH + step, road[i].designH));
      }
    }
    for (const p of road) p.h = p.designH;
    audit.maxRoadApproachGrade = 0;
    for (let i = 1; i < road.length; i++) {
      const d = Math.hypot(road[i].x - road[i - 1].x, road[i].z - road[i - 1].z);
      if (d > 1) audit.maxRoadApproachGrade = Math.max(
        audit.maxRoadApproachGrade, Math.abs(road[i].h - road[i - 1].h) / d);
    }

    /* 检测：桥跨必须水平、高于两岸，且结构顶面与沥青有固定净空。 */
    for (let i = 1; i < road.length - 1;) {
      if (!road[i].bridge) { i++; continue; }
      let e = i;
      while (e + 1 < road.length - 1 && road[e + 1].bridge) e++;
      let lo = Infinity, hi = -Infinity;
      for (let k = i; k <= e; k++) {
        lo = Math.min(lo, road[k].designH);
        hi = Math.max(hi, road[k].designH);
      }
      if (hi - lo > 0.02) {
        for (let k = i; k <= e; k++) {
          road[k].designH = hi;
          road[k].h = hi;
        }
        audit.adjusted++;
      }
      const bank = Math.max(base[Math.max(0, i - 1)], base[Math.min(road.length - 1, e + 1)]);
      if (hi < bank + 0.2) {
        const raise = bank + 0.65 - hi;
        for (let k = i; k <= e; k++) {
          road[k].designH += raise;
          road[k].h += raise;
        }
        audit.adjusted++;
      }
      const clearance = ROAD_SURFACE_LIFT - ROAD_STRUCTURE_TOP;
      if (clearance < 0.25) audit.errors.push('bridge structure clearance');
      i = e + 1;
    }
  }
  if (audit.maxRoadApproachGrade > 0.06) audit.errors.push('road bridge approach too steep');
  g.roadBridgeAudit = audit;
}

function auditBridgePlacement(g) {
  const audit = g.roadBridgeAudit || { spans: 0, adjusted: 0, errors: [], minClearance: ROAD_SURFACE_LIFT - ROAD_STRUCTURE_TOP };
  audit.railSpans = 0;
  audit.railHeightVariation = 0;
  audit.maxRailGrade = 0;
  audit.maxRailApproachGrade = 0;
  audit.maxRailGradeAt = 0;
  for (const line of (g.railways || [])) {
    for (let i = 1; i < line.length; i++) {
      const d = Math.hypot(line[i].x - line[i - 1].x, line[i].z - line[i - 1].z);
      if (d > 1) {
        const gr = Math.abs(line[i].h - line[i - 1].h) / d;
        if (gr > audit.maxRailGrade) {
          audit.maxRailGrade = gr;
          audit.maxRailGradeAt = i;
        }
      }
    }
    for (let i = 0; i < line.length;) {
      if (!line[i].bridge) { i++; continue; }
      let e = i;
      while (e + 1 < line.length && line[e + 1].bridge) e++;
      let lo = Infinity, hi = -Infinity;
      for (let k = i; k <= e; k++) {
        lo = Math.min(lo, line[k].h);
        hi = Math.max(hi, line[k].h);
      }
      audit.railSpans++;
      audit.railHeightVariation = Math.max(audit.railHeightVariation, hi - lo);
      if (hi - lo > 0.02) audit.errors.push('rail bridge not level');
      for (const side of [{ start: i, dir: -1 }, { start: e, dir: 1 }]) {
        let prev = side.start;
        for (let k = side.start + side.dir; k >= 0 && k < line.length; k += side.dir) {
          if (line[k].bridge || line[k].anchor) break;
          const d = Math.hypot(line[k].x - line[prev].x, line[k].z - line[prev].z);
          if (d > 1) audit.maxRailApproachGrade = Math.max(
            audit.maxRailApproachGrade,
            Math.abs(line[k].h - line[prev].h) / d);
          prev = k;
        }
      }
      i = e + 1;
    }
  }
  if (audit.maxRailGrade > RAIL_MAX_GRADE + 1e-5) audit.errors.push('rail grade exceeds limit');
  if (audit.maxRailApproachGrade > RAIL_MAX_GRADE + 1e-5) {
    audit.errors.push('rail bridge approach too steep');
  }
  g.bridgeAudit = audit;
}

/* ---- 铁路：城市外缘车站 + A* 选定城际走廊 ---- */
const RAIL_GRID_N = 96;
const RAIL_CLEAR = 26;
const RAIL_FIELD_CELL = 10;
const RAIL_HALF_FLAT = 14;
const RAIL_HALF_BLEND = 30;
const RAIL_APPROACH_GRADE = 0.040;
const RAIL_MAX_GRADE = 0.200;
const RAIL_MIN_APPROACH = 100;
const RAIL_MIN_CURVE_RADIUS = 60;

let _railW = 0, _railH = 0;

/* 铁路地坪场：线路与站场范围内的地形压到轨下，避免轨道切进山坡。 */
function buildRailField(g) {
  const N = Math.ceil((WORLD_HALF * 2) / RAIL_FIELD_CELL);
  g.railN = N; g.railCell = RAIL_FIELD_CELL;
  if (!(g.railways && g.railways.length)) {
    g.railW = null; g.railH = null;
    return;
  }
  const W = new Float32Array(N * N), H = new Float32Array(N * N);
  const D = new Float32Array(N * N).fill(Infinity);
  const mark = (px, pz, target, d) => {
    if (Math.abs(px) >= WORLD_HALF || Math.abs(pz) >= WORLD_HALF) return;
    if (d >= RAIL_HALF_BLEND) return;
    const w = d <= RAIL_HALF_FLAT
      ? 1
      : smoothstep(RAIL_HALF_BLEND, RAIL_HALF_FLAT, d);
    const ix = Math.floor((px + WORLD_HALF) / RAIL_FIELD_CELL);
    const iz = Math.floor((pz + WORLD_HALF) / RAIL_FIELD_CELL);
    if (ix < 0 || iz < 0 || ix >= N || iz >= N) return;
    const k = ix * N + iz;
    if (d < D[k]) {
      D[k] = d;
      W[k] = w;
      H[k] = target;
    }
  };

  for (const line of g.railways) {
    for (let i = 1; i < line.length; i++) {
      const a = line[i - 1], b = line[i];
      if (a.bridge || b.bridge) continue;
      const vx = b.x - a.x, vz = b.z - a.z;
      const vv = vx * vx + vz * vz || 1;
      /* 轨面参考线比地坪高 0.1m，压平目标保留这一点高差。 */
      const ha = a.h - 0.1, hb = b.h - 0.1;
      const x0 = Math.max(-WORLD_HALF, Math.min(a.x, b.x) - RAIL_HALF_BLEND);
      const x1 = Math.min(WORLD_HALF, Math.max(a.x, b.x) + RAIL_HALF_BLEND);
      const z0 = Math.max(-WORLD_HALF, Math.min(a.z, b.z) - RAIL_HALF_BLEND);
      const z1 = Math.min(WORLD_HALF, Math.max(a.z, b.z) + RAIL_HALF_BLEND);
      const i0 = Math.max(0, Math.floor((x0 + WORLD_HALF) / RAIL_FIELD_CELL));
      const i1 = Math.min(N - 1, Math.ceil((x1 + WORLD_HALF) / RAIL_FIELD_CELL));
      const j0 = Math.max(0, Math.floor((z0 + WORLD_HALF) / RAIL_FIELD_CELL));
      const j1 = Math.min(N - 1, Math.ceil((z1 + WORLD_HALF) / RAIL_FIELD_CELL));
      for (let ix = i0; ix <= i1; ix++) {
        const px = -WORLD_HALF + (ix + 0.5) * RAIL_FIELD_CELL;
        for (let iz = j0; iz <= j1; iz++) {
          const pz = -WORLD_HALF + (iz + 0.5) * RAIL_FIELD_CELL;
          let t = ((px - a.x) * vx + (pz - a.z) * vz) / vv;
          t = t < 0 ? 0 : (t > 1 ? 1 : t);
          const d = Math.hypot(px - (a.x + vx * t), pz - (a.z + vz * t));
          mark(px, pz, ha + (hb - ha) * t, d);
        }
      }
    }
  }

  g.railW = W; g.railH = H;
}

/* 道路 / 铁路全宽穿模审计：检测最终高度场是否高过路面，并在走廊内向下修正。 */
function auditTransportClearance(g) {
  const f = g.heightGrid;
  if (!f) return;
  const audit = {
    roadRepairs: 0, railRepairs: 0,
    roadSamples: 0, railSamples: 0,
    maxRoadPenetration: 0, maxRailPenetration: 0
  };
  const lowerAt = (x, z, target, core, blend) => {
    const minIx = Math.max(0, Math.floor((x - core - blend - f.x0) / f.dx));
    const maxIx = Math.min(f.n - 1, Math.ceil((x + core + blend - f.x0) / f.dx));
    const minIz = Math.max(0, Math.floor((z - core - blend - f.z0) / f.dz));
    const maxIz = Math.min(f.n - 1, Math.ceil((z + core + blend - f.z0) / f.dz));
    const want = target - 0.12;
    let changed = 0;
    for (let iz = minIz; iz <= maxIz; iz++) {
      const pz = f.z0 + iz * f.dz;
      for (let ix = minIx; ix <= maxIx; ix++) {
        const px = f.x0 + ix * f.dx;
        const d = Math.hypot(px - x, pz - z);
        if (d > core + blend) continue;
        const k = iz * f.n + ix;
        if (f.data[k] <= want) continue;
        if (d <= core) {
          f.data[k] = want;
        } else {
          const w = smoothstep(core + blend, core, d);
          const blended = f.data[k] * (1 - w) + want * w;
          f.data[k] = Math.min(f.data[k], blended);
        }
        changed++;
      }
    }
    return changed;
  };

  for (const road of g.roads) {
    for (let i = 0; i < road.length; i++) {
      const p = road[i];
      if (!p) continue;
      const h = p.designH !== undefined ? p.designH : p.h;
      const half = p.asphaltHalf || 10.5;
      const core = (p.shoulderHalf || 17) + 2.0;
      audit.roadRepairs += lowerAt(p.x, p.z, h, core, ROAD_HALF_BLEND);
      if (i + 1 < road.length) {
        const q = road[i + 1];
        const qh = q.designH !== undefined ? q.designH : q.h;
        const qcore = (q.shoulderHalf || 17) + 2.0;
        audit.roadRepairs += lowerAt((p.x + q.x) * 0.5, (p.z + q.z) * 0.5,
          (h + qh) * 0.5, (core + qcore) * 0.5,
          ROAD_HALF_BLEND);
      }
    }
  }
  for (const line of (g.railways || [])) {
    for (let i = 0; i < line.length; i++) {
      const p = line[i];
      if (!p) continue;
      audit.railRepairs += lowerAt(p.x, p.z, p.h - 0.25, 9.0, RAIL_HALF_BLEND + 18);
      if (i + 1 < line.length) {
        const q = line[i + 1];
        audit.railRepairs += lowerAt((p.x + q.x) * 0.5, (p.z + q.z) * 0.5,
          (p.h + q.h) * 0.5 - 0.25, 9.0, RAIL_HALF_BLEND + 18);
      }
    }
  }

  const inspect = (x, z, surface) => {
    const ground = sampleHeightGrid(f, x, z);
    return Math.max(0, ground - surface);
  };
  for (const road of g.roads) {
    for (const p of road) {
      const h = p.designH !== undefined ? p.designH : p.h;
      const half = (p.asphaltHalf || 10.5) * 0.82;
      const dx = half * 0.707, dz = half * 0.707;
      audit.maxRoadPenetration = Math.max(audit.maxRoadPenetration,
        inspect(p.x, p.z, h + 0.66),
        inspect(p.x + dx, p.z - dz, h + 0.66),
        inspect(p.x - dx, p.z + dz, h + 0.66));
      audit.roadSamples += 3;
    }
  }
  for (const line of (g.railways || [])) {
    for (const p of line) {
      audit.maxRailPenetration = Math.max(audit.maxRailPenetration,
        inspect(p.x, p.z, p.h + 0.1),
        inspect(p.x + 3.2, p.z, p.h + 0.1),
        inspect(p.x - 3.2, p.z, p.h + 0.1));
      audit.railSamples += 3;
    }
  }
  g.transportAudit = audit;
}

function sampleRailField(g, x, z) {
  const N = g.railN;
  if (!N || !g.railW) return 0;
  const fx = (x + WORLD_HALF) / RAIL_FIELD_CELL - 0.5;
  const fz = (z + WORLD_HALF) / RAIL_FIELD_CELL - 0.5;
  const ix = Math.floor(fx), iz = Math.floor(fz);
  if (ix < 0 || iz < 0 || ix >= N - 1 || iz >= N - 1) return 0;
  const tx = fx - ix, tz = fz - iz;
  const k = ix * N + iz;
  const W = g.railW, H = g.railH;
  const w00 = W[k] * (1 - tx) * (1 - tz);
  const w10 = W[k + N] * tx * (1 - tz);
  const w01 = W[k + 1] * (1 - tx) * tz;
  const w11 = W[k + N + 1] * tx * tz;
  const w = w00 + w10 + w01 + w11;
  if (w < 0.002) return 0;
  _railH = (H[k] * w00 + H[k + N] * w10 + H[k + 1] * w01 + H[k + N + 1] * w11) / w;
  _railW = w;
  return w;
}

function railNear(g, x, z, pad) {
  const clear = pad === undefined ? RAIL_CLEAR : pad;
  for (const line of (g.railways || [])) {
    for (let i = 0; i < line.length - 1; i++) {
      const a = line[i], b = line[i + 1];
      const vx = b.x - a.x, vz = b.z - a.z;
      const vv = vx * vx + vz * vz || 1;
      let t = ((x - a.x) * vx + (z - a.z) * vz) / vv;
      t = t < 0 ? 0 : (t > 1 ? 1 : t);
      if (Math.hypot(x - (a.x + vx * t), z - (a.z + vz * t)) < clear) return true;
    }
  }
  for (const st of (g.railStations || [])) {
    if (Math.hypot(x - st.x, z - st.z) < (st.r || 60) + clear) return true;
  }
  return false;
}

function stationSiteOK(g, x, z, rot, len, wid) {
  const c = Math.cos(rot), s = Math.sin(rot);
  for (const lx of [-len * 0.48, 0, len * 0.48]) {
    for (const lz of [-wid * 0.34, 0, wid * 0.72]) {
      const px = x + c * lx + s * lz;
      const pz = z - s * lx + c * lz;
      if (Math.abs(px) > WORLD_HALF - 80 || Math.abs(pz) > WORLD_HALF - 80) return false;
      if (groundHeight(g, px, pz) < WATER_LEVEL + 7) return false;
      if (roadAt(g, px, pz) > 0.025) return false;
      for (const v of g.villages) {
        if (Math.hypot(px - v.x, pz - v.z) < v.r + 70) return false;
      }
    }
  }
  return true;
}

function genRailways(g, rng) {
  g.railStations = [];
  g.railways = [];
  if (!g.cities.length) return;
  const stationWaterAt = (x, z) => {
    if (groundHeight(g, x, z) < WATER_LEVEL + 2.4) return true;
    for (const r of g.rivers) {
      const c = r.dir === 'z' ? z : x;
      const cen = r.base + Math.sin(c * r.f1 + r.ph1) * r.a1 +
        Math.sin(c * r.f2 + r.ph2) * r.a2;
      if (Math.abs((r.dir === 'z' ? x : z) - cen) < r.w * 3.1) return true;
    }
    for (const l of g.lakes) {
      if (Math.hypot(x - l.x, z - l.z) < l.r * 1.16) return true;
    }
    return false;
  };
  const stationClearEnds = (x, z, rot, len) => {
    const ux = Math.cos(rot), uz = -Math.sin(rot);
    let clear = 0;
    for (const sign of [-1, 1]) {
      let ok = true;
      for (let d = len * 0.46 + 14; d <= len * 0.46 + 220; d += 18) {
        const px = x + ux * sign * d, pz = z + uz * sign * d;
        if (roadAt(g, px, pz) > 0.012 || stationWaterAt(px, pz)) { ok = false; break; }
      }
      if (ok) clear++;
    }
    return clear;
  };
  const stationOptions = [];
  const makeStationAt = (x, z, ci, target, stationRot, len, wid, forced) => {
    let hSum = 0, hN = 0;
    const hc = Math.cos(stationRot), hs = Math.sin(stationRot);
    for (let sx = -1; sx <= 1; sx++) {
      for (let sz = -1; sz <= 1; sz++) {
        const hx = x + hc * sx * len * 0.34 + hs * sz * wid * 0.34;
        const hz = z - hs * sx * len * 0.34 + hc * sz * wid * 0.34;
        hSum += groundHeight(g, hx, hz);
        hN++;
      }
    }
    return {
      x, z, rot: stationRot, h: hSum / hN, len, wid,
      cityIndex: ci, targetIndex: target, r: Math.max(len, wid) * 0.55,
      clearEnds: stationClearEnds(x, z, stationRot, len),
      forced: !!forced
    };
  };

  for (let ci = 0; ci < g.cities.length; ci++) {
    const ct = g.cities[ci];
    let target = -1, best = Infinity;
    for (let j = 0; j < g.cities.length; j++) {
      if (j === ci) continue;
      const d = Math.hypot(g.cities[j].x - ct.x, g.cities[j].z - ct.z);
      if (d < best) { best = d; target = j; }
    }
    const baseAng = target >= 0
      ? Math.atan2(g.cities[target].z - ct.z, g.cities[target].x - ct.x)
      : rng() * 6.2832;
    let opts = [];
    const offsets = [0, 0.18, -0.18, 0.36, -0.36, 0.54, -0.54, 0.72, -0.72];
    for (let t = 0; t < 120; t++) {
      const off = t < offsets.length ? offsets[t] : (rng() - 0.5) * 1.12;
      const ang = baseAng + off + (t ? (rng() - 0.5) * 0.045 : 0);
      const c = Math.cos(ang), s = Math.sin(ang);
      const boundary = 1 / Math.sqrt((c / ct.rx) ** 2 + (s / ct.rz) ** 2);
      const dist = boundary * 1.10 + 82 + rng() * 30;
      const x = ct.x + c * dist, z = ct.z + s * dist;
      const len = 138 + rng() * 34, wid = 58 + rng() * 10;
      const stationRot = -ang;
      if (!stationSiteOK(g, x, z, stationRot, len, wid)) continue;
      opts.push(makeStationAt(x, z, ci, target, stationRot, len, wid, false));
    }
    /* 城市被山、水或既有道路夹住时，站址必须仍有保底解；不能因为筛选过严让整座城市失去铁路。 */
    if (!opts.length) {
      let best = null;
      const spans = [[132, 54], [118, 48], [104, 42]];
      for (let pass = 0; pass < spans.length; pass++) {
        const len = spans[pass][0], wid = spans[pass][1];
        for (let t = 0; t < 72; t++) {
          const ang = baseAng + t / 72 * Math.PI * 2 + (rng() - 0.5) * 0.025;
          const c = Math.cos(ang), s = Math.sin(ang);
          const boundary = 1 / Math.sqrt((c / ct.rx) ** 2 + (s / ct.rz) ** 2);
          const dist = boundary * (1.075 + pass * 0.035) + 68 + (t % 5) * 18;
          const x = ct.x + c * dist, z = ct.z + s * dist;
          if (Math.abs(x) > WORLD_HALF - 72 || Math.abs(z) > WORLD_HALF - 72) continue;
          const stationRot = -ang;
          const made = makeStationAt(x, z, ci, target, stationRot, len, wid, true);
          let penalty = Math.abs(made.h - groundHeight(g, ct.x, ct.z)) * 4;
          const hc = Math.cos(stationRot), hs = Math.sin(stationRot);
          for (const lx of [-len * 0.48, 0, len * 0.48]) {
            for (const lz of [-wid * 0.34, 0, wid * 0.72]) {
              const px = x + hc * lx + hs * lz;
              const pz = z - hs * lx + hc * lz;
              const gh = groundHeight(g, px, pz);
              if (gh < WATER_LEVEL + 7) penalty += (WATER_LEVEL + 7 - gh) * 260;
              if (roadAt(g, px, pz) > 0.025) penalty += 900;
              for (const v of g.villages) {
                const d = Math.hypot(px - v.x, pz - v.z);
                if (d < v.r + 70) penalty += (v.r + 70 - d) * 6;
              }
            }
          }
          penalty -= made.clearEnds * 450;
          if (!best || penalty < best.penalty) best = { station: made, penalty };
        }
      }
      if (best) opts.push(best.station);
      else {
        const c = Math.cos(baseAng), s = Math.sin(baseAng);
        const boundary = 1 / Math.sqrt((c / ct.rx) ** 2 + (s / ct.rz) ** 2);
        const x = ct.x + c * (boundary * 1.08 + 64);
        const z = ct.z + s * (boundary * 1.08 + 64);
        opts.push(makeStationAt(x, z, ci, target, -baseAng, 104, 42, true));
      }
    }
    opts.sort((a, b) => b.clearEnds - a.clearEnds ||
      Math.hypot(a.x - ct.x, a.z - ct.z) - Math.hypot(b.x - ct.x, b.z - ct.z));
    opts = opts.slice(0, 3);
    stationOptions.push(opts);
  }
  if (g.cities.length < 2) {
    const st = stationOptions[0][0];
    const ux = Math.cos(st.rot), uz = -Math.sin(st.rot);
    const spur = [];
    for (let k = -4; k <= 4; k++) {
      spur.push({
        x: st.x + ux * k * st.len * 0.085,
        z: st.z + uz * k * st.len * 0.085,
        h: st.h + 0.1, bridge: false, overRoad: false,
        span: false, ramp: false, anchor: Math.abs(k) === 4,
        stationEnd: Math.abs(k) === 4
      });
    }
    g.railStations = [st];
    g.railways.push(spur);
    g.railTopologyAudit = {
      stationCount: 1, cityCount: 1, edgeCount: 0,
      connectedEdges: 0, disconnectedEdges: 0, reconstructedLinks: 1,
      extraConnections: 0, emergencyConnections: 0,
      servedCities: 1, connectedCities: 1, unservedCities: 0,
      minCurveRadius: RAIL_MIN_CURVE_RADIUS, pathCurves: [Infinity]
    };
    return;
  }

  /* 先确定城市连通树，再为每城固定一个车站，避免同一城市的不同线路各接一套站台。 */
  const edges = [];
  const tree = [0];
  while (tree.length < g.cities.length) {
    let best = null;
    for (const i of tree) for (let j = 0; j < g.cities.length; j++) {
      if (tree.indexOf(j) >= 0) continue;
      const d = Math.hypot(g.cities[i].x - g.cities[j].x, g.cities[i].z - g.cities[j].z);
      if (!best || d < best.d) best = { i, j, d };
    }
    if (!best) break;
    tree.push(best.j);
    edges.push([best.i, best.j]);
  }
  const N = RAIL_GRID_N, CELL = (WORLD_HALF * 2) / N;
  const hgt = new Float32Array(N * N);
  const cost = new Float32Array(N * N);
  for (let ix = 0; ix < N; ix++) {
    const x = -WORLD_HALF + (ix + 0.5) * CELL;
    for (let iz = 0; iz < N; iz++) {
      const z = -WORLD_HALF + (iz + 0.5) * CELL;
      const h = groundHeight(g, x, z);
      let c = 1;
      if (h < WATER_LEVEL + 3) c += 1800;
      if (h > 320) c += (h - 320) * 7;
      if (roadAt(g, x, z) > 0.018) c += 3800;
      for (const ct of g.cities) {
        if (Math.hypot((x - ct.x) / ct.rx, (z - ct.z) / ct.rz) < 1.035) { c += 9000; break; }
      }
      for (const v of g.villages) {
        if (Math.hypot(x - v.x, z - v.z) < v.r + 80) { c += 16000; break; }
      }
      const k = ix * N + iz;
      hgt[k] = h; cost[k] = c;
    }
  }

  const railWaterAt = (x, z) => {
    if (groundHeight(g, x, z) < WATER_LEVEL + 2.4) return true;
    for (const r of g.rivers) {
      const c = r.dir === 'z' ? z : x;
      const cen = r.base + Math.sin(c * r.f1 + r.ph1) * r.a1 +
        Math.sin(c * r.f2 + r.ph2) * r.a2;
      if (Math.abs((r.dir === 'z' ? x : z) - cen) < r.w * 3.1) return true;
    }
    for (const l of g.lakes) {
      if (Math.hypot(x - l.x, z - l.z) < l.r * 1.16) return true;
    }
    return false;
  };

  const relaxRailPath = (pts, minRadius) => {
    for (let pass = 0; pass < 40; pass++) {
      let changed = false;
      const cp = pts.map(p => ({ x: p.x, z: p.z }));
      for (let i = 1; i + 1 < pts.length; i++) {
        const ax = cp[i].x - cp[i - 1].x, az = cp[i].z - cp[i - 1].z;
        const bx = cp[i + 1].x - cp[i].x, bz = cp[i + 1].z - cp[i].z;
        const al = Math.hypot(ax, az), bl = Math.hypot(bx, bz);
        if (al < 1 || bl < 1) continue;
        const dot = Math.max(-1, Math.min(1, (ax * bx + az * bz) / (al * bl)));
        const radius = Math.acos(dot) > 1e-6 ? ((al + bl) * 0.5) / Math.acos(dot) : Infinity;
        if (radius >= minRadius) continue;
        const w = Math.min(0.58, 0.18 + (minRadius - radius) / minRadius * 0.6);
        pts[i].x = cp[i].x * (1 - w) + (cp[i - 1].x + cp[i + 1].x) * 0.5 * w;
        pts[i].z = cp[i].z * (1 - w) + (cp[i - 1].z + cp[i + 1].z) * 0.5 * w;
        changed = true;
      }
      if (!changed) break;
    }
    return pts;
  };

  const levelRailBridgeGroups = path => {
    for (let i = 1; i < path.length - 1;) {
      if (!path[i] || !path[i].bridge) { i++; continue; }
      let e = i;
      while (e + 1 < path.length - 1 && path[e + 1].bridge) e++;
      let deckY = WATER_LEVEL + 8;
      for (let k = i; k <= e; k++) deckY = Math.max(deckY, path[k].h);
      for (let k = i; k <= e; k++) {
        path[k].h = deckY;
        path[k].span = true;
        path[k].ramp = false;
      }
      i = e + 1;
    }
    return path;
  };

  const gradeRailBridgeApproaches = path => {
    for (let i = 1; i < path.length - 1;) {
      if (!path[i] || !path[i].bridge) { i++; continue; }
      let e = i;
      while (e + 1 < path.length - 1 && path[e + 1].bridge) e++;
      for (const side of [{ start: i, dir: -1 }, { start: e, dir: 1 }]) {
        let prev = side.start;
        for (let k = side.start + side.dir; k >= 0 && k < path.length; k += side.dir) {
          if (path[k].bridge || path[k].anchor) break;
          const step = Math.hypot(path[k].x - path[prev].x, path[k].z - path[prev].z) *
            RAIL_APPROACH_GRADE;
          path[k].h = Math.max(path[k].h, path[prev].h - step);
          prev = k;
        }
      }
      i = e + 1;
    }
    return path;
  };

  /* 全里程纵断面约束：站台端点和桥面为硬约束，其余节点做双向坡度投影。 */
  const solveRailVertical = path => {
    const n = path.length;
    if (n < 2) return false;
    let h = new Float64Array(n);
    const pinned = new Uint8Array(n);
    const groupOf = new Int32Array(n).fill(-1);
    const groups = [];

    for (let i = 0; i < n; i++) {
      h[i] = groundHeight(g, path[i].x, path[i].z) + 0.15;
    }
    h[0] = path[0].h;
    h[n - 1] = path[n - 1].h;
    pinned[0] = pinned[n - 1] = 1;

    for (let i = 1; i < n;) {
      if (!path[i] || !path[i].bridge) { i++; continue; }
      const s = i;
      while (i + 1 < n && path[i + 1].bridge) i++;
