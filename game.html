  effects.push({
    type: 'ball', mesh: m, ownsGeo: false, ownsMat: true,
    life: 0, dur: 0.07, base: 1.6
  });
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bu = bullets[i];
    bu.age += dt;

    const stepLen = bu.vel.length() * dt;
    const steps = Math.max(1, Math.ceil(stepLen / 6));
    let removed = false;

    for (let s = 0; s < steps; s++) {
      bu.mesh.position.addScaledVector(bu.vel, dt / steps);

      const p = bu.mesh.position;
      const gh = terrainHeight(p.x, p.z);
      if (p.y < gh) {
        spawnHitSpark(p);
        scene.remove(bu.mesh);
        bullets.splice(i, 1);
        removed = true;
        break;
      }

      const nearby = queryBuildings(p.x, p.z, 30);
      for (let j = 0; j < nearby.length; j++) {
        const b = nearby[j];
        if (b.dead) continue;
        if (p.x > b.x - b.hw && p.x < b.x + b.hw &&
            p.z > b.z - b.hd && p.z < b.z + b.hd &&
            p.y > b.y0 && p.y < b.y1) {
          hitByBullet(b, p.clone());
          scene.remove(bu.mesh);
          bullets.splice(i, 1);
          removed = true;
          break;
        }
      }

      /* 树木 / 电线杆 / 车站模块 */
      if (!removed) {
        const props = queryPropTargets(p.x, p.z, 58);
        for (let j = 0; j < props.length; j++) {
          const t = props[j];
          if (!propPointHit(t, p)) continue;
          hitSceneryTarget(t, p.clone());
          scene.remove(bu.mesh);
          bullets.splice(i, 1);
          removed = true;
          break;
        }
      }

      /* 列车车厢 */
      if (!removed) {
        for (let j = 0; j < trainTargets.length; j++) {
          const t = trainTargets[j];
          if (!trainCarPointHit(t, p)) continue;
          hitSceneryTarget(t, p.clone());
          scene.remove(bu.mesh);
          bullets.splice(i, 1);
          removed = true;
          break;
        }
      }

      /* 命中敌方单位（防空机枪 / 导弹阵地 / 敌机） */
      if (!removed) {
        for (let j = 0; j < aaaGuns.length; j++) {
          const g = aaaGuns[j];
          if (g.dead) continue;
          if (p.distanceToSquared(_u2.set(g.x, g.baseY + 3.0, g.z)) < 81) {
            g.hp--;
            if (g.hp <= 0) destroyAAA(g); else spawnHitSpark(p);
            scene.remove(bu.mesh);
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
      }
      if (!removed) {
        for (let j = 0; j < samSites.length; j++) {
          const s = samSites[j];
          if (s.dead) continue;
          if (p.distanceToSquared(_u2.set(s.x, s.baseY + 8.0, s.z)) < 576) {
            s.hp--;
            if (s.hp <= 0) destroySAM(s); else spawnHitSpark(p);
            scene.remove(bu.mesh);
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
      }
      if (!removed) {
        for (let j = 0; j < enemies.length; j++) {
          const en = enemies[j];
          if (en.dead) continue;
          if (p.distanceToSquared(en.mesh.position) < 81) {
            en.hp--;
            if (en.hp <= 0) destroyEnemy(en, true); else spawnHitSpark(p);
            scene.remove(bu.mesh);
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
      }

      if (removed) break;
    }

    if (removed) continue;

    if (bu.age > 2.2) {
      scene.remove(bu.mesh);
      bullets.splice(i, 1);
    }
  }
}

/* 双坡屋面（三棱柱）几何：底面宽 1.732r、脊高 1.5r、长 2L（小房子屋顶用） */
function makePrismGeo(r, L) {
  const w = r * 0.8660254, b = -r * 0.5, t = r;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    0, t, -L,   -w, b, -L,   w, b, -L,
    0, t,  L,    w, b,  L,  -w, b,  L,
  ]), 3));
  g.setIndex([0, 2, 1, 3, 4, 5, 0, 1, 5, 0, 5, 3, 0, 3, 4, 0, 4, 2]);
  g.computeVertexNormals();
  return g;
}

function makeHouse(w, h, d, wallMat, roofMat, ry) {
  const house = new THREE.Group();
  const walls = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  walls.position.y = h / 2 + 0.1;
  house.add(walls);
  const r = w * 0.62;
  const roof = new THREE.Mesh(makePrismGeo(r, d * 0.58), roofMat);
  roof.position.y = h + 0.1 + r * 0.5;
  house.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.72, 0.07), M_H_DOOR);
  door.position.set(w * 0.2, 0.56, d / 2 + 0.05);
  house.add(door);
  house.rotation.y = ry;
  return house;
}

/* 让物体的 -Z 朝向 dir（可带滚转） */
const _oF = new THREE.Vector3(), _oR = new THREE.Vector3();

function orientToward(obj, dir, bank) {
  _oF.copy(dir).normalize();
  _oR.crossVectors(_oF, _worldUp);
  if (_oR.lengthSq() < 1e-6) _oR.set(1, 0, 0); else _oR.normalize();
  _oU.crossVectors(_oR, _oF).normalize();
  if (bank) {
    _oQ.setFromAxisAngle(_oF, bank);
    _oR.applyQuaternion(_oQ);
    _oU.applyQuaternion(_oQ);
  }
  _oB.copy(_oF).negate();
  _oM.makeBasis(_oR, _oU, _oB);
  obj.quaternion.setFromRotationMatrix(_oM);
}

function enableEntityShadows(root) {
  if (!root) return;
  root.traverse(object => {
    if (!object.isMesh || !object.material) return;
    const materials = Array.isArray(object.material) ? object.material : [object.material];
    let castable = false, receives = false;
    for (const material of materials) {
      if (!material || material.visible === false) continue;
      if (material.blending !== THREE.AdditiveBlending && material.depthWrite !== false) {
        castable = true;
      }
      if (!material.transparent || material.opacity >= 0.75) receives = true;
    }
    if (castable) object.castShadow = true;
    if (receives) object.receiveShadow = true;
  });
}

    Math.min(880, Math.max(320, plane.position.y + (Math.random() - 0.5) * 320)), ez);

/* 迭代求拦截点（写入 _u3）：|目标位置 + 目标速度·t − 炮口| = 弹速·t */
function leadTarget(muzzle, bulletSpd, tPos, tVel) {
  _u4.copy(tVel);
  let t = _u3.copy(tPos).distanceTo(muzzle) / bulletSpd;
  for (let k = 0; k < 2; k++) {
    _u3.copy(tPos).addScaledVector(_u4, t);
    t = _u3.distanceTo(muzzle) / bulletSpd;
  }
  _u3.copy(tPos).addScaledVector(_u4, t);
  return _u3;
}

/* ---- 防空机枪更新：跟踪 + 连发 ---- */
function fireAAAShot(gun) {
  gun.mesh.updateMatrixWorld(true);
  gun.mzIdx = (gun.mzIdx + 1) % gun.muzzles.length;   // 四管交替喷火
  const mz = gun.muzzles[gun.mzIdx];
  _u1.setFromMatrixPosition(mz.matrixWorld);

  const dist = _u1.distanceTo(plane.position);
  _vt.copy(getForward()).multiplyScalar(curSpeed());
  leadTarget(_u1, THREAT_BULLET_SPD, plane.position, _vt);
  _u2.subVectors(_u3, _u1).normalize();

  spawnThreatBullet(_u1.clone(), _u2, THREAT_BULLET_SPD, 0.025);
  const vol = Math.max(0, 1 - dist / 1500);
  if (vol > 0.06) Sound.aaa(vol);
}

function updateAAA(dt) {
  for (const gun of aaaGuns) {
    if (gun.dead) continue;

    const dx = plane.position.x - gun.x;
    const dz = plane.position.z - gun.z;
    const dh = Math.hypot(dx, dz);
    const dist = Math.hypot(dh, plane.position.y - gun.baseY);
    const canFire = G.started && !G.over && !G.crashing && dist < AAA_RANGE;

    /* 炮塔水平跟踪 */
    let yawErr = Math.atan2(-dx, -dz) - gun.yaw;
    while (yawErr > Math.PI) yawErr -= Math.PI * 2;
    while (yawErr < -Math.PI) yawErr += Math.PI * 2;
    const yawStep = 2.2 * dt;
    gun.yaw += Math.max(-yawStep, Math.min(yawStep, yawErr));
    gun.turret.rotation.y = gun.yaw - gun.yawBase;    // 车体带朝向，炮塔取局部角

    /* 炮管俯仰跟踪 */
    const mountY = gun.baseY + (1.75 + 0.55) * AAA_SCALE;
    const pitchTarget = Math.atan2(plane.position.y - mountY, Math.max(1, dh));
    const pErr = pitchTarget - gun.pitch.rotation.x;
    const pStep = 1.5 * dt;
    gun.pitch.rotation.x += Math.max(-pStep, Math.min(pStep, pErr));

    /* 连发 / 冷却 */
    if (gun.burst > 0) {
      gun.burst -= dt;
      gun.shotGap -= dt;
      if (gun.shotGap <= 0) {
        gun.shotGap = 0.09;
        fireAAAShot(gun);
        gun.shots--;
        if (gun.shots <= 0) gun.burst = 0;
      }
    } else {
      gun.cool -= dt;
      if (canFire && gun.cool <= 0 && Math.abs(yawErr) < 0.14 && Math.abs(pErr) < 0.22) {
        gun.burst = 99;
        gun.shots = 6 + (Math.random() * 5 | 0);
        gun.shotGap = 0;
        gun.cool = 1.6 + Math.random() * 1.3;
      }
    }
  }
}

/* ---- 导弹阵地更新：跟踪 + 锁定 + 发射 + 装填 ---- */
function launchSAM(s) {
  s.mesh.updateMatrixWorld(true);
  s.missile.updateMatrixWorld(true);
  const pos = new THREE.Vector3().setFromMatrixPosition(s.missile.matrixWorld);

  const m = makeMissileMesh();
  m.position.copy(pos);
  scene.add(m);

  const dir = new THREE.Vector3().subVectors(plane.position, pos).normalize();
  orientToward(m, dir, 0);
  m.scale.setScalar(SAM_SCALE);                              // 与阵地上待发弹同尺寸
  missiles.push({ mesh: m, dir, spd: 140, age: 0, trail: 0 });

  Sound.launch();
  spawnSmoke(pos.clone(), 3.0, false);                       // 冷发射筒口烟
  s.missile.visible = false;
  s.cd = 8;
}

function updateSAM(dt) {
  for (const s of samSites) {
    if (s.dead) continue;

    const dx = plane.position.x - s.x;
    const dz = plane.position.z - s.z;
    const dist = Math.sqrt(dx * dx + dz * dz + (plane.position.y - s.baseY) * (plane.position.y - s.baseY));
    const active = G.started && !G.over && !G.crashing;

    /* 垂直发射系统无需瞄准：载具静止，仅雷达天线旋转 */
    s.dish.rotation.y += dt * 2.4;

    /* 锁定进度 */
    if (active && dist < SAM_RANGE) s.lock = Math.min(1.6, s.lock + dt);
    else s.lock = Math.max(0, s.lock - dt * 2);

    /* 发射与装填 */
    s.cd -= dt;
    if (active && s.lock > 1.2 && s.cd <= 0 && missiles.length < 3) launchSAM(s);
    if (!s.missile.visible && s.cd < 5.2) s.missile.visible = true;
  }
}

/* ---- 敌机更新：追击 + 规避 + 开火（限制转向速率保证可规避） ---- */
function updateEnemies(dt) {
  enemyTimer -= dt;
  if (enemyTimer <= 0 && enemies.length < ENEMY_MAX) {
    spawnEnemy();
    enemyTimer = 9 + Math.random() * 5;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const m = e.mesh;

    /* 目标选择：玩家或僚机中较近者（每 5~8 秒重评，僚机可分担火力） */
    e.retarget -= dt;
    if (e.retarget <= 0 || (e.target !== 'plane' && e.target.dead)) {
      e.retarget = 5 + Math.random() * 3;
      let best = 'plane', bestD = m.position.distanceTo(plane.position);
      for (const w of wingmen) {
        if (w.dead) continue;
        const d = m.position.distanceTo(w.mesh.position);
        if (d < bestD) { bestD = d; best = w; }
      }
      e.target = best;
    }
    const tgt = e.target;
    const tPos = tgt === 'plane' ? plane.position : tgt.mesh.position;

    const dx = tPos.x - m.position.x;
    const dy = tPos.y - m.position.y;
    const dz = tPos.z - m.position.z;
    const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy + dz * dz));

    /* 撞击目标：同归于尽 */
    if (dist < 12) {
      destroyEnemy(e, true);
      if (tgt === 'plane') startCrash(); else destroyWingman(tgt);
      continue;
    }

    /* 期望方向：追击；进入交汇区则从目标侧向 90m 处绕行；贴地则拉起 */
    let tx = dx / dist, ty = dy / dist, tz = dz / dist;
    if (dist < 260) {
      /* 交汇脱离：从玩家侧向绕行通过，避免撞机与贴脸穿模 */
      _u2.set(tx, 0, tz);
      _u3.crossVectors(_u2, _worldUp);
      if (_u3.lengthSq() > 1e-6) {
        _u3.normalize();
        const ox = dx + _u3.x * e.sideBias * 90;
        const oy = dy + 20;
        const oz = dz + _u3.z * e.sideBias * 90;
        const ol = Math.max(1, Math.hypot(ox, oy, oz));
        tx = ox / ol; ty = oy / ol; tz = oz / ol;
      }
    }
    const gh = terrainHeight(m.position.x, m.position.z);
    if (m.position.y < gh + 80) ty = Math.max(ty, 0.45);
    if (m.position.y > 950) ty = Math.min(ty, -0.1);
    _u1.set(tx, ty, tz).normalize();

    /* 限速转向 */
    const ang = e.fwd.angleTo(_u1);
    if (ang > 1e-5) {
      const t = Math.min(1, (0.9 * dt) / ang);
      e.fwd.multiplyScalar(1 - t).addScaledVector(_u1, t).normalize();
    }

    /* 依据转向方向倾斜机身 */
    _u2.crossVectors(e.fwd, _worldUp);
    if (_u2.lengthSq() > 1e-6) {
      _u2.normalize();
      const side = _u1.dot(_u2);
      const bankTarget = Math.max(-1.0, Math.min(1.0, side * 1.2));
      e.bank += (bankTarget - e.bank) * (1 - Math.exp(-3 * dt));
    }
    orientToward(m, e.fwd, e.bank);

    /* 前进与地形碰撞 */
    m.position.addScaledVector(e.fwd, e.spd * dt);
    const ghn = terrainHeight(m.position.x, m.position.z);
    if (m.position.y < ghn + 3) {
      destroyEnemy(e, false);
      continue;
    }

    /* 尾焰闪烁 */
    const fl = m.userData.flame;
    if (fl) {
      const s = 0.8 + Math.random() * 0.5;
      fl.scale.set(s, s, s * (0.8 + Math.random() * 0.6));
      fl.material.opacity = 0.55 + Math.random() * 0.4;
    }

    /* 开火：对准且进入射程时打连发 */
    if (e.fire > 0) {
      e.fire -= dt;
      e.shotGap -= dt;
      if (e.shotGap <= 0 && dist < 800) {
        e.shotGap = 0.1;
        /* 命中点预判（对当前目标） */
        if (tgt === 'plane') _vt.copy(getForward()).multiplyScalar(curSpeed());
        else _vt.copy(tgt.fwd).multiplyScalar(tgt.spd);
        _u2.copy(e.fwd).multiplyScalar(7.6).add(m.position);
        leadTarget(_u2, 430, tPos, _vt);
        _u1.subVectors(_u3, _u2).normalize();
        spawnThreatBullet(_u2.clone(), _u1, 430, 0.04);
        const vol = Math.max(0, 1 - dist / 1400);
        if (vol > 0.07) Sound.aaa(vol);
        e.shots--;
        if (e.shots <= 0) {
          e.fire = 0;
          e.fireCd = 1.6 + Math.random() * 1.2;
        }
      }
    } else {
      e.fireCd -= dt;
      if (e.fireCd <= 0 && dist < 680) {
        _u1.set(dx / dist, dy / dist, dz / dist);
        if (e.fwd.dot(_u1) > 0.992) {
          e.fire = 1.4;
          e.shots = 6 + (Math.random() * 5 | 0);
          e.shotGap = 0;
        }
      }
    }
  }
}

/* 玩家受击：扣 1 点血量（带 0.22s 无敌帧），归零坠毁；导弹命中与撞击仍是即死 */
function damagePlayer(n) {
  if (!G.started || G.over || G.crashing) return;
  if (G.invuln > 0) return;
  G.invuln = 0.22;
  G.hitFlash = 0.6;
  G.shake = Math.min(2.0, G.shake + 0.5);
  Sound.hit();
  G.hp -= n;
  if (G.hp <= 0) {
    G.hp = 0;
    startCrash();
  }
}

/* 点到线段距离（标量版，用于导弹近炸段式判定，避免高速穿透） */
function segDist(p0, p1, q) {
  const ax = p1.x - p0.x, ay = p1.y - p0.y, az = p1.z - p0.z;
  const L2 = ax * ax + ay * ay + az * az;
  let t = 0;
  if (L2 > 1e-9) {
    t = ((q.x - p0.x) * ax + (q.y - p0.y) * ay + (q.z - p0.z) * az) / L2;
    t = Math.max(0, Math.min(1, t));
  }
  const cx = p0.x + ax * t - q.x, cy = p0.y + ay * t - q.y, cz = p0.z + az * t - q.z;
  return Math.sqrt(cx * cx + cy * cy + cz * cz);
}

function plTargetPoint(ms, out) {
  if (!ms.target || ms.target.dead) return false;
  out.copy(ms.target.mesh.position);
  out.y += ms.targetUp || 0;
  return true;
}

function hitPLTarget(ms) {
  const target = ms.target;
  if (!target || target.dead) return false;
  if (ms.kind === 'enemy') destroyEnemy(target, true);
  else if (ms.kind === 'aaa') destroyAAA(target);
  else if (ms.kind === 'sam') destroySAM(target);
  else return false;
  return true;
}

/* 玩家主动弹：初速较低，随后加速；按目标速度做一次拦截点预判并限制转向率。 */
function updatePlayerMissiles(dt) {
  for (let i = playerMissiles.length - 1; i >= 0; i--) {
    const ms = playerMissiles[i];
    ms.age += dt;
    ms.spd = Math.min(PL_SPEED_MAX, ms.spd + PL_ACCEL * dt);
    _plPrev.copy(ms.mesh.position);

    if (plTargetPoint(ms, _plTarget)) {
      ms.lost = 0;
      _plVel.set(0, 0, 0);
      if (ms.kind === 'enemy' && ms.target.fwd) {
        _plVel.copy(ms.target.fwd).multiplyScalar(ms.target.spd || 0);
      }

      /* 一段式拦截预判：高速目标继续前进时，导弹朝提前量交汇。 */
      let lead = _plPrev.distanceTo(_plTarget) / Math.max(PL_SPEED_MIN, ms.spd);
      lead = Math.max(0, Math.min(1.25, lead));
      _plGoal.copy(_plTarget).addScaledVector(_plVel, lead);
      _plDir.subVectors(_plGoal, _plPrev);
      if (_plDir.lengthSq() > 1e-6) {
        _plDir.normalize();
        const ang = ms.dir.angleTo(_plDir);
        if (ang > 1e-5) {
          const t = Math.min(1, (PL_TURN_RATE * dt) / ang);
          ms.dir.multiplyScalar(1 - t).addScaledVector(_plDir, t).normalize();
        }
      }
    } else {
      ms.lost += dt;
    }

    ms.mesh.position.addScaledVector(ms.dir, ms.spd * dt);
    orientToward(ms.mesh, ms.dir, 0);

    const flame = ms.mesh.userData.flame;
    const flameOuter = ms.mesh.userData.flameOuter;
    const flameGlow = ms.mesh.userData.flameGlow;
    if (flame) {
      const pulse = 0.86 + Math.random() * 0.32;
      flame.scale.set(pulse, 0.92 + Math.random() * 0.62, pulse);
      flame.material.opacity = 0.78 + Math.random() * 0.22;
    }
    if (flameOuter) {
      const pulse = 0.82 + Math.random() * 0.38;
      flameOuter.scale.set(pulse, 0.88 + Math.random() * 0.72, pulse);
      flameOuter.material.opacity = 0.42 + Math.random() * 0.25;
    }
    if (flameGlow) {
      const pulse = 0.82 + Math.sin(ms.age * 42) * 0.18 + Math.random() * 0.12;
      flameGlow.scale.setScalar(pulse);
      flameGlow.material.opacity = 0.65 + Math.random() * 0.30;
    }
    updatePLTrailFx(ms, dt);

    ms.trail -= dt;
    if (ms.trail <= 0) {
      ms.trail = 0.034 + Math.random() * 0.012;
      _plExhaustPos.copy(ms.mesh.position).addScaledVector(ms.dir, -1.75);
      const speedMix = Math.max(0, Math.min(1,
        (ms.spd - PL_SPEED_MIN) / (PL_SPEED_MAX - PL_SPEED_MIN)));
      spawnPLExhaustPuff(_plExhaustPos, 0.95 + speedMix * 0.9, true);
      if ((ms.trailPuffs++ & 1) === 0) {
        spawnPLExhaustPuff(_plExhaustPos, 1.65 + speedMix * 1.25, false);
      }
    }

    const p = ms.mesh.position;
    let blow = false;
    let targetHit = false;

    if (plTargetPoint(ms, _plTarget) &&
        segDist(_plPrev, p, _plTarget) < PL_HIT_RADIUS) {
      targetHit = hitPLTarget(ms);
      if (targetHit) blow = true;
    }

    if (!targetHit && p.y <= terrainHeight(p.x, p.z) + 1.5) blow = true;
    if (!targetHit && !blow) {
      const near = queryBuildings(p.x, p.z, 24);
      for (let j = 0; j < near.length; j++) {
        const b = near[j];
        if (b.dead) continue;
        if (p.x > b.x - b.hw && p.x < b.x + b.hw &&
            p.z > b.z - b.hd && p.z < b.z + b.hd &&
            p.y > b.y0 && p.y < b.y1) {
          destroyBuilding(b);
          targetHit = true;       // 建筑爆炸已由 destroyBuilding 处理
          blow = true;
          break;
        }
      }
    }
    if (ms.lost > 0.72 || ms.age > PL_MISSILE_LIFE) blow = true;

    if (blow) {
      if (!targetHit) explosionAt(p.clone(), 2.4, 1.25);
      disposePLMissile(ms);
      playerMissiles.splice(i, 1);
    }
  }
}

/* ---- 威胁物：敌方弹幕与导弹推进 / 命中判定 ---- */
function updateThreats(dt) {
  const active = G.started && !G.over && !G.crashing;

  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.age += dt;
    const stepLen = b.vel.length() * dt;
    const steps = Math.max(1, Math.ceil(stepLen / 7));
    let removed = false;

    for (let s = 0; s < steps; s++) {
      b.mesh.position.addScaledVector(b.vel, dt / steps);
      const p = b.mesh.position;
      if (p.y <= terrainHeight(p.x, p.z) + 0.5) {
        spawnHitSpark(p);
        removed = true;
        break;
      }
      if (active && p.distanceToSquared(plane.position) < 64) {   // 半径 8 命中：扣血
        damagePlayer(1);
        removed = true;
        break;
      }
      if (active && !removed) {
        for (let j = 0; j < wingmen.length; j++) {
          const w = wingmen[j];
          if (w.dead) continue;
          if (p.distanceToSquared(w.mesh.position) < 100) {        // 半径 10：僚机被击中
            w.hp--;
            if (w.hp <= 0) destroyWingman(w); else spawnHitSpark(p);
            removed = true;
            break;
          }
        }
      }
    }

    if (removed || b.age > 3.5) {
      scene.remove(b.mesh);
      eBullets.splice(i, 1);
    }
  }

  for (let i = missiles.length - 1; i >= 0; i--) {
    const ms = missiles[i];
    ms.age += dt;

    /* 追踪（限转向速率，可被大机动甩掉） */
    _u1.subVectors(plane.position, ms.mesh.position);
    const dist = Math.max(0.001, _u1.length());
    _u1.multiplyScalar(1 / dist);
    const ang = ms.dir.angleTo(_u1);
    if (ang > 1e-5) {
      const t = Math.min(1, (0.9 * dt) / ang);
      ms.dir.multiplyScalar(1 - t).addScaledVector(_u1, t).normalize();
    }
    _u3.copy(ms.mesh.position);
    ms.mesh.position.addScaledVector(ms.dir, ms.spd * dt);
    orientToward(ms.mesh, ms.dir, 0);

    /* 烟迹 */
    ms.trail -= dt;
    if (ms.trail <= 0) {
      ms.trail = 0.05;
      spawnSmoke(ms.mesh.position.clone(), 1.5, false);
    }

    const p = ms.mesh.position;
    let blow = false;

    if (active && segDist(_u3, p, plane.position) < 12) {   // 近炸半径 12（段式判定）
      startCrash();
      blow = true;
    } else if (p.y <= terrainHeight(p.x, p.z) + 1) {
      blow = true;
    } else {
      const near = queryBuildings(p.x, p.z, 24);
      for (let j = 0; j < near.length; j++) {
        const b = near[j];
        if (b.dead) continue;
        if (p.x > b.x - b.hw && p.x < b.x + b.hw &&
            p.z > b.z - b.hd && p.z < b.z + b.hd &&
            p.y > b.y0 && p.y < b.y1) { blow = true; break; }
      }
    }
    if (ms.age > 6.5) blow = true;

    if (blow) {
      explosionAt(p.clone(), 2.4, 1.3);
      scene.remove(ms.mesh);
      missiles.splice(i, 1);
    }
  }
}

/* ---- 摧毁判定与结算 ---- */
function explosionAt(pos, scale, power) {
  spawnExplosion(pos, scale);
  Sound.boom(power);
  G.shake = Math.min(2.4, G.shake + 0.6);
}

function destroyAAA(g) {
  if (g.dead) return;
  g.dead = true;
  scene.remove(g.mesh);
  explosionAt(new THREE.Vector3(g.x, g.baseY + 4, g.z), 2.6, 1.2);
  G.destroyed++;
  G.score += 60;
}

function destroySAM(s) {
  if (s.dead) return;
  s.dead = true;
  scene.remove(s.mesh);
  explosionAt(new THREE.Vector3(s.x, s.baseY + 8, s.z), 3.2, 1.3);
  G.destroyed++;
  G.score += 90;
}

function destroyEnemy(e, scored) {
  if (e.dead) return;
  e.dead = true;
  explosionAt(e.mesh.position.clone(), 2.6, 1.2);
  scene.remove(e.mesh);
  const idx = enemies.indexOf(e);
  if (idx >= 0) enemies.splice(idx, 1);
  if (scored) { G.destroyed++; G.score += 150; }
}

/* =========================================================
   僚机（友军 AI）：编队跟随 / 交战敌机 / 击落后归队
========================================================= */
const WING_HP = 6;          // 僚机血量
const WING_RESPAWN = 20;    // 击落后归队时间（秒）

const M_W_BODY  = new THREE.MeshLambertMaterial({ color: 0xbfccd8 });
const M_W_WING  = new THREE.MeshLambertMaterial({ color: 0xaebbc9 });
const M_W_BLUE  = new THREE.MeshLambertMaterial({ color: 0x3a7bd5 });
const M_W_DARK  = new THREE.MeshLambertMaterial({ color: 0x36434f });
const M_W_GLASS = new THREE.MeshPhongMaterial({ color: 0x2f4a6e, shininess: 120, transparent: true, opacity: 0.9 });

/* 僚机：浅灰蓝机身 + 蓝色翼尖/垂尾（与敌机深灰红明确区分） */
function createWingmanPlane() {
  const g = new THREE.Group();

  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.1, 8.2, 12), M_W_BODY);
  fus.rotation.x = Math.PI / 2;
  fus.position.z = 0.3;
  g.add(fus);

  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2.8, 12), M_W_BODY);
  nose.rotation.x = -Math.PI / 2;
  nose.position.z = -5.0;
  g.add(nose);

  const wing = new THREE.Mesh(new THREE.BoxGeometry(11.5, 0.3, 2.8), M_W_WING);
  wing.position.set(0, -0.27, 0.4);
  g.add(wing);

  [-5.6, 5.6].forEach(x => {
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.36, 2.8), M_W_BLUE);
    tip.position.set(x, -0.27, 0.4);
    g.add(tip);
  });

  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.26, 1.9, 1.5), M_W_BLUE);
  fin.position.set(0, 1.32, 3.0);
  g.add(fin);

  const tail = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.25, 1.4), M_W_WING);
  tail.position.set(0, 0.05, 2.95);
  g.add(tail);

  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.66, 10, 8), M_W_GLASS);
  canopy.scale.set(1, 0.71, 2.27);
  canopy.position.set(0, 0.72, -1.6);
  g.add(canopy);

  const noz = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.84, 0.7, 10), M_W_DARK);
  noz.rotation.x = Math.PI / 2;
  noz.position.z = 4.5;
  g.add(noz);

  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(0.34, 1.3, 10),
    new THREE.MeshBasicMaterial({
      color: 0x9fd8ff, transparent: true, opacity: 0.85,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  flame.rotation.x = Math.PI / 2;
  flame.position.z = 5.0;
  g.add(flame);
  g.userData.flame = flame;

  g.scale.setScalar(1.35);
  enableEntityShadows(g);
  return g;
}

/* 编队位置（玩家侧后方）写入 out */
function wingFormationPos(side, out) {
  _w1.copy(getForward());
  _w2.crossVectors(_w1, _worldUp);
  if (_w2.lengthSq() < 1e-6) _w2.set(1, 0, 0); else _w2.normalize();
  _w3.crossVectors(_w2, _w1);
  out.copy(plane.position)
    .addScaledVector(_w1, -55)
    .addScaledVector(_w2, side * 70)
    .addScaledVector(_w3, -8);
  return out;
}

function spawnWingman(side) {
  const m = createWingmanPlane();
  wingFormationPos(side, _w4);
  const gh = terrainHeight(_w4.x, _w4.z);
  if (_w4.y < gh + 40) _w4.y = gh + 40;
  m.position.copy(_w4);
  scene.add(m);

  const fwd = getForward().clone();
  orientToward(m, fwd, 0);
  wingmen.push({
    mesh: m, fwd, spd: curSpeed(), bank: 0, side, hp: WING_HP,
    target: null, retarget: 0, fire: 0, shots: 0, shotGap: 0, fireCd: 1 + Math.random(),
    dead: false
  });
}

function destroyWingman(w) {
  if (w.dead) return;
  w.dead = true;
  explosionAt(w.mesh.position.clone(), 2.4, 1.1);
  scene.remove(w.mesh);
  const idx = wingmen.indexOf(w);
  if (idx >= 0) wingmen.splice(idx, 1);
  wingRespawn[w.side > 0 ? 1 : 0] = WING_RESPAWN;
}

/* 僚机开火：曳光弹并入玩家子弹池（复用命中判定），命中敌机同样有效 */
function fireWingBullet(w) {
  const e = w.target;
  if (!e || e.dead) return;
  _vt.copy(e.fwd).multiplyScalar(e.spd);
  _w3.copy(w.fwd).multiplyScalar(7.8).add(w.mesh.position);
  leadTarget(_w3, 450, e.mesh.position, _vt);
  _w2.subVectors(_u3, _w3).normalize();
  _w2.x += (Math.random() - 0.5) * 0.03;
  _w2.y += (Math.random() - 0.5) * 0.03;
  _w2.z += (Math.random() - 0.5) * 0.03;
  _w2.normalize();

  const m = new THREE.Mesh(BULLET_GEO, BULLET_MAT);
  m.position.copy(_w3);
  scene.add(m);
  orientToward(m, _w2, 0);
  bullets.push({ mesh: m, vel: _w2.clone().multiplyScalar(450), age: 0 });
  spawnMuzzleFlash(_w3);
  const vol = Math.max(0, 1 - w.mesh.position.distanceTo(plane.position) / 1400);
  if (vol > 0.05) Sound.aaa(vol * 0.8);
}

function updateWingmen(dt) {
  /* 归队重生 */
  for (let k = 0; k < 2; k++) {
    const side = k === 0 ? -1 : 1;
    wingRespawn[k] -= dt;
    if (wingRespawn[k] <= 0 && !wingmen.some(w => w.side === side)) spawnWingman(side);
  }

  for (let i = wingmen.length - 1; i >= 0; i--) {
    const w = wingmen[i];
    if (w.dead) continue;
    const m = w.mesh;

    /* 主动出击：纯战斗机，发现任何敌机即自发脱离编队迎战（不对地面单位反应）；无敌机时回编队 */
    w.retarget -= dt;
    if (w.retarget <= 0 || (w.target && w.target.dead)) {
      w.retarget = 1.0;
      let best = null, bestD = 1e9;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = m.position.distanceTo(e.mesh.position);
        if (d < bestD) { bestD = d; best = e; }
      }
      w.target = best;
    }

    let wantSpd;
    if (w.target && !w.target.dead) {
      /* ---- 交战：提前量追击 + 咬尾变速 + 近距规避 ---- */
      const e = w.target;
      const rdx = e.mesh.position.x - m.position.x;
      const rdy = e.mesh.position.y - m.position.y;
      const rdz = e.mesh.position.z - m.position.z;
      const rawDist = Math.max(1, Math.sqrt(rdx * rdx + rdy * rdy + rdz * rdz));

      /* 相撞：同归于尽 */
      if (rawDist < 12) {
        destroyEnemy(e, true);
        destroyWingman(w);
        continue;
      }

      let tx, ty, tz;
      if (rawDist < 120) {
        /* 极近处才做侧向脱离，避免对撞（近距缠斗其余时间保持机头指向） */
        _w2.set(rdx / rawDist, 0, rdz / rawDist);
        _w3.crossVectors(_w2, _worldUp);
        if (_w3.lengthSq() < 1e-6) _w3.set(1, 0, 0); else _w3.normalize();
        const ox = rdx + _w3.x * w.side * 90;
        const oy = rdy + 20;
        const oz = rdz + _w3.z * w.side * 90;
        const ol = Math.max(1, Math.hypot(ox, oy, oz));
        tx = ox / ol; ty = oy / ol; tz = oz / ol;
        wantSpd = 110;
      } else {
        /* 提前量追击：瞄向 0.6 秒后的敌机位置 */
        const ax = e.mesh.position.x + e.fwd.x * e.spd * 0.6;
        const ay = e.mesh.position.y + e.fwd.y * e.spd * 0.6;
        const az = e.mesh.position.z + e.fwd.z * e.spd * 0.6;
        const ddx = ax - m.position.x, ddy = ay - m.position.y, ddz = az - m.position.z;
        const dl = Math.max(1, Math.sqrt(ddx * ddx + ddy * ddy + ddz * ddz));
        tx = ddx / dl; ty = ddy / dl; tz = ddz / dl;
        const alignDot = tx * w.fwd.x + ty * w.fwd.y + tz * w.fwd.z;
        if (alignDot > 0.85) {
          /* 咬尾控速：接近目标速度避免冲过头 */
          wantSpd = Math.min(150, Math.max(90, e.spd + (rawDist - 180) * 0.8));
        } else {
          /* 大角度回转减速收紧转弯半径，其余快步接近 */
          wantSpd = alignDot < 0.25 ? 85 : 130;
        }
      }
      _w1.set(tx, ty, tz);
    } else {
      /* ---- 编队：跟住玩家侧后方 ---- */
      wingFormationPos(w.side, _w4);
      const dx = _w4.x - m.position.x;
      const dy = _w4.y - m.position.y;
      const dz = _w4.z - m.position.z;
      const dist = Math.max(1, Math.sqrt(dx * dx + dy * dy + dz * dz));
      if (dist < 35) _w1.copy(getForward());
      else _w1.set(dx / dist, dy / dist, dz / dist);
      /* 编队速度：下限 34 略低于关车滑翔速度（≈37），保证关车滑翔时也能跟住 */
      wantSpd = Math.min(155, Math.max(34, curSpeed() + (dist - 30) * 0.9));
    }

    /* 与玩家保持安全距离（防穿模） */
    const pdx = m.position.x - plane.position.x;
    const pdy = m.position.y - plane.position.y;
    const pdz = m.position.z - plane.position.z;
    const pd = Math.max(1, Math.sqrt(pdx * pdx + pdy * pdy + pdz * pdz));
    if (pd < 45) {
      const k = 1.6 - pd / 45;
      _w1.x += (pdx / pd) * k * 1.4;
      _w1.y += (pdy / pd) * k * 0.8;
      _w1.z += (pdz / pd) * k * 1.4;
      _w1.normalize();
    }

    /* 贴地拉起 */
    const gh = terrainHeight(m.position.x, m.position.z);
    if (m.position.y < gh + 80) {
      _w1.y = Math.max(_w1.y, 0.5);
      _w1.normalize();
    }

    /* 限速转向 + 滚转 */
    const ang = w.fwd.angleTo(_w1);
    if (ang > 1e-5) {
      const t = Math.min(1, (1.3 * dt) / ang);
      w.fwd.multiplyScalar(1 - t).addScaledVector(_w1, t).normalize();
    }
    _w2.crossVectors(w.fwd, _worldUp);
    if (_w2.lengthSq() > 1e-6) {
      _w2.normalize();
      const side = _w1.dot(_w2);
      const bankTarget = Math.max(-1.1, Math.min(1.1, side * 1.3));
      w.bank += (bankTarget - w.bank) * (1 - Math.exp(-3.5 * dt));
    }
    orientToward(m, w.fwd, w.bank);

    /* 平滑变速与前进 */
    w.spd += (wantSpd - w.spd) * (1 - Math.exp(-1.5 * dt));
    m.position.addScaledVector(w.fwd, w.spd * dt);

    if (m.position.y < terrainHeight(m.position.x, m.position.z) + 3) {
      destroyWingman(w);
      continue;
    }

    /* 尾焰 */
    const fl = m.userData.flame;
    if (fl) {
      const s = 0.8 + Math.random() * 0.45;
      fl.scale.set(s, s, s * (0.8 + Math.random() * 0.5));
      fl.material.opacity = 0.55 + Math.random() * 0.4;
    }

    /* 开火（仅交战时打连发） */
    if (w.target && !w.target.dead) {
      const distT = m.position.distanceTo(w.target.mesh.position);
      if (w.fire > 0) {
        w.fire -= dt;
        w.shotGap -= dt;
        if (w.shotGap <= 0 && distT < 780) {
          w.shotGap = 0.1;
          fireWingBullet(w);
          w.shots--;
          if (w.shots <= 0) {
            w.fire = 0;
            w.fireCd = 1.4 + Math.random() * 1.2;
          }
        }
      } else {
        w.fireCd -= dt;
        if (w.fireCd <= 0 && distT < 700) {
          const dxx = w.target.mesh.position.x - m.position.x;
          const dyy = w.target.mesh.position.y - m.position.y;
          const dzz = w.target.mesh.position.z - m.position.z;
          const dd = Math.max(1, Math.sqrt(dxx * dxx + dyy * dyy + dzz * dzz));
          _w4.set(dxx / dd, dyy / dd, dzz / dd);
          if (w.fwd.dot(_w4) > 0.96) {
            w.fire = 1.2;
            w.shots = 5 + (Math.random() * 4 | 0);
            w.shotGap = 0;
          }
        }
      }
    }
  }
}

function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.life += dt;
    const t = e.life / e.dur;

    if (t >= 1) {
      scene.remove(e.mesh);
      if (e.ownsMat && e.mesh.material) e.mesh.material.dispose();
      if (e.ownsGeo && e.mesh.geometry) e.mesh.geometry.dispose();
      effects.splice(i, 1);
      continue;
    }

    switch (e.type) {
      case 'flash': {
        e.mesh.scale.setScalar(e.base * (0.6 + t * 3.0));
        e.mesh.material.opacity = Math.pow(1 - t, 2.2);
        break;
      }
      case 'ball': {
        e.mesh.scale.setScalar(e.base * (0.55 + t * 2.3));
        e.mesh.material.opacity = Math.pow(1 - t, 1.4);
        e.mesh.material.color.setHSL(0.13 - t * 0.13, 1, 0.66 - t * 0.34);
        break;
      }
      case 'ring': {
        e.mesh.scale.setScalar(e.base * (1 + t * 5.2));
        e.mesh.material.opacity = Math.pow(1 - t, 1.8) * 0.9;
        break;
      }
      case 'spark': {
        e.vel.y -= 66 * dt;
        e.mesh.position.addScaledVector(e.vel, dt);
        e.mesh.material.opacity = 1 - t * t;
        e.mesh.rotation.x += dt * 13;
        e.mesh.rotation.y += dt * 10;
        e.mesh.scale.multiplyScalar(1 - dt * 1.0);
        break;
      }
      case 'smoke': {
        e.mesh.position.addScaledVector(e.vel, dt);
        e.vel.multiplyScalar(1 - dt * 1.6);
        e.mesh.scale.setScalar(e.base * (0.8 + t * 1.9));
        e.mesh.material.opacity = 0.5 * Math.pow(1 - t, 1.3);
        break;
      }
      case 'plume': {
        e.mesh.position.addScaledVector(e.vel, dt);
        e.vel.multiplyScalar(1 - dt * 1.25);
        e.mesh.scale.setScalar(e.base * (0.55 + t * 2.8));
        e.mesh.material.opacity = e.opacity * Math.pow(1 - t, 1.45);
        break;
      }
      case 'debris': {
        e.vel.y -= 58 * dt;
        e.mesh.position.addScaledVector(e.vel, dt);
        e.mesh.rotation.x += e.angVel.x * dt;
        e.mesh.rotation.y += e.angVel.y * dt;
        e.mesh.rotation.z += e.angVel.z * dt;

        const gh = terrainHeight(e.mesh.position.x, e.mesh.position.z);
        if (e.mesh.position.y < gh + 1) {
          e.mesh.position.y = gh + 1;
          e.vel.y *= -0.25;
          e.vel.x *= 0.7;
          e.vel.z *= 0.7;
          e.angVel.multiplyScalar(0.6);
        }
        e.mesh.material.opacity = Math.max(0, 1 - t * t * 1.3);
        e.mesh.material.transparent = true;
        break;
      }
    }
  }
}

/* =========================================================
   键盘 / 鼠标输入
========================================================= */
const KEY_MAP = { KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right' };
let weaponNoticeTimer = 0;

function showWeaponNotice(text, tone) {
  const el = document.getElementById('weaponWarn');
  if (!el) return;
  el.textContent = text;
  el.className = 'show' + (tone ? ' ' + tone : '');
  weaponNoticeTimer = 1.5;
}

function clampViewOffsets() {
  if (camYawOff > Math.PI) camYawOff -= Math.PI * 2;
  else if (camYawOff < -Math.PI) camYawOff += Math.PI * 2;
  camPitchOff = Math.max(CAM_PITCH_MIN, Math.min(CAM_PITCH_MAX, camPitchOff));
}

/* 视角回正（Alt 点按归正）：锁定期间视角由锁定接管，Alt 不生效、也不解除锁定 */
function resetView() {
  if (G.lockTarget) return;
  camYawOff = 0;
  camPitchOff = 0;
  if (navigator.vibrate) navigator.vibrate(12);
}

/* 鼠标光标显隐（进入任务自动隐藏，Tab 键切换，结算面板恢复显示） */
function setCursorHidden(h) {
  G.cursorHidden = !!h;
  document.body.classList.toggle('hide-cursor', G.cursorHidden);
}

function aircraftHasPLMissiles() {
  return (selectedAircraftSpec().plMissiles || 0) > 0;
}

/* 霹雳主动弹：必须有 R 锁定的敌方目标，发射后锁定发射瞬间的目标引用。 */
function firePLMissile() {
  const spec = selectedAircraftSpec();
  if (!G.started || G.over || G.crashing || !(spec.plMissiles > 0)) return false;
  if (G.missileCooldown > 0) {
    showWeaponNotice('霹雳导弹正在重新装填');
    return false;
  }
  if (G.missileAmmo <= 0) {
    showWeaponNotice('霹雳导弹已耗尽');
    return false;
  }

  const L = G.lockTarget;
  if (!L || L.u.dead) {
    showWeaponNotice('先按 R 锁定敌方目标');
    return false;
  }
  if (!L.hostile) {
    showWeaponNotice('霹雳导弹不能攻击友军');
    return false;
  }

  plane.updateMatrixWorld(true);
  const slots = plane.userData.plMissileSlots || [];
  const slot = slots[Math.max(0, Math.min(slots.length - 1, G.missileAmmo - 1))];
  const pos = new THREE.Vector3();
  if (slot) {
    slot.mount.getWorldPosition(pos);
  } else {
    const side = new THREE.Vector3(1, 0, 0).applyQuaternion(plane.quaternion);
    pos.copy(plane.position).addScaledVector(side, G.missileAmmo % 2 ? -4.3 : 4.3);
    pos.y -= 0.7;
  }

  const mesh = makePLMissileMesh(true);
  mesh.position.copy(pos);
  mesh.scale.setScalar(1.35);
  const dir = getForward().clone();
  orientToward(mesh, dir, 0);
  scene.add(mesh);

  const ms = {
    mesh,
    dir,
    target: L.u,
    targetUp: L.up,
    kind: L.kind,
    label: L.label,
    spd: PL_SPEED_MIN,
    age: 0,
    trail: 0,
    trailPuffs: 0,
    trailFx: createPLTrailFx(),
    lost: 0
  };
  updatePLTrailFx(ms, 0);
  playerMissiles.push(ms);

  G.missileAmmo--;
  G.missileCooldown = spec.missileCooldown || 1.05;
  syncPlayerMissileRack(G.missileAmmo);
  Sound.launch();
  spawnPLExhaustPuff(pos.clone(), 2.6, true);
  spawnPLExhaustPuff(pos.clone().addScaledVector(dir, -1.5), 2.2, false);
  G.shake = Math.min(1.2, G.shake + 0.22);
  showWeaponNotice('霹雳发射 · 追踪' + (L.label || '目标'), 'ready');
  return true;
}

function updatePLRecharge(dt) {
  const maxAmmo = selectedAircraftSpec().plMissiles || 0;
  if (!G.started || G.over || G.crashing || maxAmmo <= 0) {
    G.missileReloadTimer = 0;
    return;
  }
  if (G.missileAmmo >= maxAmmo) {
    G.missileReloadTimer = 0;
    return;
  }

  G.missileReloadTimer += dt;
  let replenished = false;
  while (G.missileReloadTimer >= PL_REPLENISH_INTERVAL && G.missileAmmo < maxAmmo) {
    G.missileReloadTimer -= PL_REPLENISH_INTERVAL;
    G.missileAmmo++;
    replenished = true;
  }
  if (G.missileAmmo >= maxAmmo) G.missileReloadTimer = 0;
  if (replenished) {
    syncPlayerMissileRack(G.missileAmmo);
    showWeaponNotice('霹雳补弹 +1', 'ready');
  }
}

function bindKeyboardMouse() {
  /* ---- 键盘：WASD 飞行 / Alt 视角回正 / 左Shift 加力 / Tab 显隐鼠标 / 长按 Space 关发动机 ---- */
  window.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;   // 种子输入框内不拦截
    if (e.code === 'Escape') {
      e.preventDefault();
      if (e.repeat) return;
      if (G.menuOpen) resumeGameFromMenu();
      else if (G.started && !G.over && !G.crashing) showGameMenu();
      return;
    }
    if (e.key === 'Alt') { e.preventDefault(); resetView(); }
    if (e.code === 'Tab') { e.preventDefault(); setCursorHidden(!G.cursorHidden); return; }
    if (e.code === 'ShiftLeft') { keys.boost = true; return; }
    if (e.code === 'Space') {                              // 长按关发动机（不用 Ctrl：浏览器保留快捷键无法屏蔽）
      if (G.started && !G.over && !G.crashing) e.preventDefault(); // 飞行中拦截空格默认行为
      keys.engineCut = true;
      return;
    }
    if (e.code === 'KeyF') {
      if (e.ctrlKey || e.metaKey) return;   // 保留浏览器 Ctrl/Cmd+F
      e.preventDefault();
      if (!e.repeat) firePLMissile();
      return;
    }
    if (e.code === 'KeyR') {
      if (e.ctrlKey || e.metaKey) return;   // 不拦截 Ctrl/Cmd+R
      e.preventDefault();
      toggleLock();
      return;
    }
    const k = KEY_MAP[e.code];
    if (!k) return;
    if (e.ctrlKey || e.metaKey) return;   // 带 Ctrl / Cmd 时不触发飞行，避免拦截浏览器快捷键
    keys[k] = true;
    e.preventDefault();
  });

  window.addEventListener('keyup', e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.code === 'ShiftLeft') { keys.boost = false; return; }
    if (e.code === 'Space') { keys.engineCut = false; return; }
    const k = KEY_MAP[e.code];
    if (k) keys[k] = false;
  });

  /* ---- 左键：按住机炮扫射 ---- */
  /* ---- 右键：α型按住瞄准、松开投弹；歼-10 直接发射霹雳 ---- */
  window.addEventListener('mousedown', e => {
    if (e.button === 0) {
      keys.fire = true;
    } else if (e.button === 2) {
      e.preventDefault();
      if (aircraftHasPLMissiles()) {
        G.aiming = false;
        if (G.started && !G.over && !G.crashing) {
          firePLMissile();
          if (navigator.vibrate) navigator.vibrate(18);
        }
        return;
      }
      if (G.aiming) return;
      if (G.started && !G.over && !G.crashing) {
        G.aiming = true;
        if (navigator.vibrate) navigator.vibrate(8);
      }
    }
  });

  window.addEventListener('mouseup', e => {
    if (e.button === 0) {
      keys.fire = false;
    } else if (e.button === 2) {
      if (aircraftHasPLMissiles()) {
        G.aiming = false;
        return;
      }
      if (!G.aiming) return;
      G.aiming = false;
      if (G.started && !G.over && !G.crashing) {
        dropBomb(getForward().clone());
        if (navigator.vibrate) navigator.vibrate(22);
      }
    }
  });

  /* 屏蔽右键菜单 */
  window.addEventListener('contextmenu', e => e.preventDefault());

  /* ---- 鼠标滑动：拖动视角（灵敏度 MOUSE_SENS，范围与摇杆时代一致） ---- */
  window.addEventListener('mousemove', e => {
    if (G.aiming && (e.buttons & 2) === 0) G.aiming = false; // 右键在窗口外松开：兜底取消瞄准
    if (mousePX === null) { mousePX = e.clientX; mousePY = e.clientY; return; }
    const dx = e.clientX - mousePX;
    const dy = e.clientY - mousePY;
    mousePX = e.clientX;
    mousePY = e.clientY;
    if (!G.started || G.over || G.crashing) return;
    if (G.lockTarget) return;   // 锁定视角期间鼠标不控制视角
    if (dx) camYawOff   -= dx * MOUSE_SENS;
    if (dy) camPitchOff -= dy * MOUSE_SENS;
    if (dx || dy) clampViewOffsets();
  });

  /* 窗口失焦：清空按键、取消瞄准，防止状态卡住 */
  window.addEventListener('blur', () => {
    keys.left = keys.right = keys.up = keys.down = keys.fire = false;
    keys.boost = false;
    keys.engineCut = false;
    G.aiming = false;
    mousePX = null;
    mousePY = null;
  });
}

/* =========================================================
   姿态 / 相机
========================================================= */
const _fwd = new THREE.Vector3();
const _worldUp = new THREE.Vector3(0, 1, 0);
const _right = new THREE.Vector3();
const _up = new THREE.Vector3();

function getForward() {
  return _fwd.set(0, 0, -1).applyQuaternion(plane.quaternion);
}

/* 当前空速：基础速度 × 加力（关车时加力无效）× 推力滑翔系数 */
function curSpeed() {
  const thr = G.thrust;
  const boostMul = 1 + G.boost * (BOOST_MULT - 1) * thr;
  return CFG.speed * boostMul * (CUT_GLIDE + (1 - CUT_GLIDE) * thr);
}

/* =========================================================
   视角锁定（R）：锁定面向屏幕中心最近的敌方单位；锁定后相机改为
   “目标视线稳定系”——与机身姿态（WASD 滚转 / 俯仰 / 偏航）完全解耦：
   相机取在机身沿目标方向后方 30、稳定系上方 9.5（不引用任何机身姿态向量），
   视线每帧精确注视目标；机身位移仍带动相机平滑跟拍。再按 R 解除。
========================================================= */
const lockMarkEl = document.getElementById('lockMark');
const _lockPos = new THREE.Vector3();
const lockCamPos = new THREE.Vector3();     // 锁定相机位置（稳定系；updateLock 每帧重建）
const lockCamLook = new THREE.Vector3();    // 锁定相机注视点（= 目标点 → 目标恒居画面正中）

function lockUnitPos(L, out) {
  out.copy(L.u.mesh.position);
  out.y += L.up;
  return out;
}

function findLockTarget() {
  _u1.set(0, 0, -1).applyQuaternion(camera.quaternion);   // 相机前向
  let best = null, bestD = 1e9;
  const consider = (unit, up, kind, label) => {
    if (!unit || unit.dead) return;
    _u2.copy(unit.mesh.position);
    _u2.y += up;
    if (_u2.distanceToSquared(camera.position) > 2600 * 2600) return;
    _u3.subVectors(_u2, camera.position).normalize();
    if (_u3.dot(_u1) < 0.1) return;                       // 需在视野前方
    _u3.copy(_u2).project(camera);
    const d = Math.hypot(_u3.x, _u3.y);
    if (d < bestD) {
      bestD = d;
      best = { u: unit, up, kind, label, hostile: true };
    }
  };
  for (const e of enemies) consider(e, 0, 'enemy', '敌机');
  for (const g of aaaGuns) consider(g, 5, 'aaa', '防空车');
  for (const s of samSites) consider(s, 16, 'sam', '导弹阵地');
  return best;
}

function toggleLock() {
  if (!G.started || G.over || G.crashing) return;
  if (G.lockTarget) {                                     // 再按 R：解除（相机平滑交还鼠标视角）
    G.lockTarget = null;
    lockMarkEl.style.display = 'none';
    return;
  }
  const t = findLockTarget();
  if (t) G.lockTarget = t;
}

function updateLock(dt) {
  const L = G.lockTarget;
  if (!L) return;
  if (L.u.dead) {                                         // 目标被摧毁：自动解除
    G.lockTarget = null;
    lockMarkEl.style.display = 'none';
    return;
  }

  /* 稳定系首轴：机身→目标的世界方向（不含任何机身姿态量） */
  lockUnitPos(L, _lockPos);
  _u1.subVectors(_lockPos, plane.position).normalize();
  _u2.crossVectors(_u1, _worldUp);
  if (_u2.lengthSq() < 1e-6) _u2.set(1, 0, 0);            // 目标近乎正上 / 正下时的退化保护
  _u2.normalize();
  _u3.crossVectors(_u2, _u1).normalize();                 // 稳定系“上”方向

  /* 相机：机身沿目标方向后方 30、稳定系上方 9.5；视线精确注视目标点 */
  lockCamPos.copy(plane.position).addScaledVector(_u1, -30).addScaledVector(_u3, 9.5);
  const camGround = terrainHeight(lockCamPos.x, lockCamPos.z) + 9;
  if (lockCamPos.y < camGround) lockCamPos.y = camGround;
  lockCamLook.copy(_lockPos);

  /* 锁定标记：视线即目标方向，标记恒在画面正中（CSS 已锚定 left / top 50%） */
  lockMarkEl.style.display = 'block';
}

function updateCamera(dt) {
  if (G.lockTarget) {
    /* 锁定期间：相机由“目标视线稳定系”（updateLock 每帧重建）刚性接管，
       与机身姿态完全解耦——WASD 滚转 / 俯仰 / 偏航不再影响取景 */
    if (!camInit) {
      camera.position.copy(lockCamPos);
      camLook.copy(lockCamLook);
      camInit = true;
    }
    camera.position.copy(lockCamPos);
    camLook.copy(lockCamLook);
  } else {
    const fwd = getForward().clone();

    _right.crossVectors(fwd, _worldUp);
    if (_right.lengthSq() < 0.0001) _right.set(1, 0, 0);
    _right.normalize();
    _up.crossVectors(_right, fwd).normalize();

    const camPos = plane.position.clone()
      .addScaledVector(fwd, -30)
      .addScaledVector(_up, 9.5);

    const lookAt = plane.position.clone()
      .addScaledVector(fwd, 15)
      .addScaledVector(_up, 2.5);

    // 应用视角偏移（围绕飞机旋转）
    if (camYawOff !== 0 || camPitchOff !== 0) {
      _tmpEuler.set(camPitchOff, camYawOff, 0, 'YXZ');
      _tmpQuat.setFromEuler(_tmpEuler);

      _tmpVec.copy(camPos).sub(plane.position).applyQuaternion(_tmpQuat).add(plane.position);
      camPos.copy(_tmpVec);

      _tmpVec.copy(lookAt).sub(plane.position).applyQuaternion(_tmpQuat).add(plane.position);
      lookAt.copy(_tmpVec);
    }

    const camGround = terrainHeight(camPos.x, camPos.z) + 9;
    if (camPos.y < camGround) camPos.y = camGround;

    if (!camInit) {
      camera.position.copy(camPos);
      camLook.copy(lookAt);
      camInit = true;
    }

    camera.position.lerp(camPos, 1 - Math.exp(-8 * dt));
    camLook.lerp(lookAt, 1 - Math.exp(-11 * dt));
  }
  camera.lookAt(camLook);

  /* 加力：视野拉伸 + 轻微抖动，强化速度感 */
  const fovT = 62 + G.boost * 14;
  if (Math.abs(camera.fov - fovT) > 0.02) {
    camera.fov = fovT;
    camera.updateProjectionMatrix();
  }
  if (G.boost > 0.02 && !G.lockTarget) {
    const bj = G.boost * 0.6;
    camera.position.x += (Math.random() - 0.5) * bj;
    camera.position.y += (Math.random() - 0.5) * bj;
  }

  if (G.shake > 0.001) {
    const s = G.shake;
    if (!G.lockTarget) {
      camera.position.x += (Math.random() - 0.5) * s * 1.6;
      camera.position.y += (Math.random() - 0.5) * s * 1.6;
      camera.position.z += (Math.random() - 0.5) * s * 1.6;
    }
    G.shake -= dt * 7;
    if (G.shake < 0) G.shake = 0;
  }
}

/* =========================================================
   投弹落点预测（长按右键显示）：按与 dropBomb 完全一致的真实弹道
   （挂点偏移 13 / 初速 −8 / 逐帧重力）积分到着地面，在落点上平铺
   红色预瞄图标（与地面平行，机炮准星同款元素）
========================================================= */
const _aimN = new THREE.Vector3();

/* 炸弹着地面：地形与水面（WATER_LEVEL）取高者，爆炸判定与本函数共用 */
function bombSurfaceY(x, z) {
  return Math.max(terrainHeight(x, z), WATER_LEVEL);
}

/* 地表法线（中心差分；限幅约 40° 内，保证图标始终可读） */
function terrainNormal(x, z, out) {
  const e = 6;
  const hx = terrainHeight(x + e, z) - terrainHeight(x - e, z);
  const hz = terrainHeight(x, z + e) - terrainHeight(x, z - e);
  out.set(-hx, 2 * e, -hz).normalize();
  if (out.y < 0.77) { out.y = 0.77; out.normalize(); }
  return out;
}

function updateAim() {
  if (!G.aiming || aircraftHasPLMissiles()) {
    G.aiming = false;
    if (bombMark.visible) bombMark.visible = false;
    return;
  }

  /* 与 dropBomb 完全相同的出弹状态 */
  const fwd = getForward();
  const p = plane.position.clone().addScaledVector(fwd, 13);
  p.y -= 4;
  const v = fwd.clone().multiplyScalar(curSpeed());
  v.y -= 8;

  /* 逐步积分（步长 1/60，与逐帧炸弹一致）到着地面 */
  const step = 1 / 60;
  let hit = null;
  for (let i = 0; i < 3600; i++) {
    v.y -= CFG.gravity * step;
    p.addScaledVector(v, step);
    const sy = bombSurfaceY(p.x, p.z);
    if (p.y <= sy) { hit = p; hit.y = sy; break; }
  }

  if (!hit) { bombMark.visible = false; return; }

  /* 姿态：水面取水平；坡面贴合地表；沿法线抬升一点，避免插进地形 */
  const gh = terrainHeight(hit.x, hit.z);
  if (hit.y > gh + 0.05) _aimN.set(0, 1, 0);
  else terrainNormal(hit.x, hit.z, _aimN);

  bombMark.visible = true;
  bombMark.position.copy(hit).addScaledVector(_aimN, 1.6);
  bombMark.quaternion.setFromUnitVectors(_worldUp, _aimN);

  /* 大小随视距缩放（保持屏幕识别度），透明度闪烁 */
  const dist = camera.position.distanceTo(hit);
  bombMark.scale.setScalar(Math.max(3, Math.min(60, dist * 0.035)));
  bombMark.userData.mat.opacity = 0.6 + 0.3 * Math.sin(performance.now() * 0.01);
}

/* =========================================================
   机炮预瞄（按住左键扫射时显示弹着点准星）
========================================================= */
function updateGunAim() {
  if (!keys.fire || !G.started || G.over || G.crashing) {
    if (gunReticle.visible) gunReticle.visible = false;
    return;
  }

  /* 子弹为直线弹道：从炮口沿机头方向步进，找地形 / 建筑弹着点 */
  const fwd = getForward().clone();
  const pos = plane.position.clone().addScaledVector(fwd, 13);
  const step = 10;
  let hit = null;

  for (let i = 0; i < 130; i++) {
    pos.addScaledVector(fwd, step);
    const gh = terrainHeight(pos.x, pos.z);
    if (pos.y <= gh) { hit = pos.clone(); hit.y = gh; break; }

    const near = queryBuildings(pos.x, pos.z, 24);
    for (let j = 0; j < near.length; j++) {
      const b = near[j];
      if (b.dead) continue;
      if (pos.x > b.x - b.hw && pos.x < b.x + b.hw &&
          pos.z > b.z - b.hd && pos.z < b.z + b.hd &&
          pos.y > b.y0 && pos.y < b.y1) { hit = pos.clone(); break; }
    }
    if (hit) break;
  }

  if (!hit) { gunReticle.visible = false; return; }

  gunReticle.visible = true;
  gunReticle.position.copy(hit);
  const dist = camera.position.distanceTo(hit);
  gunReticle.scale.setScalar(Math.max(2.5, Math.min(40, dist * 0.024)));
  gunReticle.lookAt(camera.position);
  gunReticle.userData.mat.opacity = 0.55 + 0.35 * Math.sin(performance.now() * 0.012);
}

/* =========================================================
   碰撞 & 坠毁
========================================================= */
function checkPlaneCollision() {
  const p = plane.position;

  const gh = terrainHeight(p.x, p.z);
  if (p.y < gh + 3) {
    startCrash();
    return;
  }

  const R = CFG.planeR;
  const nearby = queryBuildings(p.x, p.z, R + 90);
  for (let i = 0; i < nearby.length; i++) {
    const b = nearby[i];
    if (b.dead) continue;
    if (sphereHitsBuilding(p.x, p.y, p.z, R, b)) {
      startCrash();
      return;
    }
  }
}

function startCrash() {
  if (G.crashing || G.over) return;
  G.crashing = true;
  G.crashTime = 0;
  G.aiming = false;
  G.lockTarget = null;
  lockMarkEl.style.display = 'none';
  if (gunReticle) gunReticle.visible = false;
  if (bombMark) bombMark.visible = false;
  Sound.silenceEngine();
  Sound.boom(1.0);
  spawnExplosion(plane.position.clone(), 1.8);
  G.shake = 2.0;
  if (navigator.vibrate) navigator.vibrate([40, 30, 80]);
}

function updateCrash(dt) {
  G.crashTime += dt;
  G.boost = Math.max(0, G.boost - dt * 2.5);

  plane.position.y -= 95 * dt;
  plane.rotateZ(4.5 * dt);
  plane.rotateX(-1.8 * dt);

  const fwd = getForward();
  plane.position.addScaledVector(fwd, 45 * dt);

  const flame = plane.userData.flame;
  if (flame) flame.material.opacity *= (1 - dt * 4);

  const gh = terrainHeight(plane.position.x, plane.position.z);
  if (plane.position.y < gh + 4 || G.crashTime > 2.2) {
    spawnExplosion(plane.position.clone(), 5.5);
    Sound.boom(1.8);
    G.shake = 2.5;
    plane.visible = false;
    G.crashing = false;
    G.over = true;
    setTimeout(showGameOver, 700);
  }

  updateEffects(dt);
  updateCamera(dt);
}

const hudHpMax     = document.getElementById('hudHpMax');

const weaponBombAmmo = document.getElementById('weaponBombAmmo');
const weaponMissileState = document.getElementById('weaponMissileState');
const weaponMissileAmmo = document.getElementById('weaponMissileAmmo');
const radarCanvas = document.getElementById('radarCanvas');
const radarCtx = radarCanvas ? radarCanvas.getContext('2d') : null;
const RADAR_RANGE = 4200;
let lastScore = -1, lastDestroyed = -1, lastAlt = -1, lastHp = -1;
let lastEnemyCount = -1, lastAircraftId = '';
let lastEngineMode = '', lastThrottleValue = -1;
let lastRadarTime = -999, radarSweep = -Math.PI * 0.5;

function setWeaponCard(card, stateEl, ammoEl, options) {
  if (!card) return;
  card.classList.toggle('active', !!options.active);
  card.classList.toggle('reload', !!options.reload);
  card.classList.toggle('empty', !!options.empty);
  card.classList.toggle('unavailable', !!options.unavailable);
  if (stateEl && stateEl.textContent !== options.state) stateEl.textContent = options.state;
  if (ammoEl && ammoEl.textContent !== options.ammo) ammoEl.textContent = options.ammo;
}

function updateRadar(now) {
  if (!radarCtx || now - lastRadarTime < 45) return;
  lastRadarTime = now;
  radarSweep += 0.16;

  const w = radarCanvas.width, h = radarCanvas.height;
  const cx = w * 0.5, cy = h * 0.5;
  const radius = Math.min(w, h) * 0.445;
  const ctx = radarCtx;
  ctx.clearRect(0, 0, w, h);

  const bg = ctx.createRadialGradient
    ? ctx.createRadialGradient(cx, cy, radius * 0.08, cx, cy, radius)
    : null;
  if (bg && bg.addColorStop) {
    bg.addColorStop(0, 'rgba(27,64,80,.28)');
    bg.addColorStop(0.64, 'rgba(9,31,45,.38)');
    bg.addColorStop(1, 'rgba(4,16,26,.54)');
    ctx.fillStyle = bg;
  } else {
    ctx.fillStyle = 'rgba(8,28,42,.44)';
  }
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(145,194,207,.38)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radius - 0.5, 0, Math.PI * 2);
  ctx.clip();
  if (ctx.setLineDash) ctx.setLineDash([2, 5]);
  for (let ring = 1; ring <= 3; ring++) {
    ctx.beginPath();
    ctx.arc(cx, cy, radius * ring / 3, 0, Math.PI * 2);
    ctx.strokeStyle = ring === 3 ? 'rgba(127,170,185,.26)' : 'rgba(127,170,185,.14)';
    ctx.stroke();
  }
  if (ctx.setLineDash) ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(cx - radius, cy); ctx.lineTo(cx + radius, cy);
  ctx.moveTo(cx, cy - radius); ctx.lineTo(cx, cy + radius);
  ctx.strokeStyle = 'rgba(127,170,185,.13)';
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, radius, radarSweep - 0.64, radarSweep);
  ctx.closePath();
  ctx.fillStyle = 'rgba(108,180,199,.075)';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(radarSweep) * radius, cy + Math.sin(radarSweep) * radius);
  ctx.strokeStyle = 'rgba(171,224,235,.42)';
  ctx.stroke();
  ctx.restore();

  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(plane.quaternion);
  forward.y = 0;
  if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
  forward.normalize();
  const rightX = -forward.z, rightZ = forward.x;

  const drawContact = (unit, kind) => {
    const px = unit.mesh ? unit.mesh.position.x : unit.x;
    const pz = unit.mesh ? unit.mesh.position.z : unit.z;
    const dx = px - plane.position.x, dz = pz - plane.position.z;
    const rawDist = Math.hypot(dx, dz);
    if (rawDist < 0.001) return;
    const localX = dx * rightX + dz * rightZ;
    const localZ = dx * forward.x + dz * forward.z;
    const scale = Math.min(radius * 0.94 / RADAR_RANGE, (radius * 0.94) / rawDist);
    const x = cx + localX * scale;
    const y = cy - localZ * scale;
    const edge = rawDist > RADAR_RANGE;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = edge ? 0.34 : 0.94;
    if (kind === 'enemy') {
      ctx.rotate(Math.PI);
      ctx.beginPath();
      ctx.moveTo(0, -4.8); ctx.lineTo(4.2, 4); ctx.lineTo(0, 2.4); ctx.lineTo(-4.2, 4);
      ctx.closePath();
      ctx.fillStyle = '#b87978';
      ctx.fill();
    } else if (kind === 'wingman') {
      ctx.beginPath();
      ctx.moveTo(0, -4.6); ctx.lineTo(4, 3.4); ctx.lineTo(0, 1.8); ctx.lineTo(-4, 3.4);
      ctx.closePath();
      ctx.fillStyle = '#75b8cf';
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.rect(-2.9, -2.9, 5.8, 5.8);
      ctx.fillStyle = 'rgba(195,170,118,.28)';
      ctx.fill();
      ctx.strokeStyle = '#c3aa76';
      ctx.stroke();
    }
    if (G.lockTarget && G.lockTarget.u === unit) {
      const pulse = 8.5 + Math.sin(now * 0.012) * 1.5;
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#df7070';
      ctx.lineWidth = 1.6;
      ctx.strokeRect(-pulse, -pulse, pulse * 2, pulse * 2);
      ctx.strokeStyle = 'rgba(223,112,112,.42)';
      ctx.lineWidth = 4;
      ctx.strokeRect(-pulse - 2, -pulse - 2, (pulse + 2) * 2, (pulse + 2) * 2);
    }
    ctx.restore();
  };

  for (const e of enemies) if (!e.dead) drawContact(e, 'enemy');
  for (const wg of wingmen) if (!wg.dead) drawContact(wg, 'wingman');
  for (const g of aaaGuns) if (!g.dead) drawContact(g, 'ground');
  for (const s of samSites) if (!s.dead) drawContact(s, 'ground');

  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  ctx.moveTo(0, -7);
  ctx.lineTo(5, 5);
  ctx.lineTo(0, 2.5);
  ctx.lineTo(-5, 5);
  ctx.closePath();
  ctx.fillStyle = '#d8ebef';
  ctx.fill();
  ctx.restore();

}

function updateHUD() {
  const gh = terrainHeight(plane.position.x, plane.position.z);
  const alt = Math.max(0, Math.round(plane.position.y - gh));
  if (alt !== lastAlt) { hudAlt.textContent = alt; lastAlt = alt; }
  if (G.score !== lastScore) { hudScore.textContent = G.score; lastScore = G.score; }
  if (G.destroyed !== lastDestroyed) {
    hudDestroyed.textContent = G.destroyed; lastDestroyed = G.destroyed;
  }
  const hpPct = Math.max(0, G.hp / G.hpMax);
  if (hpPct !== lastHp) {
    hpFill.style.width = (hpPct * 100).toFixed(1) + '%';
    hpFill.style.background = hpPct > 0.6 ? '#78aeb4' : (hpPct > 0.3 ? '#b7a378' : '#b87978');
    if (hudHpValue) hudHpValue.textContent = Math.max(0, G.hp);
    lastHp = hpPct;
  }
  if (hudHpMax) hudHpMax.textContent = G.hpMax;
  dmgFlash.style.opacity = G.hitFlash;

  const spec = selectedAircraftSpec();
  const hasPL = spec.plMissiles > 0;
  if (lastAircraftId !== spec.id) {
    lastAircraftId = spec.id;
    hudAircraftName.textContent = spec.name;
    hudAircraftCode.textContent = spec.code;
    hudAircraftRole.textContent = spec.role;
  }
  weaponBombEl.hidden = hasPL;
  weaponMissileEl.hidden = !hasPL;

  const gunActive = !!(keys.fire && G.started && !G.over && !G.crashing);
  const bombActive = !!(G.aiming && !hasPL && G.started && !G.over && !G.crashing);
  const missileReloading = hasPL && G.missileCooldown > 0;
  const missileEmpty = hasPL && G.missileAmmo <= 0;
  setWeaponCard(weaponGunEl, weaponGunState, weaponGunAmmo, {
    active: gunActive, reload: false, empty: false, unavailable: false,
    state: gunActive ? 'FIRING' : 'STANDBY', ammo: '∞'
  });
  setWeaponCard(weaponBombEl, weaponBombState, weaponBombAmmo, {
    active: bombActive, reload: false, empty: false, unavailable: hasPL,
    state: bombActive ? 'AIMING' : 'STANDBY', ammo: '∞'
  });
  setWeaponCard(weaponMissileEl, weaponMissileState, weaponMissileAmmo, {
    active: missileReloading, reload: missileReloading && !missileEmpty, empty: missileEmpty,
    unavailable: !hasPL,
    state: missileEmpty ? 'EMPTY' : (missileReloading ? 'RELOAD' : (G.lockTarget && G.lockTarget.hostile ? 'LOCKED' : 'STANDBY')),
    ammo: hasPL ? String(G.missileAmmo) : '0'
  });

  const throttle = Math.round(G.thrust * 100);
  if (throttle !== lastThrottleValue) {
    hudThrottle.textContent = throttle;
    if (enginePowerFill) {
      enginePowerFill.style.width = throttle + '%';
      enginePowerFill.style.opacity = G.engCut ? '.34' : '.68';
    }
    lastThrottleValue = throttle;
  }
  const engineMode = G.engCut ? 'cut' : (keys.boost ? 'boost' : (G.thrust < 0.98 ? 'recover' : ''));
  if (engineMode !== lastEngineMode) {
    engineGraphic.setAttribute('class', 'engine-graphic' + (engineMode ? ' ' + engineMode : ''));
    lastEngineMode = engineMode;
  }
  if (engineFan) {
    const rpm = Math.max(0.18, G.thrust * (keys.boost ? 2.15 : 1));
    engineFan.style.animationDuration = (0.95 / rpm).toFixed(2) + 's';
  }
  if (engineFlame) {
    engineFlame.style.opacity = G.engCut ? '0' : String(0.24 + G.thrust * 0.76);
    engineFlame.style.transform = 'scaleX(' + (0.34 + G.thrust * 0.96) + ')';
  }

  const enemyCount = enemies.reduce((n, e) => n + (e.dead ? 0 : 1), 0);
  if (enemyCount !== lastEnemyCount) {
    hudEnemyCount.textContent = String(enemyCount).padStart(2, '0');
    hudEnemyCount.className = enemyCount > 0 ? 'danger' : '';
    lastEnemyCount = enemyCount;
  }
  updateRadar(performance.now());
}

function updateSunShadow(force) {
  if (!worldSun || !plane) return;
  const groundY = Math.max(terrainHeight(plane.position.x, plane.position.z), WATER_LEVEL);
  const altitude = Math.max(0, plane.position.y - groundY);
  const sunY = Math.max(100, SHADOW_SUN_OFFSET.y);
  const shadowX = plane.position.x - SHADOW_SUN_OFFSET.x * altitude / sunY;
  const shadowZ = plane.position.z - SHADOW_SUN_OFFSET.z * altitude / sunY;
  const tx = (plane.position.x + shadowX) * 0.5;
  const ty = (plane.position.y + groundY) * 0.5;
  const tz = (plane.position.z + shadowZ) * 0.5;
  const dx = tx - _shadowAnchor.x;
  const dy = ty - _shadowAnchor.y;
  const dz = tz - _shadowAnchor.z;
  if (!force && dx * dx + dy * dy + dz * dz < 90 * 90) return;
  worldSun.target.position.set(tx, ty, tz);
  worldSun.position.copy(worldSun.target.position).add(SHADOW_SUN_OFFSET);
  worldSun.target.updateMatrixWorld();
  worldSun.updateMatrixWorld();
  _shadowAnchor.set(tx, ty, tz);
  if (renderer && renderer.shadowMap) renderer.shadowMap.needsUpdate = true;
}

function resetPlane() {
  const gy = terrainHeight(SPAWN_X, SPAWN_Z);
  plane.position.set(SPAWN_X, gy + 460, SPAWN_Z);
  plane.quaternion.identity();
  /* 出生后直接朝最近城市的航线看过去；非相机对象 lookAt 让 +Z 朝向目标，故取镜像点。 */
  let targetX = 0, targetZ = -1200;
  if (GEN.cities.length) {
    let best = Infinity;
    for (const ct of GEN.cities) {
      const d = Math.hypot(ct.x - SPAWN_X, ct.z - SPAWN_Z);
      if (d < best) { best = d; targetX = ct.x; targetZ = ct.z; }
    }
  }
  plane.lookAt(SPAWN_X * 2 - targetX, gy + 600, SPAWN_Z * 2 - targetZ);
  camInit = false;
  camYawOff = 0;
  camPitchOff = 0;
  if (edgeWarnEl) edgeWarnEl.classList.remove('show');
  updateSunShadow(true);
}

function startGame() {
  overlay.classList.add('hide');
  setCursorHidden(true);
  applyLightingPreset(selectedLightMode);
  const aircraftSpec = selectedAircraftSpec();

  clearCity();

  for (const bu of bullets) scene.remove(bu.mesh);
  bullets.length = 0;

  for (const bo of bombs) scene.remove(bo.mesh);
  bombs.length = 0;

  for (const e of effects) {
    scene.remove(e.mesh);
    if (e.ownsMat && e.mesh.material) e.mesh.material.dispose();
    if (e.ownsGeo && e.mesh.geometry) e.mesh.geometry.dispose();
  }
  effects.length = 0;
  resetDestructibleScenery();

  createCity();
  createVillageHouses();
  createFarmsteads();
  detBuild();

  /* 重置并重新布防敌方单位 */
  for (const g of aaaGuns) scene.remove(g.mesh);
  aaaGuns.length = 0;
  for (const s of samSites) scene.remove(s.mesh);
  samSites.length = 0;
  for (const en of enemies) scene.remove(en.mesh);
  enemies.length = 0;
  for (const eb of eBullets) scene.remove(eb.mesh);
  eBullets.length = 0;
  for (const ms of missiles) scene.remove(ms.mesh);
  missiles.length = 0;
  for (const pm of playerMissiles) disposePLMissile(pm);
  playerMissiles.length = 0;
  for (const w of wingmen) scene.remove(w.mesh);
  wingmen.length = 0;
  wingRespawn[0] = wingRespawn[1] = 0;
  createDefenses();
  enemyTimer = 6;

  plane.visible = true;
  resetPlane();

  G.started = true;
  G.over = false;
  G.menuOpen = false;
  G.crashing = false;
  G.aiming = false;
  G.score = 0;
  G.destroyed = 0;
  G.fireTimer = 0;
  G.shake = 0;
  G.boost = 0;
  G.hp = G.hpMax;
  G.invuln = 0;
  G.hitFlash = 0;
  G.engCut = false;
  G.thrust = 1;
  G.lockTarget = null;
  G.missileAmmo = aircraftSpec.plMissiles || 0;
  G.missileCooldown = 0;
  G.missileReloadTimer = 0;
  syncPlayerMissileRack(G.missileAmmo);
  lockMarkEl.style.display = 'none';
  gunReticle.visible = false;
  weaponNoticeTimer = 0;
  lastScore = lastDestroyed = lastAlt = lastHp = -1;
  lastEnemyCount = -1;
  lastAircraftId = '';
  lastEngineMode = '';
  lastThrottleValue = -1;
  lastRadarTime = -999;
  const weaponWarnEl = document.getElementById('weaponWarn');
  if (weaponWarnEl) weaponWarnEl.className = '';

  Sound.init();
  if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
  Sound.setEngine(0.55);

  clock.getDelta();
  updateHUD();
}

function randomSeedStr() {
  return Math.random().toString(36).slice(2, 8).toUpperCase();
}

function normalizeSeed(seedStr) {
  const s = String(seedStr || '').trim().replace(/\s+/g, ' ');
  return (s || 'OPENJET').slice(0, 40);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[ch]);
}

function yieldToPaint() {
  return new Promise(resolve => {
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(() => setTimeout(resolve, 0));
    } else {
      setTimeout(resolve, 0);
    }
  });
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function setGenerationStage(key, fraction) {
  if (!genUI) return;
  const step = WORLD_STAGE_MAP[key];
  if (!step) return;
  const sub = Math.max(0, Math.min(0.999, Number(fraction) || 0));
  const pct = Math.min(99.4, ((step.index + sub) / WORLD_STAGE_SPECS.length) * 100);
  genUI.stage.textContent = step.label;
  genUI.bar.style.width = pct.toFixed(2) + '%';
  genUI.bar.parentNode.setAttribute('aria-valuenow', Math.round(pct));
  genUI.percent.textContent = Math.round(pct) + '%';
  genUI.step.textContent = String(step.index + 1).padStart(2, '0') + ' / ' +
                           String(WORLD_STAGE_SPECS.length).padStart(2, '0');
}

  });

async function runStepsAsync(iterator, report, shouldCancel) {
  let step = iterator.next();
  while (!step.done) {
    if (shouldCancel && shouldCancel()) return null;
    report(step.value);
    await yieldToPaint();
    step = iterator.next();
  }
  return step.value;
}

async function startGeneration(seedStr) {
  if (isGenerating) return;
  isGenerating = true;
  disposeAircraftPreview();
  const token = ++generationToken;
  const s = normalizeSeed(seedStr);
  currentSeed = s;
  G.started = false;
  G.over = false;
  G.menuOpen = false;
  G.crashing = false;
  if (plane) plane.visible = false;
  setCursorHidden(false);
  overlay.classList.remove('hide');
  showLoadingScreen();
  try {
    await yieldToPaint();
    GEN = await runStepsAsync(genWorldSteps(hashStr(s)), key => {
      if (token === generationToken) setGenerationStage(key);
    }, () => token !== generationToken);
    if (!GEN || token !== generationToken) return;
    clearWorld();
    await runStepsAsync(buildWorldSteps(), key => {
      if (token === generationToken) setGenerationStage(key);
    }, () => token !== generationToken);
    if (token !== generationToken) return;
    const previewComplete = await renderPreviewBaseAsync(fraction => {
      if (token === generationToken) setGenerationStage('previewBase', fraction);
    }, () => token !== generationToken);
    if (!previewComplete || token !== generationToken) return;
    setGenerationStage('previewLayers');
    await yieldToPaint();
    PLAN = autoPlaceUnits(5, 3);
    setGenerationStage('deploy');
    await yieldToPaint();
    setGenerationStage('ready');
    await yieldToPaint();
    completeGenerationUI();
    await wait(260);
    if (token !== generationToken) return;
    showSetupScreen();
    resetPlane();
    plane.visible = false;
    updateCamera(1);
    updateHUD();
  } catch (err) {
    console.error('世界生成失败', err);
    if (token === generationToken) {
      showSeedScreen('生成失败：' + (err && err.message ? err.message : '未知错误'));
    }
  } finally {
    if (token === generationToken) isGenerating = false;
  }
}

function applySeedDeferred(seedStr) {
  return startGeneration(seedStr);
}

/* ---- 2D 预览：地形高度着色（含水面色） ---- */
function createPreviewSurface() {
  const off = document.createElement('canvas');
  off.width = off.height = PREV_N;
  const ctx = off.getContext('2d');
  const img = ctx.createImageData(PREV_N, PREV_N);
  return { off, ctx, img, tmp: [0, 0, 0] };
}

function paintPreviewRows(surface, iz0, iz1) {
  const { ctx, img, tmp } = surface;
  for (let iz = iz0; iz < iz1; iz++) {
    const z = (iz / (PREV_N - 1) - 0.5) * WORLD_HALF * 2;
    for (let ix = 0; ix < PREV_N; ix++) {
      const x = (ix / (PREV_N - 1) - 0.5) * WORLD_HALF * 2;
      const h = terrainHeight(x, z);
      terrainColor(h, tmp);
      let r = tmp[0] * 255, g = tmp[1] * 255, b = tmp[2] * 255;
      if (h < WATER_LEVEL) {
        const t = 0.78;
        r = r * (1 - t) + 0x2f * t;
        g = g * (1 - t) + 0x6f * t;
        b = b * (1 - t) + 0x9e * t;
      }
      const o = (iz * PREV_N + ix) * 4;
      img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
    }
  }
  if (iz1 === PREV_N) {
    ctx.putImageData(img, 0, 0);
  }
}

function renderPreviewBase() {
  const surface = createPreviewSurface();
  paintPreviewRows(surface, 0, PREV_N);
  previewBase = surface.off;
}

async function renderPreviewBaseAsync(report, shouldCancel) {
  const surface = createPreviewSurface();
  const chunk = 36;
  for (let iz = 0; iz < PREV_N; iz += chunk) {
    if (shouldCancel && shouldCancel()) return false;
    paintPreviewRows(surface, iz, Math.min(PREV_N, iz + chunk));
    report(Math.min(1, (iz + chunk) / PREV_N));
    await yieldToPaint();
  }
  previewBase = surface.off;
  return true;
}

const mapToWorld = (px, py) => ({
  x: (px / PREV_N - 0.5) * WORLD_HALF * 2,
  z: (py / PREV_N - 0.5) * WORLD_HALF * 2
});
const worldToMap = (x, z) => ({
  x: (x / (WORLD_HALF * 2) + 0.5) * PREV_N,
  y: (z / (WORLD_HALF * 2) + 0.5) * PREV_N
});

function drawPreview() {
  if (!previewBase || !mapCanvasEl || !GEN) return;
  const ctx = mapCanvasEl.getContext('2d');
  ctx.clearRect(0, 0, PREV_N, PREV_N);
  ctx.drawImage(previewBase, 0, 0);

  const s = PREV_N / (WORLD_HALF * 2);          /* 世界米 → 预览像素 */

  /* 草甸 / 牧场 */
  ctx.fillStyle = 'rgba(164,166,92,.28)';
  for (const md of (GEN.meadows || [])) {
    for (const l of md.lobes) {
      const m = worldToMap(l.x, l.z);
      ctx.beginPath();
      ctx.ellipse(m.x, m.y, Math.max(1.1, l.rx * s), Math.max(1.0, l.rz * s),
        l.rot, 0, 6.2832);
      ctx.fill();
    }
  }

  /* 树林 */
  ctx.fillStyle = 'rgba(24,54,28,.30)';
  for (const f of GEN.forests) {
    for (const l of f.lobes) {
      const wx = f.x + l.x * f.cr - l.z * f.sr;
      const wz = f.z + l.x * f.sr + l.z * f.cr;
      const m = worldToMap(wx, wz);
      ctx.beginPath();
      ctx.ellipse(m.x, m.y, Math.max(1.2, l.rx * s), Math.max(1.0, l.rz * s),
        f.rot + l.rot, 0, 6.2832);
      ctx.fill();
    }
  }

  /* 农田 */
  const FIELD_COLORS = {
    grain: 'rgba(194,172,92,.72)',
    vegetable: 'rgba(112,151,82,.72)',
    pasture: 'rgba(98,143,82,.66)',
    orchard: 'rgba(70,108,72,.72)',
    fallow: 'rgba(150,122,88,.70)'
  };
  for (const f of GEN.fields) {
    const m = worldToMap(f.x, f.z);
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(f.rot);
    ctx.beginPath();
    for (let i = 0; i < f.poly.length; i++) {
      const px = f.poly[i][0] * s, py = f.poly[i][1] * s;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = FIELD_COLORS[f.kind] || FIELD_COLORS.grain;
    ctx.fill();
    ctx.strokeStyle = 'rgba(88,72,45,.72)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.restore();
  }

  /* 道路与桥 */
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = 'rgba(36,34,32,.88)';
  for (const road of GEN.roads) {
    ctx.beginPath();
    for (let i = 0; i < road.length; i++) {
      const m = worldToMap(road[i].x, road[i].z);
      if (i) ctx.lineTo(m.x, m.y); else ctx.moveTo(m.x, m.y);
    }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(228,231,238,.95)';
  ctx.lineWidth = 2;
  for (const road of GEN.roads) {
    for (let i = 0; i < road.length - 1; i++) {
      if (!road[i].bridge && !road[i + 1].bridge) continue;
      const a = worldToMap(road[i].x, road[i].z), b = worldToMap(road[i + 1].x, road[i + 1].z);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }

  /* 铁路与车站 */
  ctx.strokeStyle = 'rgba(95,61,43,.95)';
  ctx.lineWidth = 1.35;
  for (const rail of (GEN.railways || [])) {
    ctx.beginPath();
    for (let i = 0; i < rail.length; i++) {
      const m = worldToMap(rail[i].x, rail[i].z);
      if (i) ctx.lineTo(m.x, m.y); else ctx.moveTo(m.x, m.y);
    }
    ctx.stroke();
  }
  for (const st of (GEN.railStations || [])) {
    const m = worldToMap(st.x, st.z);
    ctx.fillStyle = 'rgba(238,204,92,.95)';
    ctx.fillRect(m.x - 2.4, m.y - 2.4, 4.8, 4.8);
    ctx.strokeStyle = 'rgba(60,42,30,.95)';
    ctx.lineWidth = 1;
    ctx.strokeRect(m.x - 2.4, m.y - 2.4, 4.8, 4.8);
  }

  /* 村庄 */
  for (const v of GEN.villages) {
    const m = worldToMap(v.x, v.z);
    ctx.fillStyle = 'rgba(206,186,142,.52)';
    ctx.beginPath();
    ctx.arc(m.x, m.y, Math.max(2, v.r * s), 0, 6.2832);
    ctx.fill();
    ctx.strokeStyle = 'rgba(122,102,68,.85)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(m.x - Math.cos(v.rot) * v.r * s, m.y - Math.sin(v.rot) * v.r * s);
    ctx.lineTo(m.x + Math.cos(v.rot) * v.r * s, m.y + Math.sin(v.rot) * v.r * s);
    ctx.stroke();
  }

  /* 城市范围 */
  for (const ct of GEN.cities) {
    const p0 = worldToMap(ct.x - ct.rx, ct.z - ct.rz);
    const p1 = worldToMap(ct.x + ct.rx, ct.z + ct.rz);
    ctx.fillStyle = 'rgba(235,240,255,.13)';
    ctx.strokeStyle = 'rgba(235,240,255,.55)';
    ctx.lineWidth = 1;
    ctx.fillRect(p0.x, p0.y, p1.x - p0.x, p1.y - p0.y);
    ctx.strokeRect(p0.x + 0.5, p0.y + 0.5, p1.x - p0.x - 1, p1.y - p0.y - 1);
  }

  /* 出生点（南侧边缘，朝北） */
  const sp = worldToMap(SPAWN_X, SPAWN_Z);
  ctx.fillStyle = '#7dff8a';
  ctx.beginPath();
  ctx.moveTo(sp.x, sp.y - 7);
  ctx.lineTo(sp.x - 6, sp.y + 5);
  ctx.lineTo(sp.x + 6, sp.y + 5);
  ctx.closePath();
  ctx.fill();

  /* 单位标记 */
  const drawOne = (kind, p, alpha) => {
    const m = worldToMap(p.x, p.z);
    ctx.globalAlpha = alpha;
    if (kind === 'aaa') {
      ctx.beginPath();
      ctx.arc(m.x, m.y, 5, 0, 6.2832);
      ctx.fillStyle = '#6f8f3f';
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = '#d9ffb0';
      ctx.stroke();
    } else {
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(m.x - 4.5, m.y - 4.5, 9, 9);
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = '#ffb3a6';
      ctx.strokeRect(m.x - 4.5, m.y - 4.5, 9, 9);
    }
    ctx.globalAlpha = 1;
  };
  PLAN.aaa.forEach(p => drawOne('aaa', p, 1));
  PLAN.sam.forEach(p => drawOne('sam', p, 1));
  if (dragState && dragState.moved && dragState.pos) drawOne(dragState.kind, dragState.pos, 0.55);
}
